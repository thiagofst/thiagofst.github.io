
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandbox - Thiago Ferreira</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{--bg:#fff;--fg:#000;--accent:#e30613;--gutter:24px}

body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
}

a{color:var(--fg);text-decoration:none}

.page{max-width:1200px;margin:0 auto;padding:0 var(--gutter)}

.row{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gutter)}

.topbar{padding:1.4rem 0 0;font-weight:700;font-size:1rem}
.topbar a:hover{color:var(--accent)}
.topbar a{display:block;width:fit-content;line-height:0}

header{padding:2.2rem 0 1.2rem;border-bottom:3px solid var(--fg)}

h1{
    grid-column:1/-1;
    font-size:clamp(2.6rem,7.2vw,5.6rem);
    font-weight:700;
    line-height:0.98;
    letter-spacing:-0.035em;
}

.item{
    position:relative;
    display:grid;
    grid-template-columns:repeat(12,1fr);
    column-gap:var(--gutter);
    padding:1.2rem 0;
    border-bottom:1px solid var(--fg);
}

.item h2{
    grid-column:1/-1;
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.2;
}

.item p{
    grid-column:1/-1;
    font-size:1rem;
    line-height:1.4;
    margin-top:.2rem;
}

.item:hover h2{color:var(--accent)}

.cover{position:absolute;inset:0}

.games-section{margin-top:4rem;border-top:3px solid var(--fg)}

.games-toggle{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:none;
    border:0;
    border-bottom:3px solid var(--fg);
    padding:2.2rem 0 1.2rem;
    font-family:inherit;
    color:var(--fg);
    text-align:left;
    cursor:pointer;
}

.games-toggle h1{
    font-size:clamp(2.6rem,7.2vw,5.6rem);
    font-weight:700;
    line-height:0.98;
    letter-spacing:-0.035em;
}

.games-toggle:hover h1{color:var(--accent)}

.arrow{
    font-size:1.5rem;
    transition:transform .25s ease;
}

.games-toggle[aria-expanded="true"] .arrow{transform:rotate(180deg)}

.games-content{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .35s ease;
}

.games-content.open{grid-template-rows:1fr}

.games-inner{overflow:hidden}

footer{
    padding:1rem 0 2.5rem;
    font-size:.9rem;
    font-weight:700;
}

@media(max-width:800px){
    :root{--gutter:16px}
}

@media(prefers-reduced-motion:reduce){
    .games-content,.arrow{transition:none}
}
</style>
</head>

<body>
<div class="page">

<div class="topbar">
<a href="index.html" aria-label="Back to home">
<svg width="55" height="24" viewBox="1 0 55 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
<path d="M54 12H2M12 2L2 12l10 10"/>
</svg>
</a>
</div>

<header>
<div class="row">
<h1>Sandbox</h1>
</div>
</header>

<main>

<!-- Interactive tools -->

<div class="item">
    <a class="cover" href="sandbox/hr.html" target="_blank" aria-label="Open HRD"></a>
    <h2>HRD</h2>
    <p>An interactive Hertzsprung-Russell diagram</p>
</div>

<div class="item">
    <a class="cover" href="sandbox/planet.html" target="_blank" aria-label="Open Planet Lab"></a>
    <h2>Planet Lab</h2>
    <p>A simulator of transits and radial velocities for planets, spots and binaries</p>
</div>

<section class="games-section">

<button class="games-toggle" id="gamesToggle" type="button" aria-expanded="false" aria-controls="gamesContent">
<h1>...</h1>
<span class="arrow" aria-hidden="true">↓</span>
</button>

<div class="games-content" id="gamesContent">
<div class="games-inner">

<div class="item">
    <a class="cover" href="sandbox/games/cartogram.html" target="_blank" aria-label="Open Cartogram"></a>
    <h2>Cartogram</h2>
    <p>A world geography game</p>
</div>

<div class="item">
    <a class="cover" href="sandbox/games/moscow.html" target="_blank" aria-label="Open Moscow"></a>
    <h2>Moscow</h2>
    <p></p>
</div>

<div class="item">
    <a class="cover" href="sandbox/games/grand-prix.html" target="_blank" aria-label="Open Grand Prix"></a>
    <h2>Grand Prix</h2>
    <p>Formula 1</p>
</div>

</div>
</div>

</section>

</main>

<footer>
<strong>Thiago Ferreira dos Santos | thiago.dossantos(@)yale.edu</strong>
</footer>

</div>

<script>
const gamesToggle = document.getElementById('gamesToggle');
const gamesContent = document.getElementById('gamesContent');

gamesToggle.addEventListener('click', () => {
    const isOpen = gamesToggle.getAttribute('aria-expanded') === 'true';
    gamesToggle.setAttribute('aria-expanded', String(!isOpen));
    gamesContent.classList.toggle('open', !isOpen);
});
</script>

</body>
</html>
