function hex2rgb(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }

  if (bprp == null || isNaN(bprp)) return '#8a8577';
  if (bprp <= STOPS[0][0]) return STOPS[0][1];

  return STOPS[STOPS.length - 1][1];
}
function shade(c, f) {

}

let LAST = [];

FIELDS.forEach((f, i) => sel.add(new Option(f.n, i)));

// upload: a .json from make_field.py, or a Gaia .csv (ra, dec, phot_g_mean_mag, bp_rp)
function fromFile(txt, name) {
  const t = txt.trim();
  if (t[0] === '{') {
    const j = JSON.parse(t);
    return { n: j.name || name, v: [j.ra, j.dec, j.radius], s: j.stars.map(a => ({ ra: a[0], dec: a[1], g: a[2], c: a[3] })) };
  }
  const s = parseCSV(t);
  if (!s.length) throw new Error('no stars');
  const ra = s.map(q => q.ra), de = s.map(q => q.dec), ra0 = (Math.min(...ra) + Math.max(...ra)) / 2, de0 = (Math.min(...de) + Math.max(...de)) / 2, cd = Math.cos(de0 * Math.PI / 180);
  const r = Math.max(...s.map(q => Math.hypot((q.ra - ra0) * cd, q.dec - de0)));
  return { n: name, v: [+ra0.toFixed(4), +de0.toFixed(4), +(Math.ceil(r * 20) / 20).toFixed(2)], s };
}
function parseCSV(txt) {
  return txt.trim().split('\n').slice(1).map(l => l.split(',')).map(c => ({ ra: +c[0], dec: +c[1], g: +c[2], c: c[3] === '' || c[3] === undefined ? null : +c[3] }))
    .filter(q => isFinite(q.ra) && isFinite(q.dec) && isFinite(q.g));
}
const fileIn = document.getElementById('file');
document.getElementById('upload').onclick = () => fileIn.click();
fileIn.onchange = () => {
  const f = fileIn.files[0];
  if (!f) return;
  f.text().then(txt => {
    const fld = fromFile(txt, f.name.replace(/\.[^.]+$/, ''));
    FIELDS.push(fld); sel.add(new Option(fld.n, FIELDS.length - 1));
    sel.style.display = ''; sel.value = FIELDS.length - 1; plant();
  }).catch(() => alert('Could not read this file'));
  fileIn.value = '';
};

// save: largest PNG this browser can make
document.getElementById('save').onclick = () => {
  const svg = document.getElementById('art');
  if (!svg) return;
  const img = new Image();
  img.onload = async () => {
    for (const n of [12000, 8192, 6000, 4096, 2048]) {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = n;
        const ctx = c.getContext('2d');
        if (!ctx) continue;
        ctx.drawImage(img, 0, 0, n, n);
        if (ctx.getImageData(n >> 1, n >> 1, 1, 1).data[3] === 0) continue;
        const b = await new Promise(r => c.toBlob(r, 'image/png'));
        if (!b || b.size < 1000) continue;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = 'sky-garden-' + n + '.png'; a.click();
        return;
      } catch (e) { }
    }
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
};
sel.onchange = plant;
draw();
</script>
