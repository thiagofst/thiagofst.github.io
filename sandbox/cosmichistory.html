<!doctype html>
<html lang="en" ><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic History</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:ital,wght@0,200;0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>@property --ch{syntax:"<color>";inherits:true;initial-value:#c58bff}
:root{transition:--ch 1.4s ease;--bg:#05040a;--fg:#f1ece4;--mute:rgba(241,236,228,.55);--line:rgba(255,255,255,.14);--glass:rgba(14,10,24,.72);--ch:#c58bff;--acc:#ffb45a;--ui:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 40% 55%,color-mix(in srgb,var(--ch) 34%,transparent),transparent 62%),radial-gradient(ellipse at 80% 20%,color-mix(in srgb,var(--ch) 16%,transparent),transparent 55%),linear-gradient(transparent 0,transparent 100%);transition:background 1.2s}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:120px 120px;mask-image:radial-gradient(ellipse at 50% 50%,#000 20%,transparent 75%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.pill{border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);background:rgba(10,8,20,.6);backdrop-filter:blur(8px);transition:background .2s}
.pill:hover:not(:disabled){background:rgba(255,180,90,.16)}.pill:disabled{opacity:.3;cursor:default}
#top{position:fixed;left:44px;top:28px;z-index:20;font-family:var(--mono)}
#top .ch{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
#top .big{font-family:var(--ui);font-weight:300;font-size:clamp(34px,4.4vw,62px);letter-spacing:-.02em;line-height:1.1;margin-top:6px}
#top .big small{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);display:block;text-transform:uppercase;margin-bottom:2px}
#btns{position:fixed;right:28px;top:26px;z-index:20;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
#hudbox{position:fixed;left:44px;bottom:214px;z-index:20;width:min(300px,calc(100vw - 88px));background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.8;backdrop-filter:blur(10px)}
#hudbox div{display:flex;justify-content:space-between;gap:12px}#hudbox span{color:var(--mute)}
#stage{position:fixed;z-index:10;right:44px;top:122px;bottom:214px;width:min(400px,calc(100vw - 88px));pointer-events:none}
.card{position:absolute;right:0;top:0;max-height:100%;width:100%;display:none;overflow-y:auto;padding:20px 22px 22px;background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);pointer-events:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.card.on,.card.out{display:block}.card.on.enter{animation:in .7s cubic-bezier(.2,.8,.2,1) .15s both}.card.out{animation:outa .45s cubic-bezier(.4,0,1,1) both;pointer-events:none;z-index:0}@keyframes outa{to{opacity:0;transform:translateY(-12px) scale(.985)}}#hudbig.sw span{animation:in .6s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card .tm{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card .tag{border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--mute);font-size:10px;letter-spacing:.1em}
.card h2{font-weight:300;font-size:clamp(26px,2.3vw,34px);letter-spacing:-.015em;line-height:1.1;margin:8px 0 10px}
.card .imp{font-style:italic;font-size:19px;line-height:1.35;margin-bottom:14px}
.card .viz{position:relative;height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:4px 0 14px;background:#07050d}
.card canvas.mini{position:absolute;inset:0;width:100%;height:100%;display:block}
.card .story{font-size:15px;line-height:1.7;color:rgba(241,236,228,.9)}
.card dl.facts{display:grid;gap:6px;margin-top:14px;font-family:var(--mono);font-size:11.5px}
.card dl.facts div{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding-top:6px}
.card dl.facts dt{color:var(--mute)}.card dl.facts dd{text-align:right}
.card details{margin-top:14px}
.card summary{cursor:pointer;list-style:none;display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.card summary::-webkit-details-marker{display:none}.card summary::after{content:' +'}.card details[open] summary::after{content:' –'}
.card p.more{font-size:14px;line-height:1.65;margin-top:14px;color:rgba(241,236,228,.85)}
.card h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px;font-weight:400}
.card ol.refs{list-style:none;display:grid;gap:8px;font-size:12px;line-height:1.5;color:var(--mute)}
.card ol.refs li{padding-left:16px;text-indent:-16px}
.card ol.refs a{color:var(--acc);font-family:var(--mono);font-size:10.5px;text-decoration:none;white-space:nowrap}
.card .ext{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
footer{position:fixed;left:0;right:0;bottom:0;height:200px;z-index:20;display:flex;align-items:flex-end;gap:14px;padding:0 28px 14px;background:linear-gradient(transparent,rgba(5,4,10,.85) 60%)}
#strip{flex:1;position:relative;height:190px;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}#strip svg{display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
#pos{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mute);white-space:nowrap}#pos b{color:var(--fg);font-weight:400}
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:var(--bg);transition:opacity .9s}
#intro::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(110,60,170,.4),transparent 60%)}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro h1{position:relative;font-weight:200;font-size:clamp(48px,9vw,124px);letter-spacing:-.025em}
#intro .pill{position:relative;font-size:12px;padding:13px 26px}
#intro.gone{opacity:0;pointer-events:none}
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,4,10,.94);backdrop-filter:blur(10px);display:none;flex-direction:column}
.ov.on{display:flex}
.ov .oh{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#mapg{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(10,minmax(200px,1fr));gap:18px;padding:6px 28px 40px}
#mapg .col h3{font-weight:200;font-size:30px;color:var(--c)}#mapg .col h4{font-weight:400;font-size:14px;margin:2px 0 2px}#mapg .col small{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
#mapg ul{list-style:none;margin-top:12px}#mapg li{display:grid;grid-template-columns:30px 1fr;font-size:13px;line-height:1.35;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;color:rgba(241,236,228,.8)}#mapg li span{font-family:var(--mono);font-size:10px;color:var(--mute);padding-top:2px}#mapg li:hover,#mapg li.cur{color:var(--c)}
#bib{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 28px 60px;font-size:13px;line-height:1.55;width:100%;max-width:900px;margin:0 auto}
#bib p{padding-left:22px;text-indent:-22px;margin-bottom:10px;break-inside:avoid;color:var(--mute)}#bib a{color:var(--acc);font-family:var(--mono);font-size:11px;text-decoration:none}#bib h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);column-span:all;margin-bottom:16px;font-weight:400}
@media (max-width:860px){
#top{left:16px;top:14px}#top .ch{max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#top .big{font-size:30px}#btns{right:14px;top:14px;flex-direction:row}.pill{padding:7px 11px;font-size:10px}
#hudbox{display:none}
#stage{left:12px;right:12px;width:auto;top:auto;bottom:84px;height:58vh}
.card{top:auto;bottom:0;max-height:100%}
footer{padding:0 12px 12px;gap:8px}#pos span{display:none}
#mapg{grid-template-columns:1fr}
}
.card .nav{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}.card .nav button{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.card .nav button.s{background:var(--acc);color:#1a1208;border-color:transparent}.card .nav button.s2{color:var(--acc)}.card .nav button:hover{filter:brightness(1.2)}
@media (max-width:860px){footer{height:150px}#strip{height:150px}#stage{bottom:160px;height:54vh}}
</style></head><body>
<canvas id="bg"></canvas>
<div id="top"><div class="ch" id="chl"></div><div class="big" id="hudbig"></div></div>
<div id="btns"><button class="pill" id="bmap">Map</button><button class="pill" id="bref">References</button></div>
<div id="hudbox"></div>
<main id="stage"></main>
<footer><button class="pill" id="prev" aria-label="Previous">←</button><div id="strip"></div><div id="pos"></div><button class="pill" id="next" aria-label="Next">→</button></footer>
<section class="ov" id="mapov"><div class="oh"><span>Map</span><button class="pill" data-close>Close</button></div><div id="mapg"></div></section>
<section class="ov" id="bibov"><div class="oh"><span>References</span><button class="pill" data-close>Close</button></div><div id="bib"></div></section>
<section id="intro"><canvas id="ic"></canvas><h1>Cosmic History</h1><button class="pill" id="go">Follow the map</button></section>
<script>
const CARDS=[{"ch": 1, "title": "The Planck era", "when": "before 10⁻⁴³ seconds", "tag": "unknown physics", "story": "Here our understanding ends. At this scale gravity itself should behave like a quantum thing, and no theory we trust can say what space and time were doing. Everything before this moment is a question, not an answer.", "more": "The Planck time is built from the constants G, ħ and c alone. It marks the scale at which general relativity and quantum mechanics must be combined, which no existing theory does in a tested way.", "facts": [["Planck time", "5.39×10⁻⁴⁴ s"], ["Planck length", "1.62×10⁻³⁵ m"], ["Status", "no accepted theory"]], "refs": [{"t": "Tiesinga, E., Mohr, P. J., Newell, D. B., & Taylor, B. N. (2021). CODATA recommended values of the fundamental physical constants: 2018. Reviews of Modern Physics.", "l": "https://doi.org/10.1103/RevModPhys.93.025010", "id": "doi:10.1103/RevModPhys.93.025010"}], "anim": "foam", "tz": {"sec": 5.39e-44}, "imp": ""}, {"ch": 1, "title": "The forces split apart", "when": "about 10⁻³⁶ seconds", "tag": "hypothesis", "story": "In the oldest picture, the strong force and the electroweak force were once a single force. As the fireball cooled they separated, and a hidden unity gave way to the separate forces we measure today. We have never seen the unified state, and the idea is still a hypothesis.", "more": "Grand unified theories predict that protons should decay, extremely slowly. Super-Kamiokande has watched tens of kilotonnes of water for years and seen no decay, which already rules out the simplest versions.", "facts": [["Unification scale", "~10¹⁶ GeV (model-dependent)"], ["Proton lifetime", "> 10³⁴ yr (measured limit)"], ["Status", "hypothesis"]], "refs": [{"t": "Georgi, H., & Glashow, S. L. (1974). Unity of all elementary-particle forces. Physical Review Letters.", "l": "https://doi.org/10.1103/PhysRevLett.32.438", "id": "doi:10.1103/PhysRevLett.32.438"}, {"t": "Abe, K. et al. (2017). Search for proton decay via p → e⁺π⁰ and p → μ⁺π⁰ in 0.31 megaton·years exposure of the Super-Kamiokande water Cherenkov detector. Physical Review D.", "l": "https://doi.org/10.1103/PhysRevD.95.012004", "id": "doi:10.1103/PhysRevD.95.012004"}], "anim": "foam", "tz": {"sec": 1e-36}, "imp": ""}, {"ch": 1, "title": "Inflation", "when": "10⁻³⁶ – 10⁻³² seconds", "tag": "hypothesis", "story": "Before stars, atoms or even light as we know it, there was a patch of space far smaller than a proton. In a sliver of a second it was stretched by a factor of at least a hundred trillion trillion, faster than anything has grown since.", "more": "In the leading picture a quantum field, the inflaton, holds a huge and nearly constant energy density, and space expands exponentially, a ∝ e^(Ht). Around 60 e-foldings would explain why the universe is so flat and so uniform on large scales. Quantum fluctuations of the field are stretched to macroscopic sizes and later become the density differences that grow into galaxies. Their near scale-invariance, n_s = 0.9649 ± 0.0042, is one of inflation’s best-tested predictions, but the energy scale and the timing are model-dependent and inflation itself is not proven.", "facts": [["Stretch", "≳ 60 e-folds (~10²⁶)"], ["Spectral index n_s", "0.9649 ± 0.0042"], ["Status", "hypothesis"]], "refs": [{"t": "Guth, A. H. (1981). The inflationary universe. Physical Review D.", "l": "https://doi.org/10.1103/PhysRevD.23.347", "id": "doi:10.1103/PhysRevD.23.347"}, {"t": "Baumann, D. (2009). TASI lectures on inflation. arXiv preprint.", "l": "https://arxiv.org/abs/0907.5424", "id": "arxiv:0907.5424"}, {"t": "Planck Collaboration (2020). Planck 2018 results. X. Constraints on inflation. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06211", "id": "arxiv:1807.06211"}], "anim": "expand", "tz": {"sec": 1e-34}, "imp": "", "old": 1}, {"ch": 1, "title": "The fireball", "when": "~10⁻³² seconds", "tag": "theory", "story": "Inflation ended the way a stretched spring lets go. The energy stored in empty space poured out as a hot fireball of particles. This, and not the stretching, is what we usually call the Big Bang.", "more": "As the inflaton decays, its energy is converted into a hot plasma of Standard Model particles, a process called reheating. The temperature reached depends on the model and is unknown. From here the universe is dominated by radiation, and it stays that way for roughly the next 51,000 years.", "facts": [["Temperature", "model-dependent"]], "refs": [{"t": "Kofman, L., Linde, A., & Starobinsky, A. (1997). Towards the theory of reheating after inflation. Physical Review D.", "l": "https://arxiv.org/abs/hep-ph/9704452", "id": "arxiv:hep-ph/9704452"}, {"t": "Allahverdi, R. et al. (2010). Reheating in inflationary cosmology. Annual Review of Nuclear and Particle Science.", "l": "https://arxiv.org/abs/1001.2600", "id": "arxiv:1001.2600"}], "anim": "burst", "tz": {"sec": 1e-32}, "imp": "", "old": 1}, {"ch": 1, "title": "The Higgs field switches on", "when": "~10⁻¹¹ seconds", "tag": "lattice", "story": "As the universe cooled below about 160 billion electron-volts, an invisible field that fills all of space settled into its lowest-energy state. Particles that had been massless now had to wade through it, and so they gained mass. Without this step there would be no atoms.", "more": "The Higgs potential changes from a single well to the “Mexican hat” shape, and the field takes a non-zero value. The W and Z bosons and the quarks and charged leptons acquire mass, and the weak force becomes short-ranged. With the measured Higgs mass the Standard Model transition is a smooth crossover, not a sharp jump.", "facts": [["Crossover T", "159.5 ± 1.5 GeV"], ["Temperature", "≈ 1.9×10¹⁵ K"]], "refs": [{"t": "D’Onofrio, M., & Rummukainen, K. (2016). Standard Model cross-over on the lattice. Physical Review D.", "l": "https://arxiv.org/abs/1508.07161", "id": "arxiv:1508.07161"}, {"t": "Kajantie, K. et al. (1996). Is there a hot electroweak phase transition at mH ≳ mW?. Physical Review Letters.", "l": "https://arxiv.org/abs/hep-ph/9605288", "id": "arxiv:hep-ph/9605288"}], "anim": "higgs", "tz": {"sec": 9.2e-12}, "imp": "", "old": 1}, {"ch": 1, "title": "Dark matter appears", "when": "time unknown", "tag": "open question", "story": "Whatever dark matter is, it was there from early on. It does not shine, it does not touch light, and it outweighs all the ordinary matter by more than five to one. We know it by its gravity alone, and we do not yet know what it is.", "more": "The time shown is schematic. Candidates such as weakly interacting massive particles would have frozen out about a nanosecond after the Big Bang, but other candidates are produced at completely different epochs, so the time is model-dependent.", "facts": [["Density Ω_c h²", "0.1200 ± 0.0012"], ["Dark / ordinary matter", "≈ 5.4 (derived)"], ["Nature", "unknown"]], "refs": [{"t": "Bertone, G., & Hooper, D. (2018). History of dark matter. Reviews of Modern Physics.", "l": "https://arxiv.org/abs/1605.04909", "id": "arxiv:1605.04909"}, {"t": "Planck Collaboration (2020). Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06209", "id": "arxiv:1807.06209"}], "anim": "web", "tz": {"sec": 1e-10}, "imp": ""}, {"ch": 1, "title": "Why anything exists", "when": "time unknown (before ~10⁻⁵ s)", "tag": "open question", "story": "Nature makes matter and antimatter in equal measure, and when they meet they vanish into light. In a perfectly balanced universe nothing would have survived. Something tipped the scales by about one part in a billion, and you are made of what was left over.", "more": "Today there is about one proton or neutron for every 1.6 billion photons: a baryon-to-photon ratio η ≈ 6.1×10⁻¹⁰, computed here from Ω_b h² = 0.02237 ± 0.00015. Producing it needs, in Sakharov’s terms, baryon-number violation, C and CP violation, and a departure from equilibrium. The Standard Model alone does not supply enough asymmetry, so the real mechanism is unknown and the time is placed schematically.", "facts": [["Baryon-to-photon ratio", "≈ 6.1×10⁻¹⁰ (derived)"], ["Mechanism", "unknown"]], "refs": [{"t": "Riotto, A., & Trodden, M. (1999). Recent progress in baryogenesis. Annual Review of Nuclear and Particle Science.", "l": "https://arxiv.org/abs/hep-ph/9901362", "id": "arxiv:hep-ph/9901362"}, {"t": "Dine, M., & Kusenko, A. (2003). The origin of the matter-antimatter asymmetry. Reviews of Modern Physics.", "l": "https://arxiv.org/abs/hep-ph/0303065", "id": "arxiv:hep-ph/0303065"}, {"t": "Planck Collaboration (2020). Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06209", "id": "arxiv:1807.06209"}], "anim": "asym", "tz": {"sec": 1e-08}, "imp": "For every billion pairs of particles, one was left over. We are made of the leftovers.", "old": 1}, {"ch": 2, "title": "Quarks lock together", "when": "~10 microseconds", "tag": "lattice", "story": "For ten millionths of a second the universe was a soup of free quarks and gluons at about two trillion degrees. Then it cooled enough for them to clump in threes. Every proton and neutron in the observable universe formed within this instant, and no quark has been seen alone since.", "more": "Quarks and gluons are confined into hadrons through a smooth crossover rather than a sharp phase transition. The strong force between quarks does not weaken with distance, so separating them creates new quark pairs instead. The temperature of the crossover is known from lattice QCD.", "facts": [["Crossover T", "156.5 ± 1.5 MeV"], ["Temperature", "≈ 1.8×10¹² K"]], "refs": [{"t": "Bazavov, A. et al. (2019). Chiral crossover in QCD at zero and non-zero chemical potentials. Physics Letters B.", "l": "https://arxiv.org/abs/1812.08235", "id": "arxiv:1812.08235"}, {"t": "Aoki, Y. et al. (2006). The order of the QCD transition predicted by the Standard Model. Nature.", "l": "https://arxiv.org/abs/hep-lat/0611014", "id": "arxiv:hep-lat/0611014"}], "anim": "qcd", "tz": {"sec": 1.26e-05}, "imp": "", "old": 1}, {"ch": 2, "title": "Pions and muons vanish", "when": "about 10⁻⁴ seconds", "tag": "", "story": "As the soup cools, heavier particles can no longer be made from the heat that is left. The short-lived muons, the heavy cousins of the electron, decay away in millionths of a second, and the universe settles into a simpler mix of light, electrons and neutrinos.", "more": "", "facts": [["Muon mean life", "2.197 µs"], ["Muon mass", "105.66 MeV"], ["Temperature", "≈ 10¹² K"]], "refs": [{"t": "Workman, R. L. et al. (Particle Data Group) (2022). Review of particle physics. Progress of Theoretical and Experimental Physics.", "l": "https://doi.org/10.1093/ptep/ptac097", "id": "doi:10.1093/ptep/ptac097"}], "anim": "plasma", "tz": {"sec": 6e-05}, "imp": ""}, {"ch": 2, "title": "The neutrinos escape", "when": "about 1 second", "tag": "", "story": "After a second the universe is so thin that neutrinos, the most elusive particles we know, stop colliding with anything and fly free. They still fill space today. At the same moment, the reactions that turned neutrons into protons freeze, which fixes the recipe for the helium to come.", "more": "At T ≈ 0.8 MeV the weak interactions that interconvert neutrons and protons fall out of equilibrium and the neutron-to-proton ratio freezes. It then keeps dropping because free neutrons decay, with a mean life of 885.7 ± 0.8 s. This ratio sets how much helium-4 can be made.", "facts": [["Temperature", "≈ 0.8 MeV (~10¹⁰ K)"], ["Neutron mean life", "885.7 ± 0.8 s"]], "refs": [{"t": "Steigman, G. (2004). Big Bang nucleosynthesis: probing the first 20 minutes. arXiv preprint.", "l": "https://arxiv.org/abs/astro-ph/0307244", "id": "arxiv:astro-ph/0307244"}, {"t": "Pitrou, C. et al. (2018). Precision BBN with improved helium-4 predictions. Physics Reports.", "l": "https://arxiv.org/abs/1801.08023", "id": "arxiv:1801.08023"}], "anim": "weak", "tz": {"sec": 1}, "imp": "", "old": 1}, {"ch": 2, "title": "Electrons and positrons annihilate", "when": "a few seconds to ~20 seconds", "tag": "", "story": "Electrons and their antiparticles meet, and the mass of almost all of them turns into light. The neutrinos have already left, so they miss the heat. That is why the neutrino background is colder than the afterglow of light, and why we can compute it today.", "more": "The extra heat from the annihilation goes into the photons only, which is the origin of the 4/11 factor. The cosmic neutrino background has never been detected directly, so its temperature is a prediction.", "facts": [["T(ν) / T(γ) today", "(4/11)^(1/3) ≈ 0.714"], ["Neutrino background", "≈ 1.95 K (predicted)"], ["Status", "not directly detected"]], "refs": [{"t": "Dolgov, A. D. (2002). Neutrinos in cosmology. Physics Reports.", "l": "https://arxiv.org/abs/hep-ph/0202122", "id": "arxiv:hep-ph/0202122"}], "anim": "pairs", "tz": {"sec": 10}, "imp": ""}, {"ch": 2, "title": "A nuclear reactor the size of the universe", "when": "3 to 20 minutes", "tag": "", "story": "As things cooled, protons and neutrons could finally stick together without being torn apart again. For about seventeen minutes the entire universe was a fusion reactor, forging helium. When it shut down, matter was about three-quarters hydrogen and one-quarter helium, and that is still what the oldest gas looks like.", "more": "Deuterium survives photodissociation only when T < ~80 keV, which opens the “deuterium bottleneck”; after that helium-4, with traces of deuterium, helium-3 and lithium-7, is built in minutes. Nuclear reactions freeze by about 20 minutes (T < ~30 keV). The predicted lithium-7 is roughly three times higher than measured in old stars, which is the “lithium problem”.", "facts": [["⁴He mass fraction", "0.248 ± 0.001 (prediction)"], ["D/H", "≈ 2.6×10⁻⁵"], ["Ends at", "T < ~30 keV"]], "refs": [{"t": "Cyburt, R. H. et al. (2016). Big Bang nucleosynthesis: present status. Reviews of Modern Physics.", "l": "https://arxiv.org/abs/1505.01076", "id": "arxiv:1505.01076"}, {"t": "Fields, B. D. et al. (2020). Big-bang nucleosynthesis after Planck. Journal of Cosmology and Astroparticle Physics.", "l": "https://arxiv.org/abs/1912.01132", "id": "arxiv:1912.01132"}, {"t": "Fields, B. D. (2011). The primordial lithium problem. Annual Review of Nuclear and Particle Science.", "l": "https://arxiv.org/abs/1203.3551", "id": "arxiv:1203.3551"}, {"t": "Steigman, G. (2004). Big Bang nucleosynthesis: probing the first 20 minutes. arXiv preprint.", "l": "https://arxiv.org/abs/astro-ph/0307244", "id": "arxiv:astro-ph/0307244"}], "anim": "fuse", "tz": {"sec": 600}, "imp": "", "old": 1}, {"ch": 3, "title": "Matter takes the lead", "when": "51,000 years · z = 3402 ± 26", "tag": "Planck", "story": "For its first 50,000 years the universe was ruled by light. But as space stretches, light loses energy while matter is only diluted, and so matter slowly overtook it. From this moment gravity can start gathering matter into clumps.", "more": "Radiation energy density falls as a⁻⁴ (number dilution plus redshift) and matter as a⁻³, so they cross at z_eq = 3402 ± 26. Dark matter, which does not interact with light, starts to collapse into halos first, and ordinary matter follows later.", "facts": [["Redshift", "3402 ± 26"], ["Temperature", "≈ 9,300 K"]], "refs": [{"t": "Planck Collaboration (2020). Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06209", "id": "arxiv:1807.06209"}, {"t": "Planck Collaboration (2020). Planck 2018 results. I. Overview. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06205", "id": "arxiv:1807.06205"}], "anim": "balance", "tz": {"z": 3402}, "imp": "", "old": 1}, {"ch": 3, "title": "The universe becomes transparent", "when": "371,000 years · z = 1089.92 ± 0.25", "tag": "Planck", "story": "Until now the universe was an opaque, glowing fog, like the inside of a star. At about 3,000 degrees, hot enough to melt any rock but cool as stars go, electrons were captured by nuclei and atoms formed for the first time. Suddenly light could travel freely, and it has been travelling ever since.", "more": "Free electrons scatter photons very efficiently, so the plasma is opaque. When most of them combine with protons and helium nuclei (recombination), photons decouple at the surface of last scattering. The recombination redshift is z* = 1089.92 ± 0.25.", "facts": [["Redshift", "1089.92 ± 0.25"], ["Temperature then", "≈ 2,970 K"], ["Temperature now", "2.7255 K"]], "refs": [{"t": "Seager, S., Sasselov, D. D., & Scott, D. (1999). A new calculation of the recombination epoch. The Astrophysical Journal Letters.", "l": "https://arxiv.org/abs/astro-ph/9909275", "id": "arxiv:astro-ph/9909275"}, {"t": "Planck Collaboration (2020). Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06209", "id": "arxiv:1807.06209"}], "anim": "recomb", "tz": {"z": 1089.92}, "imp": "The fog clears. The first light that can travel is on its way, and it is still arriving.", "old": 1}, {"ch": 3, "title": "The plasma rings", "when": "about 380,000 years · z ≈ 1060", "tag": "Planck", "story": "Before the fog cleared, sound waves rippled through the hot plasma. When the light was released they froze in place, and left a ring in the matter about 150 megaparsecs across. We still find that ring in the positions of galaxies, a ruler written into the sky.", "more": "These baryon acoustic oscillations give a standard ruler. Measuring its apparent size at different distances maps the expansion history, and is the main method behind the DESI results.", "facts": [["Drag epoch", "z = 1059.94 ± 0.30"], ["Sound horizon", "147.09 ± 0.26 Mpc"], ["First seen in galaxies", "2005"]], "refs": [{"t": "Planck Collaboration (2020). Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06209", "id": "arxiv:1807.06209"}, {"t": "Eisenstein, D. J. et al. (2005). Detection of the baryon acoustic peak in the large-scale correlation function of SDSS luminous red galaxies. The Astrophysical Journal.", "l": "https://arxiv.org/abs/astro-ph/0501171", "id": "arxiv:astro-ph/0501171"}], "anim": "rings", "tz": {"z": 1059.94}, "imp": ""}, {"ch": 3, "title": "The afterglow", "when": "about 390,000 years", "tag": "", "story": "That first light is still all around us. In 1965 two radio engineers, Arno Penzias and Robert Wilson, found a faint hiss in their antenna that they could not get rid of. It was the afterglow of the Big Bang, now stretched to microwaves, with tiny hot and cold patches that mark where galaxies would one day grow.", "more": "The CMB has a blackbody spectrum at 2.7255 K. Its temperature varies by only about one part in 100,000 from place to place, and these anisotropies reflect the density fluctuations at recombination, seeded by inflation. Their statistics measure the age, geometry and composition of the universe.", "facts": [["Discovered", "1965 (Penzias & Wilson)"], ["Temperature", "2.7255 K"], ["Variation", "~1 part in 100,000"]], "refs": [{"t": "Fixsen, D. J. (2009). The temperature of the cosmic microwave background. The Astrophysical Journal.", "l": "https://arxiv.org/abs/0911.1955", "id": "arxiv:0911.1955"}, {"t": "Fixsen, D. J. et al. (1996). The CMB spectrum from the full COBE FIRAS data set. The Astrophysical Journal.", "l": "https://arxiv.org/abs/astro-ph/9605054", "id": "arxiv:astro-ph/9605054"}, {"t": "Planck Collaboration (2020). Planck 2018 results. I. Overview. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06205", "id": "arxiv:1807.06205"}, {"t": "Lewis, A., Challinor, A., & Lasenby, A. (2000). Efficient computation of CMB anisotropies in closed FRW models. The Astrophysical Journal.", "l": "https://arxiv.org/abs/astro-ph/9911177", "id": "arxiv:astro-ph/9911177"}], "anim": "cmbmap", "tz": {"z": 1040}, "imp": "", "old": 1}, {"ch": 3, "title": "The Dark Ages", "when": "0.4 to about 100 million years", "tag": "", "story": "Now there was light, but no source of it. The glow of the Big Bang faded from orange to red to invisible infrared, and the universe went dark. In the darkness gravity worked slowly, pulling matter into a cosmic web of filaments, held together by dark matter, a substance five times more abundant than everything we can see.", "more": "With Ω_c h² = 0.1200 and Ω_b h² = 0.02237, dark matter outweighs ordinary matter by about 5.4 to 1. Density differences of one part in 100,000 grow under gravity into the first dark-matter halos of around a million solar masses, the minihalos that will host the first stars.", "facts": [["Dark/ordinary matter", "≈ 5.4 (derived)"], ["Minihalo mass", "~10⁶ M☉"]], "refs": [{"t": "Bromm, V. (2013). Formation of the first stars. Reports on Progress in Physics.", "l": "https://arxiv.org/abs/1305.5178", "id": "arxiv:1305.5178"}, {"t": "Pritchard, J. R., & Loeb, A. (2012). 21 cm cosmology in the 21st century. Reports on Progress in Physics.", "l": "https://arxiv.org/abs/1109.6012", "id": "arxiv:1109.6012"}], "anim": "redshift", "tz": {"z": 150}, "imp": "", "old": 1}, {"ch": 3, "title": "The first clumps", "when": "from the first millions of years", "tag": "theory", "story": "Gravity needs somewhere to begin. In the cold, dark gas and dark matter, the slightest excess of density pulled in more matter, and grew. The smallest of these dark clumps could be as light as the Earth, and they are still waiting to be found.", "more": "", "facts": [["Halos that host the first stars", "~10⁶ M☉"], ["Smallest halos (WIMP models)", "~10⁻⁶ M☉ (model-dependent)"]], "refs": [{"t": "Green, A. M., Hofmann, S., & Schwarz, D. J. (2004). The power spectrum of SUSY-CDM on sub-galactic scales. Monthly Notices of the Royal Astronomical Society.", "l": "https://arxiv.org/abs/astro-ph/0309621", "id": "arxiv:astro-ph/0309621"}, {"t": "Bromm, V. (2013). Formation of the first stars. Reports on Progress in Physics.", "l": "https://arxiv.org/abs/1305.5178", "id": "arxiv:1305.5178"}], "anim": "web", "tz": {"z": 40}, "imp": ""}, {"ch": 3, "title": "The first stars", "when": "about 100 million years · z ≈ 20–30", "tag": "simulation", "story": "In the darkness, gas collapsed in the deepest halos and ignited the first stars. They were made only of hydrogen and helium, and simulations suggest they were giants of 10 to 50 solar masses or more, bright and blue and short-lived. No one has yet seen one directly.", "more": "Without heavy elements gas cools poorly, so the first stars are expected to be more massive than later ones. Their ultraviolet light begins to heat and ionise the gas around them. Population III stars have not been detected directly; searches focus on faint high-redshift galaxies and on the chemical signatures in the oldest stars today.", "facts": [["Formation", "z ≈ 20–30"], ["Typical mass", "~10–50 M☉ (simulations)"], ["Composition", "H and He only"]], "refs": [{"t": "Abel, T., Bryan, G. L., & Norman, M. L. (2002). The formation of the first star in the universe. Science.", "l": "https://arxiv.org/abs/astro-ph/0112088", "id": "arxiv:astro-ph/0112088"}, {"t": "Hirano, S. et al. (2014). One hundred first stars: protostellar evolution and the final masses. The Astrophysical Journal.", "l": "https://arxiv.org/abs/1308.4456", "id": "arxiv:1308.4456"}, {"t": "Klessen, R. S., & Glover, S. C. O. (2023). The first stars: formation, properties, and impact. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/2303.12500", "id": "arxiv:2303.12500"}], "anim": "starborn", "tz": {"z": 28}, "imp": "Somewhere in the dark a cloud of hydrogen collapses, and the first lamps are lit.", "old": 1}, {"ch": 3, "title": "The first black holes", "when": "from about 100 million years", "tag": "debated", "story": "Some of the first stars collapsed to black holes, and some of the first gas clouds may have collapsed straight into a black hole without ever making a star. These seeds had to grow fast, because only a few hundred million years later we see monsters with a billion Suns of mass.", "more": "Which route made the seeds is one of the main open questions. Webb has since found many faint, active nuclei at z > 5, which suggests that early black holes were common.", "facts": [["Light seeds", "~10²–10³ M☉ (star remnants)"], ["Heavy seeds", "~10⁴–10⁵ M☉ (direct collapse)"], ["UHZ1", "z = 10.1, X-ray quasar"]], "refs": [{"t": "Inayoshi, K., Visbal, E., & Haiman, Z. (2020). The assembly of the first massive black holes. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/1911.05791", "id": "arxiv:1911.05791"}, {"t": "Bogdán, Á. et al. (2024). Evidence for heavy-seed origin of early supermassive black holes from a z ≈ 10 X-ray quasar. Nature Astronomy.", "l": "https://arxiv.org/abs/2305.15458", "id": "arxiv:2305.15458"}], "anim": "bh", "tz": {"z": 25}, "imp": ""}, {"ch": 3, "title": "The first elements", "when": "about 180 million years", "tag": "standard theory", "story": "The first stars lived fast and died in explosions that scattered carbon, oxygen, iron and other elements into space for the first time. Everything in your body heavier than helium was built in stars and thrown out like this. We are, in a very literal sense, star stuff.", "more": "Massive stars end their lives as supernovae, enriching the gas with “metals”. The next generation of stars forms from enriched gas. The faint remnants of this first enrichment survive as chemical fingerprints in the most metal-poor stars of the Milky Way.", "facts": [["Made in the first stars", "C, O, Mg, Si, Fe …"], ["Fingerprints", "in the most metal-poor stars"]], "refs": [{"t": "Heger, A., & Woosley, S. E. (2002). The nucleosynthetic signature of Population III. The Astrophysical Journal.", "l": "https://arxiv.org/abs/astro-ph/0107037", "id": "arxiv:astro-ph/0107037"}, {"t": "Keller, S. C. et al. (2014). A single low-energy, iron-poor supernova as the source of metals in SMSS J0313−6708. Nature.", "l": "https://arxiv.org/abs/1402.1517", "id": "arxiv:1402.1517"}, {"t": "Frebel, A., & Norris, J. E. (2015). Near-field cosmology with extremely metal-poor stars. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/1501.06921", "id": "arxiv:1501.06921"}], "anim": "supernova", "tz": {"z": 20}, "imp": "", "old": 1}, {"ch": 3, "title": "The 21-centimetre silence", "when": "from about 100 million years · z ≈ 20–30", "tag": "not yet detected", "story": "Hydrogen atoms carry a faint radio signature at 21 centimetres. Stretched by the expansion, the signal from the dark ages and the first stars should arrive at metre wavelengths, and it would be the only direct view of this era. In 2018 one experiment reported a dip, and another one in 2022 did not confirm it.", "more": "A confirmed signal would constrain when the first stars switched on. The EDGES dip was deeper than standard physics allows, which made it either new physics or a systematic error. The 2022 SARAS 3 result favours a systematic.", "facts": [["Rest frequency", "1420.405752 MHz"], ["EDGES claim (2018)", "absorption near 78 MHz"], ["SARAS 3 (2022)", "profile rejected"]], "refs": [{"t": "Bowman, J. D. et al. (2018). An absorption profile centred at 78 megahertz in the sky-averaged spectrum. Nature.", "l": "https://doi.org/10.1038/nature25792", "id": "doi:10.1038/nature25792"}, {"t": "Singh, S. et al. (2022). On the detection of a cosmic dawn signal in the radio background. Nature Astronomy.", "l": "https://arxiv.org/abs/2112.06778", "id": "arxiv:2112.06778"}], "anim": "trough", "tz": {"z": 20}, "imp": ""}, {"ch": 3, "title": "Stars born from ashes", "when": "from about 200 million years · z ≈ 15", "tag": "archaeology", "story": "The second generation of stars formed from gas that the first stars had polluted. A pinch of carbon and oxygen was enough to let the gas cool and to make small stars that live for billions of years. A few of them are still shining, and astronomers read them like fossils.", "more": "A star with [Fe/H] = −5.4 has about 250,000 times less iron than the Sun, relative to hydrogen. Stars this poor in metals are rare, and most of the known ones are strongly enhanced in carbon, which is why carbon is thought to have enabled their formation.", "facts": [["HE 1327−2326", "[Fe/H] = −5.4"], ["SMSS J0313−6708", "[Fe/H] < −7.1"], ["Cooling threshold", "[C/H] ≳ −3.5 (carbon-driven)"]], "refs": [{"t": "Frebel, A. et al. (2005). Discovery of HE 1327−2326, an extremely metal-poor star. Nature.", "l": "https://doi.org/10.1038/nature03455", "id": "doi:10.1038/nature03455"}, {"t": "Keller, S. C. et al. (2014). A single low-energy, iron-poor supernova as the source of metals in the star SMSS J0313−6708. Nature.", "l": "https://arxiv.org/abs/1402.1517", "id": "arxiv:1402.1517"}], "anim": "starborn", "tz": {"z": 15}, "imp": ""}, {"ch": 4, "title": "The earliest galaxy we have seen", "when": "about 280 million years · z = 14.44", "tag": "JWST", "story": "The James Webb Space Telescope can see galaxies as they were less than 300 million years after the Big Bang. The most distant one confirmed so far, MoM-z14, is more compact and brighter than many models predicted.", "more": "MoM-z14 was confirmed spectroscopically at z = 14.44. Its light has travelled for about 13.5 billion years and been stretched by a factor of 15.4, so ultraviolet light reaches us as infrared. Finding so many luminous galaxies this early is one of Webb’s surprises.", "facts": [["Redshift", "14.44"], ["Cosmic age", "≈ 282 Myr"]], "refs": [{"t": "Naidu, R. P. et al. (2025). A “cosmic miracle”: a remarkably luminous galaxy at z = 14.44. arXiv preprint.", "l": "https://arxiv.org/abs/2505.11263", "id": "arxiv:2505.11263"}, {"t": "Carniani, S. et al. (2024). A shining cosmic dawn: spectroscopic confirmation of two luminous galaxies at z ~ 14. Nature.", "l": "https://arxiv.org/abs/2405.18485", "id": "arxiv:2405.18485"}, {"t": "Harikane, Y. et al. (2023). A comprehensive study of galaxies at z ~ 9–16. The Astrophysical Journal Supplement Series.", "l": "https://arxiv.org/abs/2208.01612", "id": "arxiv:2208.01612"}], "anim": "firstgal", "tz": {"z": 14.44}, "imp": "With the Webb telescope we look back across almost fourteen billion years, and find that the dawn was bright.", "old": 1}, {"ch": 4, "title": "The fog lifts again", "when": "about 670 million years · z ≈ 7.7", "tag": "Planck", "story": "The new stars and galaxies flooded space with ultraviolet light, tearing electrons from the hydrogen around them. Bubbles of ionised gas grew and merged until the whole universe was transparent to ultraviolet light, as it is today.", "more": "Reionisation redshift z_re = 7.67 ± 0.73 in the simple tanh model, and an optical depth τ = 0.0544 ± 0.0073 for the CMB photons that scatter off the freed electrons. Less than ~1% of the stars in the universe formed during this era.", "facts": [["Midpoint z", "7.67 ± 0.73"], ["Optical depth τ", "0.0544 ± 0.0073"]], "refs": [{"t": "Robertson, B. E. et al. (2015). Cosmic reionization and early star-forming galaxies. The Astrophysical Journal Letters.", "l": "https://arxiv.org/abs/1502.02024", "id": "arxiv:1502.02024"}, {"t": "Fan, X., Carilli, C. L., & Keating, B. (2006). Observational constraints on cosmic reionization. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/astro-ph/0602375", "id": "arxiv:astro-ph/0602375"}, {"t": "Planck Collaboration (2020). Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06209", "id": "arxiv:1807.06209"}], "anim": "bubbles", "tz": {"z": 7.67}, "imp": "", "old": 1}, {"ch": 4, "title": "Monsters in the dark", "when": "670 million years · z = 7.64", "tag": "Keck / Gemini", "story": "Already at 670 million years there were black holes with a billion times the mass of the Sun, lighting up the gas around them as quasars. How did they grow so big so fast? That is one of the open puzzles of the early universe.", "more": "The quasar J0313−1806 at z = 7.64 is powered by a black hole of more than 1.6 billion solar masses. Seeds from the first stars, or direct collapse of gas clouds, with fast growth, are the main candidate routes.", "facts": [["Quasar", "J0313−1806"], ["Redshift", "7.64"], ["Black-hole mass", "> 1.6×10⁹ M☉"]], "refs": [{"t": "Wang, F. et al. (2021). A luminous quasar at redshift 7.642. The Astrophysical Journal Letters.", "l": "https://arxiv.org/abs/2101.03179", "id": "arxiv:2101.03179"}, {"t": "Bañados, E. et al. (2018). An 800-million-solar-mass black hole in a significantly neutral universe at z = 7.5. Nature.", "l": "https://arxiv.org/abs/1712.01860", "id": "arxiv:1712.01860"}, {"t": "Maiolino, R. et al. (2024). A small and vigorous black hole in the early universe. Nature.", "l": "https://arxiv.org/abs/2305.12492", "id": "arxiv:2305.12492"}, {"t": "Matthee, J. et al. (2024). Little red dots. The Astrophysical Journal.", "l": "https://arxiv.org/abs/2306.05448", "id": "arxiv:2306.05448"}], "anim": "bh", "tz": {"z": 7.64}, "imp": "", "old": 1}, {"ch": 4, "title": "Our Galaxy takes shape", "when": "0.8 billion years", "tag": "Gaia + LAMOST", "story": "Even this early the Milky Way was assembling. Stars in its thick disc began forming around 13 billion years ago. Soon after, it swallowed a smaller galaxy, called Gaia-Sausage-Enceladus, which triggered a burst of new stars.", "more": "Ages of stars measured by combining Gaia and LAMOST data place the formation of the thick disc about 0.8 billion years after the Big Bang. It continued forming stars until its gas ran out about 6 billion years after the Big Bang.", "facts": [["Thick disc starts", "≈ 0.8 Gyr after BB"], ["Thick disc ends", "≈ 6 Gyr after BB"]], "refs": [{"t": "Belokurov, V. et al. (2018). Co-formation of the disc and the stellar halo. Monthly Notices of the Royal Astronomical Society.", "l": "https://arxiv.org/abs/1802.03414", "id": "arxiv:1802.03414"}, {"t": "Helmi, A. et al. (2018). The merger that led to the formation of the Milky Way’s inner stellar halo and thick disk. Nature.", "l": "https://arxiv.org/abs/1806.06038", "id": "arxiv:1806.06038"}, {"t": "Xiang, M., & Rix, H.-W. (2022). A time-resolved picture of our Milky Way’s early formation history. Nature.", "l": "https://arxiv.org/abs/2203.12110", "id": "arxiv:2203.12110"}, {"t": "Bland-Hawthorn, J., & Gerhard, O. (2016). The Galaxy in context. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/1602.07702", "id": "arxiv:1602.07702"}], "anim": "galaxy", "tz": {"gyr": 0.8}, "imp": "", "old": 1}, {"ch": 4, "title": "The cosmic web", "when": "from about 1 billion years · z ≈ 6", "tag": "simulation", "story": "Gravity did not gather matter into a ball. It drew it into a net: long filaments of dark matter and gas, crossing in knots where galaxies cluster, around vast empty voids. Everything we can see sits on the threads of this web.", "more": "In simulations the web is a robust prediction of cold dark matter and a cosmological constant. Observations of galaxy surveys show the same filaments and voids, and faint gas glowing along filaments has been imaged directly at high redshift.", "facts": [["Millennium Simulation", "10¹⁰ particles"], ["Box size", "500 h⁻¹ Mpc"], ["Structure", "filaments, knots, voids"]], "refs": [{"t": "Springel, V. et al. (2005). Simulations of the formation, evolution and clustering of galaxies and quasars. Nature.", "l": "https://doi.org/10.1038/nature03597", "id": "doi:10.1038/nature03597"}], "anim": "web", "tz": {"z": 6}, "imp": ""}, {"ch": 4, "title": "The first clusters", "when": "about 1.4 billion years · z = 4.3", "tag": "observed", "story": "Where the threads of the web crossed, whole families of galaxies gathered. One of the earliest known is seen as it was when the universe was 1.4 billion years old: a dense knot of galaxies forming stars at a ferocious rate, a baby cluster.", "more": "", "facts": [["Protocluster", "SPT2349−56"], ["Redshift", "z = 4.3"], ["Star formation", "> 10⁴ M☉ per year (combined)"]], "refs": [{"t": "Miller, T. B. et al. (2018). A massive core for a cluster of galaxies at a redshift of 4.3. Nature.", "l": "https://ui.adsabs.harvard.edu/abs/2018Natur.556..469M", "id": "ads:2018Natur.556..469M"}], "anim": "galaxy", "tz": {"z": 4.3}, "imp": ""}, {"ch": 4, "title": "Cosmic noon", "when": "3.5 billion years · z ≈ 1.9", "tag": "", "story": "This was the busiest era in the history of the universe: galaxies were forming stars at about ten times today’s rate. Roughly half of all the stars that exist today had formed by z = 1.3, and the rate has been declining ever since.", "more": "The cosmic star-formation rate density peaked about 3.5 billion years after the Big Bang, at z ≈ 1.9, and has declined exponentially since with an e-folding time of 3.9 billion years. About 25% of today’s stellar mass formed before the peak and another 25% after z = 0.7.", "facts": [["Peak", "z ≈ 1.9"], ["e-folding decline", "3.9 Gyr"], ["Half the stars by", "z = 1.3"]], "refs": [{"t": "Madau, P., & Dickinson, M. (2014). Cosmic star-formation history. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/1403.0007", "id": "arxiv:1403.0007"}, {"t": "Conselice, C. J. et al. (2016). The evolution of galaxy number density at z < 8 and its implications. The Astrophysical Journal.", "l": "https://arxiv.org/abs/1607.03909", "id": "arxiv:1607.03909"}], "anim": "sfr", "tz": {"z": 1.9}, "imp": "", "old": 1}, {"ch": 4, "title": "A galaxy swallows a galaxy", "when": "about 10 billion years ago", "tag": "Gaia", "story": "About ten billion years ago the young Milky Way collided with a smaller galaxy and absorbed it. The stars of the victim are still with us. Their orbits are so stretched that, in a plot of their speeds, they form a shape like a sausage, which gave the event its name.", "more": "The merger is thought to have heated the early disc and to have contributed much of the stars in the inner halo. Its mass and timing are still being refined.", "facts": [["Merger", "≈ 10 Gyr ago"], ["Progenitor", "Gaia-Sausage-Enceladus"], ["Stellar mass", "~10⁹ M☉ (order of magnitude)"]], "refs": [{"t": "Helmi, A. et al. (2018). The merger that led to the formation of the Milky Way’s inner stellar halo and thick disk. Nature.", "l": "https://arxiv.org/abs/1806.06038", "id": "arxiv:1806.06038"}, {"t": "Belokurov, V. et al. (2018). Co-formation of the disc and the stellar halo. Monthly Notices of the Royal Astronomical Society.", "l": "https://arxiv.org/abs/1802.03414", "id": "arxiv:1802.03414"}], "anim": "galaxy", "tz": {"ago": 10}, "imp": ""}, {"ch": 4, "title": "The universe speeds up", "when": "7.7 billion years · z ≈ 0.63", "tag": "Planck", "story": "For billions of years gravity slowed the expansion. But as matter thinned out, a mysterious dark energy, which does not thin out, took over. At about 7.7 billion years the expansion began to accelerate, and it still does.", "more": "In flat ΛCDM with Ω_m = 0.3153 and Ω_Λ = 0.6847, acceleration starts at z ≈ 0.63, and dark energy exceeds matter in density from z ≈ 0.29, about 3.5 billion years ago. The nature of dark energy is unknown.", "facts": [["Acceleration starts", "z ≈ 0.63"], ["ρΛ = ρm", "z ≈ 0.29"], ["Ω_Λ", "0.6847 ± 0.0073"]], "refs": [{"t": "Riess, A. G. et al. (1998). Observational evidence from supernovae for an accelerating universe. The Astronomical Journal.", "l": "https://arxiv.org/abs/astro-ph/9805201", "id": "arxiv:astro-ph/9805201"}, {"t": "Perlmutter, S. et al. (1999). Measurements of Ω and Λ from 42 high-redshift supernovae. The Astrophysical Journal.", "l": "https://arxiv.org/abs/astro-ph/9812133", "id": "arxiv:astro-ph/9812133"}, {"t": "DESI Collaboration (2025). DESI DR2 results II. arXiv preprint.", "l": "https://arxiv.org/abs/2503.14738", "id": "arxiv:2503.14738"}], "anim": "accel", "tz": {"z": 0.63}, "imp": "Something unknown is pushing space apart. We call it dark energy, and we do not know what it is.", "old": 1}, {"ch": 4, "title": "The Large Magellanic Cloud arrives", "when": "first infall about 1–2 billion years ago", "tag": "debated", "story": "The two brightest satellites of the Milky Way are probably newcomers. The Large Magellanic Cloud seems to be on its first pass, and it is already pulling on our Galaxy hard enough to wobble it.", "more": "", "facts": [["Distance", "≈ 50 kpc"], ["Orbit", "first infall (debated)"]], "refs": [{"t": "Besla, G. et al. (2007). Are the Magellanic Clouds on their first passage about the Milky Way? The Astrophysical Journal.", "l": "https://ui.adsabs.harvard.edu/abs/2007ApJ...668..949B", "id": "ads:2007ApJ...668..949B"}], "anim": "galaxy", "tz": {"ago": 1.5}, "imp": ""}, {"ch": 4, "title": "The Sagittarius dwarf", "when": "still happening", "tag": "observed", "story": "A small galaxy is crossing our Galaxy right now. It was found in 1994, and its stars are being stripped into a stream that wraps around the entire sky. Galaxies do not only form, they keep feeding.", "more": "", "facts": [["Discovered", "1994"], ["Status", "being disrupted today"]], "refs": [{"t": "Ibata, R. A., Gilmore, G., & Irwin, M. J. (1994). A dwarf satellite galaxy in Sagittarius. Nature.", "l": "https://doi.org/10.1038/370194a0", "id": "doi:10.1038/370194a0"}], "anim": "galaxy", "tz": {"ago": 0.0}, "imp": ""}, {"ch": 5, "title": "A massive star explodes", "when": "millions of years after birth", "tag": "theory", "story": "Not every star ends quietly. A star born with more than roughly ten times the Sun’s mass burns through its fuel within a few tens of millions of years. Its iron core can no longer hold up the weight above it, collapses in a fraction of a second, and the rest of the star is blown into space as a supernova.", "more": "Single stars below about 9 to 10 solar masses are not expected to end in core collapse, and the boundary is uncertain. Neutrino-powered explosion models of stars from 9 to 120 solar masses find that whether a star explodes depends sensitively on the structure of its core, and that neutron stars and black holes are interleaved over a wide range of birth masses.", "facts": [["Birth mass", "≳ 10 M☉ (approximate)"], ["Core collapse", "a fraction of a second"], ["Outcome", "neutron star or black hole"]], "refs": [{"t": "Heger, A. et al. (2003). How massive single stars end their life. The Astrophysical Journal.", "l": "https://arxiv.org/abs/astro-ph/0212469", "id": "arxiv:astro-ph/0212469"}, {"t": "Sukhbold, T. et al. (2016). Core-collapse supernovae from 9 to 120 solar masses based on neutrino-powered explosions. The Astrophysical Journal.", "l": "https://arxiv.org/abs/1510.04643", "id": "arxiv:1510.04643"}], "anim": "supernova", "tz": {}, "imp": "", "old": 1}, {"ch": 5, "title": "A neutron star", "when": "moments after the explosion", "tag": "measured", "story": "The collapsing core stops when neutrons and the strong force push back. What remains is a ball about twelve kilometres across, with more mass than the Sun. Some neutron stars spin many times a second and sweep beams of radio waves across the sky: pulsars.", "more": "Neutron-star masses are typically about 1.4 solar masses. The NICER X-ray telescope measured PSR J0030+0451 at 1.44 (+0.15 −0.14) solar masses and 13.02 (+1.24 −1.06) km, and PSR J0740+6620, a 2.8-ms pulsar of 2.08 ± 0.07 solar masses, at 12.39 (+1.30 −0.98) km. In February 2024 the James Webb Space Telescope found emission lines pointing to a neutron star inside the remnant of SN 1987A.", "facts": [["Radius", "≈ 12 km"], ["Typical mass", "≈ 1.4 M☉"], ["PSR J0740+6620", "2.08 ± 0.07 M☉"]], "refs": [{"t": "Özel, F., & Freire, P. (2016). Masses, radii, and the equation of state of neutron stars. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/1603.02698", "id": "arxiv:1603.02698"}, {"t": "Miller, M. C. et al. (2019). PSR J0030+0451 mass and radius from NICER data. The Astrophysical Journal Letters.", "l": "https://arxiv.org/abs/1912.05705", "id": "arxiv:1912.05705"}, {"t": "Fonseca, E. et al. (2021). Refined mass and geometric measurements of the high-mass PSR J0740+6620. The Astrophysical Journal Letters.", "l": "https://arxiv.org/abs/2104.00880", "id": "arxiv:2104.00880"}, {"t": "Riley, T. E. et al. (2021). A NICER view of the massive pulsar PSR J0740+6620. The Astrophysical Journal Letters.", "l": "https://arxiv.org/abs/2105.06980", "id": "arxiv:2105.06980"}, {"t": "Fransson, C. et al. (2024). Emission lines due to ionizing radiation from a compact object in the remnant of Supernova 1987A. Science.", "l": "https://arxiv.org/abs/2403.04386", "id": "arxiv:2403.04386"}], "anim": "pulsar", "tz": {}, "imp": "A city-sized ball heavier than the Sun, spinning like a lighthouse.", "old": 1}, {"ch": 5, "title": "A black hole", "when": "for the heaviest cores", "tag": "measured", "story": "If the core is massive enough, nothing stops the collapse. What is left is a black hole: a region from which not even light escapes. Its size is its Schwarzschild radius, 2.95 kilometres for every solar mass. The first black hole ever found, Cygnus X-1, weighs about 21 Suns.", "more": "Cygnus X-1 contains a black hole of 21.2 ± 2.2 solar masses at a distance of 2.22 (+0.18 −0.17) kpc. In GW150914, black holes of about 36 and 29 solar masses merged into one of 62 solar masses, radiating about 3 solar masses of energy as gravitational waves. The horizon radius values are derived from 2GM/c².", "facts": [["Horizon radius", "2.95 km per M☉"], ["Cygnus X-1", "21.2 ± 2.2 M☉"], ["GW150914", "36 + 29 → 62 M☉"]], "refs": [{"t": "Miller-Jones, J. C. A. et al. (2021). Cygnus X-1 contains a 21-solar mass black hole. Science.", "l": "https://arxiv.org/abs/2102.09091", "id": "arxiv:2102.09091"}, {"t": "Abbott, B. P. et al. (2016). Observation of gravitational waves from a binary black hole merger. Physical Review Letters.", "l": "https://arxiv.org/abs/1602.03837", "id": "arxiv:1602.03837"}], "anim": "bhole", "tz": {}, "imp": "", "old": 1}, {"ch": 5, "title": "A last gift from a dying star", "when": "just before the Sun forms", "tag": "debated", "story": "In the oldest grains of the Solar System, we find the fading ash of aluminium that was freshly made and radioactive. Something close by, a massive star or a supernova, had recently polluted the cloud. The heat of this aluminium may have dried the young rocky planets.", "more": "The short half-life means the aluminium was made no more than a few million years before the first solids formed. Whether it came from a supernova, a Wolf–Rayet wind or an asymptotic giant branch star is still debated.", "facts": [["²⁶Al / ²⁷Al in the first solids", "≈ 5×10⁻⁵"], ["²⁶Al half-life", "0.72 Myr"], ["Source", "debated"]], "refs": [{"t": "Jacobsen, B. et al. (2008). 26Al–26Mg and 207Pb–206Pb systematics of Allende CAIs: Canonical solar initial 26Al/27Al ratio reinstated. Earth and Planetary Science Letters.", "l": "https://ui.adsabs.harvard.edu/abs/2008E&PSL.272..353J", "id": "ads:2008E&PSL.272..353J"}, {"t": "Adams, F. C. (2010). The birth environment of the Solar System. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/1001.5444", "id": "arxiv:1001.5444"}], "anim": "blast", "tz": {"ago": 4.568}, "imp": ""}, {"ch": 5, "title": "The oldest solids", "when": "4.567 billion years ago", "tag": "dated", "story": "The first solid things in the Solar System are tiny white inclusions in meteorites, rich in calcium and aluminium. Counting the lead made from uranium inside them gives the age of the Solar System, as precisely as we know the age of anything this old.", "more": "", "facts": [["Age of the oldest solids (CAIs)", "4567.30 ± 0.16 Ma"], ["Method", "U–Pb (Pb–Pb)"]], "refs": [{"t": "Connelly, J. N. et al. (2012). The absolute chronology and thermal processing of solids in the solar protoplanetary disk. Science.", "l": "https://doi.org/10.1126/science.1226919", "id": "doi:10.1126/science.1226919"}], "anim": "orbit", "tz": {"ago": 4.5673}, "imp": ""}, {"ch": 5, "title": "A cloud becomes a star", "when": "4.57 billion years ago", "tag": "", "story": "In an ordinary spiral galaxy, a cold cloud of gas and dust began to collapse under its own weight. As it fell inward it spun faster, flattened into a disc, and in the middle grew hot enough to ignite hydrogen fusion. That star was our Sun.", "more": "The age of the Solar System is dated from the oldest solids in meteorites, calcium–aluminium-rich inclusions, using the decay of uranium to lead. Conservation of angular momentum flattens the collapsing cloud into a protoplanetary disc, with most of the mass in the central protostar.", "facts": [["Cosmic age then", "≈ 9.2 Gyr"], ["Dated from", "meteoritic CAIs (Pb–Pb)"]], "refs": [{"t": "Connelly, J. N. et al. (2012). The absolute chronology and thermal processing of solids in the solar protoplanetary disk. Science.", "l": "https://doi.org/10.1126/science.1226919", "id": "doi:10.1126/science.1226919"}, {"t": "Adams, F. C. (2010). The birth environment of the Solar System. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/1001.5444", "id": "arxiv:1001.5444"}, {"t": "Williams, J. P., & Cieza, L. A. (2011). Protoplanetary disks and their evolution. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/1103.0556", "id": "arxiv:1103.0556"}], "anim": "collapse", "tz": {"ago": 4.567}, "imp": "A cold cloud trembles, and begins to fall inward. We are on our way.", "old": 1}, {"ch": 5, "title": "A birth cluster", "when": "4.57 billion years ago", "tag": "inferred", "story": "The Sun was probably not born alone. Most stars form in clusters, and the Sun likely had a few thousand siblings. They have long since scattered around the Galaxy, and we do not know where they are.", "more": "", "facts": [["Likely cluster size", "10³–10⁴ stars"], ["Siblings today", "unidentified"]], "refs": [{"t": "Adams, F. C. (2010). The birth environment of the Solar System. Annual Review of Astronomy and Astrophysics.", "l": "https://arxiv.org/abs/1001.5444", "id": "arxiv:1001.5444"}], "anim": "cluster", "tz": {"ago": 4.567}, "imp": ""}, {"ch": 5, "title": "Building worlds", "when": "the first few million years", "tag": "hypothesis", "story": "In the disc, dust grains stuck together into pebbles, pebbles into boulders, and boulders into planets. The giant planets grew quickly while gas was still around. One idea, the Grand Tack, says Jupiter first moved inward and then back out, which may be why Mars is so small.", "more": "Gas discs last roughly 1–10 million years. In the Grand Tack scenario Jupiter migrates inward as far as about 1.5 AU, truncating the disc near 1 AU, and then outward, which reproduces Mars’s small mass and the structure of the asteroid belt in simulations. It is a published hypothesis, not an established fact.", "facts": [["Gas disc lifetime", "~1–10 Myr"], ["Grand Tack", "hypothesis (Walsh et al. 2011)"]], "refs": [{"t": "Walsh, K. J. et al. (2011). A low mass for Mars from Jupiter’s early gas-driven migration. Nature.", "l": "https://arxiv.org/abs/1201.5177", "id": "arxiv:1201.5177"}, {"t": "Raymond, S. N., & Morbidelli, A. (2022). Planet formation: key mechanisms and global models. arXiv preprint.", "l": "https://arxiv.org/abs/2002.05756", "id": "arxiv:2002.05756"}], "anim": "disc", "tz": {"ago": 4.5665}, "imp": "", "old": 1}, {"ch": 5, "title": "A world melts into layers", "when": "tens of millions of years after the Solar System", "tag": "model-dependent", "story": "The young Earth was hot enough for iron to sink and rock to float. In the first tens of millions of years the heavy metal collected in a core, and the planet was sorted into layers. The core is the source of Earth’s magnetic field.", "more": "", "facts": [["Core radius", "3,480 km"], ["Inner core radius", "≈ 1,220 km"], ["Core formation", "tens of Myr (Hf–W, model-dependent)"]], "refs": [{"t": "Dziewonski, A. M., & Anderson, D. L. (1981). Preliminary reference Earth model. Physics of the Earth and Planetary Interiors.", "l": "https://doi.org/10.1016/0031-9201(81)90046-7", "id": "doi:10.1016/0031-9201(81)90046-7"}], "anim": "earth:lava", "tz": {"ago": 4.53}, "imp": ""}, {"ch": 6, "title": "A world hit by a world", "when": "about 4.5 billion years ago", "tag": "hypothesis", "story": "The young Earth was a ball of molten rock. Then, according to the leading theory, a planet about the size of Mars struck it a glancing blow. The debris thrown into orbit gathered into the Moon.", "more": "The giant-impact hypothesis says that a Mars-sized body, called Theia, hit the proto-Earth early in the Hadean eon. The exact date is still debated. The impact would have melted much of the Earth and left a magma ocean.", "facts": [["Date", "early Hadean (debated)"], ["Impactor", "Mars-sized (hypothesis)"]], "refs": [{"t": "Canup, R. M., & Asphaug, E. (2001). Origin of the Moon in a giant impact near the end of the Earth’s formation. Nature.", "l": "https://doi.org/10.1038/35089010", "id": "doi:10.1038/35089010"}, {"t": "Ćuk, M., & Stewart, S. T. (2012). Making the Moon from a fast-spinning Earth. Science.", "l": "https://doi.org/10.1126/science.1225542", "id": "doi:10.1126/science.1225542"}, {"t": "Barboni, M. et al. (2017). Early formation of the Moon 4.51 billion years ago. Science Advances.", "l": "https://doi.org/10.1126/sciadv.1602365", "id": "doi:10.1126/sciadv.1602365"}], "anim": "impact", "tz": {"ago": 4.5}, "imp": "", "old": 1}, {"ch": 6, "title": "The faint young Sun", "when": "4.5 billion years ago", "tag": "puzzle", "story": "The young Sun was only about 70 per cent as bright as today. With that little sunlight, the early Earth should have been a frozen ball, and yet the rocks show liquid water. A thick blanket of greenhouse gases is the favoured answer.", "more": "", "facts": [["Early solar luminosity", "≈ 70% of today"], ["Brightening", "~10% per Gyr"], ["Favoured fix", "greenhouse gases (CO₂, perhaps CH₄)"]], "refs": [{"t": "Sagan, C., & Mullen, G. (1972). Earth and Mars: evolution of atmospheres and surface temperatures. Science.", "l": "https://doi.org/10.1126/science.177.4043.52", "id": "doi:10.1126/science.177.4043.52"}, {"t": "Feulner, G. (2012). The faint young Sun problem. Reviews of Geophysics.", "l": "https://doi.org/10.1029/2011RG000375", "id": "doi:10.1029/2011RG000375"}], "anim": "sunwarm", "tz": {"ago": 4.5}, "imp": ""}, {"ch": 6, "title": "Oceans", "when": "4.4 billion years ago", "tag": "zircon", "story": "As the molten surface cooled, rain fell for the first time and the first oceans formed. The evidence is a handful of tiny zircon crystals from Western Australia, some 4.4 billion years old, which formed in the presence of liquid water.", "more": "The oldest dated zircon from the Jack Hills is about 4.404 billion years old. Studies of such crystals suggest that liquid water may have existed between 4.0 and 4.4 billion years ago, even though the surface was very hot, because water stays liquid under a thick atmosphere.", "facts": [["Oldest zircon", "4.404 Gyr"], ["Liquid water", "4.0–4.4 Gyr ago"]], "refs": [{"t": "Wilde, S. A. et al. (2001). Evidence from detrital zircons for the existence of continental crust and oceans on the Earth 4.4 Gyr ago. Nature.", "l": "https://doi.org/10.1038/35051550", "id": "doi:10.1038/35051550"}, {"t": "Valley, J. W. et al. (2014). Hadean age for a post-magma-ocean zircon confirmed by atom-probe tomography. Nature Geoscience.", "l": "https://doi.org/10.1038/ngeo2075", "id": "doi:10.1038/ngeo2075"}], "anim": "geobar", "tz": {"ago": 4.4}, "imp": "", "old": 1}, {"ch": 6, "title": "The last common ancestor", "when": "about 4.2 billion years ago", "tag": "molecular clock", "story": "Every living thing today shares one ancestor: a population of cells that was already complex, with a genome of thousands of genes. It was not the first life, only the root we can reach with the genes of the living. The molecular clock says that it lived within a few hundred million years of Earth’s birth.", "more": "", "facts": [["Estimated age", "≈ 4.2 Ga (4.09–4.33 Ga)"], ["Method", "molecular clock"], ["Status", "model-dependent"]], "refs": [{"t": "Moody, E. R. R. et al. (2024). The nature of the last universal common ancestor and its impact on the early Earth system. Nature Ecology & Evolution.", "l": "https://doi.org/10.1038/s41559-024-02461-1", "id": "doi:10.1038/s41559-024-02461-1"}], "anim": "tree", "tz": {"ago": 4.2}, "imp": ""}, {"ch": 6, "title": "The oldest rocks", "when": "4.0 billion years ago", "tag": "dated", "story": "The Earth has recycled almost all of its early crust, so very little of it is left to read. The oldest rock still intact is a gneiss from northern Canada, about four billion years old. The few older things are single mineral grains, washed into younger rocks.", "more": "", "facts": [["Acasta Gneiss", "≈ 4.03 Ga"], ["Oldest mineral (zircon)", "4.404 Ga"]], "refs": [{"t": "Bowring, S. A., & Williams, I. S. (1999). Priscoan (4.00–4.03 Ga) orthogneisses from northwestern Canada. Contributions to Mineralogy and Petrology.", "l": "https://ui.adsabs.harvard.edu/abs/1999CoMP..134....3B", "id": "ads:1999CoMP..134....3B"}], "anim": "earth:rock", "tz": {"ago": 4.03}, "imp": ""}, {"ch": 6, "title": "A wetter Mars", "when": "about 4 billion years ago", "tag": "", "story": "Our neighbour Mars was once warmer and wetter, with rivers and lakes. Then it lost most of its atmosphere to space, its water vanished, and it froze into the red desert we see now. It is a warning of how fragile a habitable world can be.", "more": "About four billion years ago Mars was far wetter and more hospitable. The loss of its atmosphere took place somewhere around 3.5 to 3.7 billion years ago. NASA’s MAVEN mission is studying how the atmosphere escaped, but the driver of the change is not settled.", "facts": [["Wet Mars", "~4 Gyr ago"], ["Atmosphere lost", "3.5–3.7 Gyr ago"]], "refs": [{"t": "Wordsworth, R. D. (2016). The climate of early Mars. Annual Review of Earth and Planetary Sciences.", "l": "https://arxiv.org/abs/1606.02813", "id": "arxiv:1606.02813"}, {"t": "Jakosky, B. M., & Phillips, R. J. (2001). Mars’ volatile and climate history. Nature.", "l": "https://doi.org/10.1038/35084184", "id": "doi:10.1038/35084184"}], "anim": "geobar", "tz": {"ago": 4}, "imp": "", "old": 1}, {"ch": 6, "title": "The late bombardment", "when": "4.1 to 3.8 billion years ago", "tag": "debated", "story": "Moon rocks suggested that a hail of asteroids pounded the inner Solar System long after the planets had formed. It might have been set off by the migration of the giant planets. Whether it was a true spike, or the tail end of the planets’ formation, is still argued.", "more": "", "facts": [["Proposed timing", "4.1–3.8 Ga"], ["Evidence", "Apollo impact melts"], ["Status", "debated"]], "refs": [{"t": "Gomes, R., Levison, H. F., Tsiganis, K., & Morbidelli, A. (2005). Origin of the cataclysmic Late Heavy Bombardment period of the terrestrial planets. Nature.", "l": "https://doi.org/10.1038/nature03676", "id": "doi:10.1038/nature03676"}], "anim": "impact", "tz": {"ago": 3.95}, "imp": ""}, {"ch": 6, "title": "Life", "when": "at least 3.48 billion years ago", "tag": "debated", "story": "Somewhere in the oceans, chemistry began to copy itself. The oldest widely accepted traces are layered mounds built by microbes, the stromatolites of Western Australia. Older claims reach as far back as 4.1 billion years, but remain debated.", "more": "Stromatolites in the Dresser Formation date to about 3.48 billion years. Some argue for signs of life back to 3.8 billion years, and possibly 4.1 billion years in zircons, but these are interpretations. The timing of the origin of life is unknown.", "facts": [["Oldest widely accepted", "≈ 3.48 Gyr"], ["Contested older claims", "3.7 – 4.3 Gyr"]], "refs": [{"t": "Dodd, M. S. et al. (2017). Evidence for early life in Earth’s oldest hydrothermal vent precipitates. Nature.", "l": "https://doi.org/10.1038/nature21377", "id": "doi:10.1038/nature21377"}, {"t": "Djokic, T. et al. (2017). Earliest signs of life on land preserved in ca. 3.5 Ga hot spring deposits. Nature Communications.", "l": "https://doi.org/10.1038/ncomms15263", "id": "doi:10.1038/ncomms15263"}, {"t": "Betts, H. C. et al. (2018). Integrated genomic and fossil evidence illuminates life’s early evolution and eukaryote origin. Nature Ecology & Evolution.", "l": "https://doi.org/10.1038/s41559-018-0644-x", "id": "doi:10.1038/s41559-018-0644-x"}], "anim": "life", "tz": {"ago": 3.48}, "imp": "In some warm, wet place, chemistry crossed a line and became biology.", "old": 1}, {"ch": 6, "title": "A magnetic shield", "when": "at least 3.45 billion years ago", "tag": "measured", "story": "Churning iron in the core made a magnetic field around the planet. It deflects the solar wind, and it helped to keep the atmosphere and the oceans from being stripped away, as happened on Mars. Rocks 3.45 billion years old have kept a record of it.", "more": "", "facts": [["Earliest secure record", "≈ 3.45 Ga"], ["Older claims", "up to 4.2 Ga (disputed)"]], "refs": [{"t": "Tarduno, J. A. et al. (2010). Geodynamo, solar wind, and magnetopause 3.4 to 3.45 billion years ago. Science.", "l": "https://ui.adsabs.harvard.edu/abs/2010Sci...327.1238T", "id": "ads:2010Sci...327.1238T"}], "anim": "field", "tz": {"ago": 3.45}, "imp": ""}, {"ch": 6, "title": "Sunlight becomes food", "when": "by about 3.4 billion years ago", "tag": "debated", "story": "Life learned to live on light. The first light-eaters did not make oxygen. Later microbes found a way to split water, and the waste gas, oxygen, would change the planet. When that second step happened is disputed.", "more": "", "facts": [["Phototrophs (no O₂)", "≥ 3.4 Ga"], ["Oxygenic photosynthesis", "possibly ≥ 3.0 Ga (disputed)"]], "refs": [{"t": "Tice, M. M., & Lowe, D. R. (2004). Photosynthetic microbial mats in the 3,416-Myr-old ocean. Nature.", "l": "https://ui.adsabs.harvard.edu/abs/2004Natur.431..549T", "id": "ads:2004Natur.431..549T"}, {"t": "Planavsky, N. J. et al. (2014). Evidence for oxygenic photosynthesis half a billion years before the Great Oxidation Event. Nature Geoscience.", "l": "https://ui.adsabs.harvard.edu/abs/2014NatGe...7..283P", "id": "ads:2014NatGe...7..283P"}], "anim": "oxygen", "tz": {"ago": 3.4}, "imp": ""}, {"ch": 6, "title": "The ground starts to move", "when": "between 4 and 2 billion years ago", "tag": "debated", "story": "The rigid shell of the Earth broke into plates which slid, collided and sank into the mantle. When it started is one of the great open questions: some say more than 3 billion years ago, some say much later. The recycling of rock it drives has shaped the continents, the air and the oceans ever since.", "more": "", "facts": [["Proposed onset", "~4 to ~0.8 Ga (debated)"], ["Plate speed today", "a few cm per year"]], "refs": [{"t": "Dhuime, B., Hawkesworth, C. J., Cawood, P. A., & Storey, C. D. (2012). A change in the geodynamics of continental growth 3 billion years ago. Science.", "l": "https://ui.adsabs.harvard.edu/abs/2012Sci...335.1334D", "id": "ads:2012Sci...335.1334D"}], "anim": "plates", "tz": {"ago": 3.0}, "imp": ""}, {"ch": 6, "title": "The air turns to oxygen", "when": "2.3 – 2.4 billion years ago", "tag": "", "story": "Microbes that use sunlight to split water began releasing oxygen as waste. Over millions of years it built up in the air, an event that poisoned much of the life then alive and made possible, in the long run, creatures that breathe.", "more": "The Great Oxidation Event, the first sustained rise of atmospheric O₂, is dated to about 2.3–2.4 billion years ago. Near-modern oxygen levels were probably not reached until the late Neoproterozoic or later.", "facts": [["Great Oxidation", "2.3 – 2.4 Gyr ago"], ["Modern O₂ levels", "< ~0.54 Gyr ago (probably)"]], "refs": [{"t": "Lyons, T. W., Reinhard, C. T., & Planavsky, N. J. (2014). The rise of oxygen in Earth’s early ocean and atmosphere. Nature.", "l": "https://doi.org/10.1038/nature13068", "id": "doi:10.1038/nature13068"}, {"t": "Gumsley, A. P. et al. (2017). Timing and tempo of the Great Oxidation Event. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.1608824114", "id": "doi:10.1073/pnas.1608824114"}], "anim": "oxygen", "tz": {"ago": 2.4}, "imp": "A humble microbe changes the sky, and with it the fate of the planet.", "old": 1}, {"ch": 6, "title": "Ice at the equator, once more", "when": "2.45 to 2.22 billion years ago", "tag": "", "story": "Soon after oxygen appeared, the planet froze. Oxygen destroyed the methane that had warmed the air, and glaciers spread across the world. The same microbes that made the oxygen may have caused the ice.", "more": "", "facts": [["Huronian glaciation", "≈ 2.45–2.22 Ga"], ["Possible trigger", "methane destroyed by O₂"]], "refs": [{"t": "Warke, M. R. et al. (2020). The Great Oxidation Event preceded a Paleoproterozoic “snowball Earth”. Proceedings of the National Academy of Sciences.", "l": "https://ui.adsabs.harvard.edu/abs/2020PNAS..11713314W", "id": "ads:2020PNAS..11713314W"}], "anim": "ice", "tz": {"ago": 2.3}, "imp": ""}, {"ch": 6, "title": "Cells with a nucleus", "when": "about 1.8 – 1.2 billion years ago", "tag": "debated", "story": "For two billion years life was made of simple cells with no nucleus. Then one cell swallowed another and, instead of digesting it, kept it. The guest became the mitochondrion, the power plant inside every cell of your body, and a new kind of cell with a nucleus was born: the eukaryote, ancestor of all animals, plants and fungi.", "more": "Eukaryotes combine an archaeal host with a bacterial endosymbiont. A molecular-clock study that combines genomes with fossils puts the crown group of eukaryotes at less than 1.84 billion years ago (a 1.84 to 1.21 billion-year interval) and the mitochondrial symbiosis between 2.05 and 1.21 billion years ago. Lane and Martin argue that mitochondria made large genomes energetically affordable, which is what opened the way to complex life.", "facts": [["Crown eukaryotes", "< 1.84 Ga (1.84 – 1.21)"], ["Mitochondrial symbiosis", "2.05 – 1.21 Ga"], ["Status", "dates model-dependent"]], "refs": [{"t": "Betts, H. C. et al. (2018). Integrated genomic and fossil evidence illuminates life’s early evolution and eukaryote origin. Nature Ecology & Evolution.", "l": "https://doi.org/10.1038/s41559-018-0644-x", "id": "doi:10.1038/s41559-018-0644-x"}, {"t": "Lane, N., & Martin, W. (2010). The energetics of genome complexity. Nature.", "l": "https://doi.org/10.1038/nature09486", "id": "doi:10.1038/nature09486"}], "anim": "endo", "tz": {"ago": 1.6}, "imp": "One cell takes in another, and neither is ever alone again.", "old": 1}, {"ch": 6, "title": "The boring billion", "when": "1.8 to 0.8 billion years ago", "tag": "", "story": "For a billion years almost nothing seems to change: the climate stays warm, the continents hardly move, oxygen stays low, and life stays small. It was probably not as dull as it looks, since the first complex cells grew and spread in these years.", "more": "", "facts": [["Span", "≈ 1.8–0.8 Ga"], ["Oxygen", "low, perhaps 0.1–10% of today (uncertain)"]], "refs": [{"t": "Cawood, P. A., & Hawkesworth, C. J. (2014). Earth’s middle age. Geology.", "l": "https://ui.adsabs.harvard.edu/abs/2014Geo....42..503C", "id": "ads:2014Geo....42..503C"}], "anim": "strata", "tz": {"ago": 1.4}, "imp": ""}, {"ch": 6, "title": "Sex and bodies", "when": "about 1.05 billion years ago", "tag": "dated", "story": "A red alga about a billion years old is the oldest organism that is widely accepted as having differentiated cells and a form of sexual reproduction. Sex shuffles genes in every generation, and it sped up the pace of evolution.", "more": "", "facts": [["Bangiomorpha", "1.047 Ga"], ["Type", "red alga (a eukaryote)"]], "refs": [{"t": "Gibson, T. M. et
