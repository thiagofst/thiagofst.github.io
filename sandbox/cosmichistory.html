 al. (2018). Precise age of Bangiomorpha pubescens dates the origin of eukaryotic photosynthesis. Geology.", "l": "https://ui.adsabs.harvard.edu/abs/2018Geo....46..135G", "id": "ads:2018Geo....46..135G"}], "anim": "tree", "tz": {"ago": 1.047}, "imp": ""}, {"ch": 6, "title": "Rodinia", "when": "1.2 billion to 750 million years ago", "tag": "", "story": "Long before Pangaea, the continents had gathered into another supercontinent. It formed about 1.2 billion years ago and broke up some 750 million years ago, and its breakup may have preceded the Snowball Earth ice ages.", "more": "", "facts": [["Assembly", "≈ 1.3–0.9 Ga"], ["Breakup", "≈ 750–633 Ma"]], "refs": [{"t": "Li, Z. X. et al. (2008). Assembly, configuration, and break-up history of Rodinia: a synthesis. Precambrian Research.", "l": "https://doi.org/10.1016/j.precamres.2007.04.021", "id": "doi:10.1016/j.precamres.2007.04.021"}], "anim": "drift", "tz": {"ago": 1.0}, "imp": ""}, {"ch": 6, "title": "Snowball Earth", "when": "717 to 635 million years ago", "tag": "", "story": "Twice, the whole planet froze, with ice reaching the equator. The first deep freeze lasted around 57 million years. Life survived in cracks, around volcanoes and under the ice, and when the ice finally melted, complex life was ready to explode.", "more": "The Sturtian glaciation lasted about 717–660 million years ago and the Marinoan about 650–635 million years ago. Glacial deposits and dropstones are found at low palaeolatitudes. Whether the ocean was fully frozen (“snowball”) or partly open (“slushball”) is debated.", "facts": [["Sturtian", "717 – 660 Ma"], ["Marinoan", "650 – 635 Ma"]], "refs": [{"t": "Hoffman, P. F. et al. (1998). A Neoproterozoic snowball Earth. Science.", "l": "https://doi.org/10.1126/science.281.5381.1342", "id": "doi:10.1126/science.281.5381.1342"}, {"t": "Rooney, A. D. et al. (2014). Re-Os geochronology and coupled Os-Sr isotope constraints on the Sturtian snowball Earth. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.1317266110", "id": "doi:10.1073/pnas.1317266110"}, {"t": "Hoffman, P. F. et al. (2017). Snowball Earth climate dynamics and Cryogenian geology-geobiology. Science Advances.", "l": "https://doi.org/10.1126/sciadv.1600983", "id": "doi:10.1126/sciadv.1600983"}], "anim": "geobar", "tz": {"ago": 0.717}, "imp": "", "old": 1}, {"ch": 7, "title": "The first animals", "when": "about 575 million years ago", "tag": "", "story": "After the great thaw the seas held a strange garden: quilted fronds, discs and ribbons up to a metre long, rooted to the sea floor. They had no eyes, no shells and no mouths we can easily recognise. These soft-bodied Ediacaran creatures include some of the first animals.", "more": "The Ediacaran Period runs from about 635 to 538.8 million years ago, and the oldest large assemblages, such as those in Newfoundland, are about 574 million years old. Which Ediacaran forms were animals, and how they relate to later groups, is still debated. Unambiguous modern body plans become common only in the Cambrian.", "facts": [["Ediacaran Period", "635 – 538.8 Ma"], ["Oldest large assemblages", "~574 Ma"]], "refs": [{"t": "Narbonne, G. M. (2005). The Ediacara biota: Neoproterozoic origin of animals and their ecosystems. Annual Review of Earth and Planetary Sciences.", "l": "https://doi.org/10.1146/annurev.earth.33.092203.122519", "id": "doi:10.1146/annurev.earth.33.092203.122519"}, {"t": "Erwin, D. H. et al. (2011). The Cambrian conundrum: early divergence and later ecological success in the early history of animals. Science.", "l": "https://doi.org/10.1126/science.1206375", "id": "doi:10.1126/science.1206375"}], "anim": "ediac", "tz": {"ago": 0.575}, "imp": "", "old": 1}, {"ch": 7, "title": "The Cambrian explosion", "when": "538.8 million years ago", "tag": "", "story": "Within a few tens of millions of years the seas filled with animals: trilobites, worms, sponges and the first relatives of the fish. Eyes appeared, and with them the first predators and the first arms race.", "more": "The Cambrian began 538.8 ± 0.6 million years ago. It brought the first representatives of most modern animal groups, including arthropods, molluscs, annelids and our own distant stem-chordate relatives such as Pikaia. Whether the burst was truly rapid, or a long fuse made visible by new skeletons and better fossilisation, is part of what is called the Cambrian conundrum.", "facts": [["Cambrian starts", "538.8 ± 0.6 Ma"], ["Our relatives", "Pikaia (stem chordate)"]], "refs": [{"t": "Linnemann, U. et al. (2019). New high-resolution age data from the Ediacaran–Cambrian boundary indicate rapid, ecologically driven onset of the Cambrian explosion. Terra Nova.", "l": "https://doi.org/10.1111/ter.12368", "id": "doi:10.1111/ter.12368"}, {"t": "Erwin, D. H. et al. (2011). The Cambrian conundrum. Science.", "l": "https://doi.org/10.1126/science.1206375", "id": "doi:10.1126/science.1206375"}], "anim": "geobar", "tz": {"ago": 0.5388}, "imp": "", "old": 1}, {"ch": 7, "title": "The first eyes", "when": "about 520 to 515 million years ago", "tag": "fossils", "story": "Eyes appeared suddenly in the fossil record. By 515 million years ago some arthropods had compound eyes with thousands of lenses. The ability to see made hunting and hiding into a race, and it changed the shape of animals.", "more": "", "facts": [["Emu Bay Shale", "compound eyes with thousands of lenses"], ["Theory", "an eye can evolve in < 364,000 yr"]], "refs": [{"t": "Lee, M. S. Y. et al. (2011). Modern optics in exceptionally preserved eyes of Early Cambrian arthropods from Australia. Nature.", "l": "https://doi.org/10.1038/nature10097", "id": "doi:10.1038/nature10097"}, {"t": "Nilsson, D.-E., & Pelger, S. (1994). A pessimistic estimate of the time required for an eye to evolve. Proceedings of the Royal Society B.", "l": "https://doi.org/10.1098/rspb.1994.0048", "id": "doi:10.1098/rspb.1994.0048"}], "anim": "eye", "tz": {"ago": 0.515}, "imp": ""}, {"ch": 7, "title": "Life, preserved in mud", "when": "about 518 to 505 million years ago", "tag": "fossils", "story": "In a few places, sudden mud slides buried animals so quickly that their soft bodies were kept: eyes, guts and gills. The Burgess Shale in the Canadian Rockies, found in 1909, and Chengjiang in China, a little older, show a whole ocean of strange creatures, some of them unlike anything alive today.", "more": "", "facts": [["Burgess Shale", "≈ 505 Ma, found 1909"], ["Chengjiang", "≈ 518 Ma (approximate)"], ["Walcott’s collection", "> 65,000 specimens by 1924"]], "refs": [{"t": "Gaines, R. R. et al. (2012). Mechanism for Burgess Shale-type preservation. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.1111784109", "id": "doi:10.1073/pnas.1111784109"}], "anim": "strata", "tz": {"ago": 0.51}, "imp": ""}, {"ch": 7, "title": "The great diversification", "when": "497 to 467 million years ago", "tag": "dated", "story": "The Cambrian explosion invented the body plans. In the Ordovician that followed, life filled them with species. Over about thirty million years the number of marine families roughly tripled, and the seas became as diverse as today’s.", "more": "", "facts": [["Duration", "≈ 497–467 Ma"], ["Marine families", "~×3 (Droser & Finnegan 2003)"]], "refs": [{"t": "Fan, J.-X. et al. (2020). A high-resolution summary of Cambrian to Early Triassic marine invertebrate biodiversity. Science.", "l": "https://doi.org/10.1126/science.aax4953", "id": "doi:10.1126/science.aax4953"}], "anim": "strata", "tz": {"ago": 0.48}, "imp": ""}, {"ch": 7, "title": "Life turns the land green", "when": "about 470 million years ago", "tag": "", "story": "For most of Earth’s history the continents were bare rock, with at most a film of microbes. About 470 million years ago the first plants crept ashore: tiny, low and moss-like, surviving at the edge of the water. They began the slow work of turning rock into soil.", "more": "The oldest land-plant spores are about 470 million years old (Middle Ordovician). Molecular clocks that use fossils to calibrate the plant tree place the origin of the land-plant lineage somewhat earlier, in the Cambrian to Ordovician, with large uncertainty.", "facts": [["First spores", "~470 Ma"], ["Molecular-clock origin", "~515 – 470 Ma"]], "refs": [{"t": "Wellman, C. H., Osterloff, P. L., & Mohiuddin, U. (2003). Fragments of the earliest land plants. Nature.", "l": "https://doi.org/10.1038/nature01884", "id": "doi:10.1038/nature01884"}, {"t": "Morris, J. L. et al. (2018). The timescale of early land plant evolution. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.1719588115", "id": "doi:10.1073/pnas.1719588115"}], "anim": "geobar", "tz": {"ago": 0.47}, "imp": "", "old": 1}, {"ch": 7, "title": "Ice, then a first mass extinction", "when": "about 445 million years ago", "tag": "", "story": "Ice sheets grew across the southern supercontinent, locking up water and dropping the sea level. The seas cooled, then rose again as the ice melted. In two pulses, about 85 per cent of marine species disappeared. It was the first of the five great mass extinctions.", "more": "The Late Ordovician (Hirnantian) mass extinction, around 445 million years ago, coincides with a short but intense glaciation centred on Gondwana. It is the second-largest of the “Big Five” by the fraction of marine genera lost, and it took place at sea, since there were no land animals yet.", "facts": [["Date", "~445 Ma"], ["Marine species lost", "~85%"], ["Cause", "glaciation, sea-level change"]], "refs": [{"t": "Sheehan, P. M. (2001). The Late Ordovician mass extinction. Annual Review of Earth and Planetary Sciences.", "l": "https://doi.org/10.1146/annurev.earth.29.1.331", "id": "doi:10.1146/annurev.earth.29.1.331"}, {"t": "Finnegan, S. et al. (2011). The magnitude and duration of Late Ordovician–Early Silurian glaciation. Science.", "l": "https://doi.org/10.1126/science.1200803", "id": "doi:10.1126/science.1200803"}, {"t": "Bambach, R. K. (2006). Phanerozoic biodiversity mass extinctions. Annual Review of Earth and Planetary Sciences.", "l": "https://doi.org/10.1146/annurev.earth.33.092203.122654", "id": "doi:10.1146/annurev.earth.33.092203.122654"}], "anim": "extinct", "tz": {"ago": 0.445}, "imp": "", "old": 1}, {"ch": 7, "title": "Animals leave the water", "when": "about 428 million years ago", "tag": "fossils", "story": "A millipede-like animal that breathed air through pores is among the oldest known land animals. It crawled between mats of mosses and tiny plants, in a world that had no trees yet.", "more": "", "facts": [["Pneumodesmus", "≈ 428 Ma"], ["Group", "millipede (arthropod)"]], "refs": [{"t": "Wilson, H. M., & Anderson, L. I. (2004). Morphology and taxonomy of Paleozoic millipedes (Diplopoda: Chilognatha: Archipolypoda) from Scotland. Journal of Paleontology.", "l": "https://ui.adsabs.harvard.edu/abs/2004JPal...78..169W", "id": "ads:2004JPal...78..169W"}], "anim": "strata", "tz": {"ago": 0.428}, "imp": ""}, {"ch": 7, "title": "Jaws", "when": "about 420 million years ago", "tag": "fossils", "story": "Until then vertebrates had no jaws. Then part of the gill supports turned into biting mouths, and fish became hunters. An armoured fish about 419 million years old had the bones of a jaw that we still carry in our face.", "more": "", "facts": [["Entelognathus", "≈ 419 Ma (Silurian)"], ["Origin of jaws", "from gill arches"]], "refs": [{"t": "Zhu, M. et al. (2013). A Silurian placoderm with osteichthyan-like marginal jaw bones. Nature.", "l": "https://doi.org/10.1038/nature12617", "id": "doi:10.1038/nature12617"}], "anim": "tree", "tz": {"ago": 0.419}, "imp": ""}, {"ch": 7, "title": "Fish learn to walk", "when": "about 375 million years ago", "tag": "", "story": "In a shallow Devonian stream lived Tiktaalik, a fish with a flat head, a neck, and fins with wrist-like bones. It could prop itself up in the shallows. From animals like it came every four-legged vertebrate, including you. On the banks the first forests were already growing.", "more": "Tiktaalik roseae, found on Ellesmere Island in Arctic Canada, lived about 375 million years ago and mixes fish and tetrapod features: a mobile neck, a flattened skull and a pectoral fin with the beginnings of a wrist. The oldest known forest, at Gilboa in New York, is of tree-sized cladoxylopsids around 385 million years old.", "facts": [["Tiktaalik", "~375 Ma"], ["Oldest known forest", "~385 Ma (Gilboa)"]], "refs": [{"t": "Daeschler, E. B., Shubin, N. H., & Jenkins, F. A. (2006). A Devonian tetrapod-like fish and the evolution of the tetrapod body plan. Nature.", "l": "https://doi.org/10.1038/nature04639", "id": "doi:10.1038/nature04639"}, {"t": "Shubin, N. H., Daeschler, E. B., & Jenkins, F. A. (2006). The pectoral fin of Tiktaalik roseae and the origin of the tetrapod limb. Nature.", "l": "https://doi.org/10.1038/nature04637", "id": "doi:10.1038/nature04637"}, {"t": "Stein, W. E. et al. (2007). Giant cladoxylopsid trees resolve the enigma of the Earth’s earliest forest stumps at Gilboa. Nature.", "l": "https://doi.org/10.1038/nature05705", "id": "doi:10.1038/nature05705"}], "anim": "tetra", "tz": {"ago": 0.375}, "imp": "A fish props itself up on its fins. Every step you will ever take began here.", "old": 1}, {"ch": 7, "title": "The first forests collapse", "when": "about 372 and 359 million years ago", "tag": "dated", "story": "The first forests pumped carbon out of the air and sent nutrients into the sea. The oceans turned stagnant and lost their oxygen, and in two pulses much of marine life died, in the Late Devonian crisis. Trees had changed the world, and the world pushed back.", "more": "", "facts": [["Kellwasser event", "≈ 372 Ma"], ["Hangenberg event", "≈ 359 Ma"], ["Leading cause", "ocean anoxia (debated)"]], "refs": [{"t": "Carmichael, S. K., Waters, J. A., Königshof, P., Suttner, T. J., & Kido, E. (2019). Paleogeography and paleoenvironments of the Late Devonian Kellwasser event: a review of its sedimentological and geochemical expression. Global and Planetary Change.", "l": "https://ui.adsabs.harvard.edu/abs/2019GPC...18302984C", "id": "ads:2019GPC...18302984C"}], "anim": "extinct", "tz": {"ago": 0.372}, "imp": ""}, {"ch": 7, "title": "The egg that conquered the land", "when": "about 315 million years ago", "tag": "fossils", "story": "Amphibians must return to the water to lay their eggs. The amniotes found a way around it: an egg with its own pond inside, protected by membranes. With it, vertebrates could live anywhere on land. This is the ancestry of reptiles, birds and mammals, including us.", "more": "", "facts": [["Oldest amniote fossils", "≥ 312 Ma"], ["Key innovation", "the amniotic egg"]], "refs": [{"t": "Benton, M. J., & Donoghue, P. C. J. (2007). Paleontological evidence to date the tree of life. Molecular Biology and Evolution.", "l": "https://doi.org/10.1093/molbev/msl150", "id": "doi:10.1093/molbev/msl150"}], "anim": "tree", "tz": {"ago": 0.315}, "imp": ""}, {"ch": 7, "title": "The coal forests", "when": "about 310 million years ago", "tag": "", "story": "Giant club-moss trees more than thirty metres tall grew in warm, wet swamps. When they died they sank into the water and were buried before they could fully rot. Their remains became the coal we burn today. Dragonfly-like insects had wings nearly 70 centimetres across, and models suggest the air held more oxygen than ours.", "more": "Carboniferous coal swamps were dominated by lycopsid trees such as Lepidodendron. Models of the atmosphere give an oxygen peak of roughly 30 per cent or more around the Carboniferous–Permian, but the numbers are model-dependent and debated. An old idea that trees appeared before microbes able to digest wood explains the coal has been challenged by later work on fungal evolution.", "facts": [["Carboniferous", "359 – 299 Ma"], ["Oxygen (model)", "up to ~30%, uncertain"]], "refs": [{"t": "Berner, R. A. (2006). GEOCARBSULF: a combined model for Phanerozoic atmospheric O₂ and CO₂. Geochimica et Cosmochimica Acta.", "l": "https://doi.org/10.1016/j.gca.2005.11.032", "id": "doi:10.1016/j.gca.2005.11.032"}, {"t": "Nelsen, M. P. et al. (2016). Delayed fungal evolution did not cause the Paleozoic peak in coal production. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.1517943113", "id": "doi:10.1073/pnas.1517943113"}], "anim": "coal", "tz": {"ago": 0.31}, "imp": "", "old": 1}, {"ch": 7, "title": "Before the dinosaurs", "when": "about 295 to 272 million years ago", "tag": "fossils", "story": "The sail-backed Dimetrodon ruled the Permian lands. It looks like a dinosaur, but it is not one. It belongs to the group that includes the ancestors of mammals, so it is a cousin of ours, older than any dinosaur.", "more": "", "facts": [["Dimetrodon", "≈ 295–272 Ma (Early Permian)"], ["Lineage", "synapsid (mammal line)"]], "refs": [{"t": "Kemp, T. S. (2005). The Origin and Evolution of Mammals. Oxford University Press.", "l": null, "id": "book"}], "anim": "tree", "tz": {"ago": 0.28}, "imp": ""}, {"ch": 7, "title": "The Great Dying", "when": "about 251.9 million years ago", "tag": "", "story": "Siberian volcanoes poured out lava and gas for hundreds of thousands of years. The air warmed, the oceans became acidic and starved of oxygen. It was the worst crisis in the history of life: about four out of five marine species vanished (older estimates say up to 96 per cent), together with roughly 70 per cent of land vertebrate species.", "more": "High-precision uranium–lead dating puts the end-Permian extinction at 251.902 ± 0.024 million years ago, with an extinction interval of only 60 ± 48 thousand years. The Siberian Traps large igneous province is the leading suspect. Estimates of the fraction of marine species lost range from about 81 per cent to 96 per cent, the largest of the Big Five. Proxy records show a strong warming, of order 8 °C, and carbon dioxide rising from roughly 400 to 2,500 ppm.", "facts": [["Date", "251.902 ± 0.024 Ma"], ["Extinction interval", "60 ± 48 kyr"], ["Marine species lost", "~80 – 90%"]], "refs": [{"t": "Burgess, S. D., Bowring, S. A., & Shen, S. (2014). High-precision timeline for Earth’s most severe extinction. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.1317692111", "id": "doi:10.1073/pnas.1317692111"}, {"t": "Shen, S. et al. (2011). Calibrating the end-Permian mass extinction. Science.", "l": "https://doi.org/10.1126/science.1213454", "id": "doi:10.1126/science.1213454"}, {"t": "Stanley, S. M. (2016). Estimates of the magnitudes of major marine mass extinctions in Earth history. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.1613094113", "id": "doi:10.1073/pnas.1613094113"}, {"t": "Raup, D. M. (1979). Size of the Permo-Triassic bottleneck and its evolutionary implications. Science.", "l": "https://doi.org/10.1126/science.206.4415.217", "id": "doi:10.1126/science.206.4415.217"}, {"t": "Bambach, R. K. (2006). Phanerozoic biodiversity mass extinctions. Annual Review of Earth and Planetary Sciences.", "l": "https://doi.org/10.1146/annurev.earth.33.092203.122654", "id": "doi:10.1146/annurev.earth.33.092203.122654"}], "anim": "extinct", "tz": {"ago": 0.2519}, "imp": "The closest that life has ever come to ending on Earth.", "old": 1}, {"ch": 7, "title": "Dinosaurs and the first mammals", "when": "about 230 million years ago", "tag": "", "story": "In the recovery, a new group of reptiles, small, fast and walking on two legs, appeared in the southern lands of the supercontinent Pangaea. They were the first dinosaurs. At about the same time came shrew-sized, furry animals, the first mammals, who lived in their shadow for well over a hundred million years.", "more": "Eodromaeus and Eoraptor, from the Ischigualasto Formation in Argentina, are among the oldest known dinosaurs, about 230 million years old. Early dinosaurs were a minor part of faunas until the end-Triassic extinction, around 201 million years ago, opened the field. Mammaliaforms, close relatives of true mammals, appear in the Late Triassic and Jurassic.", "facts": [["Oldest dinosaurs", "~230 Ma (Argentina)"], ["End-Triassic extinction", "~201 Ma"]], "refs": [{"t": "Martínez, R. N. et al. (2011). A basal dinosaur from the dawn of the dinosaur era in southwestern Pangaea. Science.", "l": "https://doi.org/10.1126/science.1198467", "id": "doi:10.1126/science.1198467"}, {"t": "Langer, M. C. et al. (2010). The origin and early evolution of dinosaurs. Biological Reviews.", "l": "https://doi.org/10.1111/j.1469-185X.2009.00094.x", "id": "doi:10.1111/j.1469-185X.2009.00094.x"}, {"t": "Luo, Z. (2007). Transformation and diversification in early mammal evolution. Nature.", "l": "https://doi.org/10.1038/nature06277", "id": "doi:10.1038/nature06277"}, {"t": "Li, Z. X. et al. (2008). Assembly, configuration, and break-up history of Rodinia: a synthesis. Precambrian Research.", "l": "https://doi.org/10.1016/j.precamres.2007.04.021", "id": "doi:10.1016/j.precamres.2007.04.021"}, {"t": "Nance, R. D., Murphy, J. B., & Santosh, M. (2014). The supercontinent cycle: a retrospective essay. Gondwana Research.", "l": "https://doi.org/10.1016/j.gr.2012.12.026", "id": "doi:10.1016/j.gr.2012.12.026"}], "anim": "drift", "tz": {"ago": 0.231}, "imp": "", "old": 1}, {"ch": 7, "title": "Wings", "when": "from about 228 million years ago", "tag": "fossils", "story": "The pterosaurs were the first vertebrates to master powered flight, with wings of skin stretched on one enormously long finger. They were not dinosaurs, and they ranged from sparrow-sized to giants with wingspans of about ten metres.", "more": "", "facts": [["First appearance", "≈ 228 Ma (Late Triassic)"], ["Largest wingspan", "≈ 10 m"]], "refs": [{"t": "Witton, M. P. (2013). Pterosaurs: Natural History, Evolution, Anatomy. Princeton University Press.", "l": null, "id": "book"}], "anim": "wings", "tz": {"ago": 0.228}, "imp": ""}, {"ch": 7, "title": "The end of the Triassic", "when": "about 201.5 million years ago", "tag": "dated", "story": "Another volcanic episode, another mass death. The opening of the Atlantic Ocean poured out lava and gas across a supercontinent. Many large reptile rivals of the dinosaurs died out, and the dinosaurs inherited the world.", "more": "", "facts": [["Date", "≈ 201.5 Ma"], ["Cause", "Central Atlantic Magmatic Province"], ["Marine genera lost", "≈ 23–34%"]], "refs": [{"t": "Blackburn, T. J. et al. (2013). Zircon U–Pb geochronology links the end-Triassic extinction with the Central Atlantic Magmatic Province. Science.", "l": "https://doi.org/10.1126/science.1234204", "id": "doi:10.1126/science.1234204"}], "anim": "extinct", "tz": {"ago": 0.2015}, "imp": ""}, {"ch": 7, "title": "Giants and the first birds", "when": "about 150 million years ago", "tag": "", "story": "Pangaea was splitting and a new Atlantic was opening. Warm shallow seas flooded the land. Long-necked sauropods, the largest animals ever to walk on land, browsed the treetops. In a lagoon in what is now Bavaria, a feathered, toothed, long-tailed creature fell into the mud: Archaeopteryx, a dinosaur that could fly.", "more": "The Jurassic runs from about 201 to 145 million years ago. Archaeopteryx, from the Solnhofen Limestone of Germany, is about 150 million years old. Birds are living dinosaurs, descended from small feathered theropods. Sauropod gigantism relied on a bird-like air-sac lung system, fast growth and light, air-filled bones.", "facts": [["Jurassic", "201 – 145 Ma"], ["Archaeopteryx", "~150 Ma (Solnhofen)"]], "refs": [{"t": "Sander, P. M. et al. (2011). Biology of the sauropod dinosaurs: the evolution of gigantism. Biological Reviews.", "l": "https://doi.org/10.1111/j.1469-185X.2010.00137.x", "id": "doi:10.1111/j.1469-185X.2010.00137.x"}, {"t": "Brusatte, S. L. et al. (2015). The origin and diversification of birds. Current Biology.", "l": "https://doi.org/10.1016/j.cub.2015.08.003", "id": "doi:10.1016/j.cub.2015.08.003"}, {"t": "Scotese, C. R. (2021). An atlas of Phanerozoic paleogeographic maps. Annual Review of Earth and Planetary Sciences.", "l": "https://doi.org/10.1146/annurev-earth-081320-064052", "id": "doi:10.1146/annurev-earth-081320-064052"}, {"t": "Nance, R. D., Murphy, J. B., & Santosh, M. (2014). The supercontinent cycle: a retrospective essay. Gondwana Research.", "l": "https://doi.org/10.1016/j.gr.2012.12.026", "id": "doi:10.1016/j.gr.2012.12.026"}], "anim": "drift", "tz": {"ago": 0.15}, "imp": "", "old": 1}, {"ch": 7, "title": "Flowers", "when": "about 125 million years ago", "tag": "", "story": "Until then the land was green but colourless, covered in ferns, conifers and cycads. Then plants invented the flower: seeds wrapped in a fruit, and showy petals to hire insects as couriers. Within a few tens of millions of years flowering plants had taken over most of the world.", "more": "Unambiguous flowering-plant fossils (first pollen, then flowers) appear in the Early Cretaceous, roughly 135 to 125 million years ago, whereas molecular clocks put the origin earlier, with large uncertainty. The rise of flowering plants went hand in hand with the diversification of insects, birds and mammals.", "facts": [["Earliest fossils", "~135 – 125 Ma"], ["Molecular-clock origin", "earlier, debated"]], "refs": [{"t": "Magallón, S. et al. (2015). A metacalibrated time-tree documents the early rise of flowering plant phylogenetic diversity. New Phytologist.", "l": "https://doi.org/10.1111/nph.13264", "id": "doi:10.1111/nph.13264"}, {"t": "Barba-Montoya, J. et al. (2018). Constraining uncertainty in the timescale of angiosperm evolution. New Phytologist.", "l": "https://doi.org/10.1111/nph.15011", "id": "doi:10.1111/nph.15011"}], "anim": "flower", "tz": {"ago": 0.125}, "imp": "", "old": 1}, {"ch": 7, "title": "A bad day for the dinosaurs", "when": "66 million years ago", "tag": "", "story": "An asteroid more than ten kilometres wide hit what is now Mexico and dug a crater some 200 kilometres across. Dust and fire darkened the sky. The impact helped end the reign of the dinosaurs, except for the birds, and opened the world to mammals.", "more": "The Cretaceous–Paleogene boundary is dated to about 66.04 million years ago. Evidence supports a bolide impact as the main driver of the extinction, with Deccan volcanism possibly shaping the climate and the recovery. Around three-quarters of species were lost.", "facts": [["Date", "≈ 66.04 ± 0.01 Ma"], ["Crater", "~200 km (Chicxulub)"], ["Impactor", "> 10 km"]], "refs": [{"t": "Alvarez, L. W. et al. (1980). Extraterrestrial cause for the Cretaceous–Tertiary extinction. Science.", "l": "https://doi.org/10.1126/science.208.4448.1095", "id": "doi:10.1126/science.208.4448.1095"}, {"t": "Schulte, P. et al. (2010). The Chicxulub asteroid impact and mass extinction at the Cretaceous–Paleogene boundary. Science.", "l": "https://doi.org/10.1126/science.1177265", "id": "doi:10.1126/science.1177265"}, {"t": "Renne, P. R. et al. (2013). Time scales of critical events around the Cretaceous–Paleogene boundary. Science.", "l": "https://doi.org/10.1126/science.1230492", "id": "doi:10.1126/science.1230492"}, {"t": "Hull, P. M. et al. (2020). On impact and volcanism across the Cretaceous–Paleogene boundary. Science.", "l": "https://doi.org/10.1126/science.aay5055", "id": "doi:10.1126/science.aay5055"}, {"t": "Bambach, R. K. (2006). Phanerozoic biodiversity mass extinctions. Annual Review of Earth and Planetary Sciences.", "l": "https://doi.org/10.1146/annurev.earth.33.092203.122654", "id": "doi:10.1146/annurev.earth.33.092203.122654"}], "anim": "extinct", "tz": {"ago": 0.066}, "imp": "A mountain falls out of the sky, and the world changes in an afternoon.", "old": 1}, {"ch": 7, "title": "Mammals take over", "when": "about 56 million years ago", "tag": "", "story": "With the dinosaurs gone, mammals grew from the size of a rat to that of a horse or a whale in a few million years. Then, 56 million years ago, the Earth caught a fever: carbon released into the air warmed the planet by several degrees, and palm trees grew near the poles. Primates appeared around then, and our long line began.", "more": "The Paleocene–Eocene Thermal Maximum, about 56 million years ago, warmed the planet by roughly 5 to 8 degrees Celsius in a few tens of thousands of years. Through the rest of the Cenozoic the deep ocean cooled, with a major step about 34 million years ago when the Antarctic ice sheet formed. In the chart, the three early points are reconstructions of global mean surface temperature from proxies (with 66 per cent intervals), not a continuous curve.", "facts": [["PETM", "~56 Ma"], ["Warming", "~5 – 8 °C"], ["Antarctic ice sheet", "~34 Ma"]], "refs": [{"t": "Zachos, J. et al. (2001). Trends, rhythms, and aberrations in global climate 65 Ma to present. Science.", "l": "https://doi.org/10.1126/science.1059412", "id": "doi:10.1126/science.1059412"}, {"t": "McInerney, F. A., & Wing, S. L. (2011). The Paleocene–Eocene Thermal Maximum. Annual Review of Earth and Planetary Sciences.", "l": "https://doi.org/10.1146/annurev-earth-040610-133431", "id": "doi:10.1146/annurev-earth-040610-133431"}, {"t": "Bininda-Emonds, O. R. P. et al. (2007). The delayed rise of present-day mammals. Nature.", "l": "https://doi.org/10.1038/nature05634", "id": "doi:10.1038/nature05634"}, {"t": "Inglis, G. N. et al. (2020). Global mean surface temperature and climate sensitivity of the early Eocene Climatic Optimum (EECO), PETM and latest Paleocene. Climate of the Past.", "l": "https://doi.org/10.5194/cp-16-1953-2020", "id": "doi:10.5194/cp-16-1953-2020"}, {"t": "Westerhold, T. et al. (2020). An astronomically dated record of Earth’s climate and its predictability over the last 66 million years. Science.", "l": "https://doi.org/10.1126/science.aba6853", "id": "doi:10.1126/science.aba6853"}], "anim": "temp", "tz": {"ago": 0.056}, "imp": "", "old": 1}, {"ch": 7, "title": "India meets Asia", "when": "from about 55 million years ago", "tag": "", "story": "A whole subcontinent ran into Asia, and the two have been pushing on one another ever since. The crust crumpled upwards into the Himalaya and the Tibetan plateau, which are still rising at about five millimetres a year.", "more": "", "facts": [["Collision began", "≈ 55–60 Ma"], ["Uplift today", "≈ 5 mm/yr"], ["Everest", "8,848.86 m"]], "refs": [{"t": "Molnar, P., & Tapponnier, P. (1975). Cenozoic tectonics of Asia: effects of a continental collision. Science.", "l": "https://doi.org/10.1126/science.189.4201.419", "id": "doi:10.1126/science.189.4201.419"}], "anim": "plates", "tz": {"ago": 0.055}, "imp": ""}, {"ch": 7, "title": "Whales go back to sea", "when": "about 50 to 40 million years ago", "tag": "fossils", "story": "Whales are mammals whose ancestors lived on land. A small, deer-like animal, a relative of the hippos, took to the water, and over ten million years its descendants lost their legs. The earliest whales walked; the later ones swam.", "more": "", "facts": [["Pakicetus", "≈ 50 Ma (land)"], ["Basilosaurus", "≈ 40 Ma (fully aquatic)"]], "refs": [{"t": "Thewissen, J. G. M., Cooper, L. N., Clementz, M. T., Bajpai, S., & Tiwari, B. N. (2007). Whales originated from aquatic artiodactyls in the Eocene epoch of India. Nature.", "l": "https://doi.org/10.1038/nature06343", "id": "doi:10.1038/nature06343"}], "anim": "tree", "tz": {"ago": 0.045}, "imp": ""}, {"ch": 7, "title": "The apes", "when": "from about 25 million years ago", "tag": "molecular clock", "story": "The ancestors of the apes parted from the Old World monkeys some 25 to 30 million years ago, then grew in size, lost their tails and learned to hang from branches. The line that led to us split from the chimpanzees’ a few million years ago.", "more": "", "facts": [["Apes / Old World monkeys", "≈ 25–30 Ma"], ["Human / chimpanzee split", "≈ 6–13 Ma (calibration-dependent)"]], "refs": [{"t": "Springer, M. S. et al. (2012). Macroevolutionary dynamics and historical biogeography of primate diversification inferred from a species supermatrix. PLoS ONE.", "l": "https://doi.org/10.1371/journal.pone.0049521", "id": "doi:10.1371/journal.pone.0049521"}, {"t": "Langergraber, K. E. et al. (2012). Generation times in wild chimpanzees and gorillas suggest earlier divergence times in great ape and human evolution. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.1211740109", "id": "doi:10.1073/pnas.1211740109"}], "anim": "tree", "tz": {"ago": 0.025}, "imp": ""}, {"ch": 7, "title": "The grasslands spread", "when": "about 8 to 6 million years ago", "tag": "", "story": "Grasses are older than the Cenozoic, but the open savannas are young. As the world dried, a new grass type spread across the continents, and with it came herds, grazers and a new place to live: open ground, where upright walkers could see far.", "more": "", "facts": [["Grass phytoliths", "in dinosaur dung, ≈ 66 Ma"], ["C₄ savanna expansion", "≈ 8–6 Ma"]], "refs": [{"t": "Cerling, T. E. et al. (1997). Global vegetation change through the Miocene/Pliocene boundary. Nature.", "l": "https://doi.org/10.1038/38229", "id": "doi:10.1038/38229"}], "anim": "grass", "tz": {"ago": 0.007}, "imp": ""}, {"ch": 7, "title": "The sea disappears", "when": "5.97 to 5.33 million years ago", "tag": "dated", "story": "When the Strait of Gibraltar closed, the Mediterranean dried out into a salt desert, thousands of metres deep. Then the Atlantic broke back in, in one of the largest floods the Earth has known, which may have refilled the basin in as little as a couple of years.", "more": "", "facts": [["Salinity crisis", "≈ 5.97–5.33 Ma"], ["Refilling", "months to ≲ 2 yr (model)"]], "refs": [{"t": "Garcia-Castellanos, D. et al. (2009). Catastrophic flood of the Mediterranean after the Messinian salinity crisis. Nature.", "l": "https://doi.org/10.1038/nature08555", "id": "doi:10.1038/nature08555"}], "anim": "flood", "tz": {"ago": 0.0056}, "imp": ""}, {"ch": 7, "title": "An isthmus closes", "when": "about 3 million years ago", "tag": "debated", "story": "A land bridge rose between North and South America, and the animals of both continents crossed it. Ocean currents were rerouted, and the isthmus may have helped to start the ice ages. When it really closed is still argued: classically 3 million years ago, perhaps much earlier.", "more": "", "facts": [["Classic date", "≈ 3 Ma"], ["Alternative", "much earlier (debated)"]], "refs": [{"t": "O’Dea, A. et al. (2016). Formation of the Isthmus of Panama. Science Advances.", "l": "https://doi.org/10.1126/sciadv.1600883", "id": "doi:10.1126/sciadv.1600883"}], "anim": "plates", "tz": {"ago": 0.003}, "imp": ""}, {"ch": 8, "title": "The first tools", "when": "3.3 to 2.6 million years ago", "tag": "dated", "story": "Someone picked up a stone and struck it against another to make a sharp edge. The oldest known stone tools are 3.3 million years old, older than our genus. A few hundred thousand years later, the Oldowan toolkit spread widely.", "more": "", "facts": [["Lomekwi (Kenya)", "≈ 3.3 Ma"], ["Oldowan toolkit", "≈ 2.6 Ma"]], "refs": [{"t": "Harmand, S. et al. (2015). 3.3-million-year-old stone tools from Lomekwi 3, West Turkana, Kenya. Nature.", "l": "https://doi.org/10.1038/nature14464", "id": "doi:10.1038/nature14464"}], "anim": "ago", "tz": {"ago": 0.0033}, "imp": ""}, {"ch": 8, "title": "Lucy", "when": "3.2 million years ago", "tag": "fossils", "story": "A small ape-like woman, a little over a metre tall, walked upright across the plains of what is now Ethiopia. Her skeleton, found in 1974, showed that our ancestors stood on two legs long before they had large brains.", "more": "", "facts": [["Lucy (A.L. 288-1)", "≈ 3.2 Ma"], ["Species", "Australopithecus afarensis"], ["Height", "≈ 1.1 m"]], "refs": [{"t": "Johanson, D. C., & Taieb, M. (1976). Plio-Pleistocene hominid discoveries in Hadar, Ethiopia. Nature.", "l": "https://doi.org/10.1038/260293a0", "id": "doi:10.1038/260293a0"}], "anim": "ago", "tz": {"ago": 0.0032}, "imp": ""}, {"ch": 8, "title": "The ice ages", "when": "from 2.58 million years ago", "tag": "", "story": "Slowly the world cooled. Ice sheets grew over Canada and Scandinavia and melted again, on a rhythm set by small wobbles in Earth’s orbit and tilt. Our ancestors evolved in this shifting climate: they made tools, tamed fire, and grew bigger brains.", "more": "The Quaternary Period begins at 2.58 million years ago. Its glacial cycles are paced by orbital changes (Milankovitch cycles), with a period of about 41,000 years until roughly a million years ago and about 100,000 years since. At the Last Glacial Maximum, about 21,000 years ago, the global mean surface temperature was about 6.1 °C (5.7 to 6.5) colder than before the industrial era.", "facts": [["Quaternary starts", "2.58 Ma"], ["Cycles", "41 kyr, then ~100 kyr"]], "refs": [{"t": "Gibbard, P. L. et al. (2010). Formal ratification of the Quaternary System/Period and the Pleistocene Series/Epoch with a base at 2.58 Ma. Journal of Quaternary Science.", "l": "https://doi.org/10.1002/jqs.1338", "id": "doi:10.1002/jqs.1338"}, {"t": "Hays, J. D., Imbrie, J., & Shackleton, N. J. (1976). Variations in the Earth’s orbit: pacemaker of the ice ages. Science.", "l": "https://doi.org/10.1126/science.194.4270.1121", "id": "doi:10.1126/science.194.4270.1121"}, {"t": "Lisiecki, L. E., & Raymo, M. E. (2005). A Pliocene–Pleistocene stack of 57 globally distributed benthic δ18O records. Paleoceanography.", "l": "https://doi.org/10.1029/2004PA001071", "id": "doi:10.1029/2004PA001071"}, {"t": "Tierney, J. E. et al. (2020). Glacial cooling and climate sensitivity revisited. Nature.", "l": "https://doi.org/10.1038/s41586-020-2617-x", "id": "doi:10.1038/s41586-020-2617-x"}], "anim": "temp", "tz": {"ago": 0.00258}, "imp": "", "old": 1}, {"ch": 8, "title": "Fire", "when": "about 1 million years ago", "tag": "debated", "story": "A hearth in a cave in South Africa holds burnt bone and ash about a million years old. Cooking made food easier to digest, and the fire gave warmth, light and protection. How regularly it was used so early is still being worked out.", "more": "", "facts": [["Wonderwerk Cave", "≈ 1.0 Ma"], ["Habitual use", "later, debated"]], "refs": [{"t": "Berna, F. et al. (2012). Microstratigraphic evidence of in situ fire in the Acheulean strata of Wonderwerk Cave, Northern Cape province, South Africa. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.1117620109", "id": "doi:10.1073/pnas.1117620109"}], "anim": "fire", "tz": {"ago": 0.001}, "imp": ""}, {"ch": 8, "title": "Cousins", "when": "from about 600,000 years ago", "tag": "genomes", "story": "Our species was not alone. The Neanderthals in Europe and the Denisovans in Asia split from our ancestors more than half a million years ago, and our paths crossed again. Most people alive today carry a few per cent of their DNA. The last Neanderthals died out about 40,000 years ago.", "more": "", "facts": [["Neanderthal–human split", "≈ 550–765 ka"], ["Neanderthal DNA in non-Africans", "≈ 2%"], ["Last Neanderthals", "≈ 40 ka"]], "refs": [{"t": "Prüfer, K. et al. (2014). The complete genome sequence of a Neanderthal from the Altai Mountains. Nature.", "l": "https://doi.org/10.1038/nature12886", "id": "doi:10.1038/nature12886"}, {"t": "Higham, T. et al. (2014). The timing and spatiotemporal patterning of Neanderthal disappearance. Nature.", "l": "https://doi.org/10.1038/nature13621", "id": "doi:10.1038/nature13621"}], "anim": "dots", "tz": {"ago": 0.0006}, "imp": ""}, {"ch": 8, "title": "People", "when": "about 315,000 years ago", "tag": "", "story": "In a cave in Morocco lived people with faces like ours. At about 315,000 years old, the Jebel Irhoud fossils are the oldest remains attributed to our species, Homo sapiens, though experts still discuss exactly where to draw the line.", "more": "Two dating methods give 280,000 to 350,000 years for the Jebel Irhoud fossils. Most researchers had placed our origin in East Africa about 200,000 years ago. Ancient genomes from southern Africa put the deepest divergence among living human populations between 350,000 and 260,000 years ago. Not all experts agree that the Irhoud fossils are Homo sapiens.", "facts": [["Age", "≈ 315,000 years"], ["Uncertainty", "280,000 – 350,000"], ["Genetic divergence", "350 – 260 ka"]], "refs": [{"t": "Hublin, J.-J. et al. (2017). New fossils from Jebel Irhoud, Morocco and the pan-African origin of Homo sapiens. Nature.", "l": "https://doi.org/10.1038/nature22336", "id": "doi:10.1038/nature22336"}, {"t": "Richter, D. et al. (2017). The age of the hominin fossils from Jebel Irhoud, Morocco, and the origins of the Middle Stone Age. Nature.", "l": "https://doi.org/10.1038/nature22335", "id": "doi:10.1038/nature22335"}, {"t": "Schlebusch, C. M. et al. (2017). Southern African ancient genomes estimate modern human divergence to 350,000 to 260,000 years ago. Science.", "l": "https://doi.org/10.1126/science.aao6266", "id": "doi:10.1126/science.aao6266"}], "anim": "geobar", "tz": {"ago": 0.000315}, "imp": "At last, a creature that looks up at the lights in the sky and asks what they are.", "old": 1}, {"ch": 8, "title": "Out of Africa", "when": "about 200,000 to 50,000 years ago", "tag": "fossils", "story": "Our species began to leave Africa. A jaw from a cave in Israel, 177,000 to 194,000 years old, shows an early attempt, and by about 65,000 years ago people had reached Australia. In a few tens of thousands of years, the species spread to every continent but Antarctica.", "more": "", "facts": [["Misliya jaw (Israel)", "177–194 ka"], ["Madjedbebe (Australia)", "≈ 65 ka"]], "refs": [{"t": "Hershkovitz, I. et al. (2018). The earliest modern humans outside Africa. Science.", "l": "https://doi.org/10.1126/science.aap8369", "id": "doi:10.1126/science.aap8369"}, {"t": "Clarkson, C. et al. (2017). Human occupation of northern Australia by 65,000 years ago. Nature.", "l": "https://doi.org/10.1038/nature22968", "id": "doi:10.1038/nature22968"}], "anim": "dots", "tz": {"ago": 0.0002}, "imp": "A small species begins a very long walk."}, {"ch": 8, "title": "The first pictures", "when": "at least 51,000 years ago", "tag": "dated", "story": "In a cave on the Indonesian island of Sulawesi, someone painted a hunt: small human figures and wild animals, in red. It is at least 51,200 years old, the oldest known narrative scene. Humans had begun to tell stories to people who were not there.", "more": "", "facts": [["Sulawesi scene", "≥ 51.2 ka"], ["Blombos ochre engraving", "≈ 73 ka"]], "refs": [{"t": "Oktaviana, A. A. et al. (2024). Narrative cave art in Indonesia by 51,200 years ago. Nature.", "l": "https://doi.org/10.1038/s41586-024-07541-7", "id": "doi:10.1038/s41586-024-07541-7"}, {"t": "Henshilwood, C. S. et al. (2018). An abstract drawing from the 73,000-year-old levels at Blombos Cave, South Africa. Nature.", "l": "https://doi.org/10.1038/s41586-018-0514-3", "id": "doi:10.1038/s41586-018-0514-3"}], "anim": "ago", "tz": {"ago": 5.1e-05}, "imp": ""}, {"ch": 8, "title": "The giants vanish", "when": "from about 50,000 to 10,000 years ago", "tag": "debated", "story": "Mammoths, giant sloths, sabre-toothed cats and many more disappeared across the continents as climate changed and humans arrived. How much was due to each is still argued. The last mammoths lived on an island in the Arctic until about 4,000 years ago.", "more": "", "facts": [["Late Quaternary extinctions", "≈ 50–10 ka"], ["Last mammoths (Wrangel Island)", "≈ 4 ka"]], "refs": [{"t": "Koch, P. L., & Barnosky, A. D. (2006). Late Quaternary extinctions: state of the debate. Annual Review of Ecology, Evolution, and Systematics.", "l": "https://doi.org/10.1146/annurev.ecolsys.34.011802.132415", "id": "doi:10.1146/annurev.ecolsys.34.011802.132415"}, {"t": "Vartanyan, S. L., Garutt, V. E., & Sher, A. V. (1993). Holocene dwarf mammoths from Wrangel Island in the Siberian Arctic. Nature.", "l": "https://doi.org/10.1038/362337a0", "id": "doi:10.1038/362337a0"}], "anim": "ago", "tz": {"ago": 4e-05}, "imp": ""}, {"ch": 8, "title": "The first friend", "when": "tens of thousands of years ago", "tag": "debated", "story": "The first animal people ever tamed was a wolf. Dogs descend from wolves, and their story began at least some 15,000 years ago, and perhaps much earlier, when the answer to a question of friendship was found on the edge of a campfire. Exactly where and when is debated.", "more": "", "facts": [["Oldest accepted dog remains", "≈ 14 ka"], ["Domestication", "debated (genetics: tens of ka)"]], "refs": [{"t": "Frantz, L. A. F. et al. (2016). Genomic and archaeological evidence suggest a dual origin of domestic dogs. Science.", "l": "https://doi.org/10.1126/science.aaf3161", "id": "doi:10.1126/science.aaf3161"}], "anim": "ago", "tz": {"ago": 1.5e-05}, "imp": ""}, {"ch": 8, "title": "A cold snap, then the Holocene", "when": "12,900 to 11,700 years ago", "tag": "dated", "story": "As the last ice age ended, the warming reversed for twelve centuries: the Younger Dryas. When it ended, Greenland warmed by about ten degrees in a few decades. The stable, warm Holocene that began then is the climate in which all of agriculture and civilization arose.", "more": "", "facts": [["Younger Dryas", "≈ 12.9–11.7 ka"], ["Holocene begins", "11,700 yr before 2000"]], "refs": [{"t": "Walker, M. J. C. et al. (2009). Formal definition and dating of the GSSP for the base of the Holocene. Journal of Quaternary Science.", "l": "https://doi.org/10.1002/jqs.1227", "id": "doi:10.1002/jqs.1227"}], "anim": "ago", "tz": {"ago": 1.29e-05}, "imp": ""}, {"ch": 8, "title": "Fields, cities, a billion people", "when": "from 11,700 years ago", "tag": "", "story": "The ice retreated. Within a few thousand years, in several places at once, people began to plant seeds and keep animals: wheat and sheep in the Fertile Crescent, rice in China, maize in Mexico. Villages became cities, cities became empires, and the number of people on Earth rose from a few million to eight billion.", "more": "The Holocene begins 11,700 years before the year 2000. Domestication of plants and animals in the Near East starts around the beginning of the Holocene. Reconstructions of population (HYDE) give a few million people at 10,000 BCE, about a billion near 1800 and several billion by today. The numbers are approximate.", "facts": [["Holocene starts", "11,700 years ago"], ["Population", "a few million → ~8 billion"]], "refs": [{"t": "Walker, M. J. C. et al. (2009). Formal definition and dating of the GSSP for the base of the Holocene. Journal of Quaternary Science.", "l": "https://doi.org/10.1002/jqs.1227", "id": "doi:10.1002/jqs.1227"}, {"t": "Zeder, M. A. (2011). The origins of agriculture in the Near East. Current Anthropology.", "l": "https://doi.org/10.1086/659307", "id": "doi:10.1086/659307"}, {"t": "Klein Goldewijk, K. et al. (2017). Anthropogenic land use estimates for the Holocene, HYDE 3.2. Earth System Science Data.", "l": "https://doi.org/10.5194/essd-9-927-2017", "id": "doi:10.5194/essd-9-927-2017"}], "anim": "pop", "tz": {"ago": 1.17e-05}, "imp": "", "old": 1}, {"ch": 8, "title": "Writing", "when": "about 3300 BCE", "tag": "dated", "story": "In the city of Uruk, in what is now Iraq, people pressed signs into clay to record grain and sheep. Writing began as bookkeeping. It later let one person speak to another across time, and so it made history possible.", "more": "", "facts": [["Earliest proto-cuneiform", "≈ 3300 BCE (Uruk)"]], "refs": [{"t": "Woods, C. (Ed.) (2010). Visible Language: Inventions of Writing in the Ancient Middle East and Beyond. Oriental Institute Museum Publications 32. University of Chicago.", "l": null, "id": "book"}], "anim": "ago", "tz": {"ago": 5.3e-06}, "imp": "Now a voice could outlive the one who spoke."}, {"ch": 8, "title": "The Earth moves", "when": "1543 and 1610", "tag": "", "story": "In 1543 Copernicus published a book that put the Sun, not the Earth, at the centre. In 1610 Galileo pointed a telescope at Jupiter and saw four moons circling it, plain evidence that not everything circles the Earth. From then on, the sky was something to measure.", "more": "", "facts": [["Copernicus", "1543"], ["Galileo, moons of Jupiter", "1610"]], "refs": [{"t": "Copernicus, N. (1543). De revolutionibus orbium coelestium. Petreius, Nuremberg.", "l": null, "id": "book"}, {"t": "Galilei, G. (1610). Sidereus Nuncius. Baglioni, Venice.", "l": null, "id": "book"}], "anim": "orbit", "tz": {"ago": 4.83e-07}, "imp": ""}, {"ch": 8, "title": "The Industrial Revolution", "when": "from about 1760", "tag": "", "story": "People learned to burn the buried forests of the coal age. Steam, then electricity, then oil gave a species the power to move mountains and to change the air. Carbon dioxide, which stood near 280 parts per million for 10,000 years, has risen above 420 today.", "more": "", "facts": [["CO₂ before industry", "≈ 280 ppm"], ["CO₂ today", "> 420 ppm"]], "refs": [{"t": "Friedlingstein, P. et al. (2023). Global Carbon Budget 2023. Earth System Science Data.", "l": "https://doi.org/10.5194/essd-15-5301-2023", "id": "doi:10.5194/essd-15-5301-2023"}], "anim": "ago", "tz": {"ago": 2.63e-07}, "imp": ""}, {"ch": 8, "title": "The Great Acceleration", "when": "from 1950", "tag": "debated", "story": "Since 1950 almost every measure of human activity has bent sharply upwards: population, energy, fertilizer, cities, travel. Geologists have proposed naming this the Anthropocene epoch, but the bodies that vote on such names declined in 2024 to make it a formal unit of geological time.", "more": "", "facts": [["Start of acceleration", "≈ 1950"], ["Formal epoch?", "not adopted (2024)"]], "refs": [{"t": "Steffen, W., Broadgate, W., Deutsch, L., Gaffney, O., & Ludwig, C. (2015). The trajectory of the Anthropocene: the Great Acceleration. The Anthropocene Review.", "l": "https://doi.org/10.1177/2053019614564785", "id": "doi:10.1177/2053019614564785"}], "anim": "ago", "tz": {"ago": 7.6e-08}, "imp": ""}, {"ch": 8, "title": "The Space Age", "when": "from 1957", "tag": "", "story": "On 4 October 1957 a small metal sphere began to beep in orbit. Twelve years later, people walked on the Moon. Voyager 1, launched in 1977, crossed into interstellar space in 2012, and it is the farthest object we have ever made.", "more": "", "facts": [["Sputnik 1", "4 Oct 1957"], ["Apollo 11", "20 Jul 1969"], ["Voyager 1 leaves the heliosphere", "2012"]], "refs": [{"t": "Stone, E. C. et al. (2013). Voyager 1 observes low-energy galactic cosmic rays in a region depleted of heliospheric ions. Science.", "l": "https://doi.org/10.1126/science.1236408", "id": "doi:10.1126/science.1236408"}], "anim": "orbit", "tz": {"ago": 6.9e-08}, "imp": ""}, {"ch": 8, "title": "A pale blue dot", "when": "14 February 1990", "tag": "", "story": "On its way out of the Solar System, Voyager 1 turned its camera around and looked back from about six billion kilometres. Earth was less than a single pixel, a speck in a ray of scattered sunlight. Everyone who has ever lived was on that speck.", "more": "", "facts": [["Distance", "≈ 6×10⁹ km (≈ 40 AU)"], ["Earth in the image", "< 1 pixel"]], "refs": [{"t": "Sagan, C. (1994). Pale Blue Dot: A Vision of the Human Future in Space. Random House.", "l": null, "id": "book"}], "anim": "dot", "tz": {"ago": 3.6e-08}, "imp": "Everyone you have ever known lived on that speck."}, {"ch": 9, "title": "The universe is expanding", "when": "1929", "tag": "", "story": "Edwin Hubble measured the distances to nearby galaxies and found that the farther away they were, the faster they were receding. The universe was not static. Run the film backwards and everything was once much closer together.", "more": "", "facts": [["Hubble (1929)", "v ∝ d"], ["Modern H₀", "≈ 67–73 km/s/Mpc (the values still disagree)"]], "refs": [{"t": "Hubble, E. (1929). A relation between distance and radial velocity among extra-galactic nebulae. Proceedings of the National Academy of Sciences.", "l": "https://doi.org/10.1073/pnas.15.3.168", "id": "doi:10.1073/pnas.15.3.168"}], "anim": "expand", "tz": {"ago": 9.7e-08}, "imp": ""}, {"ch": 9, "title": "Reading the afterglow", "when": "1989 to 2018", "tag": "", "story": "Three satellites mapped the oldest light in the sky with growing sharpness: COBE in 1989, WMAP in 2001 and Planck in 2009. The faint ripples they found are the seeds of all structure, and they pin down the age of the universe to within about 20 million years.", "more": "", "facts": [["Age of the universe (Planck)", "13.797 ± 0.023 Gyr"], ["Dark energy", "≈ 68%"], ["Dark matter", "≈ 27%"], ["Ordinary matter", "≈ 5%"]], "refs": [{"t": "Planck Collaboration (2020). Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06209", "id": "arxiv:1807.06209"}], "anim": "cmb", "tz": {"ago": 3e-08}, "imp": ""}, {"ch": 9, "title": "The first other worlds", "when": "1995", "tag": "", "story": "Michel Mayor and Didier Queloz found a planet circling the Sun-like star 51 Pegasi, a giant that orbits in just over four days. Since then astronomers have confirmed more than six thousand planets around other stars. The sky is full of worlds.", "more": "", "facts": [["51 Peg b", "P = 4.23 d, M sin i ≥ 0.47 M_Jup"], ["Confirmed exoplanets", "> 6,000"]], "refs": [{"t": "Mayor, M., & Queloz, D. (1995). A Jupiter-mass companion to a solar-type star. Nature.", "l": "https://doi.org/10.1038/378355a0", "id": "doi:10.1038/378355a0"}], "anim": "orbit", "tz": {"ago": 3e-08}, "imp": ""}, {"ch": 9, "title": "The expansion speeds up", "when": "1998", "tag": "", "story": "Two teams of astronomers measured exploding stars in distant galaxies and found them dimmer than expected. The expansion of the universe is not slowing, as everyone assumed. It is speeding up. We call the cause dark energy, and we do not know what it is.", "more": "", "facts": [["Discovery", "1998"], ["Nature of dark energy", "unknown"]], "refs": [{"t": "Riess, A. G. et al. (1998). Observational evidence from supernovae for an accelerating universe and a cosmological constant. The Astronomical Journal.", "l": "https://arxiv.org/abs/astro-ph/9805201", "id": "arxiv:astro-ph/9805201"}, {"t": "Perlmutter, S. et al. (1999). Measurements of Ω and Λ from 42 high-redshift supernovae. The Astrophysical Journal.", "l": "https://arxiv.org/abs/astro-ph/9812133", "id": "arxiv:astro-ph/9812133"}], "anim": "expand", "tz": {"ago": 2.8e-08}, "imp": ""}, {"ch": 9, "title": "Ripples in space", "when": "14 September 2015", "tag": "", "story": "Two black holes, one of 36 and one of 29 times the mass of the Sun, spiralled together 1.3 billion years ago and merged. The ripple in space crossed the universe and shook two detectors in the United States by less than a thousandth of the width of a proton.", "more": "", "facts": [["GW150914", "36 + 29 → 62 M☉"], ["Energy radiated", "≈ 3 M☉c²"]], "refs": [{"t": "Abbott, B. P. et al. (2016). Observation of gravitational waves from a binary black hole merger. Physical Review Letters.", "l": "https://arxiv.org/abs/1602.03837", "id": "arxiv:1602.03837"}], "anim": "wave", "tz": {"ago": 1.1e-08}, "imp": "We learn to hear the universe, not only to see it."}, {"ch": 9, "title": "A telescope looks back", "when": "2021 to today", "tag": "", "story": "The James Webb Space Telescope was launched on 25 December 2021, and its first images were released on 12 July 2022. Its 6.5 metre mirror and infrared eyes are made to see the earliest galaxies. It shows more of them, and brighter, than most models expected.", "more": "", "facts": [["Launch", "25 Dec 2021"], ["Mirror", "6.5 m"], ["First images", "12 Jul 2022"]], "refs": [{"t": "Gardner, J. P. et al. (2006). The James Webb Space Telescope. Space Science Reviews.", "l": "https://arxiv.org/abs/astro-ph/0606175", "id": "arxiv:astro-ph/0606175"}], "anim": "stars", "tz": {"ago": 5e-09}, "imp": "We built an eye to look at the first light, and it saw more than we asked for."}, {"ch": 9, "title": "Today", "when": "13.8 billion years", "tag": "now", "story": "Here we are. A universe 13.8 billion years old, with an observable part 46 billion light-years in radius, containing somewhere between a few hundred billion and two trillion galaxies, and on one small planet a species that has worked out how all of this happened.", "more": "Age 13.797 ± 0.023 Gyr, H₀ = 67.36 ± 0.54 km/s/Mpc from the CMB. The local distance ladder gives a higher value, about 73 km/s/Mpc, an unresolved disagreement called the Hubble tension. The particle horizon is about 46 billion light-years. The number of galaxies depends on how many faint ones are counted.", "facts": [["Age", "13.797 ± 0.023 Gyr"], ["H₀ (CMB)", "67.36 ± 0.54"], ["Horizon radius", "≈ 46 Gly"]], "refs": [{"t": "Planck Collaboration (2020). Planck 2018 results. VI. Cosmological parameters. Astronomy & Astrophysics.", "l": "https://arxiv.org/abs/1807.06209", "id": "arxiv:1807.06209"}, {"t": "Riess, A. G. et al. (2022). A comprehensive measurement of the local value of the Hubble constant (SH0ES). The Astrophysical Journal Letters.", "l": "https://arxiv.org/abs/2112.04510", "id": "arxiv:2112.04510"}, {"t": "Di Valentino, E. et al. (2021). In the realm of the Hubble tension. Classical and Quantum Gravity.", "l": "https://arxiv.org/abs/2103.01183", "id": "arxiv:2103.01183"}, {"t": "Conselice, C. J. et al. (2016). The evolution of galaxy number density at z < 8 and its implications. The Astrophysical Journal.", "l": "https://arxiv.org/abs/1607.03909", "id": "arxiv:1607.03909"}], "anim": "cmbmap", "tz": {"fut": 0}, "imp": "This is the moment in which you are reading: a small world, an ordinary star, a universe still unfolding.", "old": 1}, {"ch": 10, "title": "The Moon drifts away", "when": "now, and for billions of years", "tag": "measured", "story": "The Moon moves about 3.8 centimetres farther from the Earth every year, as measured by lasers bounced off mirrors left by Apollo crews. Tides steal the Earth’s spin. The days get longer and the Moon gets slightly smaller in the sky.", "more": "", "facts": [["Recession", "≈ 3.8 cm/yr"]], "refs": [{"t": "Dickey, J. O. et al. (1994). Lunar laser ranging: a continuing legacy of the Apollo program. Science.", "l": "https://doi.org/10.1126/science.265.5171.482", "id": "doi:10.1126/science.265.5171.482"}], "anim": "orbit", "tz": {"fut": 0.0}, "imp": ""}, {"ch": 10, "title": "The next supercontinent", "when": "about 250 million years from now", "tag": "prediction", "story": "The continents drift at about the speed at which fingernails grow, and in some 250 million years they will gather again into a single supercontinent, nicknamed Pangea Ultima. The Sun will be about 2.5 per cent brighter, volcanoes will have added carbon dioxide, and the vast interior will be hot and dry. Most of the land may be too hot for mammals.", "more": "Climate simulations of a future supercontinent with background CO₂ of 410 to 816 ppm and a Sun 2.5 per cent brighter, together with the large temperature range deep inside a continent, find conditions hostile to mammals. The result depends on how the continents assemble and on how much CO₂ is released.", "facts": [["Forms in", "~250 Myr (model)"], ["Solar luminosity", "+2.5%"], ["CO₂ (model)", "410 – 816 ppm"]], "refs": [{"t": "Farnsworth, A. et al. (2023). Climate extremes likely to drive land mammal extinction during next supercontinent assembly. Nature Geoscience.", "l": "https://doi.org/10.1038/s41561-023-01259-3", "id": "doi:10.1038/s41561-023-01259-3"}, {"t": "Scotese, C. R. (2021). An atlas of Phanerozoic paleogeographic maps. Annual Review of Earth and Planetary Sciences.", "l": "https://doi.org/10.1146/annurev-earth-081320-064052", "id": "doi:10.1146/annurev-earth-081320-064052"}, {"t": "Nance, R. D., Murphy, J. B., & Santosh, M. (2014). The supercontinent cycle: a retrospective essay. Gondwana Research.", "l": "https://doi.org/10.1016/j.gr.2012.12.026", "id": "doi:10.1016/j.gr.2012.12.026"}, {"t": "Li, Z. X. et al. (2008). Assembly, configuration, and break-up history of Rodinia: a synthesis. Precambrian Research.", "l": "https://doi.org/10.1016/j.precamres.2007.04.021", "id": "doi:10.1016/j.precamres.2007.04.021"}], "anim": "drift", "tz": {"fut": 0.25}, "imp": "", "old": 1}, {"ch": 10, "title": "The air runs out", "when": "about 1 billion years from now", "tag": "prediction", "story": "The Sun gets about ten per cent brighter every billion years. A hotter Earth weathers rocks faster and pulls carbon dioxide out of the air until plants cannot live. Plants die first and the oxygen goes with them, leaving an atmosphere like that of two and a half billion years ago. Later, the oceans begin to evaporate in a moist greenhouse.", "more": "A coupled model of oxygen and carbon cycles gives the oxygen-rich atmosphere a lifespan of 1.08 ± 0.14 billion years (above 1 per cent of present levels), followed by a rapid fall to Archaean-like levels. Climate models find that Earth leaves the habitable climate range after roughly 1.5 billion years; this number is model-dependent.", "facts": [["O₂-rich air lasts", "1.08 ± 0.14 Gyr"], ["Habitable climate ends", "~1.5 Gyr (model)"]], "refs": [{"t": "Ozaki, K., & Reinhard, C. T. (2021). The future lifespan of Earth’s oxygenated atmosphere. Nature Geoscience.", "l": "https://doi.org/10.1038/s41561-021-00693-5", "id": "doi:10.1038/s41561-021-00693-5"}, {"t": "Wolf, E. T., & Toon, O. B. (2015). The evolution of habitable climates under the brightening Sun. Journal of Geophysical Research: Atmospheres.", "l": "https://doi.org/10.1002/2015JD023302", "id": "doi:10.1002/2015JD023302"}, {"t": "Kasting, J. F. (1988). Runaway and moist greenhouse atmospheres and the evolution of Earth and Venus. Icarus.", "l": "https://doi.org/10.1016/0019-1035(88)90116-9", "id": "doi:10.1016/0019-1035(88)90116-9"}], "anim": "o2fall", "tz": {"fut": 1.08}, "imp": "", "old": 1}, {"ch": 10, "title": "The Sun swells", "when": "5.5 billion years from now", "tag": "prediction", "story": "In about 5.5 billion years the Sun will run out of hydrogen in its core and swell into a red giant, hundreds of times wider than today. Mercury and Venus will be swallowed, and Earth will be scorched long before.", "more": "At maximum the red giant is about 256 times as wide and 2,730 times as luminous as the Sun now. It reaches this tip of the red-giant branch 7.59 ± 0.05 billion years from now, having lost about a third of its mass. Tidal drag from the expanding atmosphere pulls Earth’s orbit inward.", "facts": [["Leaves main sequence", "~5.5 Gyr from now"], ["Maximum size", "~256× present (1.2 AU)"]], "refs": [{"t": "Schröder, K.-P., & Smith, R. C. (2008). Distant future of the Sun and Earth revisited. Monthly Notices of the Royal Astronomical Society.", "l": "https://arxiv.org/abs/0801.4031", "id": "arxiv:0801.4031"}, {"t": "Sackmann, I.-J., Boothroyd, A. I., & Kraemer, K. E. (1993). Our Sun. III. Present and future. The Astrophysical Journal.", "l": "https://doi.org/10.1086/173407", "id": "doi:10.1086/173407"}], "anim": "pn", "tz": {"fut": 5.5}, "imp": "", "old": 1}, {"ch": 10, "title": "The end of Earth", "when": "7.59 billion years from now", "tag": "prediction", "story": "In the best current models the swollen Sun drags Earth from its orbit, and the planet spirals into the Sun’s outer atmosphere and is vaporised. Life will almost certainly have ended much earlier.", "more": "The Sun reaches the tip of the red-giant branch 7.59 billion years from now, and Earth is engulfed shortly before. Mercury and Venus go earlier. This is a model result with uncertainties in the Sun’s mass loss and in tidal drag, and Earth’s orbit also widens as the Sun loses mass.", "facts": [["Earth engulfed", "~7.59 Gyr from now"]], "refs": [{"t": "Schröder, K.-P., & Smith, R. C. (2008). Distant future of the Sun and Earth revisited. Monthly Notices of the Royal Astronomical Society.", "l": "https://arxiv.org/abs/0801.4031", "id": "arxiv:0801.4031"}, {"t": "Rybicki, K. R., & Denis, C. (2001). On the final destiny of the Earth and the Solar System. Icarus.", "l": "https://ui.adsabs.harvard.edu/abs/2001Icar..151..130R", "id": "ads:2001Icar..151..130R"}], "anim": "geobar", "tz": {"fut": 7.59}, "imp": "In its last act, the Sun may reach out and take back the world it warmed.", "old": 1}, {"ch": 10, "title": "A white dwarf", "when": "about 7.7 billion years from now", "tag": "prediction", "story": "After the red giant the Sun sheds its outer layers into space. What is left is a white dwarf: a hot, dense ember about as big as the Earth, with just over half the mass of today’s Sun. It will cool and fade for trillions of years. The Sun is too small to explode as a supernova.", "more": "In the Schröder and Smith models the Sun has 0.668 solar masses at the tip of the red-giant branch, 0.546 at the tip of the asymptotic giant branch, and ends as a white dwarf of 0.5405 solar masses. Its luminosity is too low to make a regular planetary nebula. The Sun’s age at the AGB tip is 12.30 Gyr, which is 7.72 Gyr from now (derived here from their table).", "facts": [["Final mass", "0.5405 M☉"], ["Final size", "about Earth-sized"], ["Nebula", "faint, peculiar (model)"]], "refs": [{"t": "Schröder, K.-P., & Smith, R. C. (2008). Distant future of the Sun and Earth revisited. Monthly Notices of the Royal Astronomical Society.", "l": "https://arxiv.org/abs/0801.4031", "id": "arxiv:0801.4031"}, {"t": "Kalirai, J. S. et al. (2008). The initial–final mass relation: direct constraints at the low-mass end. The Astrophysical Journal.", "l": "https://arxiv.org/abs/0706.3894", "id": "arxiv:0706.3894"}], "anim": "pn", "tz": {"fut": 7.72}, "imp": "", "old": 1}, {"ch": 10, "title": "Our galaxy meets Andromeda", "when": "about 8 billion years from now", "tag": "coin flip", "story": "Andromeda is the nearest big spiral, and for years we were told it would hit the Milky Way in 4.5 billion years. New simulations say it is a coin flip: about half the time the two galaxies merge within 10 billion years, and if they do, probably around 8 billion years from now. The Milky Way will first swallow its own satellite, the Large Magellanic Cloud.", "more": "In the simulations, with the Large Magellanic Cloud and M33 included, a merger within 10 billion years occurs in about 54 per cent of cases. Among those that merge, the median time is 7.6 to 8.0 billion years. The Large Magellanic Cloud is certain to merge with the Milky Way first, in 1.3 to 1.9 billion years. The remnant is expected to be an elliptical galaxy, nicknamed Milkomeda.", "facts": [["Merger within 10 Gyr", "~50% (54% fiducial)"], ["If it happens", "median 7.6 – 8.0 Gyr"], ["LMC merges first", "1.3 – 1.9 Gyr"]], "refs": [{"t": "Sawala, T. et al. (2025). No certainty of a Milky Way–Andromeda collision. Nature Astronomy.", "l": "https://arxiv.org/abs/2408.00064", "id": "arxiv:2408.00064"}, {"t": "Cox, T. J., & Loeb, A. (2008). The collision between the Milky Way and Andromeda. Monthly Notices of the Royal Astronomical Society.", "l": "https://arxiv.org/abs/0705.1170", "id": "arxiv:0705.1170"}], "anim": "collide", "tz": {"fut": 8}, "imp": "", "old": 1}, {"ch": 10, "title": "The web freezes", "when": "about 30 billion years from now", "tag": "prediction", "story": "Dark energy keeps pushing. Galaxies bound together by gravity stay together, but the space between groups stretches faster and faster. In a few tens of billions of years the cosmic web will have frozen: no new large structures will form, and whatever is not already bound to us will drift away for ever.", "more": "Simulations of a universe with a cosmological constant find that large-scale structure freezes in comoving coordinates, and the mass distribution of bound objects stops evolving, within about two Hubble times, roughly 30 billion years from now. Galaxies that are not bound to the Local Group recede and eventually leave our event horizon; the Virgo cluster does so about 88 billion years from now in that model.", "facts": [["Structure freezes", "within ~30 Gyr"], ["Virgo leaves horizon", "~88 Gyr from now"]], "refs": [{"t": "Nagamine, K., & Loeb, A. (2003). Future evolution of nearby large-scale structure in a universe dominated by a cosmological constant. New Astronomy.", "l": "https://arxiv.org/abs/astro-ph/0204249", "id": "arxiv:astro-ph/0204249"}, {"t": "Loeb, A. (2002). The long-term future of extragalactic astronomy. Physical Review D.", "l": "https://arxiv.org/abs/astro-ph/0107568", "id": "arxiv:astro-ph/0107568"}], "anim": "fade", "tz": {"fut": 30}, "imp": "", "old": 1}, {"ch": 10, "title": "One galaxy left", "when": "when the universe is about 100 billion years old", "tag": "prediction", "story": "When the universe is about 100 billion years old only one galaxy is left in sight: the merged Milky Way and Andromeda. All the others have faded and passed beyond the horizon. Astronomers then would see a calm, empty universe and might never guess there was a Big Bang. The glow of the Big Bang will have cooled to about 0.02 degrees above absolute zero.", "more": "Only the Milky Way–Andromeda remnant remains within the event horizon at about 100 billion years of age. Krauss and Scherrer argue that on a timescale of order 100 billion years the Hubble expansion, the CMB and primordial deuterium become inaccessible to such observers. With this clock the scale factor is about 144, so the CMB temperature is 0.019 K and its peak wavelength is about 15 cm (derived here). Stars keep forming and shining long after this, to roughly 10¹² to 10¹⁴ years.", "facts": [["Universe age", "~100 Gyr"], ["Scale factor a", "≈ 144 (derived)"], ["CMB temperature", "≈ 0.019 K (derived)"]], "refs": [{"t": "Nagamine, K., & Loeb, A. (2003). Future evolution of nearby large-scale structure in a universe dominated by a cosmological constant. New Astronomy.", "l": "https://arxiv.org/abs/astro-ph/0204249", "id": "arxiv:astro-ph/0204249"}, {"t": "Krauss, L. M., & Scherrer, R. J. (2007). The return of a static universe and the end of cosmology. General Relativity and Gravitation.", "l": "https://arxiv.org/abs/0704.0221", "id": "arxiv:0704.0221"}, {"t": "Adams, F. C., & Laughlin, G. (1997). A dying universe: the long-term fate and evolution of astrophysical objects. Reviews of Modern Physics.", "l": "https://arxiv.org/abs/astro-ph/9701131", "id": "arxiv:astro-ph/9701131"}], "anim": "cmbfade", "tz": {"fut": 86.2}, "imp": "", "old": 1}, {"ch": 10, "title": "The last stars", "when": "around 10 trillion years from now", "tag": "predicted", "story": "Star formation will slowly run out of gas. The longest-lived stars, small red dwarfs, will burn for trillions of years. Then the last of them will fade, and the universe goes dark.", "more": "", "facts": [["End of star formation", "10¹²–10¹⁴ yr"], ["Last stars", "≈ 10¹³ yr"]], "refs": [{"t": "Adams, F. C., & Laughlin, G. (1997). A dying universe: the long-term fate and evolution of astrophysical objects. Reviews of Modern Physics.", "l": "https://arxiv.org/abs/astro-ph/9701131", "id": "arxiv:astro-ph/9701131"}], "anim": "fade", "tz": {"fut": 10000}, "imp": ""}, {"ch": 10, "title": "Dead stars scatter", "when": "10¹⁹ to 10²⁰ years", "tag": "predicted", "story": "Passing stars slowly fling each other out of galaxies. Over unimaginable spans, most of the dead stars are ejected, and the rest sink to the centre.", "more": "", "facts": [["Evaporation of galaxies", "≈ 10¹⁹–10²⁰ yr"]], "refs": [{"t": "Adams, F. C., & Laughlin, G. (1997). A dying universe: the long-term fate and evolution of astrophysical objects. Reviews of Modern Physics.", "l": "https://arxiv.org/abs/astro-ph/9701131", "id": "arxiv:astro-ph/9701131"}], "anim": "fade", "tz": {"fut": 10000000000.0}, "imp": ""}, {"ch": 10, "title": "Do protons decay?", "when": "at least 10³⁴ years, or never", "tag": "open", "story": "If protons decay, every atom is slowly fading away. Experiments have watched huge tanks of water for years and seen nothing. The proton lives at least 10³⁴ years if at all. The limit depends on how the decay happens.", "more": "", "facts": [["Lower limit on lifetime", "> 10³⁴ yr (model-dependent)"]], "refs": [{"t": "Super-Kamiokande Collaboration (2020). Search for proton decay via p → e⁺π⁰ and p → μ⁺π⁰ in 0.31 megaton-years exposure. Physical Review D.", "l": "https://arxiv.org/abs/2010.16098", "id": "arxiv:2010.16098"}], "anim": "fade", "tz": {"fut": 1e+25}, "imp": ""}, {"ch": 10, "title": "Black holes evaporate", "when": "10⁶⁷ to 10¹⁰⁰ years", "tag": "predicted", "story": "Stephen Hawking showed that black holes are not quite black. They radiate, very slowly, and shrink. A black hole of one solar mass takes about 10⁶⁷ years to vanish, and the biggest take about 10¹⁰⁰.", "more": "", "facts": [["Lifetime", "≈ 2×10⁶⁷ yr (M/M☉)³"], ["10¹¹ M☉ hole", "≈ 10¹⁰⁰ yr"]], "refs": [{"t": "Hawking, S. W. (1974). Black hole explosions? Nature.", "l": "https://doi.org/10.1038/248030a0", "id": "doi:10.1038/248030a0"}], "anim": "bh", "tz": {"fut": 1e+58}, "imp": ""}, {"ch": 10, "title": "The long dark", "when": "beyond 10¹⁰⁰ years", "tag": "predicted", "story": "What remains is a thin gas of light and particles, spread across ever more space. If dark energy is constant, the universe’s horizon has a temperature of about 2×10⁻³⁰ kelvin. Nothing more happens. We do not know whether this is the truth or only the best guess we have.", "more": "", "facts": [["Horizon temperature", "≈ 2×10⁻³⁰ K (if Λ constant)"]], "refs": [{"t": "Gibbons, G. W., & Hawking, S. W. (1977). Cosmological event horizons, thermodynamics, and particle creation. Physical Review D.", "l": "https://doi.org/10.1103/PhysRevD.15.2738", "id": "doi:10.1103/PhysRevD.15.2738"}], "anim": "fade", "tz": {"fut": 1e+91}, "imp": "And still, the laws hold. That is all we can say."}, {"ch": 9, "title": "The Cosmic Calendar", "when": "13.797 billion // Planck 2018 TT,TE,EE+lowE+lensing (Table 2, Planck Collab. 2020, A&A 641, A6)
const H0 = 67.36, OM = 0.3153, hh = H0 / 100, OR = 2.4728e-5 / (hh * hh) * (1 + 0.2271 * 3.046), OL = 1 - OM - OR;
const CC = 299792458, MPC = 3.0856776e19, YR = 3.15576e7, H0s = H0 / MPC;
const Hz = a => H0s * Math.sqrt(OR / a ** 4 + OM / a ** 3 + OL);
const NT = 7600, LA0 = -15, LA1 = 2.9, LA = [], TT = [], CH = [];
(function () { const dl = (LA1 - LA0) / (NT - 1), a0 = Math.pow(10, LA0); let t = a0 * a0 / (2 * H0s * Math.sqrt(OR)), chi = 2 * CC * t / a0;
  for (let i = 0; i < NT; i++) { const la = LA0 + i * dl; LA.push(la); TT.push(t); CH.push(chi);
    if (i < NT - 1) { const am = Math.pow(10, la + dl / 2), dt = dl * Math.LN10 / Hz(am); t += dt; chi += CC * dt / am } } })();
function interp(X, Y, x) { let lo = 0, hi = X.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (X[m] <= x) lo = m; else hi = m } const f = (x - X[lo]) / (X[hi] - X[lo]); return Y[lo] + f * (Y[hi] - Y[lo]) }
const LT_ = TT.map(Math.log10);
const aOfT = t => Math.pow(10, interp(LT_, LA, Math.log10(t)));
const tOfA = a => Math.pow(10, interp(LA, LT_, Math.log10(a)));
const tOfZ = z => tOfA(1 / (1 + z));
const chiOfA = a => interp(LA, CH, Math.log10(a));

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const win=(a,b,f,L)=>sm(a-f,a,L)*(1-sm(b,b+f,L));

const MINI={};
const TAU2=Math.PI*2;
function mrng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mglow(g,x,y,r,rgb,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
const ms=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
const mlabel=(g,s,x,y,col)=>{g.font='10px JetBrains Mono,monospace';g.fillStyle=col||'rgba(255,255,255,.6)';g.fillText(s,x,y)};
MINI.expand=(g,w,h,t)=>{g.fillStyle='#120826';g.fillRect(0,0,w,h);const f=(t*.35)%1,cx=w/2,cy=h/2;
 for(let l=0;l<2;l++){const sp=22*Math.pow(2,f+l),al=l?f:1-f;g.strokeStyle=`rgba(170,190,255,${.35*al})`;g.lineWidth=1;g.beginPath();for(let x=cx%sp-sp;x<w+sp;x+=sp){g.moveTo(x,0);g.lineTo(x,h)}for(let y=cy%sp-sp;y<h+sp;y+=sp){g.moveTo(0,y);g.lineTo(w,y)}g.stroke()}
 const r=mrng(5);g.globalCompositeOperation='lighter';for(let i=0;i<26;i++){const a=r()*TAU2,d=(.15+r()*.85)*(w*.5)*(.2+f*.8*(1+i%3*.2));mglow(g,cx+Math.cos(a)*d*(1+f),cy+Math.sin(a)*d*.7*(1+f),14,i%2?'190,120,255':'110,160,255',.55)}g.globalCompositeOperation='source-over';mlabel(g,'space stretching',8,h-8)};
MINI.burst=(g,w,h,t)=>{const p=(t%3.5)/3.5;g.fillStyle='#1a0c10';g.fillRect(0,0,w,h);g.globalCompositeOperation='lighter';mglow(g,w/2,h/2,40+p*120,'255,220,160',.9*(1-p*.5));const r=mrng(9);for(let i=0;i<90;i++){const a=r()*TAU2,v=.3+r()*.9,d=p*v*w*.55;g.fillStyle=`rgba(255,${180+r()*60|0},${120+r()*80|0},${1-p*.7})`;g.beginPath();g.arc(w/2+Math.cos(a)*d,h/2+Math.sin(a)*d*.6,1.4,0,TAU2);g.fill()}g.globalCompositeOperation='source-over';mlabel(g,'energy → particles',8,h-8)};
MINI.asym=(g,w,h,t)=>{g.fillStyle='#0a0a1a';g.fillRect(0,0,w,h);const r=mrng(3);let surv=0;for(let i=0;i<34;i++){const x=20+r()*(w-40),y=18+r()*(h-44),ph=((t*.3+r())%1),surv_=i%7===0;
  if(ph<.5){const d=(1-ph/.5)*16;g.fillStyle='#ff6a6a';g.beginPath();g.arc(x-d,y,4,0,TAU2);g.fill();if(!surv_){g.fillStyle='#6aa8ff';g.beginPath();g.arc(x+d,y,4,0,TAU2);g.fill()}}
  else{if(ph<.62&&!surv_){g.globalCompositeOperation='lighter';mglow(g,x,y,22,'255,240,200',(1-(ph-.5)/.12)*.9);g.globalCompositeOperation='source-over'}if(surv_){g.fillStyle='#ffc85a';g.beginPath();g.arc(x,y,4.5,0,TAU2);g.fill()}}}
 mlabel(g,'matter ●  antimatter ●  survivors ●  (real ratio ~1 in 10⁹)',8,h-8)};
MINI.higgs=(g,w,h,t)=>{g.fillStyle='#10091a';g.fillRect(0,0,w,h);const p=ms(.15,.7,(t%6)/6),mu=1-2.3*p,cx=w/2,base=h*.78,sc=h*.34;g.strokeStyle='rgba(255,210,150,.9)';g.lineWidth=2;g.beginPath();for(let i=0;i<=120;i++){const x=-1.6+3.2*i/120,V=mu*x*x*.5+x*x*x*x*.25,px=cx+x*w*.2,py=base-(V+.2)*sc*.8;i?g.lineTo(px,py):g.moveTo(px,py)}g.stroke();
 const xm=mu<0?Math.sqrt(-mu):0,bx=xm*(1),V=mu*bx*bx*.5+bx*bx*bx*bx*.25,jit=(1-p)*Math.sin(t*14)*.35;g.fillStyle='#fff';g.beginPath();g.arc(cx+(bx+jit)*w*.2,base-(mu*(bx+jit)**2*.5+(bx+jit)**4*.25+.2)*sc*.8-6,6,0,TAU2);g.fill();mlabel(g,p<.5?'hot: field = 0, particles massless':'cold: field settles, particles get mass',8,h-8)};
MINI.qcd=(g,w,h,t)=>{g.fillStyle='#14090c';g.fillRect(0,0,w,h);const p=ms(.35,.65,(t%6)/6),r=mrng(2),cols=['#ff5a5a','#5aff8c','#6e96ff'];for(let k=0;k<3;k++){const cx=w*(.2+.3*k),cy=h/2;for(let q=0;q<3;q++){const ox=Math.cos(q*2.09+(k?1:0))*16*p,oy=Math.sin(q*2.09)*16*p,wx=cx+ox+(1-p)*(Math.sin(t*1.7+q*2+k)*34),wy=cy+oy+(1-p)*(Math.cos(t*1.3+q*3+k)*26);g.fillStyle=cols[q];g.beginPath();g.arc(wx,wy,5,0,TAU2);g.fill();if(p>.5){g.strokeStyle='rgba(255,255,255,.25)';g.beginPath();g.moveTo(wx,wy);g.lineTo(cx,cy);g.stroke()}}
