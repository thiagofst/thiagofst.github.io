<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic History</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--tx:#f1ece4;--dim:#b9b2a8;--ac:#ffb86b}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:#020207;color:var(--tx);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.45) 100%)}
#hud{position:fixed;left:max(16px,3vw);top:16px;z-index:5;pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.7)}
#hud .lab{font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
#hud #tm{font:400 clamp(26px,4.4vw,46px)/1.05 Inter,system-ui,sans-serif;letter-spacing:-.01em;max-width:80vw}
#hud #sub{min-height:16px;font:12px 'JetBrains Mono',monospace;color:var(--dim);margin-top:6px}
#hud2 .grid{display:grid;grid-template-columns:auto auto;gap:3px 16px;margin-top:12px;font:11.5px 'JetBrains Mono',monospace;width:fit-content}
#hud2 .grid span{color:var(--dim)}#hud2 .grid b{font-weight:500;color:var(--tx);text-align:right}
#hud2 #sz{margin-top:10px;font:12px/1.4 Inter,sans-serif;color:var(--dim);max-width:260px}#hud2 #sz b{color:var(--ac);font-weight:500}
#track{position:fixed;right:max(10px,1.6vw);top:12vh;height:76vh;width:26px;z-index:6;cursor:pointer}
#track::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25)}
#track i{position:absolute;left:8px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);transform:translateY(-50%);transition:.2s}
#track i:hover{background:#fff;transform:translateY(-50%) scale(1.5)}
#track i b{position:absolute;right:18px;top:50%;transform:translateY(-50%);white-space:nowrap;font:500 10px 'JetBrains Mono',monospace;letter-spacing:.05em;color:#fff;opacity:0;pointer-events:none;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:5px;transition:.2s}
#track i:hover b{opacity:1}
#track #mk{position:absolute;left:5px;width:15px;height:15px;border-radius:50%;border:2px solid var(--ac);background:rgba(0,0,0,.5);transform:translateY(-50%);box-shadow:0 0 14px var(--ac);pointer-events:none}
#intro{position:absolute;left:0;right:0;top:0;height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 24px;z-index:3}
#intro h1{font:300 clamp(44px,10vw,120px)/1 Inter,system-ui,sans-serif;letter-spacing:-.03em}
#intro p{margin-top:18px;color:var(--dim);font-size:clamp(14px,1.6vw,18px);max-width:520px}
#intro .dn{margin-top:36px;font:11px 'JetBrains Mono',monospace;letter-spacing:.25em;color:var(--dim);animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
#world{position:relative;z-index:3;width:100%}
.card{position:absolute;width:min(390px,calc(100vw - 80px));padding:20px 22px;border-radius:18px;background:rgba(6,6,14,.82);border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 50px rgba(0,0,0,.45);transform:translateY(-54%);opacity:0;transition:opacity .5s;will-change:opacity;contain:layout paint}
.card.on{opacity:1}
.card{--cw:min(390px,calc(100vw - 80px))}.card.L{left:max(16px,6vw)}.card.R{right:auto;left:min(calc(78vw - var(--cw)/2),calc(100vw - 56px - var(--cw)))}
.card .tm{font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--ac);text-transform:uppercase}
.card h2{font:400 27px/1.15 Inter,system-ui,sans-serif;margin:6px 0 8px}
.card p{color:#d9d3ca;font-size:14.5px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font:11.5px/1.45 'JetBrains Mono',monospace}
.card dt{color:var(--dim)}.card dd{text-align:right}
.card .src{margin-top:10px;font-size:11px;color:var(--dim);line-height:1.4}
.card .tag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:9px;border:1px solid rgba(255,255,255,.25);font-size:9.5px;letter-spacing:.1em;color:var(--dim);vertical-align:middle}
#outro{position:absolute;left:max(16px,6vw);right:max(16px,6vw);padding:28px 30px;z-index:3;background:rgba(4,5,12,.88);border:1px solid rgba(255,255,255,.1);border-radius:20px}
#outro h3{font:400 30px Inter,system-ui,sans-serif;margin-bottom:14px}
#outro ul{list-style:none;columns:2 340px;column-gap:40px;font-size:13px;color:#cfc9c0}
#outro li{margin-bottom:9px;break-inside:avoid}
#outro .note{margin-top:22px;font-size:12.5px;color:var(--dim);max-width:760px}
@media(max-width:760px){
 #track{width:22px}#hud2 #sz{display:none}#hud2 .grid{font-size:10.5px}
 .card{left:12px!important;right:auto!important;width:calc(100vw - 52px);padding:14px 16px}.card h2{font-size:22px}.card p{font-size:13.5px}
}
#tf{position:fixed;left:0;right:0;top:0;height:210px;z-index:4;pointer-events:none}
#hud2{position:fixed;left:max(16px,3vw);bottom:14px;z-index:5;pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.8);background:rgba(0,0,0,.45);padding:10px 14px;border-radius:12px;}#hud2 .grid{margin-top:0}
#tf{height:130px!important}
#hud2{transition:opacity .4s}

.card{max-height:max(300px,calc(100vh - 230px));overflow-y:auto;overscroll-behavior:auto;scrollbar-width:thin}
.card canvas.mini{display:block;width:100%;height:122px;border-radius:10px;margin:2px 0 12px;background:#080812}
.card p.story{color:#e6e0d6;font-size:15px}
.card details{margin-top:12px}
.card summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);padding:6px 11px;border:1px solid rgba(255,184,107,.4);border-radius:14px}
.card summary::-webkit-details-marker{display:none}
.card summary::after{content:"+";font-size:13px}
.card details[open] summary::after{content:"–"}
.card details[open] summary{margin-bottom:10px}
.card p.more{color:#cfc9c0;font-size:13.5px}
#track i.ch{width:13px;height:13px;left:6px;background:rgba(255,184,107,.7)}
#hud .lab{max-width:70vw}
@media(max-width:760px){.card{transform:translateY(-40%)}.card canvas.mini{height:110px}}

.card .refs{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
.card .refs h4{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.card .refs ol{padding-left:18px;font-size:12px;line-height:1.45;color:#cfc9c0}
.card .refs li{margin-bottom:5px}
.card .refs a{color:var(--ac);text-decoration:none;white-space:nowrap}.card .refs a:hover{text-decoration:underline}

/* ---- v3: track ---- */
#hud,#track,#rb{opacity:0;transition:none}
#track{right:max(8px,1.4vw);top:13vh;height:74vh;width:34px;background:none}
#track::before{left:auto;right:7px;width:1px;background:rgba(255,255,255,.16)}
#track #fill{position:absolute;right:7px;top:0;width:1px;height:0;background:linear-gradient(rgba(255,184,107,.15),rgba(255,184,107,.9));pointer-events:none}
#track i{left:auto;right:7px;width:7px;height:1px;border-radius:0;background:rgba(255,255,255,.3);transform:none;transition:background .2s,width .2s}
#track i::after{content:"";position:absolute;right:-7px;left:-10px;top:-6px;bottom:-6px}
#track i:hover{background:#fff;width:11px;transform:none}
#track i.ch{width:14px;height:1px;left:auto;background:rgba(255,184,107,.85)}
#track i.ch::before{content:attr(data-n);position:absolute;right:19px;top:-5px;font:500 8.5px/1 'JetBrains Mono',monospace;letter-spacing:.08em;color:rgba(255,184,107,.75)}
#track i b{right:26px;background:rgba(6,6,14,.9);border:1px solid rgba(255,255,255,.12);padding:4px 9px;font-size:10px}
#track i.ch b{right:36px}
#track #mk{left:auto;right:3.5px;width:8px;height:8px;border:0;background:#ffb86b;box-shadow:0 0 0 3px rgba(255,184,107,.18),0 0 14px 2px rgba(255,184,107,.7)}
@media(max-width:760px){#track{width:26px}#track i.ch::before{display:none}}
/* ---- v3: intro, cards, references ---- */
#intro h1{font-weight:300;letter-spacing:-.035em}
.card .cos{font:italic 300 16.5px/1.4 Inter,system-ui,sans-serif;color:#f3d8b4;margin:0 0 10px}
.card .cap{margin:-6px 0 10px;font:9.5px/1.3 'JetBrains Mono',monospace;letter-spacing:.04em;color:var(--dim);opacity:.8}
.refbtn{font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);background:rgba(6,6,14,.85);border:1px solid rgba(255,184,107,.45);border-radius:16px;padding:8px 15px;cursor:pointer}
.refbtn:hover{background:rgba(255,184,107,.14)}
#rb{position:fixed;right:max(14px,2vw);bottom:14px;z-index:7}
#endrefs{position:absolute;left:0;right:0;text-align:center;z-index:3}
#refs{position:fixed;inset:0;z-index:20;background:#020207;display:none}
#refs.on{display:block}
.rp{position:absolute;inset:0;display:flex;flex-direction:column;max-width:960px;margin:0 auto}
.rh{display:flex;align-items:baseline;gap:14px;padding:22px 24px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.rh h3{font:300 30px Inter,system-ui,sans-serif}.rh span{font:11px 'JetBrains Mono',monospace;color:var(--dim)}
.rh button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.25);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;line-height:1}
#rscroll{overflow-y:auto;padding:6px 24px 60px;flex:1}
#rbody h4{font:500 12px 'Inter',sans-serif;margin:22px 0 6px;color:#f1ece4}
#rbody h4 span{font:500 9.5px 'JetBrains Mono',monospace;color:var(--ac);border:1px solid rgba(255,184,107,.4);border-radius:9px;padding:1px 6px;margin-right:9px}
#rbody ol{padding-left:20px;font-size:12.5px;line-height:1.5;color:#cfc9c0}#rbody li{margin-bottom:4px}
#rbody a{color:var(--ac);text-decoration:none;white-space:nowrap}#rbody a:hover{text-decoration:underline}
#rbody .rnote{margin-top:30px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;line-height:1.55;color:var(--dim)}

/* ---- v3: modes and map ---- */
#intro{pointer-events:none}
.modes{display:flex;gap:14px;margin-top:38px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
.modes button{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#f1ece4;background:rgba(6,6,14,.6);border:1px solid rgba(255,255,255,.3);border-radius:22px;padding:12px 22px;cursor:pointer}
.modes button:hover{border-color:var(--ac);color:var(--ac)}
.card .nav{display:none;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.map .card .nav{display:flex}
.nav button,.nav a.b{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);border:1px solid rgba(255,184,107,.5);background:none;border-radius:14px;padding:6px 12px;cursor:pointer;text-decoration:none}
.nav .s{background:var(--ac);color:#050510}.nav .s2{border-color:#58c7b8;color:#58c7b8}
.map .card{display:none}
.map .card.mc{display:block;position:fixed;top:calc(50% - 40px)!important;transform:translateY(-50%);max-height:calc(100vh - 320px)}
.map #track,.map #endrefs,.map #intro{display:none}
#mapbar{position:fixed;left:0;right:0;bottom:0;height:190px;z-index:6;display:none;overflow:hidden;background:linear-gradient(transparent,rgba(2,2,7,.94) 45%)}
.map #mapbar{display:block}
#mapin{position:absolute;top:0;left:0;height:190px;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
#mexit{position:fixed;top:14px;right:16px;z-index:8;display:none}
.map #mexit{display:block}
.map #rb{bottom:auto;top:58px}.map #hud2{bottom:196px}
@media(max-width:760px){.map .card.mc{top:calc(50% - 30px)!important;max-height:calc(100vh - 380px);transform:translateY(-45%)}.map #hud2{display:none}}

/* polish */
.card h2{font-weight:300;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.card .cos{font-size:18px;line-height:1.38;letter-spacing:-.005em}
.card p.story{font-size:15px;line-height:1.68}
.card canvas.mini{border:1px solid rgba(255,255,255,.07)}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card.on>*{animation:cin .6s cubic-bezier(.2,.7,.2,1) both}
.card.on>*:nth-child(2){animation-delay:.05s}.card.on>*:nth-child(3){animation-delay:.1s}.card.on>*:nth-child(4){animation-delay:.15s}.card.on>*:nth-child(5){animation-delay:.2s}.card.on>*:nth-child(6){animation-delay:.25s}.card.on>*:nth-child(n+7){animation-delay:.3s}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.022;background-size:128px}
#mleg{position:fixed;left:16px;bottom:172px;z-index:7;display:none;gap:12px;font:500 9px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#b9b2a8;pointer-events:none}
.map #mleg{display:flex}#mleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pl{stroke-dasharray:2 14;animation:dash 1.3s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
@media(prefers-reduced-motion:reduce){.pl{animation:none}.card.on>*{animation:none}}
@media(max-width:760px){#mleg{display:none!important}}

const CC = 299792458, MPC = 3.0856776e19, YR = 3.15576e7, H0s = H0 / MPC;

const LINES={
'Inflation':'Before there was a “before”, a patch of space smaller than any atom began to swell.',
'The fireball':'Everything that would ever be was packed into a fire without edges.',
'Why anything exists':'For every billion pairs of particles, one was left over. We are made of the leftovers.',
'The Higgs field switches on':'An invisible sea settles, and the particles learn what it is to weigh something.',
'Quarks lock together':'The quarks, once free, are bound for ever into the stuff of atoms.',
'The neutrinos escape':'The most elusive of all particles slips away, and is still passing through you now.',
'A nuclear reactor the size of the universe':'For a few minutes the whole cosmos is a star, and it writes the first lines of the periodic table.',
'Matter takes the lead':'Light, which ruled the early universe, quietly hands the reins to gravity.',
'The universe becomes transparent':'The fog clears. The first light that can travel is on its way, and it is still arriving.',
'The afterglow':'The oldest photograph of the universe, taken long before there were eyes to see it.',
'The Dark Ages':'Darkness falls on the cosmos. In the dark, gravity is patiently at work.',
'The first stars':'Somewhere in the dark a cloud of hydrogen collapses, and the first lamps are lit.',
'The first elements':'The first stars die, and from their ashes come the raw materials of worlds.',
'The earliest galaxy we have seen':'With the Webb telescope we look back across almost fourteen billion years, and find that the dawn was bright.',
'The fog lifts again':'Starlight clears the cosmic haze, and the universe becomes transparent a second time.',
'Monsters in the dark':'At the hearts of young galaxies, black holes feed, and outshine the stars around them.',
'Our Galaxy takes shape':'Small islands of stars merge, and merge again, and a great spiral begins to turn.',
'Cosmic noon':'At the height of cosmic noon, stars are being born about ten times faster than today.',
'The universe speeds up':'Something unknown is pushing space apart. We call it dark energy, and we do not know what it is.',
'A cloud becomes a star':'A cold cloud trembles, and begins to fall inward. We are on our way.',
'Building worlds':'Dust clings to dust. Grains become pebbles, pebbles become boulders, boulders become worlds.',
'A world hit by a world':'Early in its life our planet was struck by another, and the splash became the Moon.',
'Oceans':'Water gathers on the young Earth, and a blue world takes shape.',
'A wetter Mars':'Next door, there may once have been rivers and lakes. What happened to them?',
'Life':'In some warm, wet place, chemistry crossed a line and became biology.',
'The air turns to oxygen':'A humble microbe changes the sky, and with it the fate of the planet.',
'Cells with a nucleus':'One cell takes in another, and neither is ever alone again.',
'Snowball Earth':'Ice reaches toward the equator, and the planet holds its breath.',
'The first animals':'In a quiet sea, the first creatures that move, feel and eat.',
'The Cambrian explosion':'In a geological instant, the body plans of nearly all animals are sketched.',
'Life turns the land green':'Life steps out of the water onto bare rock, and begins to make soil.',
'Ice, then a first mass extinction':'Life is not a story of unbroken progress. Sometimes the book is almost closed.',
'Fish learn to walk':'A fish props itself up on its fins. Every step you will ever take began here.',
'The coal forests':'Forests bury their sunlight in the ground. Hundreds of millions of years later, we burn it.',
'The Great Dying':'The closest that life has ever come to ending on Earth.',
'Dinosaurs and the first mammals':'Beneath the feet of giants, small warm creatures wait for their turn.',
'Giants and the first birds':'The sky acquires a new tenant.',
'Flowers':'Colour arrives on land, and with it a bargain between plants and insects.',
'A bad day for the dinosaurs':'A mountain falls out of the sky, and the world changes in an afternoon.',
'Mammals take over':'The small survivors inherit the Earth, and begin, in time, to wonder.',
'The ice ages':'The ice advances and retreats, and in its shadow a clever ape learns to make fire.',
'People':'At last, a creature that looks up at the lights in the sky and asks what they are.',
'Fields, cities, a billion people':'In the blink of a cosmic eye, we filled a world with fields and cities.',
'Today':'This is the moment in which you are reading: a small world, an ordinary star, a universe still unfolding.',
'The next supercontinent':'The continents will drift together again. The map on your wall is only a snapshot.',
'The air runs out':'The Sun brightens a little each age, and the air that gave us life is lost.',
'The Sun swells':'Our star grows old, and swells to fill the sky.',
'The end of Earth':'In its last act, the Sun may reach out and take back the world it warmed.',
'A white dwarf':'What remains of the Sun is the size of the Earth, and will glow for longer than the universe has yet existed.',
'Our galaxy meets Andromeda':'Two great islands of stars pass through each other, and almost no stars collide.',
'The web freezes':'The cosmic web stops growing. The structures we see are all we will ever have.',
'One galaxy left':'The universe grows lonely: beyond our merged galaxy, the others recede into darkness.'

{c:0,t:1e-34,when:'10⁻³⁶ – 10⁻³² seconds',tag:'hypothesis',title:'Inflation',anim:'expand',
 story:'Before stars, atoms or even light as we know it, there was a patch of space far smaller than a proton. In a sliver of a second it was stretched by a factor of at least a hundred trillion trillion, faster than anything has grown since.',
 more:'In the leading picture a quantum field, the inflaton, holds a huge and nearly constant energy density, and space expands exponentially, a ∝ e^(Ht). Around 60 e-foldings would explain why the universe is so flat and so uniform on large scales. Quantum fluctuations of the field are stretched to macroscopic sizes and later become the density differences that grow into galaxies. Their near scale-invariance, n_s = 0.9649 ± 0.0042, is one of inflation’s best-tested predictions, but the energy scale and the timing are model-dependent and inflation itself is not proven.',
 facts:[['Stretch','≳ 60 e-folds (~10²⁶)'],['Spectral index n_s','0.9649 ± 0.0042'],['Status','hypothesis']],src:'Guth (1981); Linde (1982); Planck Collaboration (2020), Table 2.'},
{c:0,t:1e-32,when:'~10⁻³² seconds',tag:'theory',title:'The fireball',anim:'burst',

{c:0,t:1e-8,when:'time unknown (before ~10⁻⁵ s)',tag:'open question',title:'Why anything exists',anim:'asym',

 facts:[['Baryon-to-photon ratio','≈ 6.1×10⁻¹⁰ (derived)'],['Mechanism','unknown']],src:'Ω_b h² from Planck Collaboration (2020), Table 2; conditions from Sakharov (1967). η = n_b/n_γ with n_γ = 411 cm⁻³ at 2.7255 K (derived here).'},
{c:0,t:9.2e-12,when:'~10⁻¹¹ seconds',tag:'lattice',title:'The Higgs field switches on',anim:'higgs',

 facts:[['Crossover T','159.5 ± 1.5 GeV'],['Temperature','≈ 1.9×10¹⁵ K']],src:'D’Onofrio & Rummukainen (2016, Phys. Rev. D 93, 025003), lattice result. Time from t ≈ 2.42 g*⁻¹ᐟ² (T/MeV)⁻² s with g* = 106.75.'},
{c:0,t:1.26e-5,when:'~10 microseconds',tag:'lattice',title:'Quarks lock together',anim:'qcd',
 story:'For ten millionths of a second the universe was a soup of free quarks and gluons at about two trillion degrees. Then it cooled enough for them to clump in threes. Every proton and neutron in the observable universe formed within this instant, and no quark has been seen alone since.',

{c:0,t:1,when:'about 1 second',tag:'',title:'The neutrinos escape',anim:'weak',
 story:'After a second the universe is so thin that neutrinos, the most elusive particles we know, stop colliding with anything and fly free. They still fill space today. At the same moment, the reactions that turned neutrons into protons freeze, which fixes the recipe for the helium to come.',
 more:'At T ≈ 0.8 MeV the weak interactions that interconvert neutrons and protons fall out of equilibrium and the neutron-to-proton ratio freezes. It then keeps dropping because free neutrons decay, with a mean life of 878.3 ± 0.4 s. This ratio sets how much helium-4 can be made.',

{c:0,t:600,when:'3 to 20 minutes',tag:'',title:'A nuclear reactor the size of the universe',anim:'fuse',

 more:'Deuterium survives photodissociation only when T < ~80 keV, which opens the “deuterium bottleneck”; after that helium-4, with traces of deuterium, helium-3 and lithium-7, is built in minutes. Nuclear reactions freeze by about 20 minutes (T < ~30 keV). The predicted lithium-7 is roughly three times higher than measured in old stars, which is the “lithium problem”.',

{c:1,z:3402,when:'51,000 years · z = 3402 ± 26',tag:'Planck',title:'Matter takes the lead',anim:'balance',

{c:1,z:1089.92,when:'371,000 years · z = 1089.92 ± 0.25',tag:'Planck',title:'The universe becomes transparent',anim:'recomb',

{c:1,z:1040,when:'about 390,000 years',tag:'',title:'The afterglow',anim:'cmbmap',

{c:2,id:'dark',z:150,when:'0.4 to about 100 million years',tag:'',title:'The Dark Ages',anim:'redshift',
 story:'Now there was light, but no source of it. The glow of the Big Bang faded from orange to red to invisible infrared, and the universe went dark. In the darkness gravity worked slowly, pulling matter into a cosmic web of filaments, held together by dark matter, a substance five times more abundant than everything we can see.',
 more:'With Ω_c h² = 0.1200 and Ω_b h² = 0.02237, dark matter outweighs ordinary matter by about 5.4 to 1. Density differences of one part in 100,000 grow under gravity into the first dark-matter halos of around a million solar masses, the minihalos that will host the first stars.',

{c:2,z:20,when:'about 180 million years',tag:'standard theory',title:'The first elements',anim:'supernova',
 story:'The first stars lived fast and died in explosions that scattered carbon, oxygen, iron and other elements into space for the first time. Everything in your body heavier than helium was built in stars and thrown out like this. We are, in a very literal sense, star stuff.',
 more:'Massive stars end their lives as supernovae, enriching the gas with “metals”. The next generation of stars forms from enriched gas. The faint remnants of this first enrichment survive as chemical fingerprints in the most metal-poor stars of the Milky Way.',
 facts:[['Made in the first stars','C, O, Mg, Si, Fe …'],['Fingerprints','in the most metal-poor stars']],src:'Standard stellar nucleosynthesis; see Bromm (2013) and the Atomarium page.'},
{c:2,z:14.44,when:'about 280 million years · z = 14.44',tag:'JWST',title:'The earliest galaxy we have seen',anim:'firstgal',
 story:'The James Webb Space Telescope can see galaxies as they were less than 300 million years after the Big Bang. The most distant one confirmed so far, MoM-z14, is more compact and brighter than many models predicted.',
 more:'MoM-z14 was confirmed spectroscopically at z = 14.44. Its light has travelled for about 13.5 billion years and been stretched by a factor of 15.4, so ultraviolet light reaches us as infrared. Finding so many luminous galaxies this early is one of Webb’s surprises.',
 facts:[['Redshift','14.44'],['Cosmic age','≈ 282 Myr']],src:'JWST MoM survey (as reported by Universe Today, 2025). Cosmic age computed with Planck 2018 parameters.'},
{c:2,z:7.67,when:'about 670 million years · z ≈ 7.7',tag:'Planck',title:'The fog lifts again',anim:'bubbles',
 story:'The new stars and galaxies flooded space with ultraviolet light, tearing electrons from the hydrogen around them. Bubbles of ionised gas grew and merged until the whole universe was transparent to ultraviolet light, as it is today.',
 more:'Reionisation redshift z_re = 7.67 ± 0.73 in the simple tanh model, and an optical depth τ = 0.0544 ± 0.0073 for the CMB photons that scatter off the freed electrons. Less than ~1% of the stars in the universe formed during this era.',
 facts:[['Midpoint z','7.67 ± 0.73'],['Optical depth τ','0.0544 ± 0.0073']],src:'Planck Collaboration (2020), Table 2; Madau & Dickinson (2014).'},
{c:2,z:7.64,when:'670 million years · z = 7.64',tag:'Keck / Gemini',title:'Monsters in the dark',anim:'bh',
 story:'Already at 670 million years there were black holes with a billion times the mass of the Sun, lighting up the gas around them as quasars. How did they grow so big so fast? That is one of the open puzzles of the early universe.',
 more:'The quasar J0313−1806 at z = 7.64 is powered by a black hole of more than 1.6 billion solar masses. Seeds from the first stars, or direct collapse of gas clouds, with fast growth, are the main candidate routes.',
 facts:[['Quasar','J0313−1806'],['Redshift','7.64'],['Black-hole mass','> 1.6×10⁹ M☉']],src:'Keck Observatory press release on the earliest quasar (2021).'},
{c:3,t:0.8*GYR,when:'0.8 billion years',tag:'Gaia + LAMOST',title:'Our Galaxy takes shape',anim:'galaxy',
 story:'Even this early the Milky Way was assembling. Stars in its thick disc began forming around 13 billion years ago. Soon after, it swallowed a smaller galaxy, called Gaia-Sausage-Enceladus, which triggered a burst of new stars.',
 more:'Ages of stars measured by combining Gaia and LAMOST data place the formation of the thick disc about 0.8 billion years after the Big Bang. It continued forming stars until its gas ran out about 6 billion years after the Big Bang.',
 facts:[['Thick disc starts','≈ 0.8 Gyr after BB'],['Thick disc ends','≈ 6 Gyr after BB']],src:'Xiang & Rix (2022, Nature, doi:10.1038/s41586-022-04496-5), as reported by Interesting Engineering.'},
{c:3,z:1.9,when:'3.5 billion years · z ≈ 1.9',tag:'',title:'Cosmic noon',anim:'sfr',
 story:'This was the busiest era in the history of the universe: galaxies were forming stars at about ten times today’s rate. Roughly half of all the stars that exist today had formed by z = 1.3, and the rate has been declining ever since.',
 more:'The cosmic star-formation rate density peaked about 3.5 billion years after the Big Bang, at z ≈ 1.9, and has declined exponentially since with an e-folding time of 3.9 billion years. About 25% of today’s stellar mass formed before the peak and another 25% after z = 0.7.',
 facts:[['Peak','z ≈ 1.9'],['e-folding decline','3.9 Gyr'],['Half the stars by','z = 1.3']],src:'Madau & Dickinson (2014, ARA&A 52, 415; arXiv:1403.0007).'},
{c:3,z:.63,id:'acc',when:'7.7 billion years · z ≈ 0.63',tag:'Planck',title:'The universe speeds up',anim:'accel',
 story:'For billions of years gravity slowed the expansion. But as matter thinned out, a mysterious dark energy, which does not thin out, took over. At about 7.7 billion years the expansion began to accelerate, and it still does.',
 more:'In flat ΛCDM with Ω_m = 0.3153 and Ω_Λ = 0.6847, acceleration starts at z ≈ 0.63, and dark energy exceeds matter in density from z ≈ 0.29, about 3.5 billion years ago. The nature of dark energy is unknown.',
 facts:[['Acceleration starts','z ≈ 0.63'],['ρΛ = ρm','z ≈ 0.29'],['Ω_Λ','0.6847 ± 0.0073']],src:'Computed for flat ΛCDM with Planck Collaboration (2020), Table 2 (radiation neglected).'},
{c:4,t:AGO(4.567),when:'4.57 billion years ago',tag:'',title:'A cloud becomes a star',scene:'collapse',anim:'collapse',
 story:'In an ordinary spiral galaxy, a cold cloud of gas and dust began to collapse under its own weight. As it fell inward it spun faster, flattened into a disc, and in the middle grew hot enough to ignite hydrogen fusion. That star was our Sun.',
 more:'The age of the Solar System is dated from the oldest solids in meteorites, calcium–aluminium-rich inclusions, using the decay of uranium to lead. Conservation of angular momentum flattens the collapsing cloud into a protoplanetary disc, with most of the mass in the central protostar.',
 facts:[['Cosmic age then','≈ 9.2 Gyr'],['Dated from','meteoritic CAIs (Pb–Pb)']],src:'Connelly et al. (2012, Science 338, 651); not re-fetched here.'},
{c:4,t:AGO(4.5665),when:'the first few million years',tag:'hypothesis',title:'Building worlds',scene:'disc',anim:'disc',
 story:'In the disc, dust grains stuck together into pebbles, pebbles into boulders, and boulders into planets. The giant planets grew quickly while gas was still around. One idea, the Grand Tack, says Jupiter first moved inward and then back out, which may be why Mars is so small.',
 more:'Gas discs last roughly 1–10 million years. In the Grand Tack scenario Jupiter migrates inward as far as about 1.5 AU, truncating the disc near 1 AU, and then outward, which reproduces Mars’s small mass and the structure of the asteroid belt in simulations. It is a published hypothesis, not an established fact.',
 facts:[['Gas disc lifetime','~1–10 Myr'],['Grand Tack','hypothesis (Walsh et al. 2011)']],src:'Walsh et al. (2011, Nature), summarised by K. Walsh (SwRI).'},
{c:5,t:AGO(4.5),when:'about 4.5 billion years ago',tag:'hypothesis',title:'A world hit by a world',scene:'impact',anim:'impact',
 story:'The young Earth was a ball of molten rock. Then, according to the leading theory, a planet about the size of Mars struck it a glancing blow. The debris thrown into orbit gathered into the Moon.',
 more:'The giant-impact hypothesis says that a Mars-sized body, called Theia, hit the proto-Earth early in the Hadean eon. The exact date is still debated. The impact would have melted much of the Earth and left a magma ocean.',
 facts:[['Date','early Hadean (debated)'],['Impactor','Mars-sized (hypothesis)']],src:'Giant-impact hypothesis; Hadean eon summary (Wikipedia).'},
{c:5,t:AGO(4.4),when:'4.4 billion years ago',tag:'zircon',title:'Oceans',scene:'earth:ocean',anim:'geobar',
 story:'As the molten surface cooled, rain fell for the first time and the first oceans formed. The evidence is a handful of tiny zircon crystals from Western Australia, some 4.4 billion years old, which formed in the presence of liquid water.',
 more:'The oldest dated zircon from the Jack Hills is about 4.404 billion years old. Studies of such crystals suggest that liquid water may have existed between 4.0 and 4.4 billion years ago, even though the surface was very hot, because water stays liquid under a thick atmosphere.',
 facts:[['Oldest zircon','4.404 Gyr'],['Liquid water','4.0–4.4 Gyr ago']],src:'Hadean eon (Wikipedia); Wilde et al. (2001) for the original zircon result.'},
{c:5,t:AGO(4.0),when:'about 4 billion years ago',tag:'',title:'A wetter Mars',scene:'mars:wet',anim:'geobar',
 story:'Our neighbour Mars was once warmer and wetter, with rivers and lakes. Then it lost most of its atmosphere to space, its water vanished, and it froze into the red desert we see now. It is a warning of how fragile a habitable world can be.',
 more:'About four billion years ago Mars was far wetter and more hospitable. The loss of its atmosphere took place somewhere around 3.5 to 3.7 billion years ago. NASA’s MAVEN mission is studying how the atmosphere escaped, but the driver of the change is not settled.',
 facts:[['Wet Mars','~4 Gyr ago'],['Atmosphere lost','3.5–3.7 Gyr ago']],src:'MAVEN science summaries (as reported by Universe Today).'},
{c:5,t:AGO(3.48),when:'at least 3.48 billion years ago',tag:'debated',title:'Life',scene:'earth:life',anim:'life',
 story:'Somewhere in the oceans, chemistry began to copy itself. The oldest widely accepted traces are layered mounds built by microbes, the stromatolites of Western Australia. Older claims reach as far back as 4.1 billion years, but remain debated.',
 more:'Stromatolites in the Dresser Formation date to about 3.48 billion years. Some argue for signs of life back to 3.8 billion years, and possibly 4.1 billion years in zircons, but these are interpretations. The timing of the origin of life is unknown.',
 facts:[['Oldest widely accepted','≈ 3.48 Gyr'],['Contested older claims','3.7 – 4.3 Gyr']],src:'Hickman-Lewis et al. (2022), reported by Live Science; Catling & Zahnle review (arXiv:1803.05967).'},
{c:5,t:AGO(2.4),when:'2.3 – 2.4 billion years ago',tag:'',title:'The air turns to oxygen',scene:'earth:goe',anim:'oxygen',
 story:'Microbes that use sunlight to split water began releasing oxygen as waste. Over millions of years it built up in the air, an event that poisoned much of the life then alive and made possible, in the long run, creatures that breathe.',
 more:'The Great Oxidation Event, the first sustained rise of atmospheric O₂, is dated to about 2.3–2.4 billion years ago. Near-modern oxygen levels were probably not reached until the late Neoproterozoic or later.',
 facts:[['Great Oxidation','2.3 – 2.4 Gyr ago'],['Modern O₂ levels','< ~0.54 Gyr ago (probably)']],src:'Catling & Zahnle (2018), arXiv:1803.05967; Lyons et al. (2014, Nature).'},
{c:5,t:AGO(.717),when:'717 to 635 million years ago',tag:'',title:'Snowball Earth',scene:'earth:snow',anim:'geobar',
 story:'Twice, the whole planet froze, with ice reaching the equator. The first deep freeze lasted around 57 million years. Life survived in cracks, around volcanoes and under the ice, and when the ice finally melted, complex life was ready to explode.',
 more:'The Sturtian glaciation lasted about 717–660 million years ago and the Marinoan about 650–635 million years ago. Glacial deposits and dropstones are found at low palaeolatitudes. Whether the ocean was fully frozen (“snowball”) or partly open (“slushball”) is debated.',
 facts:[['Sturtian','717 – 660 Ma'],['Marinoan','650 – 635 Ma']],src:'Fossil Guy: Snowball Earth summary of Cryogenian dates.'},
{c:5,t:AGO(1.6),when:'about 1.8 – 1.2 billion years ago',tag:'debated',title:'Cells with a nucleus',scene:'earth:goe',anim:'endo',
 story:'For two billion years life was made of simple cells with no nucleus. Then one cell swallowed another and, instead of digesting it, kept it. The guest became the mitochondrion, the power plant inside every cell of your body, and a new kind of cell with a nucleus was born: the eukaryote, ancestor of all animals, plants and fungi.',
 more:'Eukaryotes combine an archaeal host with a bacterial endosymbiont. A molecular-clock study that combines genomes with fossils puts the crown group of eukaryotes at less than 1.84 billion years ago (a 1.84 to 1.21 billion-year interval) and the mitochondrial symbiosis between 2.05 and 1.21 billion years ago. Lane and Martin argue that mitochondria made large genomes energetically affordable, which is what opened the way to complex life.',
 facts:[['Crown eukaryotes','< 1.84 Ga (1.84 – 1.21)'],['Mitochondrial symbiosis','2.05 – 1.21 Ga'],['Status','dates model-dependent']]},
{c:6,t:AGO(.575),when:'about 575 million years ago',tag:'',title:'The first animals',scene:'earth:cambrian',anim:'ediac',
 story:'After the great thaw the seas held a strange garden: quilted fronds, discs and ribbons up to a metre long, rooted to the sea floor. They had no eyes, no shells and no mouths we can easily recognise. These soft-bodied Ediacaran creatures include some of the first animals.',
 more:'The Ediacaran Period runs from about 635 to 538.8 million years ago, and the oldest large assemblages, such as those in Newfoundland, are about 574 million years old. Which Ediacaran forms were animals, and how they relate to later groups, is still debated. Unambiguous modern body plans become common only in the Cambrian.',
 facts:[['Ediacaran Period','635 – 538.8 Ma'],['Oldest large assemblages','~574 Ma']]},
{c:6,t:AGO(.5388),when:'538.8 million years ago',tag:'',title:'The Cambrian explosion',scene:'earth:cambrian',anim:'geobar',
 story:'Within a few tens of millions of years the seas filled with animals: trilobites, worms, sponges and the first relatives of the fish. Eyes appeared, and with them the first predators and the first arms race.',
 more:'The Cambrian began 538.8 ± 0.6 million years ago. It brought the first representatives of most modern animal groups, including arthropods, molluscs, annelids and our own distant stem-chordate relatives such as Pikaia. Whether the burst was truly rapid, or a long fuse made visible by new skeletons and better fossilisation, is part of what is called the Cambrian conundrum.',
 facts:[['Cambrian starts','538.8 ± 0.6 Ma'],['Our relatives','Pikaia (stem chordate)']]},
{c:6,t:AGO(.47),when:'about 470 million years ago',tag:'',title:'Life turns the land green',scene:'earth:moss',anim:'geobar',
 story:'For most of Earth’s history the continents were bare rock, with at most a film of microbes. About 470 million years ago the first plants crept ashore: tiny, low and moss-like, surviving at the edge of the water. They began the slow work of turning rock into soil.',
 more:'The oldest land-plant spores are about 470 million years old (Middle Ordovician). Molecular clocks that use fossils to calibrate the plant tree place the origin of the land-plant lineage somewhat earlier, in the Cambrian to Ordovician, with large uncertainty.',
 facts:[['First spores','~470 Ma'],['Molecular-clock origin','~515 – 470 Ma']]},
{c:6,t:AGO(.445),when:'about 445 million years ago',tag:'',title:'Ice, then a first mass extinction',scene:'earth:ordov',anim:'extinct',mk:445,
 story:'Ice sheets grew across the southern supercontinent, locking up water and dropping the sea level. The seas cooled, then rose again as the ice melted. In two pulses, about 85 per cent of marine species disappeared. It was the first of the five great mass extinctions.',
 more:'The Late Ordovician (Hirnantian) mass extinction, around 445 million years ago, coincides with a short but intense glaciation centred on Gondwana. It is the second-largest of the “Big Five” by the fraction of marine genera lost, and it took place at sea, since there were no land animals yet.',
 facts:[['Date','~445 Ma'],['Marine species lost','~85%'],['Cause','glaciation, sea-level change']]},
{c:6,t:AGO(.375),when:'about 375 million years ago',tag:'',title:'Fish learn to walk',scene:'earth:devon',anim:'tetra',
 story:'In a shallow Devonian stream lived Tiktaalik, a fish with a flat head, a neck, and fins with wrist-like bones. It could prop itself up in the shallows. From animals like it came every four-legged vertebrate, including you. On the banks the first forests were already growing.',
 more:'Tiktaalik roseae, found on Ellesmere Island in Arctic Canada, lived about 375 million years ago and mixes fish and tetrapod features: a mobile neck, a flattened skull and a pectoral fin with the beginnings of a wrist. The oldest known forest, at Gilboa in New York, is of tree-sized cladoxylopsids around 385 million years old.',
 facts:[['Tiktaalik','~375 Ma'],['Oldest known forest','~385 Ma (Gilboa)']]},
{c:6,t:AGO(.31),when:'about 310 million years ago',tag:'',title:'The coal forests',scene:'earth:carbon',anim:'coal',
 story:'Giant club-moss trees more than thirty metres tall grew in warm, wet swamps. When they died they sank into the water and were buried before they could fully rot. Their remains became the coal we burn today. Dragonfly-like insects had wings nearly 70 centimetres across, and models suggest the air held more oxygen than ours.',
 more:'Carboniferous coal swamps were dominated by lycopsid trees such as Lepidodendron. Models of the atmosphere give an oxygen peak of roughly 30 per cent or more around the Carboniferous–Permian, but the numbers are model-dependent and debated. An old idea that trees appeared before microbes able to digest wood explains the coal has been challenged by later work on fungal evolution.',
 facts:[['Carboniferous','359 – 299 Ma'],['Oxygen (model)','up to ~30%, uncertain']]},
{c:6,t:AGO(.2519),when:'about 251.9 million years ago',tag:'',title:'The Great Dying',scene:'earth:permian',anim:'extinct',mk:252,
 story:'Siberian volcanoes poured out lava and gas for hundreds of thousands of years. The air warmed, the oceans became acidic and starved of oxygen. It was the worst crisis in the history of life: about four out of five marine species vanished (older estimates say up to 96 per cent), together with roughly 70 per cent of land vertebrate species.',
 more:'High-precision uranium–lead dating puts the end-Permian extinction at 251.902 ± 0.024 million years ago, with an extinction interval of only 60 ± 48 thousand years. The Siberian Traps large igneous province is the leading suspect. Estimates of the fraction of marine species lost range from about 81 per cent to 96 per cent, the largest of the Big Five. Proxy records show a strong warming, of order 8 °C, and carbon dioxide rising from roughly 400 to 2,500 ppm.',
 facts:[['Date','251.902 ± 0.024 Ma'],['Extinction interval','60 ± 48 kyr'],['Marine species lost','~80 – 90%']]},
{c:6,t:AGO(.231),when:'about 230 million years ago',tag:'',title:'Dinosaurs and the first mammals',scene:'earth:triassic',anim:'drift',mk:230,
 story:'In the recovery, a new group of reptiles, small, fast and walking on two legs, appeared in the southern lands of the supercontinent Pangaea. They were the first dinosaurs. At about the same time came shrew-sized, furry animals, the first mammals, who lived in their shadow for well over a hundred million years.',
 more:'Eodromaeus and Eoraptor, from the Ischigualasto Formation in Argentina, are among the oldest known dinosaurs, about 230 million years old. Early dinosaurs were a minor part of faunas until the end-Triassic extinction, around 201 million years ago, opened the field. Mammaliaforms, close relatives of true mammals, appear in the Late Triassic and Jurassic.',
 facts:[['Oldest dinosaurs','~230 Ma (Argentina)'],['End-Triassic extinction','~201 Ma']]},
{c:6,t:AGO(.15),when:'about 150 million years ago',tag:'',title:'Giants and the first birds',scene:'earth:jurassic',anim:'drift',mk:150,
 story:'Pangaea was splitting and a new Atlantic was opening. Warm shallow seas flooded the land. Long-necked sauropods, the largest animals ever to walk on land, browsed the treetops. In a lagoon in what is now Bavaria, a feathered, toothed, long-tailed creature fell into the mud: Archaeopteryx, a dinosaur that could fly.',
 more:'The Jurassic runs from about 201 to 145 million years ago. Archaeopteryx, from the Solnhofen Limestone of Germany, is about 150 million years old. Birds are living dinosaurs, descended from small feathered theropods. Sauropod gigantism relied on a bird-like air-sac lung system, fast growth and light, air-filled bones.',
 facts:[['Jurassic','201 – 145 Ma'],['Archaeopteryx','~150 Ma (Solnhofen)']]},
{c:6,t:AGO(.125),when:'about 125 million years ago',tag:'',title:'Flowers',scene:'earth:cret',anim:'flower',
 story:'Until then the land was green but colourless, covered in ferns, conifers and cycads. Then plants invented the flower: seeds wrapped in a fruit, and showy petals to hire insects as couriers. Within a few tens of millions of years flowering plants had taken over most of the world.',
 more:'Unambiguous flowering-plant fossils (first pollen, then flowers) appear in the Early Cretaceous, roughly 135 to 125 million years ago, whereas molecular clocks put the origin earlier, with large uncertainty. The rise of flowering plants went hand in hand with the diversification of insects, birds and mammals.',
 facts:[['Earliest fossils','~135 – 125 Ma'],['Molecular-clock origin','earlier, debated']]},
{c:6,t:AGO(.066),when:'66 million years ago',tag:'',title:'A bad day for the dinosaurs',scene:'kpg',anim:'extinct',mk:66,
 story:'An asteroid more than ten kilometres wide hit what is now Mexico and dug a crater some 200 kilometres across. Dust and fire darkened the sky. The impact helped end the reign of the dinosaurs, except for the birds, and opened the world to mammals.',
 more:'The Cretaceous–Paleogene boundary is dated to about 66.04 million years ago. Evidence supports a bolide impact as the main driver of the extinction, with Deccan volcanism possibly shaping the climate and the recovery. Around three-quarters of species were lost.',
 facts:[['Date','≈ 66.04 ± 0.01 Ma'],['Crater','~200 km (Chicxulub)'],['Impactor','> 10 km']]},
{c:6,t:AGO(.056),when:'about 56 million years ago',tag:'',title:'Mammals take over',scene:'earth:hothouse',anim:'temp',mk:56,
 story:'With the dinosaurs gone, mammals grew from the size of a rat to that of a horse or a whale in a few million years. Then, 56 million years ago, the Earth caught a fever: carbon released into the air warmed the planet by several degrees, and palm trees grew near the poles. Primates appeared around then, and our long line began.',
 more:'The Paleocene–Eocene Thermal Maximum, about 56 million years ago, warmed the planet by roughly 5 to 8 degrees Celsius in a few tens of thousands of years. Through the rest of the Cenozoic the deep ocean cooled, with a major step about 34 million years ago when the Antarctic ice sheet formed. In the chart, the three early points are reconstructions of global mean surface temperature from proxies (with 66 per cent intervals), not a continuous curve.',
 facts:[['PETM','~56 Ma'],['Warming','~5 – 8 °C'],['Antarctic ice sheet','~34 Ma']]},
{c:6,t:AGO(.00258),when:'from 2.58 million years ago',tag:'',title:'The ice ages',scene:'earth:iceage',anim:'temp',mk:2.58,
 story:'Slowly the world cooled. Ice sheets grew over Canada and Scandinavia and melted again, on a rhythm set by small wobbles in Earth’s orbit and tilt. Our ancestors evolved in this shifting climate: they made tools, tamed fire, and grew bigger brains.',
 more:'The Quaternary Period begins at 2.58 million years ago. Its glacial cycles are paced by orbital changes (Milankovitch cycles), with a period of about 41,000 years until roughly a million years ago and about 100,000 years since. At the Last Glacial Maximum, about 21,000 years ago, the global mean surface temperature was about 6.1 °C (5.7 to 6.5) colder than before the industrial era.',
 facts:[['Quaternary starts','2.58 Ma'],['Cycles','41 kyr, then ~100 kyr']]},
{c:6,t:AGO(.000315),when:'about 315,000 years ago',tag:'',title:'People',scene:'earth:preind',anim:'geobar',
 story:'In a cave in Morocco lived people with faces like ours. At about 315,000 years old, the Jebel Irhoud fossils are the oldest remains attributed to our species, Homo sapiens, though experts still discuss exactly where to draw the line.',
 more:'Two dating methods give 280,000 to 350,000 years for the Jebel Irhoud fossils. Most researchers had placed our origin in East Africa about 200,000 years ago. Ancient genomes from southern Africa put the deepest divergence among living human populations between 350,000 and 260,000 years ago. Not all experts agree that the Irhoud fossils are Homo sapiens.',
 facts:[['Age','≈ 315,000 years'],['Uncertainty','280,000 – 350,000'],['Genetic divergence','350 – 260 ka']]},
{c:6,t:AGO(.0000117),when:'from 11,700 years ago',tag:'',title:'Fields, cities, a billion people',scene:'earth:preind',anim:'pop',
 story:'The ice retreated. Within a few thousand years, in several places at once, people began to plant seeds and keep animals: wheat and sheep in the Fertile Crescent, rice in China, maize in Mexico. Villages became cities, cities became empires, and the number of people on Earth rose from a few million to eight billion.',
 more:'The Holocene begins 11,700 years before the year 2000. Domestication of plants and animals in the Near East starts around the beginning of the Holocene. Reconstructions of population (HYDE) give a few million people at 10,000 BCE, about a billion near 1800 and several billion by today. The numbers are approximate.',
 facts:[['Holocene starts','11,700 years ago'],['Population','a few million → ~8 billion']]},
{c:6,t:T_NOW,when:'13.8 billion years',tag:'now',title:'Today',scene:'earth:now',anim:'cmbmap',
 story:'Here we are. A universe 13.8 billion years old, with an observable part 46 billion light-years in radius, containing somewhere between a few hundred billion and two trillion galaxies, and on one small planet a species that has worked out how all of this happened.',
 more:'Age 13.797 ± 0.023 Gyr, H₀ = 67.36 ± 0.54 km/s/Mpc from the CMB. The local distance ladder gives a higher value, about 73 km/s/Mpc, an unresolved disagreement called the Hubble tension. The particle horizon is about 46 billion light-years. The number of galaxies depends on how many faint ones are counted.',
 facts:[['Age','13.797 ± 0.023 Gyr'],['H₀ (CMB)','67.36 ± 0.54'],['Horizon radius','≈ 46 Gly']]},
{c:7,t:FUT(.25),when:'about 250 million years from now',tag:'prediction',title:'The next supercontinent',scene:'earth:ultima',anim:'drift',mk:-250,
 story:'The continents drift at about the speed at which fingernails grow, and in some 250 million years they will gather again into a single supercontinent, nicknamed Pangea Ultima. The Sun will be about 2.5 per cent brighter, volcanoes will have added carbon dioxide, and the vast interior will be hot and dry. Most of the land may be too hot for mammals.',
 more:'Climate simulations of a future supercontinent with background CO₂ of 410 to 816 ppm and a Sun 2.5 per cent brighter, together with the large temperature range deep inside a continent, find conditions hostile to mammals. The result depends on how the continents assemble and on how much CO₂ is released.',
 facts:[['Forms in','~250 Myr (model)'],['Solar luminosity','+2.5%'],['CO₂ (model)','410 – 816 ppm']]},
{c:7,t:FUT(1.08),when:'about 1 billion years from now',tag:'prediction',title:'The air runs out',scene:'earth:dry',anim:'o2fall',
 story:'The Sun gets about ten per cent brighter every billion years. A hotter Earth weathers rocks faster and pulls carbon dioxide out of the air until plants cannot live. Plants die first and the oxygen goes with them, leaving an atmosphere like that of two and a half billion years ago. Later, the oceans begin to evaporate in a moist greenhouse.',
 more:'A coupled model of oxygen and carbon cycles gives the oxygen-rich atmosphere a lifespan of 1.08 ± 0.14 billion years (above 1 per cent of present levels), followed by a rapid fall to Archaean-like levels. Climate models find that Earth leaves the habitable climate range after roughly 1.5 billion years; this number is model-dependent.',
 facts:[['O₂-rich air lasts','1.08 ± 0.14 Gyr'],['Habitable climate ends','~1.5 Gyr (model)']]},
{c:7,t:FUT(5.5),when:'5.5 billion years from now',tag:'prediction',title:'The Sun swells',scene:'sunfuture',anim:'pn',
 story:'In about 5.5 billion years the Sun will run out of hydrogen in its core and swell into a red giant, hundreds of times wider than today. Mercury and Venus will be swallowed, and Earth will be scorched long before.',
 more:'At maximum the red giant is about 256 times as wide and 2,730 times as luminous as the Sun now. It reaches this tip of the red-giant branch 7.59 ± 0.05 billion years from now, having lost about a third of its mass. Tidal drag from the expanding atmosphere pulls Earth’s orbit inward.',
 facts:[['Leaves main sequence','~5.5 Gyr from now'],['Maximum size','~256× present (1.2 AU)']]},
{c:7,t:FUT(7.59),when:'7.59 billion years from now',tag:'prediction',title:'The end of Earth',scene:'sunfuture',anim:'geobar',
 story:'In the best current models the swollen Sun drags Earth from its orbit, and the planet spirals into the Sun’s outer atmosphere and is vaporised. Life will almost certainly have ended much earlier.',

{c:7,t:FUT(7.72),when:'about 7.7 billion years from now',tag:'prediction',title:'A white dwarf',scene:'wd',anim:'pn',

 more:'In the Schröder and Smith models the Sun has 0.668 solar masses at the tip of the red-giant branch, 0.546 at the tip of the asymptotic giant branch, and ends as a white dwarf of 0.5405 solar masses. Its luminosity is too low to make a regular planetary nebula. The Sun’s age at the AGB tip is 12.30 Gyr, which is 7.72 Gyr from now (derived here from their table).',

{c:7,t:FUT(8),when:'about 8 billion years from now',tag:'coin flip',title:'Our galaxy meets Andromeda',scene:'andromeda',anim:'collide',
 story:'Andromeda is the nearest big spiral, and for years we were told it would hit the Milky Way in 4.5 billion years. New simulations say it is a coin flip: about half the time the two galaxies merge within 10 billion years, and if they do, probably around 8 billion years from now. The Milky Way will first swallow its own satellite, the Large Magellanic Cloud.',
 more:'In the simulations, with the Large Magellanic Cloud and M33 included, a merger within 10 billion years occurs in about 54 per cent of cases. Among those that merge, the median time is 7.6 to 8.0 billion years. The Large Magellanic Cloud is certain to merge with the Milky Way first, in 1.3 to 1.9 billion years. The remnant is expected to be an elliptical galaxy, nicknamed Milkomeda.',
 facts:[['Merger within 10 Gyr','~50% (54% fiducial)'],['If it happens','median 7.6 – 8.0 Gyr'],['LMC merges first','1.3 – 1.9 Gyr']]},
{c:7,t:FUT(30),when:'about 30 billion years from now',tag:'prediction',title:'The web freezes',scene:'horizon',anim:'fade',

 more:'Only the Milky Way–Andromeda remnant remains within the event horizon at about 100 billion years of age. Krauss and Scherrer argue that on a timescale of order 100 billion years the Hubble expansion, the CMB and primordial deuterium become inaccessible to such observers. With this clock the scale factor is about 144, so the CMB temperature is 0.019 K and its peak wavelength is about 15 cm (derived here). Stars keep forming and shining long after this, to roughly 10¹² to 10¹⁴ years.',

const GL={burst:'<path d="M0-4V4M-4 0H4M-2.8-2.8L2.8 2.8M2.8-2.8L-2.8 2.8"/>',field:'<circle r="1.2"/><circle r="3.6"/>',trio:'<circle cy="-2" r=".9"/><circle cx="-2" cy="1.6" r=".9"/><circle cx="2" cy="1.6" r=".9"/>',arrow:'<path d="M-4 0H4M1.5-2.5L4 0L1.5 2.5"/>',atom:'<ellipse rx="4" ry="1.5"/><ellipse rx="4" ry="1.5" transform="rotate(60)"/><ellipse rx="4" ry="1.5" transform="rotate(120)"/>',dots:'<circle cx="-2.6" r=".9"/><circle r=".9"/><circle cx="2.6" r=".9"/>',wave:'<path d="M-4 0Q-2-3.5 0 0T4 0"/>',moon:'<path d="M2-3.6A4 4 0 1 0 2 3.6A3 3 0 0 1 2-3.6Z"/>',star:'<path d="M0-4L1.2-1.3L4-1.2L1.8.7L2.5 3.6L0 2L-2.5 3.6L-1.8.7L-4-1.2L-1.2-1.3Z"/>',galaxy:'<ellipse rx="4" ry="1.5" transform="rotate(-25)"/><circle r=".8"/>',bh:'<circle r="1.6" fill="currentColor"/><ellipse rx="4" ry="1.3"/>',expand:'<path d="M-1-1L-4-4M-4-1.8V-4H-1.8M1 1L4 4M1.8 4H4V1.8"/>',sun:'<circle r="1.8"/><path d="M0-4V-2.8M0 4V2.8M-4 0H-2.8M4 0H2.8M-2.8-2.8L-2-2M2.8 2.8L2 2M2.8-2.8L2-2M-2.8 2.8L-2 2"/>',planet:'<circle r="2.2"/><ellipse rx="4" ry="1" transform="rotate(-20)"/>',drop:'<path d="M0-4C2-1 3 .6 3 1.6A3 3 0 0 1-3 1.6C-3 .6-2-1 0-4Z"/>',cell:'<circle r="3.4"/><circle cx="-.6" cy=".4" r="1.1"/>',flake:'<path d="M0-4V4M-3.5-2L3.5 2M-3.5 2L3.5-2"/>',shell:'<path d="M0 0C1-1 2 0 1 1.2C-.4 2.6-3 1-2.4-1.4C-1.6-3.8 2.4-3.8 3.6-1"/>',leaf:'<path d="M-3.4 3.4C-3.4-1.6 0-3.8 3.6-3.6C3.8 0 1.6 3.4-3.4 3.4ZM-3.4 3.4L1-1"/>',cross:'<path d="M-3-3L3 3M3-3L-3 3"/>',fish:'<path d="M-4 0C-2-2.6 1-2.6 2.4 0C1 2.6-2 2.6-4 0ZM2.4 0L4.2-2M2.4 0L4.2 2"/>',bone:'<path d="M-3 0H3"/><circle cx="-3.2" cy="-.9" r=".9"/><circle cx="-3.2" cy=".9" r=".9"/><circle cx="3.2" cy="-.9" r=".9"/><circle cx="3.2" cy=".9" r=".9"/>',flower:'<circle r="1"/><circle cy="-2.6" r="1.2"/><circle cx="2.5" cy="-.8" r="1.2"/><circle cx="1.5" cy="2.1" r="1.2"/><circle cx="-1.5" cy="2.1" r="1.2"/><circle cx="-2.5" cy="-.8" r="1.2"/>',paw:'<circle cy="1.6" r="1.9"/><circle cx="-2.6" cy="-1" r=".9"/><circle cx="-.9" cy="-2.6" r=".9"/><circle cx=".9" cy="-2.6" r=".9"/><circle cx="2.6" cy="-1" r=".9"/>',person:'<circle cy="-2.6" r="1.2"/><path d="M0-1.2V1.6M-2.4 0H2.4M0 1.6L-1.8 4M0 1.6L1.8 4"/>',house:'<path d="M-3.4 3.4V-.4L0-3.4L3.4-.4V3.4Z"/>',now:'<circle r="3.4"/><circle r="1.1" fill="currentColor"/>',land:'<path d="M-4 3L-1.4-2.6L0 .2L1.6-1.4L4 3Z"/>',bubble:'<circle cx="-1" cy="1" r="2.4"/><circle cx="2.2" cy="-2" r="1.3"/>',dot:'<circle r="1.8" fill="currentColor"/>',pulsar:'<circle r="1.2" fill="currentColor"/><path d="M0-4V-2M0 2V4"/><ellipse rx="3.6" ry="1.2" transform="rotate(30)"/>',impact:'<circle r="1.6"/><path d="M0-4V-2.6M0 4V2.6M-4 0H-2.6M4 0H2.6"/>'};
const GK={'Inflation':'expand','The fireball':'burst','The Higgs field switches on':'field','Why anything exists':'burst','Quarks lock together':'trio','The neutrinos escape':'arrow','A nuclear reactor the size of the universe':'atom','Matter takes the lead':'dots','The universe becomes transparent':'wave','The afterglow':'wave','The Dark Ages':'moon','The first stars':'star','The first elements':'atom','The earliest galaxy we have seen':'galaxy','The fog lifts again':'wave','Monsters in the dark':'bh','Our Galaxy takes shape':'galaxy','Cosmic noon':'galaxy','The universe speeds up':'expand','A cloud becomes a star':'sun','Building worlds':'planet','A world hit by a world':'impact','Oceans':'drop','A wetter Mars':'planet','Life':'cell','The air turns to oxygen':'bubble','Cells with a nucleus':'cell','Snowball Earth':'flake','The first animals':'shell','The Cambrian explosion':'shell','Life turns the land green':'leaf','Ice, then a first mass extinction':'cross','Fish learn to walk':'fish','The coal forests':'leaf','The Great Dying':'cross','Dinosaurs and the first mammals':'bone','Giants and the first birds':'bone','Flowers':'flower','A bad day for the dinosaurs':'impact','Mammals take over':'paw','The ice ages':'flake','People':'person','Fields, cities, a billion people':'house','Today':'now','The next supercontinent':'land','The air runs out':'bubble','The Sun swells':'sun','The end of Earth':'planet','A white dwarf':'dot','Our galaxy meets Andromeda':'galaxy','The web freezes':'flake','One galaxy left':'galaxy','A massive star explodes':'burst','A neutron star':'pulsar','A black hole':'bh'};
const ERC={Inflation:'#c58bff',Radiation:'#ff9a4d',Matter:'#5fa8ff','Dark energy':'#ff6f91'};
const eraOf=e=>{const t=e.t||EP[ti('A cloud becomes a star')].t,L=Math.log10(t),z=1/aOfT(Math.max(t,1e-20))-1;return L<-31.9?'Inflation':z>3402?'Radiation':z>.63?'Matter':'Dark energy'};
NODES.forEach(n=>{n.era=eraOf(n.e)});
function drawMap(){let s=`<svg width="${MAPW}" height="190" font-family="JetBrains Mono,monospace">`;
 NODES.forEach(n=>{s+=`<rect x="${n.x-SPX/2+1}" y="${n.y-14}" width="${SPX-2}" height="28" rx="8" fill="${ERC[n.era]}" opacity=".085"/>`});
 const nx=new Set(nextOf(CN).map(o=>o.n.i));
 Object.keys(E).forEach(k=>E[k].forEach(([t])=>{const a=NODES[k],b=NODES[t],on=VIS.has(+k)&&VIS.has(t),d=edgePath(a,b);if(on)s+=`<path d="${d}" fill="none" stroke="${LC[b.c]}" stroke-width="7" opacity=".17" stroke-linecap="round"/>`;s+=`<path d="${d}" fill="none" stroke="${LC[b.c]}" stroke-width="${on?2.4:1.4}" opacity="${on?.95:.32}"/>`;if(+k===CN.i&&nx.has(t))s+=`<path class="pl" d="${d}" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>`}));
 LAB.forEach(([i,t])=>{const n=NODES[i];s+=`<text x="${n.x-6}" y="${n.y-19}" font-size="8.5" letter-spacing="1.4" fill="${LC[n.c]}" opacity=".8">${t}</text>`});
 NODES.forEach(n=>{const cur=n===CN,v=VIS.has(n.i),isN=nx.has(n.i),r=cur?10.5:8.5,col=LC[n.c],k=GL[GK[n.e.title]]||GL.dot,sc=cur?1.25:1;
  if(cur)s+=`<circle cx="${n.x}" cy="${n.y}" r="19" fill="${col}" opacity=".26"/>`;
  s+=`<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${v||cur?col:'#070711'}" stroke="${col}" stroke-width="1.3" opacity="${v||cur||isN?1:.7}"/>`;
  const gc=v||cur?'#070711':col;s+=`<g transform="translate(${n.x} ${n.y}) scale(${sc})" fill="none" stroke="${gc}" color="${gc}" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">${k}</g>`;
  if(isN&&!cur)s+=`<circle cx="${n.x}" cy="${n.y}" r="13" fill="none" stroke="${col}" stroke-dasharray="2 3" opacity=".85"/>`;
  s+=`<circle class="hit" data-n="${n.i}" cx="${n.x}" cy="${n.y}" r="14" fill="transparent" style="cursor:pointer"><title>${n.e.title}</title></circle>`});
 s+=`<text x="${CN.x}" y="${CN.y-30}" text-anchor="middle" font-family="Inter,sans-serif" font-size="12.5" fill="#f1ece4">${CN.e.title}</text></svg>`;
 $('mapin').innerHTML=s;$('mapin').style.transform=`translate(${Math.round(innerWidth/2-CN.x)}px,0)`}
function renderNav(n){const nx=nextOf(n);let h=HIST.length?`<button data-g="p">← Back</button>`:'';
 nx.forEach((o,k)=>{h+=`<button class="${k?'s2':'s'}" data-g="${k}">${o.l} →</button>`});
 if(!nx.length)h+=`<button class="s" data-g="r">↺ Start again</button>`;
 if(n.i>=N)h+=`<a class="b" href="remnants.html">Stellar Remnants ↗</a>`;
 n.e.el.querySelector('.nav').innerHTML=h}
function goto(n,push=true){if(push&&CN&&CN!==n)HIST.push(CN);CN=n;CUR=n.e;VIS.add(n.i);vsc=INTRO()+yOfNode(n)-vh()*.5;ALL.forEach(e=>e.el.classList.remove('mc'));CUR.el.classList.add('mc');CUR.el.scrollTop=0;CUR.el.querySelector('details').open=false;sizeMini(CUR);renderNav(n);drawMap()}
function enterMap(){MAP=true;document.body.classList.add('map');document.documentElement.style.overflow='hidden';scrollTo(0,0);HIST.length=0;VIS.clear();CN=null;goto(NODES[0])}
function exitMap(){MAP=false;document.body.classList.remove('map');document.documentElement.style.overflow='';ALL.forEach(e=>e.el.classList.remove('mc'));scrollTo(0,0)}
function step(k){if(k==='p'){const p=HIST.pop();if(p)goto(p,false)}else if(k==='r'){HIST.length=0;VIS.clear();CN=null;goto(NODES[0])}else{const o=nextOf(CN)[+k];if(o)goto(o.n)}}
world.addEventListener('click',ev=>{const b=ev.target.closest('.nav button');if(b)step(b.dataset.g)});
$('mapin').addEventListener('click',ev=>{const h=ev.target.closest('.hit');if(h)goto(NODES[+h.dataset.n])});
$('bmap').onclick=enterMap;$('bscroll').onclick=()=>scrollTo({top:INTRO()-vh()*.05,behavior:'smooth'});$('mexit').onclick=exitMap;
addEventListener('keydown',ev=>{if(!MAP||$('refs').classList.contains('on'))return;if(ev.key==='ArrowRight')step('0');else if(ev.key==='ArrowLeft')step('p')});
addEventListener('resize',()=>{if(MAP){vsc=INTRO()+yOfNode(CN)-vh()*.5;sizeMini(CUR);drawMap()}});
</script></body></html>
