MINI.web=(g,w,h,t)=>{bgf(g,w,h,'#05060d');const r=mrng(9),P=[];const k=ms(0,1,(t%10)/10);for(let i=0;i<70;i++){const x0=r(),y0=r(),cx=Math.round(x0*3)/3+.17,cy=Math.round(y0*2.4)/2.4+.2;P.push([(x0+(cx-x0)*k*.7)*w,(y0+(cy-y0)*k*.7)*h])}g.lineWidth=1;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1]);if(d<w*.16){g.strokeStyle=`rgba(130,170,255,${(1-d/(w*.16))*.45*k})`;g.beginPath();g.moveTo(...P[i]);g.lineTo(...P[j]);g.stroke()}}g.globalCompositeOperation='lighter';P.forEach(p=>mglow(g,p[0],p[1],5+3*k,'170,200,255',.8));g.globalCompositeOperation='source-over';mlabel(g,'dark matter gathers into filaments and knots (schematic)',8,h-8)};
MINI.plasma=(g,w,h,t)=>{bgf(g,w,h,'#190a04');const r=mrng(3);g.globalCompositeOperation='lighter';for(let i=0;i<60;i++){const x=(r()*w+Math.sin(t*.7+i)*20+w)%w,y=(r()*h+Math.cos(t*.5+i*1.3)*16+h)%h;mglow(g,x,y,30+r()*40,i%2?'255,150,70':'255,215,150',.22)}g.globalCompositeOperation='source-over';mlabel(g,'a hot, dense plasma of light and charged particles',8,h-8)};
MINI.pairs=(g,w,h,t)=>{bgf(g,w,h,'#12090d');const r=mrng(7),p=(t%7)/7;for(let i=0;i<36;i++){const a=r()*TAU2,d0=(.1+r()*.4)*Math.min(w,h),ph=(p*1.3+r()*.5)%1,yy=h/2+Math.sin(a)*d0*.9,xx=w/2+Math.cos(a)*d0*1.6;const ann=ph>.55;g.globalCompositeOperation='lighter';if(!ann){g.fillStyle='#ff5a5a';star5(g,xx-ph*10*Math.cos(a),yy-ph*10*Math.sin(a),3,1);g.fillStyle='#5a8aff';star5(g,xx+ph*10*Math.cos(a),yy+ph*10*Math.sin(a),3,1)}else{const q=(ph-.55)/.45;mglow(g,xx,yy,10+q*26,'255,240,200',.7*(1-q))}g.globalCompositeOperation='source-over'}mlabel(g,'electron + positron → light',8,h-8)};
MINI.rings=(g,w,h,t)=>{bgf(g,w,h,'#10090a');const cx=w/2,cy=h/2;g.globalCompositeOperation='lighter';for(let k=0;k<5;k++){const ph=((t*.12+k*.2)%1),R=ph*Math.min(w,h)*.5;g.strokeStyle=`rgba(255,170,100,${(1-ph)*.55})`;g.lineWidth=2;g.beginPath();g.arc(cx,cy,R,0,TAU2);g.stroke()}mglow(g,cx,cy,24,'255,220,170',.9);g.globalCompositeOperation='source-over';mlabel(g,'sound waves in the early plasma',8,h-8)};

MINI.orbit=(g,w,h,t)=>{bgf(g,w,h,'#05070d');const cx=w/2,cy=h/2,M=Math.min(w,h);g.globalCompositeOperation='lighter';mglow(g,cx,cy,22,'255,220,150',.9);g.globalCompositeOperation='source-over';[[.16,3.1,'#c9b79c',3],[.26,1.9,'#6fb4ff',4],[.37,1.1,'#d9a066',5],[.46,.6,'#e8c88a',8]].forEach(([r,wv,c,s])=>{g.strokeStyle='rgba(255,255,255,.12)';g.beginPath();g.ellipse(cx,cy,M*r*1.4,M*r*.9,0,0,TAU2);g.stroke();g.fillStyle=c;star5(g,cx+Math.cos(t*wv*.5)*M*r*1.4,cy+Math.sin(t*wv*.5)*M*r*.9,s,1)});mlabel(g,'bodies in orbit (schematic, not to scale)',8,h-8)};

MINI.field=(g,w,h,t)=>{bgf(g,w,h,'#05070f');const cx=w*.55,cy=h/2,R=Math.min(w,h)*.12;sphere(g,cx,cy,R,'#7fb4e8','#1c3550');g.strokeStyle='rgba(120,200,255,.5)';g.lineWidth=1.2;[2.2,3.2,4.4,5.8].forEach(k=>{g.beginPath();g.ellipse(cx,cy,R*k*1.0,R*k*.6,0,0,TAU2);g.stroke()});const r=mrng(8);g.fillStyle='#ffd88a';for(let i=0;i<40;i++){const y=r()*h,x0=((t*90*(.5+r())+r()*w)%(w*.8)),dx=cx-R*5.2-x0;let x=x0*.8,yy=y;const near=Math.abs(y-cy)<R*3&&x>cx-R*7;if(x>cx-R*6.4&&Math.abs(y-cy)<R*3.2)yy=y+(y>cy?1:-1)*(x-(cx-R*6.4))*.5;star5(g,x,yy,1.6,.8)}mlabel(g,'a magnetic field deflects the solar wind',8,h-8)};

const glyphOf=c=>GL[GK[c.title]||AG[c.anim]||'dots']||GL.dots;
const HIST=[],VIS=new Set(),SPX=46,LY=[34,68,102,136,170],LC=['#c58bff','#ffb86b','#ffd27a','#6fd08c','#ff8a6a'];
const outs=i=>(GRAPH.e[i]||[]).map(([t,l])=>({to:t,l:l||CARDS[t].title}));
const NX=GRAPH.n.map(n=>40+n[0]*SPX),NY=GRAPH.n.map(n=>LY[n[1]]),MAPW=Math.max(...NX)+200;
function edgePath(a,b){const ax=NX[a],ay=NY[a],bx=NX[b],by=NY[b],dx=bx-ax;if(ay===by)return`M${ax} ${ay}H${bx}`;if(dx>SPX*3.5){const x2=bx-SPX*1.1;return`M${ax} ${ay}H${x2}C${x2+SPX*.55} ${ay} ${bx-SPX*.55} ${by} ${bx} ${by}`}const m=ax+dx/2;return`M${ax} ${ay}C${m} ${ay} ${m} ${by} ${bx} ${by}`}
let MN=null;
function buildMapSVG(){let s=`<svg width="${MAPW}" height="200" font-family="JetBrains Mono,monospace"><g id="edges">`;const ek=[];
 Object.keys(GRAPH.e).forEach(k=>GRAPH.e[k].forEach(([t])=>{ek.push([+k,t]);s+=`<path data-a="${k}" data-b="${t}" d="${edgePath(+k,t)}" fill="none" stroke="${LC[GRAPH.n[t][1]]}" stroke-width="1.2" opacity=".35" stroke-linecap="round"/>`}));

function step(k){if(k==='p'){const p=HIST.pop();if(p!=null)show(p)}else if(k==='r'){HIST.length=0;VIS.clear();VIS.add(0);show(0)}else{const o=outs(cur)[+k];if(o)goto(o.to)}}

function buildBib(){const seen=new Map();CARDS.forEach(c=>c.refs.forEach(r=>{if(!seen.has(r.t))seen.set(r.t,r)}));const arr=[...seen.values()].sort((a,b)=>a.t.localeCompare(b.t,'en'));$('bib').innerHTML=arr.map(r=>`<p>${esc(r.t)}${r.l?` <a href="${r.l}" target="_blank" rel="noopener">${esc(r.id)}</a>`:''}</p>`).join('')}

let last=0,paused=false;document.addEventListener('visibilitychange',()=>{paused=document.hidden});
function frame(ts){requestAnimationFrame(frame);if(paused)return;tickHUD(performance.now());if(ts-last<FI[QL])return;last=ts;const t=ts/1000,t0=performance.now();
 if($('intro').classList.contains('gone')){if(!document.querySelector('.ov.on')){bgdraw(t);if(cur>=0)drawMini(cur,(performance.now()-tStart)/1000)}}else introDraw(t);

const ic=$('ic'),ig=ic.getContext('2d');const IR=mrng(5),IP=Array.from({length:160},()=>({x:IR(),y:IR(),s:IR(),v:IR()}));
