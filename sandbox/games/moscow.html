<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moscow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#aeb6c8;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
  #place{position:fixed;left:0;right:0;top:18px;text-align:center;font:700 20px 'Silkscreen',monospace;color:#fff4e0;text-shadow:0 3px 0 #1a1226;letter-spacing:2px;pointer-events:none;user-select:none;opacity:0;transition:opacity .5s}
  #place.on{opacity:1}
  #keys{position:fixed;right:18px;top:14px;text-align:right;white-space:pre;line-height:1.7;font:400 12px/1.7 'Silkscreen',monospace;color:#fff4e0;text-shadow:0 2px 0 #1a1226;letter-spacing:1px;pointer-events:none;user-select:none;opacity:.88}
  #alt{position:fixed;right:22px;top:50%;margin-top:-30px;width:16px;height:150px;border:3px solid #1a1226;background:rgba(26,18,38,.55);display:none;pointer-events:none}
  #altf{position:absolute;left:0;right:0;bottom:0;height:0;background:#ffd36b}
  #altr{position:absolute;left:-3px;right:-3px;height:2px;background:#fff4e0;opacity:.0}
  #altt{position:fixed;right:14px;font:700 11px 'Silkscreen',monospace;color:#fff4e0;text-shadow:0 2px 0 #1a1226;text-align:right;display:none;pointer-events:none;letter-spacing:1px}
  #mini{position:fixed;right:16px;bottom:16px;width:170px;height:170px;border:3px solid #1a1226;border-radius:50%;background:#2a2733;box-shadow:0 4px 0 rgba(0,0,0,.35);pointer-events:none}
  #bigmap{position:fixed;inset:0;margin:auto;display:none;background:rgba(26,18,38,.94);width:100vw;height:100vh;image-rendering:auto;touch-action:none;cursor:grab}
  #prompt{position:fixed;left:0;right:0;bottom:64px;text-align:center;font:700 16px 'Silkscreen',monospace;color:#fff4e0;text-shadow:0 3px 0 #1a1226;letter-spacing:2px;pointer-events:none;user-select:none;opacity:0;transition:opacity .25s}
  #prompt.on{opacity:1}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Silkscreen',monospace;color:#fff4e0;text-shadow:0 4px 0 #1a1226;text-align:center;pointer-events:none;user-select:none}
  #msg b{font-size:clamp(30px,7vw,72px);letter-spacing:4px}
  #msg span{font-size:clamp(12px,2vw,20px);letter-spacing:2px;opacity:.9}
  #msg.hide{display:none}
  #dcount{position:fixed;left:16px;top:14px;font:700 12px 'Silkscreen',monospace;color:#fff4e0;text-shadow:0 2px 0 #1a1226;letter-spacing:2px;pointer-events:none;user-select:none}
  #disc{position:fixed;left:50%;top:64px;transform:translate(-50%,-16px);width:max-content;max-width:min(520px,86vw);box-sizing:border-box;padding:10px 18px 12px;background:rgba(26,18,38,.92);border:3px solid #fff4e0;box-shadow:0 5px 0 rgba(0,0,0,.35);text-align:center;font:700 15px 'Silkscreen',monospace;color:#fff4e0;letter-spacing:2px;opacity:0;pointer-events:none;user-select:none;transition:opacity .35s,transform .35s}
  #disc.on{opacity:1;transform:translate(-50%,0)}
  #disc small{display:block;font-size:10px;color:#ffd36b;letter-spacing:3px;margin-bottom:6px}
  #disc em{display:block;font:400 11px/1.5 'Silkscreen',monospace;font-style:normal;letter-spacing:1px;opacity:.9;margin-top:7px}
  #dcount.hit{color:#ffd36b}
  #jr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,18,.66);z-index:20}
  #jr.on{display:flex}
  #jp{width:min(860px,94vw);max-height:min(86vh,760px);display:flex;flex-direction:column;box-sizing:border-box;background:rgba(26,18,38,.97);border:3px solid #fff4e0;box-shadow:0 6px 0 rgba(0,0,0,.4);font:700 12px 'Silkscreen',monospace;color:#fff4e0;letter-spacing:1px;user-select:none}
  #jh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 18px 11px;border-bottom:3px solid rgba(255,244,224,.22)}
  #jh b{font-size:17px;color:#ffd36b;letter-spacing:4px}
  #jh span{font-size:10px;letter-spacing:2px;opacity:.7;text-align:right}
  #jl{overflow-y:auto;padding:12px 14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:9px;align-content:start}
  .je{background:rgba(255,244,224,.07);border-left:4px solid #ffd36b;padding:9px 11px 10px;cursor:pointer}
  .je:hover{background:rgba(255,244,224,.16)}
  .je b{display:block;font-size:11px;letter-spacing:2px}
  .je em{display:block;margin-top:6px;font:400 10px/1.55 'Silkscreen',monospace;font-style:normal;letter-spacing:1px;opacity:.86}
  .jn{grid-column:1/-1;font-size:10px;letter-spacing:3px;color:#ffd36b;margin-top:6px}
  .jk{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
  .jk i{font-style:normal;font-size:10px;letter-spacing:2px;padding:5px 10px;border:2px dashed rgba(255,244,224,.28);opacity:.5}
  .jz{grid-column:1/-1;font:400 11px/1.6 'Silkscreen',monospace;letter-spacing:1px;opacity:.8;padding:6px 2px}
  #taxi{position:fixed;left:16px;bottom:16px;display:none;min-width:210px;max-width:min(360px,60vw);padding:9px 14px 10px;background:rgba(26,18,38,.88);border:3px solid #ffd36b;box-shadow:0 4px 0 rgba(0,0,0,.35);font:700 12px 'Silkscreen',monospace;color:#fff4e0;letter-spacing:2px;pointer-events:none;user-select:none}
  #taxi b{display:block;font-size:18px;color:#ffd36b;letter-spacing:3px}
  #taxi span{display:block;margin-top:5px;font-weight:400;font-size:11px;letter-spacing:1px}
  #taxi i{display:block;margin-top:7px;font-style:normal;font-weight:400;font-size:10px;letter-spacing:1px;opacity:.75}
  #fare{position:fixed;left:50%;bottom:118px;transform:translate(-50%,16px);width:max-content;max-width:min(560px,90vw);box-sizing:border-box;padding:10px 18px 12px;background:rgba(26,18,38,.92);border:3px solid #ffd36b;box-shadow:0 5px 0 rgba(0,0,0,.35);text-align:center;font:700 15px 'Silkscreen',monospace;color:#fff4e0;letter-spacing:2px;opacity:0;pointer-events:none;user-select:none;transition:opacity .35s,transform .35s}
  #fare.on{opacity:1;transform:translate(-50%,0)}
  #fare small{display:block;font-size:10px;color:#ffd36b;letter-spacing:3px;margin-bottom:6px}
  #perf{position:fixed;left:14px;top:40px;font:400 11px/1.5 monospace;color:#fff4e0;background:rgba(26,18,38,.7);padding:6px 8px;display:none;pointer-events:none;white-space:pre}
</style>
</head>

const SQ0 = 0.82, SP0 = 0.88, STEPS = 128, STEP = Math.PI * 2 / STEPS;

// The default elevation is the original look. Z / X move it smoothly; the sprites are baked at NPL discrete levels, 5 degrees apart (level PL0 is the default)
const EL0 = Math.asin(SQ0), PLSTEP = 5 * Math.PI / 180, NPL = 15, PL0 = 8, ELMIN = EL0 - PL0 * PLSTEP, ELMAX = EL0 + (NPL - 1 - PL0) * PLSTEP;

  for(let z=3;z<19;z++){const tt=(z-3)/16,tier=(z-3)%5,r=Math.max(1.3,7*(1-tt)*(0.62+0.38*(1-tier/4)));
    for(let y=0;y<15;y++)for(let x=0;x<15;x++)if(Math.hypot(x-7,y-7)<=r+(hash(x,y,z*5+3)-0.5)*0.9)v.set(x,y,z,'pine');}
  return toStack(v);
}
function buildPalm(seed){   // a date palm: slim ribbed trunk, a tuft of arching fronds
  const v=new Vol(25,25,23);v.box(11,11,0,13,13,1,'bark');
  for(let z=2;z<=14;z++)v.set(12,12,z,'bark');
  for(let y=11;y<=13;y++)for(let x=11;x<=13;x++)for(let z=14;z<=16;z++)if(Math.abs(x-12)+Math.abs(y-12)+Math.abs(z-15)<=2)v.set(x,y,z,'palm');
  const na=11;
  for(let a=0;a<na;a++){const t=a*Math.PI*2/na+seed*0.7+(hash(a,seed,4)-0.5)*0.3,len=8+hash(a,seed,5)*2.5;
    for(let r=1;r<=len;r+=0.5){const x=Math.round(12+Math.cos(t)*r),y=Math.round(12+Math.sin(t)*r),zz=Math.round(16+Math.min(r,3.5)*0.55-Math.max(0,r-4.2)*0.62);
      if(zz>=0&&zz<23){v.set(x,y,zz,'palm');if(r>2&&r<len-1){v.set(x,y,Math.max(0,zz-1),'palm');}}}}
  return toStack(v);}

function buildSteam(){   // the orange-and-white striped Con Edison steam stack that stands over a street leak
  const v=new Vol(5,5,13);
  for(let z=0;z<=9;z++)v.box(1,1,z,3,3,z,(z>>1)%2?'white':'orange');
  v.box(0,0,10,4,4,10,'orange');v.box(0,0,11,4,4,11,'white');v.box(1,1,11,3,3,11,'black');v.box(1,1,12,3,3,12,null);
  for(const [x,y] of [[0,0],[4,0],[0,4],[4,4]])v.set(x,y,12,'orange');
  return toStack(v);
}

function buildCar(mat,taxi){
  const W=9,L=17,v=new Vol(W,L,7);
  const inB=(x,y)=>{if(x<1||x>7)return false;if(y===0||y===16)return x>=3&&x<=5;if(y===1||y===15)return x>=2&&x<=6;return true;};
  for(let y=2;y<=14;y++)for(let x=2;x<=6;x++)v.set(x,y,0,'iron');
  for(let z=1;z<=3;z++)for(let y=0;y<L;y++)for(let x=0;x<W;x++)if(inB(x,y))v.set(x,y,z,mat);
  for(let y=4;y<=11;y++)for(let x=2;x<=6;x++){const ex=x===2||x===6;let m=mat;if(ex&&y>=5&&y<=10)m='glass';else if(!ex&&(y<=5||y>=10))m='glass';v.set(x,y,4,m);}
  for(let y=6;y<=9;y++)for(let x=3;x<=5;x++)v.set(x,y,5,mat);
  if(taxi)v.box(3,7,6,5,8,6,'white');
  for(const yr of [[2,4],[12,14]])for(let y=yr[0];y<=yr[1];y++)for(let z=0;z<=2;z++)for(const x of [0,1,7,8])v.set(x,y,z,'tyre');
  for(const x of [3,5])for(let z=1;z<=2;z++)v.set(x,16,z,'glow');for(const x of [2,3,5,6])for(let z=1;z<=2;z++)v.set(x,15,z,'glow');
  for(const x of [3,4,5])for(let z=2;z<=3;z++)v.set(x,0,z,'tail');
  return toStack(v);
}
function buildHeli(){
  const v=new Vol(9,19,10);
  for(let y=3;y<=14;y++)for(let x=2;x<=6;x++)for(let z=2;z<=5;z++){if(z===5&&(y>11||x===2||x===6))continue;v.set(x,y,z,'white');}
  for(let y=15;y<=17;y++)for(let x=3;x<=5;x++)for(let z=2;z<=4;z++)v.set(x,y,z,y===17&&z===2?'white':'white');
  for(let y=12;y<=17;y++)for(let x=2;x<=6;x++){if(v.get(x,y,4))v.set(x,y,4,'glass');}
  for(let y=12;y<=14;y++)for(let x=3;x<=5;x++)v.set(x,y,5,'glass');
  for(let y=5;y<=10;y++)for(let x=3;x<=5;x++)v.set(x,y,6,'iron');
  v.box(4,9,7,4,9,8,'iron');
  for(let y=0;y<=3;y++){v.set(4,y,4,'white');v.set(4,y,3,'white');}
  v.box(4,0,5,4,1,7,'red');v.set(3,0,5,'red');v.set(5,0,5,'red');
  for(let y=3;y<=15;y++){v.set(1,y,0,'iron');v.set(7,y,0,'iron');}
  for(const y of [5,12])for(const x of [1,7]){v.set(x,y,1,'iron');}
  for(const y of [5,12])for(const x of [2,6])v.set(x,y,1,'iron');
  const K=1.5,w=new Vol(Math.ceil(9*K),Math.ceil(19*K),Math.ceil(10*K));
  for(let z=0;z<w.H;z++)for(let y=0;y<w.L;y++)for(let x=0;x<w.W;x++){const m=v.get(Math.floor(x/K),Math.floor(y/K),Math.floor(z/K));if(m)w.set(x,y,z,m);}
  return toStack(w);
}

    if(d<9&&((x>=9&&x<=10)||(x>=19&&x<=20))&&y>=9&&y<=20)v.set(x,y,1,'white');if(d<9&&y>=14&&y<=15&&x>=9&&x<=20)v.set(x,y,1,'white');}

function scaleVol(v,K){const w=new Vol(Math.ceil(v.W*K),Math.ceil(v.L*K),Math.ceil(v.H*K));
  for(let z=0;z<w.H;z++)for(let y=0;y<w.L;y++)for(let x=0;x<w.W;x++){const m=v.get(Math.floor(x/K),Math.floor(y/K),Math.floor(z/K));if(m)w.set(x,y,z,m);}return w;}

function buildFountain(){
  const v=new Vol(24,24,14),c=11.5;
  for(let y=0;y<24;y++)for(let x=0;x<24;x++){const d=Math.hypot(x-c,y-c);
    if(d<=11.5){v.set(x,y,0,'stone');v.set(x,y,1,d>9?'stone':'water');if(d>9.5)v.set(x,y,2,'stone');}
    if(d<=2.6)v.box(x,y,2,x,y,9,'stone'); if(d<=5.4&&d>2)v.set(x,y,7,'stone'); if(d<=3.5)v.set(x,y,8,'water');
    if(d<=1.6)v.box(x,y,10,x,y,13,'white');}
  return toStack(v);
}
function buildBridge(){
  const W=40,L=8,v=new Vol(W,L,8);
  for(let x=0;x<W;x++){const h=1+Math.round(3*Math.sin(Math.PI*(x+0.5)/W));

    for(const y of [0,1,6,7])v.set(x,y,h+1,'white'); if(x%4<2)for(const y of [0,1,6,7])v.set(x,y,h+2,'white');

  return toStack(v);
}

function modules(v,nx,ny){ny=ny||1;const cw=Math.floor(v.W/nx),ch=Math.floor(v.L/ny),out=[];
  if(nx*ny===1)return [toStack(v)];
  // MG: each wing carries 4 voxels of its neighbour on every side, so the wings overlap well past any pixel rounding.
  // P: a transparent border round every wing. The browser anti-aliases the edge of a rotated slice rectangle, and with 30 slices stacked that blended
  // edge turns opaque and dark; on the border it lands on empty pixels instead, so no hairline can appear where the wings meet.
  const MG=4, P=2, vp=new Vol(v.W+2*P,v.L+2*P,v.H);
  for(let z=0;z<v.H;z++)for(let y=0;y<v.L;y++)for(let x=0;x<v.W;x++){const m=v.get(x,y,z);if(m)vp.set(x+P,y+P,z,m);}
  const full=toStack(vp,0,true), fullC=toStack(vp), mw=cw+2*MG, mh=ch+2*MG;
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const m=new Vol(mw+2*P,mh+2*P,v.H);
    for(let z=0;z<v.H;z++)for(let y=0;y<mh;y++)for(let x=0;x<mw;x++){const c=v.get(i*cw-MG+x,j*ch-MG+y,z);if(c)m.set(x+P,y+P,z,c);}
    const st=toStack(m);
    // colours come from the whole-building bake, so a wing's cut edge shades exactly like the interior of the building
    for(let z=0;z<v.H;z++){const g=st.slices[z].getContext('2d');g.clearRect(0,0,st.w,st.h);g.drawImage(fullC.slices[z],i*cw-MG+P,j*ch-MG+P,mw,mh,P,P,mw,mh);}
    st.gs=full.sils;st.gdx=i*cw+cw/2+P;st.gdy=j*ch+ch/2+P;st.ox=i*cw+cw/2-v.W/2;st.oy=j*ch+ch/2-v.L/2;st.cw=cw;st.ch=ch;out.push(st);}return out;}

function mir(v){const o=new Vol(v.W,v.L,v.H);for(let z=0;z<v.H;z++)for(let y=0;y<v.L;y++)for(let x=0;x<v.W;x++)o.set(v.W-1-x,y,z,v.get(x,y,z));return o;}

function hip(v,x0,y0,x1,y1,z0,m,rise){for(let k=0;k<rise&&x0+k<=x1-k&&y0+k<=y1-k;k++)v.box(x0+k,y0+k,z0+k,x1-k,y1-k,z0+k,m);}
