 dele quando é recebido pela primeira vez.","Kings and Guests":"Reis e Hóspedes","Nestor":"Nestor","King of Pylos":"Rei de Pilo","The old horse-breaker. He tells Telemachus how the Greeks left Troy divided and how Orestes avenged Agamemnon.":"O velho domador de cavalos. Conta a Telêmaco como os gregos deixaram Troia divididos e como Orestes vingou Agamémnone.","Pisistratus":"Pisístrato","Son of Nestor":"Filho de Nestor","He escorts Telemachus by chariot to Sparta and stays with him.":"Conduz Telêmaco de carro a Esparta e fica com ele.","Menelaus":"Menelau","King of Sparta":"Rei de Esparta","He tells Telemachus what Proteus revealed, including that Odysseus is alive on Calypso's island.":"Conta a Telêmaco o que Proteu revelou, inclusive que Odisseu está vivo na ilha de Calipso.","Helen":"Helena","Queen of Sparta":"Rainha de Esparta","She recognises Telemachus as Odysseus' son at once, and tells how Odysseus once entered Troy disguised as a beggar.":"Reconhece de imediato Telêmaco como filho de Odisseu e conta como Odisseu entrou uma vez em Troia disfarçado de mendigo.","Theoclymenus":"Teoclímeno","A seer in flight":"Um adivinho em fuga","A descendant of the seer Melampus who has killed a man at home. Telemachus takes him aboard, and he foretells the ruin of the suitors.":"Descendente do adivinho Melampo, que matou um homem em sua terra. Telêmaco o leva a bordo, e ele prediz a ruína dos pretendentes.","The Dead":"Os Mortos","Tiresias":"Tirésias","The Theban seer":"O adivinho tebano","Even among the dead he keeps his wits. He tells Odysseus about Poseidon's anger, the cattle of the Sun, the trouble at home and the journey with the oar.":"Mesmo entre os mortos conserva o juízo. Diz a Odisseu da ira de Posido, do gado do Sol, dos males em casa e da viagem com o remo.","Achilles":"Aquiles","Shade of the great warrior":"Sombra do grande guerreiro","He says he would rather be a labourer on a poor man's farm than rule over all the dead. Odysseus tells him that his son Neoptolemus fights bravely.":"Diz que preferiria ser jornaleiro na terra de um pobre a reinar sobre todos os mortos. Odisseu lhe diz que o filho, Neoptólemo, luta com bravura.","Agamemnon":"Agamémnone","Shade of the king of Mycenae":"Sombra do rei de Micenas","Killed at a feast by Aegisthus and his own wife. He warns Odysseus not to tell a wife everything he knows.":"Morto num banquete por Egisto e pela própria esposa. Previne Odisseu de que não conte tudo à esposa.","Ajax":"Ajaz","Shade of the Greek hero":"Sombra do herói grego","Still angry that Odysseus won the armour of Achilles, he gives no answer and goes off into the dark.":"Ainda irado porque Odisseu ganhou as armas de Aquiles, não dá resposta e se vai para a escuridão.","Close":"Fechar","VIII":"VIII","XIII":"XIII","XVII":"XVII","XVIII":"XVIII","XXII":"XXII","XXIII":"XXIII","XXIV":"XXIV","PEACE":"PAZ","At Athena's word Odysseus gives way, glad at heart. Athena, in Mentor's shape, seals a covenant of peace between the two sides, and the kin of the dead go home.":"Por palavra de Atena Odisseu cede, alegre no coração. Atena, sob a figura de Mentor, sela um pacto de paz entre os dois lados, e os parentes dos mortos voltam para casa.","NOSTOS":"NOSTOS","So ends the Odyssey: after twenty years Odysseus is home, in his own house, beside Penelope, in the garden of his father Laertes.":"Assim termina a Odisseia: depois de vinte anos Odisseu está em casa, na sua própria casa, ao lado de Penélope, no jardim do seu pai Laertes.","SET SAIL":"ZARPAR","THE ODYSSEY":"A ODISSEIA","Nestor tells how the Achaeans left Troy divided: some with Menelaus, some with Agamemnon. Odysseus and his men turned back at Tenedos to please Agamemnon, and Nestor never saw him again; of his fate he knows nothing. He tells of Agamemnon's homecoming: Aegisthus killed him at a feast, and Orestes came in the eighth year and avenged his father. Telemachus should be like Orestes.":"Nestor conta como os aqueus deixaram Troia divididos: uns com Menelau, outros com Agamémnone. Odisseu e os seus voltaram atrás em Tênedo para agradar a Agamémnone, e Nestor nunca mais o viu; do destino dele nada sabe. Fala do regresso de Agamémnone: Egisto o matou num banquete, e Orestes veio no oitavo ano e vingou o pai. Telêmaco deve ser como Orestes. ","He turns into a lion, a serpent, a leopard, a great boar, running water, a tall tree, and Menelaus holds on. Worn out, Proteus is himself again and tells him that he has angered the gods by not sacrificing; that Ajax son of Oileus is dead; that Agamemnon was killed by Aegisthus; and that Odysseus is alive, held against his will on the island of the nymph Calypso, with no ship and no crew.":"Ele se faz leão, serpente, leopardo, grande javali, água corrente, árvore alta, e Menelau o segura. Exausto, Proteu volta a ser ele mesmo e lhe diz que irritou os deuses por não ter sacrificado; que Ajaz, filho de Oileu, morreu; que Agamémnone foi morto por Egisto; e que Odisseu está vivo, retido contra a vontade na ilha da ninfa Calipso, sem navio e sem companheiros. ","Odysseus climbs a rock for a look and sees only smoke. He sends two men and a herald inland. They meet a girl drawing water, the daughter of King Antiphates, and she takes them to her father's house. Her mother is as huge as a mountain peak. She calls Antiphates, who seizes one man and eats him; the others run for the ships, with a shout behind them. The Laestrygonians pour down like a crowd of fishermen and hurl boulders from the cliffs.":"Odisseu sobe a um rochedo para olhar e só vê fumaça. Envia dois homens e um arauto para o interior. Encontram uma moça que tirava água, filha do rei Antífates, e ela os leva à casa do pai. A mãe dela é enorme como um pico de montanha. Chama Antífates, que agarra um homem e o devora; os outros correm para os navios, com um grito atrás de si. Os lestrigões descem em massa como pescadores e arremessam blocos de pedra dos penhascos. ","They reach the island of Circe, the dread goddess with a human voice, and lie on the beach for two days and nights. On the third day Odysseus climbs a hill, sees smoke rising from a house among the oaks, and on the way back kills a great stag. He feeds the crew and divides the men in two groups; Eurylochus leads twenty-two men to search the house, and Odysseus waits with the rest.":"Chegam à ilha de Circe, a deusa terrível de voz humana, e ficam dois dias e duas noites na praia. No terceiro dia Odisseu sobe a uma colina, vê fumaça subindo de uma casa entre os carvalhos e, na volta, mata um grande veado. Alimenta a tripulação e divide os homens em dois grupos; Euríloco conduz vinte e dois homens a explorar a casa, e Odisseu espera com os demais. ","Hermes meets him in the likeness of a young man with the first down on his chin. He gives him a plant to defend him, a herb with a black root and a milk-white flower, which the gods call moly. When she strikes with her wand, he must draw his sword and rush at her as if to kill her; she will be afraid, and invite him to bed. He must accept, but first make her swear a great oath by the gods that she will not harm him.":"Hermes o encontra sob a figura de um jovem com a primeira penugem no queixo. Dá-lhe uma planta para defendê-lo, uma erva de raiz negra e flor branca como leite, que os deuses chamam móli. Quando ela o ferir com a varinha, ele deve sacar a espada e lançar-se sobre ela como para matá-la; ela terá medo e o convidará para o leito. Deve aceitar, mas antes fazê-la jurar um grande juramento pelos deuses de que não lhe fará mal. ","The drug does not work on him, and when she strikes he rushes at her with the sword. She cries out, clasps his knees and tells him he must be Odysseus, of whom Hermes told her. He will not go to bed with her or eat until his men are free; she swears the oath, and brings the men in, anoints them with another drug, and they turn into men again, younger and taller. They all weep for joy. Circe tells Odysseus to bring the rest of the crew up.":"A droga não surte efeito nele, e quando ela o fere ele se lança sobre ela com a espada. Ela grita, abraça-lhe os joelhos e diz que ele só pode ser Odisseu, de quem Hermes lhe falou. Ele não irá para o leito dela nem comerá até que os seus homens estejam livres; ela presta o juramento, faz entrar os homens, unta-os com outra droga, e eles voltam a ser homens, mais jovens e mais altos. Todos choram de alegria. Circe manda Odisseu trazer o resto da tripulação. ","Tiresias comes, with his golden sceptre, and drinks the blood. He tells Odysseus that he seeks a sweet homecoming, and the god makes it hard; Poseidon is angry because he blinded his son. Even so, they may reach home if they hold back their appetites on the island of Thrinacia, where the cattle and fat sheep of Helios graze. If they touch them, he warns, the ship and the crew will be destroyed; and if Odysseus himself escapes, he will return late, in distress, on a foreign ship, to find trouble in his house.":"Tirésias vem, com o seu cetro de ouro, e bebe o sangue. Diz a Odisseu que ele busca um doce regresso, e o deus o torna difícil; Posido está irado porque ele cegou o seu filho. Ainda assim, poderão chegar a casa se contiverem o apetite na ilha de Trinácria, onde pastam as vacas e as gordas ovelhas de Hélio. Se as tocarem, adverte, o navio e a tripulação serão destruídos; e se o próprio Odisseu escapar, voltará tarde, aflito, num navio alheio, para encontrar a desgraça em casa. ","Tiresias tells him how to deal with the suitors, by guile or by the sword. After that he must take a well-shaped oar and walk inland until he meets people who know nothing of the sea and who say that it is a winnowing shovel; there he must plant the oar in the ground and make a sacrifice to Poseidon. Death will come to him from the sea, gentle, at a ripe old age, with his people prosperous round him.":"Tirésias lhe diz como tratar com os pretendentes, por astúcia ou pela espada. Depois disso deve tomar um remo bem-feito e andar terra adentro até encontrar gente que nada sabe do mar e que diga que é uma pá de joeirar; ali deve fincar o remo no chão e fazer um sacrifício a Posido. A morte lhe virá do mar, suave, em idade avançada, com o seu povo próspero em redor. ","Odysseus hears the cattle lowing and the sheep bleating, and remembers the warnings of both Tiresias and Circe. He tells the men to sail on. Eurylochus answers that Odysseus is made of iron and that the men are exhausted; he wants to land for the night and make supper. Odysseus knows that some god is working against them, and yields, but makes the crew swear an oath not to touch any of the cattle or sheep.":"Odisseu ouve o mugido das vacas e o balido das ovelhas, e se lembra das advertências de Tirésias e de Circe. Diz aos homens que sigam adiante. Euríloco responde que Odisseu é feito de ferro e que os homens estão exaustos; quer desembarcar para passar a noite e preparar a ceia. Odisseu sabe que algum deus trabalha contra eles, e cede, mas faz a tripulação jurar que não tocará em nenhuma das vacas nem das ovelhas. ","Odysseus lashes the keel and the mast together and clings to them, driven by the South Wind back to Charybdis. In the morning he is between Scylla's rock and Charybdis, who is sucking down the sea. He springs up to the tall fig tree that grows over her and clings to it like a bat; he cannot plant his feet or climb. At last, late in the day, the keel and mast shoot up again from the whirlpool, and he lets go and drops on them, paddling with his hands. Zeus does not allow Scylla to see him.":"Odisseu amarra a quilha e o mastro e se agarra a eles, impelido pelo Noto de volta a Caribde. De manhã está entre o rochedo de Cila e Caribde, que sorve o mar. Salta para a alta figueira que cresce por cima dela e se agarra como um morcego; não pode firmar os pés nem subir. Por fim, já tarde, a quilha e o mastro saltam de novo do redemoinho, e ele os solta e cai sobre eles, remando com as mãos. Zeus não permite que Cila o veja. ","Menelaus gives Telemachus a mixing bowl of silver with a gold rim, the work of Hephaestus, a gift from King Phaedimus; and a two-handled cup. Helen gives him a robe she wove herself, for his future bride, to be held by his mother until the wedding. As they stand at the doorway, an eagle flies in from the right with a white goose in its claws, a tame bird from a farmyard, and men and women chase after it, shouting.":"Menelau dá a Telêmaco uma cratera de prata com borda de ouro, obra de Hefesto, presente do rei Fédimo; e uma taça de duas asas. Helena lhe dá um manto que ela mesma teceu, para a sua futura noiva, a ser guardado pela mãe dele até o casamento. Quando estão à porta, uma águia voa da direita com um ganso branco nas garras, ave mansa de um quintal, e homens e mulheres correm atrás dela, gritando. ","While the ship was at sea, Eumaeus told the beggar his own story. He was the son of a king in Syria; a Phoenician woman, a slave in his father's house, ran away with merchants, taking him with her, and he was sold to Laertes. He tells how Anticleia died of grief, and says how he misses her. Odysseus listens and sleeps well. At dawn the dogs do not bark when Telemachus approaches, but fawn on him.":"Enquanto o navio estava no mar, Eumeu contou ao mendigo a sua própria história. Era filho de um rei da ilha de Síria; uma mulher fenícia, escrava na casa do pai, fugiu com mercadores, levando-o consigo, e ele foi vendido a Laertes. Conta como Anticleia morreu de pesar, e diz quanta falta ela lhe faz. Odisseu escuta e dorme bem. Ao amanhecer os cães não latem quando Telêmaco se aproxima, mas lhe fazem festa. ","Eumaeus drops what he is doing and greets Telemachus like a father whose only son has come back from ten years abroad, kissing his head and eyes and hands. Telemachus asks for news of his mother; Eumaeus says she weeps day and night. The beggar rises from his seat for Telemachus, who tells him to sit; he is a guest and a suppliant. Eumaeus is then sent to the city to tell Penelope that her son is home.":"Eumeu larga o que está fazendo e saúda Telêmaco como um pai a quem volta o filho único depois de dez anos no estrangeiro, beijando-lhe a cabeça, os olhos e as mãos. Telêmaco pergunta pela mãe; Eumeu diz que ela chora dia e noite. O mendigo se levanta do assento para Telêmaco, que lhe manda sentar-se: é um hóspede e um suplicante. Eumeu é então enviado à cidade para dizer a Penélope que o filho voltou. ","While Eumaeus is gone, Athena stands at the door of the hut, in the form of a tall and beautiful woman, visible only to Odysseus; the dogs, seeing her, whimper and slink away. She nods to him, and he goes out to her. She tells him it is time to reveal himself, and to plan the death of the suitors. She touches him with her wand: clean cloak and tunic, a taller, more youthful body, dark skin, filled cheeks, and a dark beard on his chin.":"Enquanto Eumeu está fora, Atena está à porta da cabana, sob a forma de uma mulher alta e bela, visível apenas para Odisseu; os cães, ao vê-la, ganem e se esgueiram para longe. Ela lhe acena, e ele sai ao seu encontro. Diz-lhe que é hora de revelar-se e planejar a morte dos pretendentes. Toca-o com a varinha: manto e túnica limpos, um corpo mais alto e mais jovem, pele escura, faces cheias e barba escura no queixo. ","Telemachus turns away in fear, taking him for a god. Odysseus tells him: I am your father, for whom you have suffered so much. He kisses him, and the tears he has held back run down his face. Telemachus cannot believe him; Athena has played a trick. Odysseus tells him: no other Odysseus will ever come. They weep aloud, more than eagles, until the sun is about to set.":"Telêmaco se volta com medo, tomando-o por um deus. Odisseu lhe diz: sou teu pai, por quem tanto sofreste. Beija-o, e as lágrimas que continha lhe correm pelo rosto. Telêmaco não pode acreditar; Atena lhe pregou uma peça. Odisseu lhe diz: nenhum outro Odisseu virá jamais. Choram em voz alta, mais do que águias, até que o sol está prestes a se pôr. ","Odysseus asks how many suitors there are, and whether two men can face so many. Telemachus lists them: from Dulichium fifty-two young men, with six servants; from Same twenty-four; from Zacynthus twenty; from Ithaca itself twelve, with Medon the herald, the bard, and two attendants. A hundred and eight in all. Odysseus says Athena and Zeus will be enough as allies.":"Odisseu pergunta quantos são os pretendentes e se dois homens podem enfrentar tantos. Telêmaco os enumera: de Dulíquio cinquenta e dois jovens, com seis servos; de Samo vinte e quatro; de Zacinto vinte; da própria Ítaca doze, com o arauto Medonte, o aedo e dois auxiliares. Cento e oito ao todo. Odisseu diz que Atena e Zeus bastam como aliados. ","In the harbour, Telemachus' crew arrive with the ship; the herald and Eumaeus meet in the palace, each bringing the same news to Penelope. In town the suitors see the ship, and Antinous curses their failure to catch him. Amphinomus advises waiting for a sign from the gods. Penelope comes down with her maids and rebukes Antinous for his plot. Eurymachus promises that no one will touch her son, though in his heart he intends otherwise.":"No porto chega a tripulação de Telêmaco com o navio; o arauto e Eumeu se encontram no paço, cada um levando a mesma notícia a Penélope. Na cidade os pretendentes veem o navio, e Antínoo amaldiçoa o fracasso de não o terem apanhado. Anfínomo aconselha esperar um sinal dos deuses. Penélope desce com as servas e repreende Antínoo pela sua trama. Eurímaco promete que ninguém tocará no filho dela, embora no coração pense o contrário. ","At dawn Telemachus takes his spear and goes to the town. Eurycleia weeps, and the maids hug him. Penelope comes down from her room, in tears, and asks him for news; he tells her to wash and pray, and that he will go to the market to seek the stranger who came with him, Theoclymenus. Theoclymenus tells her that Odysseus is already in Ithaca, sitting or walking, and is planning the evil to come.":"Ao amanhecer Telêmaco toma a lança e vai à cidade. Euricleia chora, e as servas o abraçam. Penélope desce do quarto, em lágrimas, e lhe pede notícias; ele lhe diz que se lave e reze, e que irá à praça procurar o estrangeiro que veio com ele, Teoclímeno. Teoclímeno lhe diz que Odisseu já está em Ítaca, sentado ou andando, e prepara o mal que virá. ","The suitors tell Antinous he did wrong; if the beggar is a god in disguise, such things bring ruin. Telemachus keeps his anger in. In the upper room Penelope hears of it and curses Antinous, and tells Eumaeus to bring the beggar to her that evening: she hopes he may have news of her husband. Odysseus says he will speak with her after dusk, when the suitors have gone, since he fears their violence.":"Os pretendentes dizem a Antínoo que ele agiu mal; se o mendigo é um deus disfarçado, tais coisas trazem a ruína. Telêmaco contém a ira. No quarto de cima Penélope ouve o caso e amaldiçoa Antínoo, e manda Eumeu trazer-lhe o mendigo naquela tarde: espera que ele tenha notícias do marido. Odisseu diz que falará com ela depois do crepúsculo, quando os pretendentes se tiverem ido, pois teme a violência deles. ","The nurse sees the scar, left by a boar's tusk when he went to hunt on Mount Parnassus with the sons of his mother's father Autolycus, a man who surpassed everyone in theft and oaths, and who had named him Odysseus. As soon as her hands touch it, she drops his foot, and the basin overturns. Joy and grief seize her; tears fill her eyes. She cannot speak. Athena has turned Penelope's attention elsewhere, so that she does not notice.":"A ama vê a cicatriz, deixada pela presa de um javali quando ele foi caçar no monte Parnaso com os filhos do pai de sua mãe, Autólico, homem que superava todos no roubo e no juramento, e que lhe pusera o nome de Odisseu. Assim que as mãos dela a tocam, larga-lhe o pé, e a bacia se vira. Alegria e dor a tomam; lágrimas lhe enchem os olhos. Não consegue falar. Atena desviou a atenção de Penélope, de modo que ela nada nota. ","Penelope awakes and prays to Artemis to end her life, or take her to Hades, rather than live to please a lesser man. Odysseus hears her and asks Zeus for a sign; Zeus thunders from a clear sky, and Odysseus rejoices. A weary woman at the mill, one of twelve grinding the barley, who has stopped at the sound, prays that this be the day of the suitors' last feast.":"Penélope acorda e reza a Ártemis que lhe ponha termo à vida, ou a leve para Hades, antes que viva para agradar a um homem inferior. Odisseu a ouve e pede um sinal a Zeus; Zeus troveja de um céu limpo, e Odisseu se alegra. Uma mulher cansada no moinho, uma das doze que moíam a cevada, que parou ao ouvir o som, reza para que seja este o dia do último banquete dos pretendentes. ","It is the day of the festival of Apollo. Melanthius leads the best goats; Philoetius the cowherd brings a heifer; Eumaeus brings pigs. Philoetius greets the beggar kindly, and says that if Odysseus were to return he would fight for him. Odysseus tells him that he will be here before he leaves. Meanwhile the suitors plan to kill Telemachus, but a bird, an eagle with a dove in its claws, flies on the left, and Amphinomus says it is a bad omen.":"É o dia da festa de Apolo. Melântio conduz as melhores cabras; Filécio, o vaqueiro, traz uma novilha; Eumeu traz porcos. Filécio saúda o mendigo com bondade e diz que, se Odisseu voltasse, lutaria por ele. Odisseu lhe diz que ele estará aqui antes de partir. Entretanto os pretendentes planejam matar Telêmaco, mas uma ave, uma águia com uma pomba nas garras, voa à esquerda, e Anfínomo diz que é mau presságio. ","Athena makes the suitors laugh uncontrollably, though they do not know why. The meat they eat is dripping with blood; their eyes fill with tears. Theoclymenus tells them that he sees their heads, faces and knees shrouded in night, walls and rafters spattered with blood, the vestibule and courtyard full of ghosts going down into the dark. The sun has vanished from the sky. The suitors laugh at him, and Eurymachus has him thrown out. Theoclymenus leaves, saying he has eyes and ears and feet and a sound mind, and will escape the ruin.":"Atena faz os pretendentes rirem sem controle, embora não saibam por quê. A carne que comem pinga sangue; os olhos se lhes enchem de lágrimas. Teoclímeno lhes diz que vê as cabeças, os rostos e os joelhos deles envoltos em noite, paredes e vigas salpicadas de sangue, o vestíbulo e o pátio cheios de fantasmas descendo para as trevas. O sol sumiu do céu. Os pretendentes riem dele, e Eurímaco manda expulsá-lo. Teoclímeno sai, dizendo que tem olhos, ouvidos, pés e juízo são, e escapará à ruína. ","Odysseus follows Eumaeus and Philoetius out of the hall. He asks them: what would you do if Odysseus were to come back at once? Both say they would fight for him. Then he reveals himself: I am the man you long for, back after twenty years. He shows the scar from the boar's tusk at Parnassus. They throw their arms round him, weep and kiss his head and shoulders. He tells them to be quiet, and gives his orders: Eumaeus must bring him the bow in the hall, and tell Eurycleia to bar the women's doors; Philoetius is to lock the courtyard gate and tie it with a cable.":"Odisseu segue Eumeu e Filécio para fora do salão. Pergunta-lhes: que fariam se Odisseu voltasse agora mesmo? Ambos dizem que lutariam por ele. Então se revela: sou o homem que desejais, de volta depois de vinte anos. Mostra a cicatriz da presa do javali no Parnaso. Eles o abraçam, choram e lhe beijam a cabeça e os ombros. Ele lhes manda calar e dá as suas ordens: Eumeu deve trazer-lhe o arco no salão e dizer a Euricleia que tranque as portas das mulheres; Filécio deve fechar o portão do pátio e atá-lo com um cabo. ","Odysseus says to Telemachus: the stranger in your hall has not missed, nor taken long to string the bow; my strength is still unbroken, and the suitors do not mock me now. It is time for the evening meal. And he gives a sign to Telemachus, who girds on his sword, takes his spear, and stands by his father's chair, in gleaming bronze.":"Odisseu diz a Telêmaco: o estrangeiro no teu salão não errou, nem demorou a armar o arco; a minha força continua intacta, e os pretendentes já não zombam de mim. É hora da ceia. E faz um sinal a Telêmaco, que cinge a espada, toma a lança e se põe junto à cadeira do pai, em bronze reluzente. ","Penelope sits opposite him in the firelight and says nothing; she studies his face, and sometimes thinks she knows him, and sometimes, in his rags, she does not. Telemachus says that no other woman would be so hard-hearted. Odysseus smiles and tells Telemachus to leave her to test him, and bids him arrange a way to hide the killings: a bath for him, music and dancing in the hall, so that passers-by think a wedding is going on.":"Penélope se senta em frente a ele, à luz do fogo, e nada diz; estuda-lhe o rosto, e às vezes pensa que o conhece, e às vezes, nos seus trapos, não. Telêmaco diz que nenhuma outra mulher seria tão dura de coração. Odisseu sorri e manda Telêmaco deixá-la pô-lo à prova, e lhe pede que arranje um modo de esconder as mortes: um banho para ele, música e dança no salão, para que os passantes pensem que há um casamento. ","Odysseus, washed and dressed, comes out looking like a god; Athena has made him taller and thicker, his hair thick like hyacinths. He tells Penelope that she has a heart of iron. She tells Eurycleia to bring out their bed from the bridal chamber, which Odysseus built himself, and spread it with fleeces. Odysseus is furious: who has moved my bed? It was made with a living olive tree growing in the courtyard, with a trunk thick as a pillar, round which I built the room, and cut off the branches and shaped the stump into a bedpost.":"Odisseu, banhado e vestido, sai com aspecto de deus; Atena o fez mais alto e mais robusto, os cabelos espessos como jacintos. Diz a Penélope que ela tem um coração de ferro. Ela manda Euricleia tirar do quarto nupcial a cama deles, que o próprio Odisseu construiu, e cobri-la de peles. Odisseu se enfurece: quem moveu o meu leito? Foi feito de uma oliveira viva que crescia no pátio, de tronco grosso como uma coluna, em torno da qual construí o quarto, e cortei-lhe os ramos e talhei o toco em pé de cama. ","They tell each other their stories: she, how she endured the suitors; he, all his wanderings, from the Cicones to Calypso and the Phaeacians. He tells her what Tiresias foretold, that he must set out again with an oar on his shoulder, until he meets men who know nothing of the sea, and sacrifice to Poseidon. After that, death will come to him gently from the sea. Penelope says that if the gods make a better old age, there is hope of release. Then they go to bed, and sleep comes. In the morning Odysseus, with Telemachus and the herdsmen, takes up arms and goes out to the farm.":"Contam um ao outro as suas histórias: ela, como suportou os pretendentes; ele, todas as suas errâncias, dos cíconos a Calipso e aos feácios. Diz-lhe o que Tirésias predisse, que deve partir de novo com um remo ao ombro, até encontrar homens que nada sabem do mar, e sacrificar a Posido. Depois disso a morte lhe virá suavemente do mar. Penélope diz que, se os deuses fizerem uma velhice melhor, há esperança de alívio. Depois vão para a cama, e o sono vem. De manhã Odisseu, com Telêmaco e os pastores, toma as armas e vai para a chácara. ","Achilles says to Agamemnon: we thought you were loved by Zeus above all men, yet death overtook you before your time, not in glory at Troy. Agamemnon answers: you were fortunate to die at Troy, with the best of Greeks fighting round your body for three days, and then you were buried with splendid games and a golden urn. Amphimedon, the suitor, tells the whole story: how Odysseus returned and how they died. Agamemnon calls Odysseus fortunate to have so faithful a wife; the fame of Penelope's virtue will never perish, whereas Clytemnestra's shame will stay.":"Aquiles diz a Agamémnone: pensávamos que Zeus te amava acima de todos os homens, e no entanto a morte te colheu antes do tempo, não em glória em Troia. Agamémnone responde: foste afortunado em morrer em Troia, com os melhores dos gregos lutando em torno do teu corpo por três dias, e depois foste sepultado com esplêndidos jogos e uma urna de ouro. Anfimedonte, o pretendente, conta toda a história: como Odisseu voltou e como eles morreram. Agamémnone chama Odisseu afortunado por ter esposa tão fiel; a fama da virtude de Penélope jamais perecerá, ao passo que a vergonha de Clitemnestra permanecerá.","Odysseus ties the thick-fleeced black rams in threes with willow shoots from the giant's own bedding. The middle ram carries a man; the two beside it guard him. Odysseus chooses the finest ram of the flock for himself, swings under its belly, and holds on by the wool with his hands. They wait for dawn.":"Odisseu amarra os carneiros negros de lã espessa de três em três com varas de salgueiro tiradas da cama do próprio gigante. O carneiro do meio leva um homem; os dois ao lado o guardam. Odisseu escolhe para si o melhor carneiro do rebanho, pendura-se sob a sua barriga e se agarra à lã com as mãos. Esperam o amanhecer.","\"NOBODY\"":"\"NINGUÉM\"","Odysseus offers the wine in a bowl of ivy wood. The Cyclops drinks, asks for more, and asks his name, promising a guest-gift. After three bowls Odysseus answers: \"My name is Nobody. My father and mother and all my friends call me Nobody.\" The Cyclops says he will eat Nobody last, and that is his gift. Then he falls on his back, and Sleep overcomes him; he vomits wine and human flesh.":"Odisseu oferece o vinho numa tigela de madeira de hera. O Ciclope bebe, pede mais, e pergunta o seu nome, prometendo um presente de hóspede. Depois de três tigelas Odisseu responde: \"Meu nome é Ninguém. Meu pai e minha mãe e todos os meus amigos me chamam Ninguém.\" O Ciclope diz que comerá Ninguém por último, e que esse é o seu presente. Depois cai de costas, e o Sono o vence; vomita vinho e carne humana.","Polyphemus groans that an old prophecy has come true: the seer Telemus foretold that Odysseus would take his sight, and he had expected a large and noble man, not a weakling who beat him with wine. He calls Odysseus back to receive a guest-gift. Odysseus answers that he wishes he could send him to Hades as surely as the god will not heal his eye. Polyphemus then lifts his hands to the stars and prays to Poseidon, his father: that Odysseus may never reach home; or if it is fated, that he arrive late and in distress, in another man's ship, with every companion lost, and find trouble in his house. The dark-haired god hears. The giant hurls a second, larger rock, which falls just behind the stern and drives the ship across to the island.":"Polifemo geme que uma antiga profecia se cumpriu: o adivinho Télemo predisse que Odisseu lhe tiraria a vista, e ele esperava um homem grande e nobre, não um fraco que o venceu com vinho. Chama Odisseu de volta para receber um presente de hóspede. Odisseu responde que gostaria de poder mandá-lo a Hades tão certamente quanto o deus não lhe curará o olho. Polifemo então ergue as mãos às estrelas e reza a Posido, seu pai: que Odisseu jamais chegue a casa; ou, se está no destino, que chegue tarde e aflito, em navio alheio, com todos os companheiros perdidos, e encontre desgraça em casa. O deus de cabelos escuros o ouve. O gigante arremessa uma segunda rocha, maior, que cai logo atrás da popa e leva o navio para a ilha.","/7)  ·  E / CLICK":"/7)  ·  E / CLIQUE","Back at Aeaea, Circe tells Odysseus what lies ahead. The Sirens enchant every man who comes near, and none who hears them ever sees home again; they sit in a meadow beside a great heap of rotting bones with shrivelled skin. Row past, she says, and soften wax to stop your companions' ears. If you wish to hear, have them bind you hand and foot upright to the mast, and if you beg to be freed, tie you tighter still.":"De volta a Eeia, Circe diz a Odisseu o que o espera. As Sereias enfeitiçam todo homem que se aproxima, e nenhum que as ouve volta a ver o lar; sentam-se num prado ao lado de um grande monte de ossos podres de pele ressecada. Passa remando, diz ela, e amolece cera para tapar os ouvidos dos companheiros. Se quiseres ouvir, manda-os atar-te de pés e mãos, de pé, ao mastro, e se pedires para ser solto, que te apertem ainda mais.","DAY ":"DIA ","Language":"Idioma","About":"Sobre","Português":"Português","Nostos is Homer's Odyssey, played one episode at a time. After ten years at Troy, Odysseus spends ten more trying to reach Ithaca, where his wife Penelope and his son Telemachus wait among suitors who devour his house. The game follows the poem's twenty-four books in order, from the council of the gods to the peace on Ithaca. Each scene is a short task, and each story card retells what the poem tells at that point. Nothing is added and nothing is changed: there are no branches and no other endings. The English follows Ian Johnston's translation, with Robert Fagles and E. V. Rieu consulted beside it, and the Portuguese follows Carlos Alberto Nunes. All the words on the cards are our own retelling. The pictures are in the manner of Athenian black-figure vases.":"Nostos é a Odisseia de Homero, jogada um episódio de cada vez. Depois de dez anos em Troia, Odisseu passa mais dez tentando chegar a Ítaca, onde a esposa Penélope e o filho Telêmaco esperam entre pretendentes que devoram a sua casa. O jogo segue os vinte e quatro cantos do poema em ordem, do conselho dos deuses à paz em Ítaca. Cada cena é uma pequena prova, e cada cartão conta de novo o que o poema conta naquele ponto. Nada é acrescentado e nada é mudado: não há ramificações nem outros finais. O inglês segue a tradução de Ian Johnston, com Robert Fagles e E. V. Rieu consultados ao lado, e o português segue Carlos Alberto Nunes. Todas as palavras dos cartões são nosso próprio reconto. As imagens seguem a maneira dos vasos áticos de figuras negras."};

function tr(s){
  if(LANG!=='pt'||typeof s!=='string'||!s)return s;
  let r=TRC[s];if(r!==undefined)return r;
  if(PT[s]!==undefined)r=PT[s];
  else{const t=s.trim();
    if(PTT[t]!==undefined)r=s.slice(0,s.length-s.trimStart().length)+PTT[t]+s.slice(s.trimEnd().length);
    else{r=s;if(/[A-Za-z]{3}/.test(s)){let hit=false;for(const k of PTK)if(r.includes(k)){r=r.split(k).join(PT[k]);hit=true;}if(!hit||/\b(the|and|of|his|her|is|to)\b/i.test(r))MISS.push(s);}}}
  return TRC[s]=r;
}

/* ---- black-figure figures ---- */
function flower(x,y,t,sc){
  sc=sc||1;g.save();g.translate(x,y);g.scale(sc,sc);
  g.strokeStyle=C.ink;g.lineWidth=2;g.beginPath();g.moveTo(0,4);g.lineTo(0,20);g.moveTo(0,14);g.lineTo(-7,9);g.stroke();
  g.fillStyle=C.cream;for(let i=0;i<7;i++){const a=i*Math.PI*2/7+(t||0)*.15;g.beginPath();g.ellipse(Math.cos(a)*9,Math.sin(a)*9,8,3.6,a,0,7);g.fill();}
  g.fillStyle=C.ink;g.beginPath();g.arc(0,0,4.5,0,7);g.fill();g.restore();
}
/* Polyphemus: st = stand | blind | sleep ; reach = arms out */
function poly(x,y,s,st,dir,reach){
  g.save();g.translate(x,y);g.scale((dir||1)*s,s);g.lineCap='round';g.lineJoin='round';
  if(st==='sleep'){g.translate(0,-30);g.rotate(Math.PI/2);g.translate(0,30);}
  g.strokeStyle=C.ink;g.fillStyle=C.ink;
  g.lineWidth=20;g.beginPath();g.moveTo(-15,-40);g.lineTo(-18,-4);g.moveTo(15,-40);g.lineTo(18,-4);g.stroke();
  g.lineWidth=9;g.beginPath();g.moveTo(-18,-3);g.lineTo(-30,0);g.moveTo(18,-3);g.lineTo(30,0);g.stroke();
  g.beginPath();g.ellipse(0,-78,40,52,0,0,7);g.fill();
  g.fillStyle=C.red;g.beginPath();g.moveTo(-26,-38);g.lineTo(26,-38);g.lineTo(30,-18);g.lineTo(18,-26);g.lineTo(6,-16);g.lineTo(-6,-26);g.lineTo(-18,-16);g.lineTo(-30,-18);g.closePath();g.fill();
  for(let i=0;i<5;i++){inc([[-22+i*11,-100],[-24+i*12,-62]],1);}
  inc([[-26,-92],[0,-86],[26,-92]],1.2);inc([[-22,-72],[0,-66],[22,-72]],1.2);
  g.strokeStyle=C.ink;g.lineWidth=17;
  if(reach){g.beginPath();g.moveTo(-34,-110);g.lineTo(-30,-95);g.lineTo(-62,-92);g.moveTo(34,-110);g.lineTo(30,-95);g.lineTo(62,-90);g.stroke();}

function mover(a,dt){
  if(a.px===undefined){a.px=a.x;a.py=a.y;a.amp=0;a.walk=a.walk||0;a.dv=a.dir||1;}

  if(Math.abs(dx)>.25)a.dir=Math.sign(dx);

}

      const d=dist(e.x,e.y,e.tx,e.ty);if(d>4){e.x+=(e.tx-e.x)/d*30*dt;e.y+=(e.ty-e.y)/d*34*dt;e.walk+=dt*5;}

function wrapT(str,x,y,w,lh,font,col){
  str=tr(str);g.font=font||'600 17px Cinzel,Georgia,serif';g.fillStyle=col||C.cream;g.textAlign='center';g.textBaseline='alphabetic';
  const words=str.split(' ');let line='',yy=y;
  for(const wd of words){const t=line?line+' '+wd:wd;if(g.measureText(t).width>w&&line){g.fillText(line,x,yy);yy+=lh;line=wd;}else line=t;}
  if(line){g.fillText(line,x,yy);yy+=lh;}
  return yy;
}
function eye(x,y,open,s){g.save();g.translate(x,y);g.scale(s||1,s||1);g.strokeStyle=C.cream;g.fillStyle=C.ink;g.lineWidth=2.4;
  if(open){g.beginPath();g.moveTo(-18,0);g.quadraticCurveTo(0,-16,18,0);g.quadraticCurveTo(0,16,-18,0);g.fill();g.stroke();g.fillStyle=C.red;g.beginPath();g.arc(0,0,6,0,7);g.fill();g.fillStyle=C.cream;g.beginPath();g.arc(-2,-2,2,0,7);g.fill();}
  else{g.beginPath();g.moveTo(-18,0);g.quadraticCurveTo(0,10,18,0);g.stroke();for(const k of [-9,0,9]){g.beginPath();g.moveTo(k,4);g.lineTo(k*1.2,10);g.stroke();}}

/* ROW: alternate A and D to the beat */
MX.row={
  init(st,s){const h=st.hero;h.o=Object.assign({},h.o,{still:false});return{bt:0,hits:0,last:-1,flash:0,x0:h.x,x1:s.to||h.x+380};},
  update(st,tk,dt){const s=tk.s,per=s.per||.85,h=st.hero;tk.bt+=dt;tk.flash=Math.max(0,tk.flash-dt*3);
    h.o.oar=tk.bt/per*Math.PI;const tx=tk.x0+(tk.x1-tk.x0)*(tk.hits/s.n);h.x+=(tx-h.x)*Math.min(1,dt*3);},
  side(bi){return bi%2?-1:1;},
  press(st,tk,side){const per=tk.s.per||.85,bi=Math.round(tk.bt/per);
    if(bi>=1&&Math.abs(tk.bt-bi*per)<per*.24&&bi!==tk.last&&(side===0||side===this.side(bi))){
      tk.last=bi;tk.hits++;sfx('good');st.fx.push({k:'ping',t:.4});if(tk.hits>=tk.s.n)st.done();}
    else{tk.flash=1;toast(tk.s.miss||'Out of time.',.7);sfx('bad');}},
  tap(st,tk){this.press(st,tk,0);},
  click(st,tk,x){this.press(st,tk,x<W/2?-1:1);},
  key(st,tk,k){if(k==='a'||k==='arrowleft')this.press(st,tk,-1);else if(k==='d'||k==='arrowright')this.press(st,tk,1);else if(k==='e'||k===' ')this.press(st,tk,0);},
  end(st,tk){st.hero.o=Object.assign({},st.hero.o,{still:true});delete st.hero.o.oar;},
  draw(st,tk,t){const s=tk.s,per=s.per||.85,ph=(tk.bt/per)%1,bi=Math.round(tk.bt/per);
    const inW=bi>=1&&Math.abs(tk.bt-bi*per)<per*.24&&bi!==tk.last;

/* TRACE: follow the thread with the pointer */

/* LYRE: strike the notes as they reach the line */
MX.lyre={
  init(st,s){const n=s.n||18,seq=[];let r=s.seed||7;for(let i=0;i<n;i++){r=(r*1103515245+12345)&0x7fffffff;seq.push((r>>8)%3);}

  LX:[W/2-130,W/2,W/2+130],
  hit(st,tk,lane){const s=tk.s,sp=s.gap||.62,fall=1.5;
    for(let i=0;i<tk.seq.length;i++){const tt=i*sp;if(tk.res[i]!==undefined)continue;const d=tk.t-tt;
      if(tk.seq[i]===lane&&Math.abs(d)<.2){tk.res[i]=1;tk.hits++;sfx('good');tk.flash=1;return;}}

  key(st,tk,k){const m={a:0,arrowleft:0,s:1,arrowdown:1,d:2,arrowright:2}[k];if(m!==undefined)this.hit(st,tk,m);},
  click(st,tk,x){const L=this.LX;let b=0;for(let i=1;i<3;i++)if(Math.abs(x-L[i])<Math.abs(x-L[b]))b=i;this.hit(st,tk,b);},
  update(st,tk,dt){const s=tk.s,sp=s.gap||.62,need=Math.ceil(tk.seq.length*(s.need||.6));tk.t+=dt;tk.flash=Math.max(0,tk.flash-dt*4);

  draw(st,tk,t){const s=tk.s,sp=s.gap||.62,fall=1.5,y0=96,y1=H-150,L=this.LX,need=Math.ceil(tk.seq.length*(s.need||.6));

      g.globalAlpha=tk.res[i]===0?.3:1;g.fillStyle=C.cream;g.strokeStyle=C.ink;g.lineWidth=2;g.beginPath();g.arc(L[tk.seq[i]],y,14,0,7);g.fill();g.stroke();g.globalAlpha=1;}

/* ================= EPISODES: BOOKS I–VIII ================= */

  else if(k==='boar'){g.beginPath();g.ellipse(0,-26,34,19,0,0,7);g.fill();g.beginPath();g.moveTo(-30,-38);g.lineTo(-52,-26);g.lineTo(-30,-14);g.fill();g.lineWidth=6;g.beginPath();g.moveTo(-16,-14);g.lineTo(-16,0);g.moveTo(14,-14);g.lineTo(14,0);g.stroke();g.strokeStyle=C.cream;g.lineWidth=2;g.beginPath();g.moveTo(-48,-20);g.quadraticCurveTo(-54,-28,-46,-32);g.stroke();inc([[-14,-40],[0,-46],[14,-40]],1.3);}
  else if(k==='water'){g.strokeStyle=C.ink;g.lineWidth=3;for(let r=0;r<3;r++){g.beginPath();for(let a=-60;a<=60;a+=6){const yy=-8-r*14+Math.sin((a+t*60)/10)*5;a===-60?g.moveTo(a,yy):g.lineTo(a,yy);}g.stroke();}}
  else if(k==='tree'){g.fillRect(-4,-70,8,70);g.beginPath();g.ellipse(0,-84,26,20,0,0,7);g.fill();inc([[-12,-86],[-8,-78]],1.2);inc([[6,-90],[10,-82]],1.2);}
  g.restore();
}
const SHAPES=['lion','serpent','leopard','boar','water','tree'];

/* ---------- BOOK I ---------- */
EP.b1={book:'BOOK I',bk:1,hero:{x:130,o:TEL,s:1,y:FLOOR},steps:[
  {k:'card',c:[
   ['THE COUNCIL OF THE GODS','On Olympus the gods are gathered. Poseidon is away among the Ethiopians, and Athena seizes her chance to speak for Odysseus, who has been held for years on Calypso\'s island. Zeus agrees that he should go home. Athena flies down to Ithaca in the shape of Mentes, a Taphian chief, and Hermes is sent to Calypso.',[F(140,ATH,1.7),F(400,{cloak:C.red,beard:true,long:true,carry:'staff',white:true},1.9,-1)]]
  ]},
  {k:'bg',v:'hall',o:{rich:true,fire:480,door:870}},
  {k:'cast',add:[SUIT(300),SUIT(380),SUIT(640),SUIT(720),{t:'table',x:340,y:FLOOR,w:140,food:true},{t:'table',x:680,y:FLOOR,w:140,food:true}]},
  {k:'cast',add:[F(850,MENT,1,-1,'ath')]},
  {k:'card',c:[['THE HALL OF ODYSSEUS','Young Telemachus sits among the suitors, dreaming that his father might come home and drive them out. He sees a stranger waiting at the gate, and is ashamed that a guest should stand outside.',[F(180,TEL,1.7),F(400,MENT,1.7,-1)]]]},
  {k:'walk',hint:'WALK TO THE STRANGER AT THE DOOR',to:[[800,'WELCOME THE GUEST']]},
  {k:'walk',hint:'LEAD HIM TO A SEAT AND SEE HIM FED',to:[[480,'A SEAT BY THE FIRE'],[340,'BRING WATER AND FOOD']],stand:1.2,then:s=>{s.byId('ath').x=520;}},
  {k:'card',c:[
   ['MENTES\' ADVICE','The guest says he is Mentes, chief of the Taphians, and that Odysseus is alive, held on an island by a nymph. He tells Telemachus to call the Achaeans to assembly and order the suitors to disperse, then to sail to Pylos for Nestor\'s news and on to Sparta, to Menelaus. If he hears his father is dead, he must give his mother in marriage.',[F(160,TEL,1.7),F(400,MENT,1.7,-1)]],
   ['A BIRD IN THE RAFTERS','Athena leaves like a bird in flight. Telemachus feels his strength rise, and knows a god has spoken to him. Below, the bard Phemius is singing of the Achaeans\' unhappy return from Troy.']]},
  {k:'cast',add:[F(560,{pale:true,long:true,veil:true},1,-1,'pen2')]},
  {k:'walk',hint:'GO TO YOUR MOTHER',to:[[470,'PENELOPE AT THE STAIRS']]},
  {k:'card',c:[['PENELOPE COMES DOWN','Penelope begs the bard to choose another song. Telemachus answers that the singer is free to sing what the god puts in him, and that she should go to her rooms and see to her weaving: speech is for men, and for him most of all. Amazed, she goes up with her maids and weeps for Odysseus until Athena sheds sleep on her eyes.',[F(180,{pale:true,long:true,veil:true},1.7),F(400,TEL,1.7,-1)]]]}
]};

/* ---------- BOOK II ---------- */
EP.b2={book:'BOOK II',bk:2,hero:{x:150,o:TEL,s:1},steps:[
  {k:'bg',v:'court',o:{}},
  {k:'cast',add:[SUIT(560),SUIT(640),SUIT(720),SUIT(800),F(330,{cloak:C.cream,beard:true,white:true,carry:'staff',stoop:true},1,1,'aeg'),{t:'box',x:460,y:FLOOR},{t:'tree',x:900,y:FLOOR,kind:'olive',s:1}]},
  {k:'card',c:[['THE ASSEMBLY','At dawn Telemachus takes his spear and goes to the meeting-place, followed by two dogs. No assembly has been called in Ithaca since Odysseus left. The old man Aegyptius speaks first, whose son went with Odysseus and was eaten by the Cyclops. Telemachus says openly that the suitors are devouring his house, and bursts into tears, throwing the speaker\'s staff to the ground.',[F(180,TEL,1.7),{t:'dog',x:300,s:1.4}]]]},
  {k:'walk',hint:'WALK TO THE SPEAKER\'S STONE',to:[[430,'TAKE THE STAFF AND SPEAK']],stand:1.6},
  {k:'card',c:[
   ['ANTINOUS REPLIES','Antinous answers that the fault is Penelope\'s. For three years and now a fourth she has put them off: she wove a great shroud for old Laertes, promising to choose a husband when it was done, and each night she unpicked by torchlight what she wove by day, until a maid betrayed her. He tells Telemachus to send his mother back to her father.'],
   ['THE EAGLES','Zeus sends two eagles from a mountain peak. They wheel over the assembly, tear each other\'s faces and necks, and fly off to the right. Halitherses reads the sign: Odysseus is already near and is bringing death to the suitors. Eurymachus mocks the old man\'s prophecy.']]},
  {k:'trace',ph:0,amp:80,hint:'PENELOPE\'S WEB  ·  BY DAY SHE WEAVES  ·  HOLD AND FOLLOW THE THREAD'},
  {k:'trace',ph:.6,amp:80,rev:true,hint:'BY NIGHT SHE UNPICKS IT  ·  HOLD AND FOLLOW THE THREAD BACK'},
  {k:'walk',hint:'ASK FOR A SHIP AND TWENTY ROWERS  ·  WALK TO THE SHORE',to:[[760,'FIND MENTOR, WHO IS ATHENA']],stand:1.4,then:s=>{s.byId('aeg').x=700;}},
  {k:'card',c:[['MENTOR','Telemachus asks the assembly for a fast ship and twenty rowers. Mentor, old comrade of Odysseus, rebukes the people for sitting silent. Leocritus brushes it off. As the meeting breaks up, Athena, in Mentor\'s form, promises to find the ship and the crew and to sail with him. She tells him to go home and make ready the provisions.',[F(180,TEL,1.7),F(400,MENT,1.7,-1)]]]},
  {k:'bg',v:'hall',o:{rich:true,door:870}},
  {k:'cast',clear:true,add:[SUIT(380),SUIT(460),{t:'table',x:420,y:FLOOR,w:140,food:true},{t:'box',x:140,y:FLOOR},{t:'box',x:200,y:FLOOR},F(100,{pale:true,long:true,white:true,stoop:true},1,1,'eur')]},
  {k:'hero',h:{x:600,dir:-1}},
  {k:'card',c:[['PROVISIONS BY NIGHT','Telemachus tells old Eurycleia to draw off twelve jars of wine and fill twenty measures of barley meal in sewn leather sacks, and to tell no one, not even his mother, until twelve days have passed or until she asks for him. Eurycleia swears an oath to the gods. Meanwhile Athena, in Telemachus\' likeness, gathers a crew and borrows a ship from Noemon.']]},
  {k:'walk',hint:'CARRY THE JARS AND SACKS TO THE DOOR',to:[[200,'THE WINE JARS'],[140,'THE BARLEY SACKS'],[860,'CARRY THEM TO THE SHIP']],stand:1.1},
  {k:'bg',v:'shore',o:{ship:560}},
  {k:'cast',clear:true,add:[F(380,{...ATH,cloak:C.cream,helm:true,pale:false,long:false,beard:true},1,1,'m')]},
  {k:'hero',h:{x:330,dir:1}},
  {k:'tug',foe:640,gain:.075,pull:.17,hint:'HAUL THE SHIP DOWN TO THE SEA  ·  TAP SPACE OR CLICK, OR A AND D IN TURN',lose:'The sand holds her fast!'},
  {k:'card',c:[['THE LAUNCH','They carry the gear aboard, set the mast, hoist the white sails and pour libations to the immortals, above all to Athena. At her prompting a following wind blows from the west, and the ship runs all night over the dark water.',[{t:'ship',x:280,y:290,s:2.4},]]]}
]};

/* ---------- BOOK III ---------- */
EP.b3={book:'BOOK III',bk:3,hero:{x:130,o:TEL,s:1},steps:[
  {k:'bg',v:'shore',o:{}},
  {k:'cast',add:[{t:'altar',x:440,y:FLOOR},F(560,{cloak:C.cream,beard:true,white:true,carry:'staff'},1,-1,'nes'),F(640,{cloak:C.pale},1,-1),F(710,{cloak:C.cream,beard:true},1,-1),F(780,{cloak:C.pale},1,-1),{t:'ox',x:860,s:.9,dir:-1}]},
  {k:'card',c:[['PYLOS','At sunrise the ship comes to Pylos, where Nestor and his people are on the shore sacrificing black bulls to Poseidon. There are nine groups, each of five hundred men, and each group has nine bulls. Nestor\'s son Pisistratus brings Telemachus and Athena, who is in Mentor\'s shape, to sit by the feast and offers them the first portions.',[{t:'altar',x:280},F(420,{cloak:C.cream,beard:true,white:true},1.7,-1)]]]},
  {k:'walk',hint:'JOIN THE SACRIFICE ON THE SHORE',to:[[520,'GREET NESTOR']],stand:1.4},
  {k:'ring',n:4,per:1.15,at:[440,520],hint:'POUR THE LIBATION · PRESS WHEN THE RING CLOSES  ·  SPACE OR CLICK',miss:'The offering waits. Steady.'},
  {k:'card',c:[
   ['NESTOR\'S TALE','Nestor tells how the Achaeans left Troy divided: some with Menelaus, some with Agamemnon. Odysseus and his men turned back at Tenedos to please Agamemnon, and Nestor never saw him again; of his fate he knows nothing. He tells of Agamemnon\'s homecoming: Aegisthus killed him at a feast, and Orestes came in the eighth year and avenged his father. Telemachus should be like Orestes.'],
   ['THE EAGLE','Athena, leaving, changes into a sea-eagle and flies off, and everyone is amazed. Nestor knows it was a god. He vows a heifer with gilded horns to her, and the sons of Nestor carry out the sacrifice at dawn. Then Telemachus goes by chariot, with Pisistratus beside him, towards Sparta.',[F(160,ATH,1.7),{t:'altar',x:420}]]]},
  {k:'walk',hint:'NESTOR\'S SONS STAND READY. GO TO THE CHARIOT',to:[[780,'TO SPARTA, WITH PISISTRATUS']],stand:1.6}
]};

/* ---------- BOOK IV ---------- */
EP.b4={book:'BOOK IV',bk:4,hero:{x:120,o:TEL,s:1},steps:[
  {k:'bg',v:'hall',o:{rich:true,fire:480,door:880}},
  {k:'cast',add:[F(560,{cloak:C.red,beard:true,helm:false},1.05,-1,'men'),F(700,{...WM,veil:true},1,-1,'hel'),{t:'table',x:380,y:FLOOR,w:200,food:true}]},
  {k:'card',c:[['SPARTA','Telemachus and Pisistratus reach the house of Menelaus, where a double wedding feast is under way: his daughter Hermione is being sent to Neoptolemus, and his son to a daughter of Alector. A servant asks whether the strangers should be sent on, and Menelaus answers that guests must be welcomed. They are bathed, clothed and fed. Telemachus whispers his awe at the gold, amber and ivory of the hall.',[F(190,TEL,1.7),F(400,{cloak:C.red,beard:true},1.7,-1)]]]},
  {k:'walk',hint:'GREET THE KING OF SPARTA',to:[[500,'MENELAUS']],stand:1.4},
  {k:'card',c:[
   ['HELEN','Helen comes in like Artemis, and sees at once whom the young man resembles. Menelaus has also noticed the likeness to Odysseus. Telemachus weeps at his father\'s name. Helen mixes a drug in the wine that stops sorrow and anger, so that the sad tales may be told. She recalls how Odysseus entered Troy as a beggar, beaten and in rags, and told her the Greek plans.'],
   ['THE HORSE','Menelaus adds a story of his own: in the wooden horse, Helen walked round it and called out in the voices of their wives. Anticlus nearly answered, and Odysseus clamped his hand over his mouth and held him until she moved on.',[{t:'bowl',x:200},F(380,{...WM,veil:true},1.7,-1)]],
   ['PROTEUS','Menelaus tells what he learnt in Egypt. Becalmed twenty days on the island of Pharos, he was helped by the sea-goddess Eidothea, who told him to ambush her father Proteus when he came up from the sea at noon to count his seals. Hide in sealskins, hold on, and do not let go, whatever shapes he takes.']]},
  {k:'bg',v:'shore',o:{}},
  {k:'cast',clear:true,add:[F(400,{cloak:C.cream,beard:true,white:true,carry:'staff'},1.05,-1,'pro')]},
  {k:'hero',h:{x:330,dir:1,o:{cloak:C.red,beard:true,carry:'skin'},kind:'fig'}},
  {k:'hold',secs:9,hint:'HOLD HIM FAST  ·  HOLD SPACE OR THE MOUSE BUTTON',on:(st,v)=>{const i=Math.min(5,Math.floor(v*6));st.shape=SHAPES[i];},draw:st=>{if(st.shape)shape(st.shape,540,FLOOR,time);}},
  {k:'fn',f:s=>{s.shape=null;}},
  {k:'card',c:[
   ['PROTEUS SPEAKS','He turns into a lion, a serpent, a leopard, a great boar, running water, a tall tree, and Menelaus holds on. Worn out, Proteus is himself again and tells him that he has angered the gods by not sacrificing; that Ajax son of Oileus is dead; that Agamemnon was killed by Aegisthus; and that Odysseus is alive, held against his will on the island of the nymph Calypso, with no ship and no crew.'],
   ['THE AMBUSH','Menelaus bids Telemachus stay as long as he wishes. In Ithaca the suitors learn that Telemachus has sailed. Antinous takes a ship and twenty men to lie in wait in the strait between Ithaca and Same, off the isle of Asteris, to kill him on his way back. Penelope hears of it from the herald Medon and weeps, and Athena sends a dream-image to comfort her: her son will come home.']]}
]};

/* ---------- BOOK V ---------- */
EP.b5={book:'BOOK V',bk:5,hero:{x:130,o:{...OD,helm:false},s:1.05},steps:[
  {k:'card',c:[['HERMES AND CALYPSO','At the next council Athena speaks again for Odysseus, who is shut up on Ogygia, longing for home. Zeus sends Hermes with the order: the nymph must let him go. Calypso is angry at the jealousy of the gods but she obeys. She tells Odysseus to build a raft and promises not to stand in his way, and he, seated alone on the shore, weeps every day.',[F(160,{...WM},1.7),F(400,{cloak:C.red,beard:true},1.7,-1)]]]},
  {k:'bg',v:'forest',o:{kinds:['cyp','olive','cyp']}},
  {k:'cast',add:[F(740,{...WM,veil:true},1,-1,'cal')]},
  {k:'card',c:[['THE RAFT','Calypso gives Odysseus a great bronze axe and an adze. He fells twenty trees, trims them, bores and pegs the logs, and builds a broad raft on the shape of a ship\'s hold, with a mast, a steering oar, a deck and a sail cut from cloth she provides. On the fifth day he launches it.']]},
  {k:'walk',hint:'WALK TO THE GROVE',to:[[360,'THE TREES']],stand:1.2},
  {k:'ring',n:8,per:.8,at:[360,520],hint:'FELL THE TREES · STRIKE WHEN THE RING CLOSES',miss:'The axe glances off.'},
  {k:'bg',v:'sea',o:{}},
  {k:'cast',clear:true},
  {k:'hero',h:{kind:'raft',x:300,y:486,o:{mast:true}}},
  {k:'card',c:[['SEVENTEEN DAYS','He sails seventeen days, steering by the Pleiades, the Plough and Orion, keeping the Bear on his left as Calypso told him. On the eighteenth day the mountains of the Phaeacians appear. But Poseidon, coming home from the Ethiopians, sees the raft from the Solymi mountains and, in a rage, gathers the clouds and rouses every wind.']]},
  {k:'bg',v:'sea',o:{storm:true}},
  {k:'dodge',obj:'bolt',secs:13,rate:.85,hint:'POSEIDON\'S STORM  ·  STEER THE RAFT WITH A / D',hurt:'The sea strikes!'},
  {k:'bal',secs:12,force:1.6,hint:'KEEP THE RAFT LEVEL IN THE WAVES  ·  A / D AGAINST THE LEAN',lose:'The raft lurches!'},
  {k:'card',c:[['INO\'S VEIL','A great wave breaks the mast and sail, and flings Odysseus overboard. Ino Leucothea, once a mortal, takes pity on him and rises from the sea like a gull. She gives him her veil to wind round his chest and says he will not drown. Once he touches land he must untie it, throw it back into the sea, and turn his face away.']]},
  {k:'bg',v:'sea',o:{storm:true}},
  {k:'hero',h:{vis:false}},
  {k:'hold',secs:12,hint:'SWIM  ·  HOLD SPACE OR THE MOUSE BUTTON TO KEEP KICKING',draw:(st,tk)=>{const y=420+Math.sin(time*2)*4-tk.v*60;g.fillStyle=C.ink;g.beginPath();g.arc(120+tk.v*680,y,13,0,7);g.fill();g.fillStyle=C.cream;g.beginPath();g.arc(124+tk.v*680,y-2,2,0,7);g.fill();g.fillStyle=C.red;g.fillRect(104+tk.v*680,y+12,28,6);g.strokeStyle=C.ink;g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(112+tk.v*680,y+8);g.lineTo(92+tk.v*680+Math.sin(time*8)*8,y+16);g.moveTo(130+tk.v*680,y+8);g.lineTo(150+tk.v*680+Math.sin(time*8+2)*8,y+18);g.stroke();}},
  {k:'card',c:[['TWO NIGHTS AND TWO DAYS','Odysseus drifts for two nights and two days before the wind drops. On the third dawn he sees land. Surf thunders on every cliff, with no harbour, so he swims along the coast until he finds a river mouth, sheltered and smooth, and prays to the river god. It stills its current for him.']]},
  {k:'bg',v:'shore',o:{hills:true}},
  {k:'hero',h:{vis:true,kind:'fig',x:120,y:FLOOR,s:1.05,o:{beard:true}}},
  {k:'cast',clear:true,add:[{t:'tree',x:760,y:FLOOR,kind:'olive',s:1.4},{t:'tree',x:850,y:FLOOR,kind:'olive',s:1.2}]},
  {k:'walk',hint:'CRAWL ASHORE  ·  THEN FIND SHELTER UNDER THE OLIVES',to:[[420,'THE RIVER-MOUTH'],[780,'THE OLIVE THICKET']],stand:1.4},
  {k:'card',c:[['SLEEP UNDER THE OLIVES','He unties the veil and throws it back, turning away. Then he walks into the thicket, burrows under two olive trees, and heaps leaves over himself as a man hides a spark of fire in ash. Athena closes his eyes with sleep.',[{t:'tree',x:280,y:360,kind:'olive',s:2},F(420,{beard:true,lie:true},1.5)]]]}
]};

/* ---------- BOOK VI ---------- */
EP.b6={book:'BOOK VI',bk:6,hero:{x:130,o:{...WM},s:1},steps:[
  {k:'card',c:[['NAUSICAA\'S DREAM','In Scheria, Athena goes to the sleeping princess Nausicaa in the likeness of a friend and tells her to wash the family\'s clothes at the river, since she will be married soon. At dawn Nausicaa asks her father Alcinous for the mule-cart. Her mother Arete packs food, wine and olive oil for her.',[F(180,{...WM},1.7),F(400,{...WM},1.7,-1)]]]},
  {k:'bg',v:'shore',o:{hills:true}},
  {k:'cast',add:[F(480,{...WM},.95,1),F(560,{...WM},.95,-1),{t:'tree',x:850,y:FLOOR,kind:'olive',s:1.3},{t:'box',x:320,y:FLOOR}]},
  {k:'walk',hint:'DRIVE THE MULE-CART TO THE RIVER-MOUTH',to:[[400,'THE RIVER']],stand:1.4},
  {k:'ring',n:4,per:1,at:[520,520],hint:'THE BALL GAME  ·  PRESS WHEN THE RING CLOSES',miss:'The ball goes wide!'},
  {k:'card',c:[['THE BALL','After they have washed the clothes, bathed and eaten, the girls play ball. Nausicaa starts the song. When she throws the ball at a maid and it falls into the river, they scream, and Odysseus wakes. He pushes aside the leaves, covers himself with a leafy branch and walks out.',[F(180,{...WM},1.7)]]]},
  {k:'cast',clear:true,add:[{t:'tree',x:850,y:FLOOR,kind:'olive',s:1.3},F(360,{...WM},1,-1,'n')]},
  {k:'hero',h:{x:130,o:{beard:true,carry:'flower'},s:1.05}},
  {k:'walk',hint:'APPROACH THE PRINCESS',to:[[330,'NAUSICAA']],stand:1.6},
  {k:'card',c:[['THE SUPPLIANT','The maids run in terror, but Athena fills the princess with courage and she stays. Odysseus keeps his distance and begs her, as a goddess or a woman, for a rag to wear and the way to the town. She gives him clothes, olive oil and food. He washes the brine from his skin and Athena makes him taller and broader, his hair thick like hyacinth flowers.',[F(170,{beard:true,carry:'flower'},1.7),F(390,WM,1.7,-1)]]]},
  {k:'hero',h:{o:OD,x:330}},
  {k:'walk',hint:'FOLLOW THE CART AT A DISTANCE',to:[[620,'THE ROAD'],[850,'THE GROVE OF ATHENA']],stand:1.3},
  {k:'card',c:[['THE GROVE OF ATHENA','Nausicaa tells him to go behind the cart until they come near the town, then wait in Athena\'s grove, so that no gossip will touch her. Then he must go to her mother, clasp her knees, and ask for her help. In the grove Odysseus prays to Athena that the Phaeacians may receive him kindly, and she hears him, though out of respect for her uncle Poseidon she does not yet show herself.']]}
]};

/* ---------- BOOK VII ---------- */
EP.b7={book:'BOOK VII',bk:7,hero:{x:120,o:OD,s:1.05},steps:[
  {k:'bg',v:'town',o:{}},
  {k:'cast',add:[F(300,{...WM},1,-1,'gir')]},
  {k:'card',c:[['THE GIRL WITH THE JUG','As Odysseus walks towards the town, Athena meets him in the likeness of a young girl carrying a jug. She shows him the way to Alcinous\' house, and wraps him in a mist so that no one will mock a stranger as he walks through the harbour and the streets.',[F(190,OD,1.7),F(400,{...WM},1.7,-1)]]]},
  {k:'walk',hint:'FOLLOW THE GIRL THROUGH THE MIST',to:[[320,'THE HARBOUR'],[620,'THE MARKET'],[860,'THE GATE']],stand:1.2},
  {k:'bg',v:'hall',o:{rich:true,fire:480,cols:[110,300,660,850]}},
  {k:'cast',clear:true,add:[F(580,{...WM,veil:true},1,-1,'are'),F(700,{cloak:C.red,beard:true,white:true},1.05,-1,'alc'),{t:'table',x:420,y:FLOOR,w:160,food:true}]},
  {k:'card',c:[['THE PALACE OF ALCINOUS','He stops to look at the bronze walls, the blue frieze, the golden doors with silver posts, the golden and silver dogs which Hephaestus made, and the fruit orchard outside, where pears, pomegranates, apples, figs and olives never fail and the vines are in fruit all year. Athena has told him that the queen Arete must be his first appeal.']]},
  {k:'walk',hint:'CROSS THE HALL TO THE HEARTH',to:[[470,'THE HEARTH OF ARETE']],stand:1.6},
  {k:'pick',q:'ARETE ASKS: WHO GAVE YOU THESE CLOTHES?',opts:['Nausicaa gave them, at the river','Alcinous gave them, at the door','Athena gave them, in the mist'],ok:0,miss:'Not that one. Think of the river-mouth.'},
  {k:'card',c:[
   ['AT THE HEARTH','Odysseus throws his arms round Arete\'s knees and begs for a passage home. The mist falls from him. Everyone is silent, until old Echeneus tells Alcinous that it is shameful for a guest to sit in the ashes. Alcinous raises him and seats him in the chair of his own son, and the guest is served food and wine.',[F(180,OD,1.7),F(400,{...WM,veil:true},1.7,-1)]],

  if(i.kind==='scyl'){g.fillStyle=C.ink;g.beginPath();g.moveTo(x-w*.5,y+4);g.lineTo(x-w*.35,y-h*2);g.lineTo(x+w*.25,y-h*1.9);g.lineTo(x+w*.6,y+4);g.fill();g.fillStyle=C.bg2;g.beginPath();g.ellipse(x,y-h*.9,w*.18,h*.4,0,0,7);g.fill();g.strokeStyle=C.ink;g.lineWidth=2.4;g.beginPath();g.ellipse(x+w*1.1,y+8,16,6,0,0,7);g.ellipse(x+w*1.1,y+8,9,3,0,0,7);g.stroke();}

  g.restore();
}

  {k:'mash',gain:.07,decay:.3,hint:'KEEP THE SHADES FROM THE BLOOD UNTIL TIRESIAS COMES  ·  WAVE THE SWORD  ·  SPACE OR CLICK'},
  {k:'card',c:[['TIRESIAS','Tiresias comes, with his golden sceptre, and drinks the blood. He tells Odysseus that he seeks a sweet homecoming, and the god makes it hard; Poseidon is angry because he blinded his son. Even so, they may reach home if they hold back their appetites on the island of Thrinacia, where the cattle and fat sheep of Helios graze. If they touch them, he warns, the ship and the crew will be destroyed; and if Odysseus himself escapes, he will return late, in distress, on a foreign ship, to find trouble in his house.',[F(180,{...OD,carry:'sword'},1.7),SHADE(420,{beard:true,white:true,carry:'staff'},'',-1)]]]},
  {k:'card',c:[['THE LAST JOURNEY','Tiresias tells him how to deal with the suitors, by guile or by the sword. After that he must take a well-shaped oar and walk inland until he meets people who know nothing of the sea and who say that it is a winnowing shovel; there he must plant the oar in the ground and make a sacrifice to Poseidon. Death will come to him from the sea, gentle, at a ripe old age, with his people prosperous round him.']]},
  {k:'cast',clear:true,add:[{t:'pit',x:520,y:FLOOR},SHADE(700,{pale:true,long:true,veil:true},'mum')]},
  {k:'walk',hint:'LET HIS MOTHER ANTICLEIA DRINK, AND SPEAK TO HER',to:[[600,'ANTICLEIA']],stand:1.6},
  {k:'card',c:[['HIS MOTHER','Odysseus sees the shade of his mother Anticleia, who was alive when he left for Troy. He weeps, but lets her drink the blood only after Tiresias. She tells him that grief for him killed her, not illness. Three times he runs to embrace her, and three times she flies from his arms like a shadow or a dream. She tells him that this is the way of mortals when they die, and bids him take what he has learned home to his wife.',[F(190,OD,1.7),SHADE(400,{pale:true,long:true,veil:true},'',-1)]]]},
  {k:'cast',clear:true,add:[{t:'pit',x:520,y:FLOOR},SHADE(640,{beard:true,helm:true,cloak:C.cream},'ag'),SHADE(720,{beard:true,helm:true,carry:'spear'},'ach'),SHADE(800,{beard:true,helm:true},'aj')]},
  {k:'walk',hint:'SPEAK WITH THE HEROES OF TROY',to:[[560,'AGAMEMNON'],[640,'ACHILLES'],[720,'AJAX']],stand:1.2},
  {k:'card',c:[
   ['AGAMEMNON','Agamemnon drinks the blood and weeps. He tells Odysseus how Aegisthus and his own wife killed him at a feast, like an ox at its manger, and how Clytemnestra did not even stay to close his eyes and mouth as he died. He warns Odysseus not to tell a wife everything he knows.'],
   ['ACHILLES','Achilles asks how he dared to come to the house of Hades. Odysseus says that he is as honoured among the dead as he was among the living. Achilles answers that he would rather be a hired labourer on a poor man\'s farm than rule over all the dead. Odysseus tells him that his son Neoptolemus fights bravely. Achilles strides away, delighted, over the asphodel meadow.'],
   ['AJAX','The shade of Ajax stands apart, still angry that Odysseus won the armour of Achilles. Odysseus speaks to him, but he gives no answer, and goes off into the darkness. Then Odysseus sees Minos judging the dead, Orion hunting the shades of animals, Tityus pegged out, Tantalus unable to drink, Sisyphus pushing his stone, and, last, the image of Heracles, while the shades screech about him like birds.',[F(180,OD,1.7),SHADE(400,{beard:true,helm:true},'',-1)]],
   ['BACK TO THE SHIP','Odysseus would have stayed to see Theseus and Pirithous, but the shades crowd round him with their cries, and pale fear takes him: Persephone may send the head of the Gorgon against him. He goes back to the ship, orders the men aboard, and the current of Ocean carries it first under oars, then with a fair wind.']]}
]};

/* ---------- BOOK XII: SCYLLA AND CHARYBDIS ---------- */
EP.scylla={book:'BOOK XII',bk:12,done:SEAD,hero:{kind:'ship',x:480,y:470,o:{}},steps:[
  {k:'card',c:[['CIRCE\'S COUNSEL','Circe told him of two paths: past the Wandering Rocks, which no ship but Jason\'s has passed, or between two cliffs. On one is Scylla, with twelve feet, six long necks and six heads, each with three rows of teeth, who snatches one man for every head from any ship that passes. On the other is Charybdis, who three times a day sucks down the sea and three times spews it up. Better to lose six men than all. Do not arm yourself against Scylla, she told him, for she is not mortal.']]},
  {k:'bg',v:'sea',o:{}},
  {k:'cast',add:[{t:'scylla',x:130,y:380,s:1.15},{t:'whirl',x:800,y:430,s:2.2}]},
  {k:'dodge',obj:'rock',r:14,secs:13,sp:230,vy:260,rate:.7,hint:'STEER BETWEEN THE TWO  ·  A / D OR ARROWS  ·  KEEP THE MIDDLE',hurt:'The spray hurls you aside!'},
  {k:'card',c:[['SIX MEN','Odysseus, disobeying Circe, puts on his armour and takes two long spears, and stands at the prow, but sees nothing as he searches the cliff. They row in through the narrows, the men in terror as Charybdis sucks down the sea water in front of them. While all eyes are on that, Scylla seizes six of his best men from the deck. He hears them cry out his name for the last time as they are lifted high, like fish dangled over rocks.',[{t:'scylla',x:200,y:370,s:1.3}]]]},
  {k:'card',c:[['THE WORST SIGHT','The sight, Odysseus says afterwards, was the most pitiful he has seen of all the things he went through while searching the sea paths. The ship rows on and soon the island of the Sun, Thrinacia, comes into view.']]}
]};

/* ---------- BOOK XII: THRINACIA ---------- */
EP.thrin={book:'BOOK XII',bk:12,done:SEAD,hero:{x:120,o:OD,s:1.05},steps:[
  {k:'card',c:[['THE ISLAND OF THE SUN','Odysseus hears the cattle lowing and the sheep bleating, and remembers the warnings of both Tiresias and Circe. He tells the men to sail on. Eurylochus answers that Odysseus is made of iron and that the men are exhausted; he wants to land for the night and make supper. Odysseus knows that some god is working against them, and yields, but makes the crew swear an oath not to touch any of the cattle or sheep.',[F(190,OD,1.7),F(400,{...CREW,cloak:C.pale},1.7,-1)]]]},
  {k:'card',c:[['A MONTH OF WIND','During the night Zeus sends a violent storm, and in the morning they haul the ship up into a cave. For a month the South Wind blows, and then the East, and nothing else. They use up the corn and the wine, and begin to hunt for fish and birds, whatever they can catch with hooks, because hunger torments them.']]},
  {k:'bg',v:'forest',o:{kinds:['olive','cyp','fig','olive']}},
  {k:'cast',add:[{t:'ox',x:620,s:.95,dir:-1},{t:'ox',x:760,s:.95,dir:1}]},
  {k:'walk',hint:'GO INLAND TO PRAY FOR A WAY HOME',to:[[420,'A SHELTERED PLACE']],stand:1.8},
  {k:'card',c:[['THE CATTLE OF HELIOS','Odysseus washes his hands and prays to the gods on Olympus, and they send a sweet sleep. Meanwhile Eurylochus talks the men round: death by starvation is the worst of all deaths, so let them drive off the best of the cattle and promise a temple to Helios at home. They drive the cows off, kill them and roast them on spits, and when Odysseus wakes and smells the fat he cries out to Zeus, knowing that it is done.']]},
  {k:'card',c:[['THE LAMENT OF HELIOS','Lampetia the nymph goes to Helios with the news. Helios, enraged, tells Zeus that unless he is paid, he will go down to Hades and shine among the dead. Zeus promises to strike their ship with a thunderbolt. For six days the men feast, and on the seventh, when the storm drops, they put to sea.']]},
  {k:'bg',v:'sea',o:{storm:true}},
  {k:'hero',h:{kind:'ship',x:480,y:470,o:{}}},
  {k:'cast',clear:true},
  {k:'dodge',obj:'bolt',secs:11,rate:.7,vy:330,hint:'ZEUS\'S THUNDERBOLT  ·  STEER THE SHIP  ·  A / D OR ARROWS',hurt:'The ship shudders!'},
  {k:'card',c:[['THE BOLT','As soon as they have left the island, with nothing but sky and sea in sight, Zeus sets a black cloud over the hollow ship. A violent west wind breaks the forestays, and the mast crashes down on the helmsman. Zeus thunders and strikes the ship with lightning. She spins, filled with sulphur, and the men fall into the water, bobbing like sea-crows around the black ship. The gods give them no return.']]},
  {k:'bg',v:'sea',o:{storm:true}},
  {k:'hero',h:{vis:false}},
  {k:'rope',at:[480,300],amp:50,hint:'LASH THE KEEL AND THE MAST TOGETHER  ·  HOLD AND DRAG FROM KNOT TO KNOT'},
  {k:'hold',secs:9,hint:'CLING TO THE FIG TREE OVER CHARYBDIS  ·  HOLD SPACE OR THE MOUSE BUTTON',draw:(st,tk)=>{whirl(480,500,3,time);tree(480,330,2,'fig');g.fillStyle=C.ink;g.beginPath();g.arc(480,260+tk.v*70,10,0,7);g.fill();g.strokeStyle=C.ink;g.lineWidth=5;g.beginPath();g.moveTo(480,270+tk.v*70);g.lineTo(480,310+tk.v*70);g.stroke();if(tk.v>.55){g.fillStyle=C.ink;g.fillRect(520,420-tk.v*60,8,50);}}},
  {k:'card',c:[['THE FIG TREE','Odysseus lashes the keel and the mast together and clings to them, driven by the South Wind back to Charybdis. In the morning he is between Scylla\'s rock and Charybdis, who is sucking down the sea. He springs up to the tall fig tree that grows over her and clings to it like a bat; he cannot plant his feet or climb. At last, late in the day, the keel and mast shoot up again from the whirlpool, and he lets go and drops on them, paddling with his hands. Zeus does not allow Scylla to see him.']]},
  {k:'cast',clear:true,add:[{t:'raft',x:480,y:486,s:1.4}]},
  {k:'bg',v:'sea',o:{}},
  {k:'mash',gain:.045,decay:.14,hint:'PADDLE WITH YOUR HANDS  ·  TAP SPACE OR CLICK'},
  {k:'card',c:[['OGYGIA','He drifts nine days, and on the tenth night the gods bring him to Ogygia, where the dread goddess Calypso, with a human voice, takes him in and cares for him, and he stays seven years.',[{t:'raft',x:280,y:350,s:2.4}]]]},
  {k:'card',c:[['END OF THE TALE','Odysseus has told the story. Alcinous\' hall is silent. He stops, since he has already told it once, yesterday, in this very house.',[F(190,OD,1.7),F(400,{cloak:C.red,beard:true,white:true},1.7,-1)]]]},
  {k:'fn',f:()=>{S.stage=ISL.length;}}
]};

const BEG={cloak:C.cream,beard:true,stoop:true,carry:'staff'};
