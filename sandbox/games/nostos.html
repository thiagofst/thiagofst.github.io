/* ---------- BOOK XIII ---------- */
EP.b13={book:'BOOK XIII',bk:13,hero:{x:130,o:OD,s:1.05},steps:[
  {k:'bg',v:'hall',o:{rich:true,fire:480,cols:[110,300,660,850]}},
  {k:'cast',add:[F(560,{...WM,veil:true},1,-1,'are'),F(720,ALC,1.05,-1,'alc'),{t:'table',x:380,y:FLOOR,w:160,food:true}]},
  {k:'card',c:[['THE GUEST-GIFTS','The tale is over, and the hall of Alcinous is silent. Alcinous tells his guest that he will be sent home without further wandering, and that each of the Phaeacian lords will give him a tripod and a cauldron, to be repaid later by the people. In the morning the gifts are carried to the ship. Arete sends him a cloak and tunic, and a chest, and slaves to carry them.',[F(190,OD,1.7),F(400,ALC,1.7,-1)]]]},
  {k:'walk',hint:'TAKE LEAVE OF THE QUEEN AND THE KING',to:[[470,'ARETE'],[670,'ALCINOUS']],stand:1.4},
  {k:'card',c:[['FAREWELL','Odysseus puts a two-handled cup into Arete\'s hand and wishes her joy until old age and death come to her, to her children, her people, and King Alcinous. Then he steps over the threshold, and Alcinous sends a herald to lead him to the ship. At the shore the sailors spread a rug and a linen sheet on the deck at the stern, and Odysseus lies down in silence.',[F(190,OD,1.7),F(400,{...WM,veil:true},1.7,-1)]]]},
  {k:'bg',v:'sea',o:{}},
  {k:'cast',clear:true},
  {k:'hero',h:{kind:'ship',x:140,y:470,o:{}}},
  {k:'row',n:18,per:.8,to:560,hint:'THE PHAEACIAN SHIP FLIES  ·  ROW TO THE BEAT  ·  A / D IN TURN'},
  {k:'card',c:[['THE FASTEST SHIP','They strike the sea with their oars and a deep sleep falls on Odysseus, sweet, unbroken, most like death. The ship runs as fast as four stallions harnessed together, and not even a falcon could have kept up. At the first appearance of the dawn star they reach Ithaca, to the harbour of Phorcys. The sailors lift him in his sheet and lay him on the sand without waking him, with his gifts piled under an olive tree, out of the path.']]},
  {k:'card',c:[['THE SHIP OF STONE','On their way home Poseidon complains to Zeus that the Phaeacians have disregarded him. Zeus says: when all can see the ship near the land, turn it to stone, and hide the city behind a mountain. Poseidon waits until the ship is just entering harbour, strikes it with his hand, and roots it in the sea as stone. Alcinous remembers the old prophecy, and tells his people to sacrifice twelve bulls to Poseidon.']]},
  {k:'bg',v:'shore',o:{hills:true},ban:['ITHACA','The harbour of Phorcys']},
  {k:'cast',add:[{t:'tree',x:720,y:FLOOR,kind:'olive',s:1.5},{t:'box',x:690,y:FLOOR},{t:'box',x:750,y:FLOOR},{t:'bag',x:800,y:FLOOR},F(250,{...ATH,cloak:C.pale,long:false,pale:false,carry:'staff',beard:false},1,1,'ath')]},
  {k:'hero',h:{x:420,o:{...OD,helm:false},s:1.05}},
  {k:'card',c:[['ITHACA, UNKNOWN','Odysseus wakes on his own land, and does not know it: Athena has poured a mist over everything so that she can disguise him. He laments that the Phaeacians have deceived him, and counts the gifts to be sure none are missing. Then he sees a young man, a shepherd, delicate, of high birth, with a cloak folded double over his shoulders and a spear in his hand. It is Athena.',[F(190,{...OD,helm:false},1.7),F(400,{...SWH,beard:false},1.7,-1)]]]},
  {k:'walk',hint:'ASK THE SHEPHERD WHAT LAND THIS IS',to:[[300,'THE YOUNG SHEPHERD']],stand:1.4},
  {k:'card',c:[
   ['A CRETAN LIE','The shepherd tells him: this is Ithaca, known as far as Troy. Odysseus, pleased, still tells him a lie, as he always does: he is a Cretan, who killed a son of Idomeneus and fled with Phoenician sailors, who left him asleep on this shore with his cargo. Athena smiles and strokes him, becoming a tall and beautiful woman. She tells him he is a man of many tricks, and so is she.'],
   ['THE GODDESS','Athena tells him she has been at his side through all his troubles, though not in the sea storms, since she would not fight her uncle Poseidon. She lifts the mist and shows him the harbour of Phorcys, the cave of the Nymphs and Mount Neriton. Odysseus kisses the ground. She tells him that suitors have been at his house for three years, and Penelope still holds out, hoping for him. She will change him so that no one knows him.',[F(180,{...OD,helm:false},1.7),F(400,ATH,1.7,-1)]]]},
  {k:'walk',hint:'HIDE THE TREASURE IN THE CAVE OF THE NYMPHS',to:[[740,'THE GIFTS UNDER THE OLIVE'],[860,'THE CAVE OF THE NYMPHS']],stand:1.3},
  {k:'hold',secs:5,hint:'ATHENA\'S WAND  ·  HOLD STILL  ·  HOLD SPACE OR THE MOUSE BUTTON',on:(st,v)=>{if(v>.6&&!st.old){st.old=true;st.hero.o=BEG;}}},
  {k:'card',c:[['THE BEGGAR','Athena touches him with her wand. The smooth skin on his supple limbs withers, his hair falls from his head, his eyes dim, his clothes become a filthy tattered tunic and a deerskin, a staff and a worn bag with a rope for a strap. She sends him to the swineherd Eumaeus, and goes herself to Sparta to bring back Telemachus.',[F(190,{...OD,helm:false},1.7),F(400,BEG,1.7,-1)]]]}
]};

/* ---------- BOOK XIV ---------- */
EP.b14={book:'BOOK XIV',bk:14,hero:{x:110,o:BEG,s:1.05},steps:[
  {k:'bg',v:'hut',o:{fire:180}},
  {k:'cast',add:[F(560,{cloak:C.cream,beard:true},1,-1,'eum'),{t:'dog',x:480,dir:-1},{t:'dog',x:520,dir:-1},{t:'dog',x:640,dir:-1}]},
  {k:'card',c:[['EUMAEUS\' FARM','Odysseus climbs the rough path through the woods to the farm of Eumaeus, which the swineherd built himself in a clearing, with a high yard of stone, hedged with thorn and a ring of oak stakes. Inside are twelve sties, each with fifty sows, and outside four fierce dogs, as savage as wild beasts. Eumaeus is cutting a pair of sandals from an ox-hide.',[F(190,BEG,1.7),F(400,{cloak:C.cream,beard:true},1.7,-1),{t:'dog',x:480,s:1.6,dir:-1}]]]},
  {k:'walk',hint:'WALK UP TO THE FARM',to:[[400,'THE YARD']],stand:.8},
  {k:'hold',secs:3,hint:'SIT DOWN, DROP YOUR STAFF AND KEEP STILL  ·  HOLD SPACE OR THE MOUSE BUTTON',on:(st,v)=>{if(v>.4)st.hero.o={...BEG,sit:true,carry:undefined};}},
  {k:'hero',h:{x:400}},
  {k:'cast',clear:true,add:[F(560,{cloak:C.cream,beard:true},1,-1,'eum'),{t:'dog',x:450,dir:-1},{t:'dog',x:490,dir:-1},{t:'dog',x:530,dir:-1}]},
  {k:'ring',n:4,per:.9,at:[500,520],hint:'EUMAEUS DRIVES OFF THE DOGS WITH STONES  ·  PRESS WHEN THE RING CLOSES',miss:'The stone falls short.'},
  {k:'cast',clear:true,add:[F(560,{cloak:C.cream,beard:true},1,-1,'eum'),{t:'pig',x:760,dir:-1},{t:'pig',x:830,dir:-1}]},
  {k:'hero',h:{x:420,o:BEG}},
  {k:'card',c:[['THE HOST','Eumaeus brings the stranger in, spreads brushwood and a goat skin for him to sit on, and says that guests and beggars are all from Zeus, and a small gift is welcome. He mourns his master, who would have given him a house, a plot and a wife, had he lived. Odysseus asks the name, and Eumaeus answers: Odysseus, son of Laertes, who is long gone. He has not believed a stranger\'s tale of him since an Aetolian fooled him.',[F(190,BEG,1.7),F(400,{cloak:C.cream,beard:true},1.7,-1)]]]},
  {k:'walk',hint:'HELP WITH THE FEAST  ·  FETCH TWO PIGLETS AND ROAST THEM',to:[[780,'THE PIGLETS'],[180,'THE FIRE']],stand:1.3},
  {k:'card',c:[
   ['THE FEAST','Eumaeus kills two piglets, singes them, cuts them up and roasts them on spits. He shares them in seven portions: one to the Nymphs and Hermes, and the best cut, the long chine, to the stranger, which delights Odysseus. They eat, and drink the dark wine, and Odysseus, sitting by the fire, tells a false tale: he is the son of a rich Cretan, a leader at Troy beside Idomeneus, later raided Egypt and lost his men, and was a guest at the house of Thesprotian king Pheidon, who told him that Odysseus was near and would return.'],
   ['THE CLOAK','Eumaeus does not believe a word of his return, and says no news of Odysseus will move him. Odysseus swears, and wagers a cloak and tunic against a sure return in the month\'s end. As night comes on and it freezes, Odysseus tells a tale of an ambush before Troy, in which he, cold in the night, begged one of his men for a cloak, and got it by a trick. Eumaeus takes the hint and gives him a thick cloak for the night.'],
   ['THE SWINEHERD AT NIGHT','Eumaeus goes outside to sleep beside the boars, in the cold, with a sword on his shoulder and a goat-skin round him. Odysseus is glad that the man takes such care of his master\'s property, even when his master is away.']]}
]};

/* ---------- BOOK XV ---------- */
EP.b15={book:'BOOK XV',bk:15,hero:{x:130,o:{...TEL,carry:undefined},s:1},steps:[
  {k:'bg',v:'hall',o:{rich:true,fire:480,door:880}},
  {k:'cast',add:[F(560,{cloak:C.red,beard:true},1.05,-1,'men'),F(700,{...WM,veil:true},1,-1,'hel'),F(320,{cloak:C.pale},1,1,'pis'),{t:'bowl',x:620,y:FLOOR}]},
  {k:'card',c:[['ATHENA IN SPARTA','Athena finds Telemachus lying awake in the porch, troubled, and tells him it is time to go home, since the suitors may eat up his property. She says Penelope\'s family is urging her to marry Eurymachus, and that the suitors are laying an ambush for him in the strait between Ithaca and Same. He must sail by night, keep away from the islands, and when he is landed, go first to the swineherd.',[F(190,TEL,1.7),F(400,ATH,1.7,-1)]]]},
  {k:'walk',hint:'TAKE LEAVE OF MENELAUS AND HELEN',to:[[540,'MENELAUS'],[690,'HELEN']],stand:1.4},
  {k:'card',c:[['THE GIFTS OF SPARTA','Menelaus gives Telemachus a mixing bowl of silver with a gold rim, the work of Hephaestus, a gift from King Phaedimus; and a two-handled cup. Helen gives him a robe she wove herself, for his future bride, to be held by his mother until the wedding. As they stand at the doorway, an eagle flies in from the right with a white goose in its claws, a tame bird from a farmyard, and men and women chase after it, shouting.']]},
  {k:'card',c:[['HELEN\'S OMEN','Helen interprets the sign: just as the eagle, from the hills where it was bred, has snatched the goose reared in the house, so Odysseus will come home after much suffering and take his vengeance. Telemachus prays to Zeus that it may come true. He and Pisistratus drive to Pylos, and at the shore Telemachus begs Pisistratus not to take him to Nestor\'s house, but to the ship, for the old man would keep him.']]},
  {k:'bg',v:'shore',o:{ship:560}},
  {k:'cast',clear:true,add:[F(320,{cloak:C.pale,beard:true,carry:'staff'},1,1,'seer')]},
  {k:'hero',h:{x:160}},
  {k:'walk',hint:'AT THE SHIP, A STRANGER ASKS FOR PASSAGE  ·  GO TO HIM',to:[[320,'THEOCLYMENUS']],stand:1.3},
  {k:'card',c:[['THEOCLYMENUS','Telemachus is sacrificing to Athena at the stern of the ship when a stranger, Theoclymenus, descendant of the seer Melampus, arrives. He has killed a man in Argos and is a fugitive, and he begs to be taken aboard. Telemachus brings him on board, setting him beside him by the stern, and they put out to sea.',[F(190,TEL,1.7),F(400,{cloak:C.pale,beard:true},1.7,-1)]]]},
  {k:'bg',v:'sea',o:{}},
  {k:'cast',clear:true},
  {k:'hero',h:{kind:'ship',x:480,y:470,o:{}}},
  {k:'dodge',obj:'rock',r:16,secs:12,rate:.65,sp:240,hint:'SAIL BY NIGHT, KEEP WELL AWAY FROM THE ISLANDS  ·  A / D OR ARROWS',hurt:'Too close to the rocks!'},
  {k:'sneak',gx:770,gy:468,to:700,watch:1.9,rest:1.5,secs:12,hint:'PAST THE AMBUSH  ·  GO ON ONLY WHILE THEIR EYES ARE SHUT  ·  HOLD D OR SPACE',seen:'Seen! Back.'},
  {k:'card',c:[['PAST THE AMBUSH','They sail all night with a following wind, past Elis and the islets of the Pointed Isles, with Telemachus wondering whether he will escape death or be caught. Athena has told him to steer far from the islands and keep to the sea. He reaches the headland of Ithaca, tells the crew to take the ship round to the city, and goes up himself, alone, to the farm of Eumaeus.']]},
  {k:'bg',v:'hut',o:{fire:180}},
  {k:'cast',clear:true,add:[F(540,{cloak:C.cream,beard:true},1,-1,'eum')]},
  {k:'hero',h:{kind:'fig',x:130,o:{...TEL,carry:'spear'},s:1,vis:true}},
  {k:'card',c:[['EUMAEUS\' LIFE','While the ship was at sea, Eumaeus told the beggar his own story. He was the son of a king in Syria; a Phoenician woman, a slave in his father\'s house, ran away with merchants, taking him with her, and he was sold to Laertes. He tells how Anticleia died of grief, and says how he misses her. Odysseus listens and sleeps well. At dawn the dogs do not bark when Telemachus approaches, but fawn on him.']]},
  {k:'walk',hint:'GO TO THE SWINEHERD\'S HOUSE',to:[[440,'THE YARD']],stand:1.2}
]};

/* ---------- BOOK XVI ---------- */
EP.b16={book:'BOOK XVI',bk:16,hero:{x:120,o:TEL,s:1},steps:[
  {k:'bg',v:'hut',o:{fire:180}},
  {k:'cast',add:[F(520,BEG,1,-1,'od'),F(640,{cloak:C.cream,beard:true},1,-1,'eum')]},
  {k:'card',c:[['A SON COMES HOME','Eumaeus drops what he is doing and greets Telemachus like a father whose only son has come back from ten years abroad, kissing his head and eyes and hands. Telemachus asks for news of his mother; Eumaeus says she weeps day and night. The beggar rises from his seat for Telemachus, who tells him to sit; he is a guest and a suppliant. Eumaeus is then sent to the city to tell Penelope that her son is home.',[F(190,TEL,1.7),F(400,{cloak:C.cream,beard:true},1.7,-1)]]]},
  {k:'walk',hint:'GREET THE SWINEHERD',to:[[600,'EUMAEUS']],stand:1.2},
  {k:'rm',ids:['eum']},
  {k:'card',c:[['ATHENA AT THE DOOR','While Eumaeus is gone, Athena stands at the door of the hut, in the form of a tall and beautiful woman, visible only to Odysseus; the dogs, seeing her, whimper and slink away. She nods to him, and he goes out to her. She tells him it is time to reveal himself, and to plan the death of the suitors. She touches him with her wand: clean cloak and tunic, a taller, more youthful body, dark skin, filled cheeks, and a dark beard on his chin.',[F(190,BEG,1.7),F(400,ATH,1.7,-1)]]]},
  {k:'hold',secs:4,hint:'ATHENA\'S WAND  ·  HOLD SPACE OR THE MOUSE BUTTON',on:(st,v)=>{if(v>.5&&!st.rev){st.rev=true;st.byId('od').o=OD;}}},
  {k:'card',c:[['THE RECOGNITION','Telemachus turns away in fear, taking him for a god. Odysseus tells him: I am your father, for whom you have suffered so much. He kisses him, and the tears he has held back run down his face. Telemachus cannot believe him; Athena has played a trick. Odysseus tells him: no other Odysseus will ever come. They weep aloud, more than eagles, until the sun is about to set.',[F(190,TEL,1.7),F(400,OD,1.7,-1)]]]},
  {k:'walk',hint:'EMBRACE YOUR FATHER',to:[[520,'ODYSSEUS']],stand:1.8},
  {k:'card',c:[
   ['THE SUITORS COUNTED','Odysseus asks how many suitors there are, and whether two men can face so many. Telemachus lists them: from Dulichium fifty-two young men, with six servants; from Same twenty-four; from Zacynthus twenty; from Ithaca itself twelve, with Medon the herald, the bard, and two attendants. A hundred and eight in all. Odysseus says Athena and Zeus will be enough as allies.'],
   ['THE PLAN','Telemachus must go back to the house and mingle with the suitors. Odysseus will come later, as a beggar, and whatever they do to him he must bear, even if they drag him by the feet to the door. When he nods, Telemachus is to take the weapons from the hall and put them away in the upper room, telling the suitors that smoke is spoiling them, but keeping back two swords, two spears and two shields. And no one is to know he has come, not Laertes, not Penelope, not the swineherd.']]},
  {k:'card',c:[['THE SHIP RETURNS','In the harbour, Telemachus\' crew arrive with the ship; the herald and Eumaeus meet in the palace, each bringing the same news to Penelope. In town the suitors see the ship, and Antinous curses their failure to catch him. Amphinomus advises waiting for a sign from the gods. Penelope comes down with her maids and rebukes Antinous for his plot. Eurymachus promises that no one will touch her son, though in his heart he intends otherwise.']]},
  {k:'card',c:[['EUMAEUS RETURNS','Back at the farm, Athena has made Odysseus into a beggar again before Eumaeus returns. The swineherd tells Telemachus that he saw a ship full of armed men come into harbour, but he thinks nothing. Telemachus smiles to himself at his father. They eat and sleep.']]}
]};

/* ---------- BOOK XVII ---------- */
EP.b17={book:'BOOK XVII',bk:17,hero:{x:110,o:BEG,s:1.05},steps:[
  {k:'bg',v:'hall',o:{rich:true,fire:480,door:880}},
  {k:'cast',add:[F(520,{...WM,veil:true},1,-1,'pen'),F(700,TEL,1,-1,'tel'),F(300,{cloak:C.pale,beard:true,carry:'staff'},1,1,'seer')]},
  {k:'card',c:[['TELEMACHUS IN THE TOWN','At dawn Telemachus takes his spear and goes to the town. Eurycleia weeps, and the maids hug him. Penelope comes down from her room, in tears, and asks him for news; he tells her to wash and pray, and that he will go to the market to seek the stranger who came with him, Theoclymenus. Theoclymenus tells her that Odysseus is already in Ithaca, sitting or walking, and is planning the evil to come.',[F(190,TEL,1.7),F(400,{...WM,veil:true},1.7,-1)]]]},
  {k:'bg',v:'forest',o:{kinds:['olive','cyp','olive']}},
  {k:'cast',clear:true,add:[F(820,{cloak:C.cream,beard:true},1,-1,'eum'),F(720,{cloak:C.pale,beard:true,carry:'staff'},1,-1,'mel')]},
  {k:'hero',h:{x:120}},
  {k:'walk',hint:'WALK TO THE TOWN WITH EUMAEUS',to:[[420,'THE ROAD UP']],stand:1,sp:130},
  {k:'card',c:[['MELANTHIUS','On the road, they meet the goatherd Melanthius, driving the best goats to the suitors\' feast, with two herdsmen. He insults them, calling Eumaeus a swineherd leading a beggar. He kicks Odysseus in the hip. Odysseus does not move, and thinks whether to kill him with his staff, but holds back. Eumaeus prays to the Nymphs, that Odysseus may come and scatter such pride.',[F(190,BEG,1.7),F(400,{cloak:C.pale,beard:true},1.7,-1)]]]},
  {k:'bg',v:'court',o:{}},
  {k:'cast',clear:true,add:[{t:'heap',x:480,y:FLOOR},{t:'dog',x:470,y:FLOOR,old:true,dir:1,id:'argos'}]},
  {k:'hero',h:{x:120}},
  {k:'walk',hint:'APPROACH THE DUNG-HEAP AT THE GATE',to:[[360,'THE OLD DOG']],stand:1.6},
  {k:'card',c:[['ARGOS','A dog lifts his head and ears: Argos, whom Odysseus had trained as a puppy but never hunted with. Now he lies on a dung heap, full of ticks, neglected. He wags his tail and lays his ears flat, but cannot get up. Odysseus, wiping a tear away where Eumaeus cannot see, asks about him. Eumaeus says that he was once the fastest dog. As soon as he has seen Odysseus again after twenty years, black death takes Argos.',[{t:'dog',x:260,s:2,old:true},F(420,BEG,1.7,-1)]]]},
  {k:'pick',q:'WHO KNOWS HIM AT THE GATE?',opts:['Eumaeus, walking beside him','Argos, the old hound on the dung-heap','Melanthius, the goatherd'],ok:1,miss:'Not that one. Look at the dung-heap.'},
  {k:'bg',v:'hall',o:{rich:true,fire:480,door:880}},
  {k:'cast',clear:true,add:[SUIT(300),SUIT(420),SUIT(560),SUIT(660),{t:'table',x:360,y:FLOOR,w:140,food:true},{t:'table',x:610,y:FLOOR,w:140,food:true},F(700,{cloak:C.pale,beard:true},1,-1,'ant')]},
  {k:'hero',h:{x:130}},
  {k:'walk',hint:'GO ROUND THE TABLES AND BEG, AS ATHENA ADVISED',to:[[330,'THE FIRST TABLE'],[460,'ANTINOUS'],[610,'THE LAST TABLE']],stand:1.1},
  {k:'card',c:[['THE FOOTSTOOL','Telemachus sends him bread and meat from the table. He goes round the suitors, who give. Antinous refuses, saying that the beggar is a nuisance, and Odysseus answers that he has a mean heart who would not give salt from his own house. Antinous, furious, takes up the footstool under his table and throws it. It strikes Odysseus on the right shoulder. He does not flinch, but shakes his head in silence, and thinks of vengeance.',[F(190,BEG,1.7),F(400,{cloak:C.pale,beard:true},1.7,-1)]]]},
  {k:'hold',secs:3.5,hint:'STAND LIKE A ROCK  ·  HOLD SPACE OR THE MOUSE BUTTON'},
  {k:'card',c:[['PENELOPE\'S WISH','The suitors tell Antinous he did wrong; if the beggar is a god in disguise, such things bring ruin. Telemachus keeps his anger in. In the upper room Penelope hears of it and curses Antinous, and tells Eumaeus to bring the beggar to her that evening: she hopes he may have news of her husband. Odysseus says he will speak with her after dusk, when the suitors have gone, since he fears their violence.']]}
]};

/* ---------- BOOK XVIII ---------- */
EP.b18={book:'BOOK XVIII',bk:18,hero:{x:230,o:BEG,s:1.05},steps:[
  {k:'bg',v:'court',o:{}},
  {k:'cast',add:[F(700,{cloak:C.cream,beard:true},1.35,-1,'irus'),SUIT(560),SUIT(620),SUIT(780),SUIT(850),F(480,{cloak:C.pale,beard:true},1,-1,'ant')]},
  {k:'card',c:[['IRUS','A beggar called Irus, who runs errands for the suitors, arrives. He was known for his enormous appetite and his huge body, but he has no strength. Seeing Odysseus on the threshold he abuses him and tells him to leave, or he will drag him by the feet. Odysseus answers calmly that there is room for both, and that Irus should not try to be a beggar by envy. Irus threatens to knock his teeth out. Antinous laughs and says that the suitors will let them fight, and the winner may eat what he wants of the goat\'s stomachs sizzling on the fire.',[F(190,BEG,1.7),F(400,{cloak:C.cream,beard:true},2.1,-1)]]]},
  {k:'card',c:[['THE BEGGAR STRIPS','Odysseus ties his rags round his waist. The suitors see his thighs, huge and fine, his broad shoulders, his chest and thick arms, with Athena at his side making his limbs bigger. Irus is shaken, and his legs tremble. The suitors say that Irus will soon be in trouble. Antinous makes him stand.']]},
  {k:'hero',h:{x:430,o:{...BEG,carry:undefined,stoop:false}}},
  {k:'ring',n:1,per:1.1,at:[430,520],hint:'ONE BLOW  ·  STRIKE WHEN THE RING CLOSES  ·  NOT TOO HARD',miss:'Hold off. Wait for it.',on:st=>{const c=st.byId('irus');if(c)c.o={...c.o,lie:true};}},
  {k:'card',c:[['A BLOW BELOW THE EAR','Odysseus wonders whether to kill him outright, but decides to strike lightly, so that the suitors do not recognise him. He hits Irus in the neck below the ear and crushes the bone. Blood comes from his mouth and he falls in the dust, kicking, with his teeth gnashing. The suitors die laughing. Odysseus drags him by the feet out to the yard, props him against the wall and puts his staff in his hand, telling him to sit there and scare off the pigs and dogs.',[F(190,{...BEG,carry:undefined},1.7),F(400,{cloak:C.cream,beard:true,lie:true},1.5,-1)]]]},
  {k:'card',c:[['AMPHINOMUS','The suitors give him presents, and Antinous a great goat\'s stomach full of fat. Odysseus then warns Amphinomus, the best of them, that men on earth are only what the day brings them, and that Odysseus will not be far from his own people when he returns. Amphinomus is troubled, since Athena has marked him for death, and he goes back to his seat.']]},
  {k:'card',c:[['PENELOPE APPEARS','Athena puts into Penelope\'s mind the wish to appear before the suitors, to draw gifts from them. She laughs for no reason. Athena puts her to sleep, makes her taller, fairer and whiter than ivory. She comes down, veiled, with two maids, and rebukes Telemachus for letting the beggar be mistreated. The suitors\' knees give way with desire. Eurymachus calls her the most beautiful, and each suitor sends gifts: Antinous a robe, Eurymachus a golden necklace strung with amber, and others earrings and jewels.',[F(190,{...WM,veil:true},1.7)]]]},
  {k:'card',c:[['MELANTHO AND EURYMACHUS','Odysseus tends the lamps in the hall to see the maids. The maid Melantho, who sleeps with Eurymachus, insults him again. He warns her that Telemachus will hear. Eurymachus mocks him too, calling him a vagrant too lazy to work. Odysseus challenges him to a mowing match in spring and a ploughing match, and to fight in battle. Eurymachus, furious, throws a stool at him. Odysseus ducks, and it strikes the cupbearer, who falls with a crash.']]},
  {k:'dodge',obj:'rock',r:15,secs:5,rate:.8,vy:300,hint:'THE STOOL FLIES  ·  A / D OR CLICK TO DUCK ASIDE',hurt:'Close!'},
  {k:'card',c:[['PEACE FOR THE NIGHT','Telemachus calls for order: the suitors have eaten and drunk enough, and should go to bed. Amphinomus agrees. They pour the last wine and go home. Odysseus stays in the hall with Telemachus and the thought of the weapons.']]}
]};
/* ================= BOOKS XIX–XXIV ================= */
const PEN={...WM,veil:true};

/* ---------- BOOK XIX ---------- */
EP.b19={book:'BOOK XIX',bk:19,hero:{x:130,o:OD,s:1.05},steps:[
  {k:'bg',v:'hall',o:{rich:true,fire:480,door:880}},
  {k:'cast',add:[F(700,TEL,1,-1,'tel'),{t:'box',x:300,y:FLOOR},{t:'box',x:360,y:FLOOR},{t:'box',x:420,y:FLOOR},F(180,{...ATH,helm:false},1,1,'lamp')]},
  {k:'card',c:[['THE WEAPONS REMOVED','Odysseus and Telemachus stay in the hall to carry the helmets, shields and sharp spears away into the storeroom, as agreed. Athena goes ahead of them with a golden lamp, shedding a wonderful light, and Telemachus sees the walls and rafters glowing like fire. He tells his father that some god of heaven is in the house. Odysseus tells him to be quiet, and keep it to himself.']]},
  {k:'walk',hint:'CARRY THE WEAPONS OUT OF THE HALL, TO THE STOREROOM  ·  THREE LOADS',to:[[300,'THE SHIELDS'],[360,'THE HELMETS'],[420,'THE SPEARS']],stand:1.1},
  {k:'cast',clear:true,add:[F(420,PEN,1,-1,'pen'),{t:'table',x:560,y:FLOOR,w:100},F(780,{...WM,white:true,stoop:true,long:true},1,-1,'eur')]},
  {k:'hero',h:{x:130,o:BEG}},
  {k:'walk',hint:'SPEAK WITH PENELOPE BY THE FIRE',to:[[330,'PENELOPE']],stand:1.4},
  {k:'card',c:[
   ['THE KEEPER OF THE HEARTH','Penelope sits by the fire. She asks the beggar who he is. He answers with a tale: he is from Crete, Aethon by name, and Odysseus was once a guest in his brother Idomeneus\' house, on his way to Troy, held for twelve days by the north wind. She tests him: what clothes did he wear? He describes a purple cloak with a gold brooch showing a hound holding a dappled fawn, and a shining tunic, and a herald a little older who was dark, with rounded shoulders, called Eurybates.'],
   ['THE TIMING OF THE RETURN','Penelope weeps, and tells him she will give him clothes and treat him as a friend. He says that he heard Odysseus in Thesprotia, and that he will be back before this month and year are out. She does not believe it, but she tells the maids to bathe him.']]},
  {k:'card',c:[['THE SCAR','The old nurse Eurycleia comes with a basin to wash his feet. Penelope says he looks about the age her husband would be. Odysseus sits out of the firelight, thinking of the scar on his leg, and turns his face away. The nurse touches it, and knows.',[F(190,{...BEG,sit:true},1.7)]]]},
  {k:'hold',secs:4,hint:'KEEP YOUR LEG IN THE SHADOW  ·  HOLD SPACE OR THE MOUSE BUTTON'},
  {k:'card',c:[['THE BOAR\'S TUSK','The nurse sees the scar, left by a boar\'s tusk when he went to hunt on Mount Parnassus with the sons of his mother\'s father Autolycus, a man who surpassed everyone in theft and oaths, and who had named him Odysseus. As soon as her hands touch it, she drops his foot, and the basin overturns. Joy and grief seize her; tears fill her eyes. She cannot speak. Athena has turned Penelope\'s attention elsewhere, so that she does not notice.']]},
  {k:'pick',q:'HOW DOES THE NURSE KNOW HIM?',opts:['By his voice','By the scar from the boar\'s tusk','By his cloak'],ok:1,miss:'Not that one. She touches his leg.'},
  {k:'ring',n:2,per:.9,at:[300,520],hint:'SEIZE HER THROAT BEFORE SHE CRIES OUT  ·  PRESS WHEN THE RING CLOSES',miss:'She draws breath, too soon!'},
  {k:'card',c:[
   ['THE NURSE SWORN TO SILENCE','Odysseus takes her by the throat with his right hand and with his left draws her close, and tells her: you nursed me, do you wish to destroy me? Keep it to yourself, or when the god has laid the suitors low, I will not spare you when I kill the maids. Eurycleia swears: she will be as solid as stone or iron. She brings fresh water, and he moves back to the fire.'],
   ['PENELOPE\'S DREAM','Penelope tells the beggar her dream: twenty geese in the yard, whom she loved to watch eating, were killed by a great eagle that came from the mountains. She wept. The eagle perched on the roof and said in a human voice that it was Odysseus, and the geese were the suitors. The beggar says that the meaning is clear. She says that dreams pass through two gates, of horn and ivory, and this one may have come through the false gate.'],
   ['THE BOW','She says that tomorrow is the day of the contest: she will set up twelve axes in a row, as Odysseus used to, and whoever can string his bow most easily and shoot an arrow through all twelve will take her away from this house. The beggar says she should hold the contest at once, for Odysseus will be here before they finish. She goes up to bed, weeping for her husband until Athena closes her eyes.']]}
]};

/* ---------- BOOK XX ---------- */
EP.b20={book:'BOOK XX',bk:20,hero:{x:130,o:{...BEG,lie:true},s:1.05},steps:[
  {k:'bg',v:'hall',o:{rich:true,door:880}},
  {k:'cast',add:[F(560,{...WM,pale:true},1,-1,'m1'),F(660,{...WM},1,-1,'m2'),F(760,{...WM},1,-1,'m3')]},
  {k:'card',c:[['A NIGHT OF ANGER','Odysseus lies in the porch on an ox hide, with the sheepskins of the slaughtered beasts over him, and Eurynome covers him with a cloak. He cannot sleep. He sees the maids slip out to sleep with the suitors, laughing, and his heart growls in him like a bitch over her pups. He strikes his chest and speaks to his heart: endure, you endured worse when the Cyclops ate your friends. His heart obeys. Athena stands over him and reassures him.']]},
  {k:'hold',secs:5,hint:'MASTER YOUR ANGER  ·  HOLD SPACE OR THE MOUSE BUTTON'},
  {k:'card',c:[
   ['THE OMEN OF THUNDER','Penelope awakes and prays to Artemis to end her life, or take her to Hades, rather than live to please a lesser man. Odysseus hears her and asks Zeus for a sign; Zeus thunders from a clear sky, and Odysseus rejoices. A weary woman at the mill, one of twelve grinding the barley, who has stopped at the sound, prays that this be the day of the suitors\' last feast.'],
   ['THE FEAST OF APOLLO','It is the day of the festival of Apollo. Melanthius leads the best goats; Philoetius the cowherd brings a heifer; Eumaeus brings pigs. Philoetius greets the beggar kindly, and says that if Odysseus were to return he would fight for him. Odysseus tells him that he will be here before he leaves. Meanwhile the suitors plan to kill Telemachus, but a bird, an eagle with a dove in its claws, flies on the left, and Amphinomus says it is a bad omen.'],
   ['CTESIPPUS','Telemachus gives the beggar a seat and a table at the threshold. Ctesippus, a rich suitor from Same, says that he has had his share, and picks an ox\'s hoof out of the basket and throws it. Odysseus ducks with a grim smile, and the hoof hits the wall. Telemachus threatens to kill him, and Agelaus says that it would be fair to let Telemachus persuade his mother to marry one of them.',[F(190,BEG,1.7),F(400,{cloak:C.pale,beard:true},1.7,-1)]]]},
  {k:'bg',v:'hall',o:{rich:true,fire:480,door:880}},
  {k:'cast',clear:true,add:[SUIT(480),SUIT(560),SUIT(650),SUIT(740),{t:'table',x:520,y:FLOOR,w:200,food:true}]},
  {k:'hero',h:{x:130,o:BEG}},
  {k:'dodge',obj:'rock',r:17,secs:5,rate:.8,vy:320,hint:'THE OX\'S HOOF  ·  DUCK ASIDE',hurt:'It grazes you.'},
  {k:'card',c:[['THE SEER\'S VISION','Athena makes the suitors laugh uncontrollably, though they do not know why. The meat they eat is dripping with blood; their eyes fill with tears. Theoclymenus tells them that he sees their heads, faces and knees shrouded in night, walls and rafters spattered with blood, the vestibule and courtyard full of ghosts going down into the dark. The sun has vanished from the sky. The suitors laugh at him, and Eurymachus has him thrown out. Theoclymenus leaves, saying he has eyes and ears and feet and a sound mind, and will escape the ruin.']]}
]};

/* ---------- BOOK XXI ---------- */
EP.b21={book:'BOOK XXI',bk:21,hero:{x:130,o:{...WM,veil:true},s:1},steps:[
  {k:'bg',v:'hall',o:{rich:true,door:880}},
  {k:'cast',add:[{t:'box',x:300,y:FLOOR},{t:'box',x:560,y:FLOOR},{t:'bow',x:560,y:FLOOR-40,s:1}]},
  {k:'card',c:[['THE BOW FROM THE STOREROOM','Athena puts it into Penelope\'s mind to set the bow and the grey iron axes before the suitors, as a contest and a beginning of slaughter. She goes up to the storeroom at the end of the house, with the key of bronze with an ivory handle, and unlocks the door, which bellows like a bull in a meadow. She takes the bow from its peg: the bow of Odysseus, a gift from Iphitus, with a quiver full of arrows. She sits and weeps, then goes down with the maids.',[F(190,PEN,1.7)]]]},
  {k:'walk',hint:'GO UP TO THE STOREROOM AND TAKE THE BOW',to:[[300,'THE STOREROOM KEY'],[560,'THE BOW OF ODYSSEUS']],stand:1.4},
  {k:'hero',h:{x:500,o:TEL}},
  {k:'cast',clear:true,add:[SUIT(300),SUIT(380),SUIT(780),SUIT(850),{t:'axes',x:560,y:FLOOR-40,n:6,gap:30}]},
  {k:'card',c:[['PENELOPE\'S CONTEST','Penelope stands in the hall with her maids and tells the suitors: you have been eating my husband\'s house for years, and your only pretext is that you want to marry me. Here is the great bow of Odysseus. Whoever strings it most easily and shoots an arrow through all twelve axes, I will follow him from this house, even if I shall remember it in my dreams. Eumaeus weeps as he hands over the bow, and Philoetius too.',[F(190,PEN,1.7)]]]},
  {k:'ring',n:4,per:.8,at:[300,520],hint:'TELEMACHUS DIGS THE TRENCH AND SETS UP THE AXES  ·  PRESS WHEN THE RING CLOSES',miss:'Not true yet. Again.'},
  {k:'tug',cap:.88,foe:560,gain:.06,pull:.2,hint:'TELEMACHUS BENDS THE BOW  ·  TAP SPACE OR CLICK',lose:'The bow springs back!'},
  {k:'card',c:[
   ['TELEMACHUS TRIES','Telemachus tries to string the bow, and three times he strains at it, but fails. A fourth time he would have done it, but Odysseus makes a sign, and he lays the bow down. He tells the suitors that he is too weak, and invites them to try, starting with Leodes. Leodes, the priest, who has soft hands and has disapproved of the others, fails and puts the bow down.'],
   ['ANTINOUS AND EURYMACHUS','Antinous orders Melanthius to light a fire and fetch a block of tallow, to warm and grease the bow. They try it in the fire, but fail. Antinous says that the contest should wait until the next day, with an offering to Apollo, and the others agree.']]},
  {k:'bg',v:'court',o:{}},
  {k:'cast',clear:true,add:[F(600,{cloak:C.cream,beard:true},1,-1,'eum'),F(700,{cloak:C.pale,beard:true},1,-1,'phil')]},
  {k:'hero',h:{x:140,o:BEG,s:1.05}},
  {k:'walk',hint:'GO OUT TO THE COWHERD AND THE SWINEHERD',to:[[500,'EUMAEUS AND PHILOETIUS']],stand:1.4},
  {k:'card',c:[['THE SCAR AGAIN','Odysseus follows Eumaeus and Philoetius out of the hall. He asks them: what would you do if Odysseus were to come back at once? Both say they would fight for him. Then he reveals himself: I am the man you long for, back after twenty years. He shows the scar from the boar\'s tusk at Parnassus. They throw their arms round him, weep and kiss his head and shoulders. He tells them to be quiet, and gives his orders: Eumaeus must bring him the bow in the hall, and tell Eurycleia to bar the women\'s doors; Philoetius is to lock the courtyard gate and tie it with a cable.',[F(190,BEG,1.7),F(400,{cloak:C.cream,beard:true},1.7,-1)]]]},
  {k:'bg',v:'hall',o:{rich:true,fire:480,door:880}},
  {k:'cast',clear:true,add:[SUIT(300),SUIT(380),SUIT(460),SUIT(780),{t:'table',x:340,y:FLOOR,w:160,food:true},{t:'axes',x:560,y:FLOOR-40,n:6,gap:30},F(880,TEL,1,-1,'tel')]},
  {k:'hero',h:{x:300,o:{...BEG,carry:'bow'}}},
  {k:'card',c:[['THE BEGGAR ASKS','The suitors have given up for the day. The beggar asks to try the bow: he wants to know whether his strength is still as it was. Antinous shouts at him, but Penelope intervenes: the beggar will not take her, so what harm? Eurymachus objects that it is a question of shame. Penelope says that the people of this house have no reputation to lose. Telemachus tells her to go upstairs: bows are for men, and mine most of all. She obeys, and Athena puts her to sleep.',[F(190,{...BEG,carry:'bow'},1.7)]]]},
  {k:'mash',gain:.1,decay:.18,hint:'THE BEGGAR STRINGS THE BOW  ·  TAP SPACE OR CLICK'},
  {k:'card',c:[['THE BOW STRUNG','Odysseus turns the bow over and over to check for worm in the horn. The suitors mock. Then, as easily as a singer fits a new string to his lyre, he strings the bow without effort, and plucks the string, which sings like a swallow. The suitors turn pale. Zeus thunders. Odysseus takes an arrow, sits where he is, and shoots it straight through the holes of all twelve axes without touching any of them.']]},

let AC=null,MASTER=null,MUS=null,fadeA=0,trauma=0,stopT=0,banT=0;
const SCALE=[146.83,164.81,174.61,196,220,233.08,261.63,293.66,329.63];/* D phrygian-leaning, for a lyre-like line */
function audioInit(){
  if(AC||!(window.AudioContext||window.webkitAudioContext))return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain();MASTER.gain.value=SET.vol;MASTER.connect(AC.destination);
    /* sea: looped noise through a low-pass, swelling slowly */
    const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;
    for(let i=0;i<len;i++){l=l*.97+(Math.random()*2-1)*.06;d[i]=l*6;}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    const sg=AC.createGain();sg.gain.value=.16;
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.11;lg.gain.value=.07;lfo.connect(lg);lg.connect(sg.gain);lfo.start();
    src.connect(lp);lp.connect(sg);sg.connect(MASTER);src.start();
    MUS=AC.createGain();MUS.gain.value=SET.music?1:0;MUS.connect(MASTER);
    /* drone */
    [73.42,110].forEach(f=>{const o=AC.createOscillator(),g2=AC.createGain();o.type='sine';o.frequency.value=f;g2.gain.value=.025;o.connect(g2);g2.connect(MUS);o.start();});
    let step=3;setInterval(()=>{
      if(!AC||AC.state!=='running'||!SET.music||document.hidden)return;
      step=Math.max(0,Math.min(SCALE.length-1,step+Math.round((Math.random()-.5)*4)));
      if(Math.random()<.78)pluck(SCALE[step],.09,MUS,1.8);
    },1700);
  }catch(e){AC=null;}
}
function applyVol(){if(MASTER)MASTER.gain.value=SET.vol;if(MUS)MUS.gain.value=SET.music?1:0;}
function pluck(f,v,dest,dur){
  if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),g2=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;lp.type='lowpass';lp.frequency.setValueAtTime(2400,t);lp.frequency.exponentialRampToValueAtTime(500,t+(dur||.5));
  g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(v,t+.008);g2.gain.exponentialRampToValueAtTime(.0004,t+(dur||.5));
  o.connect(lp);o2.connect(lp);lp.connect(g2);g2.connect(dest||MASTER);o.start(t);o2.start(t);o.stop(t+(dur||.5)+.05);o2.stop(t+(dur||.5)+.05);
}
function noiseBurst(dur,f0,f1,v){
  if(!AC)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g2=AC.createGain();g2.gain.value=v;s.connect(bp);bp.connect(g2);g2.connect(MASTER);s.start(t);
}
function sfx(n){
  if(!AC||AC.state!=='running'||!SET.vol)return;
  if(n==='ui')pluck(392,.12,MASTER,.35);
  else if(n==='tick')pluck(330+Math.random()*60,.06,MASTER,.18);
  else if(n==='good'){pluck(440,.12,MASTER,.4);setTimeout(()=>pluck(660,.1,MASTER,.5),90);}
  else if(n==='bad'){pluck(110,.2,MASTER,.3);}
  else if(n==='shoot')noiseBurst(.18,3000,800,.12);
  else if(n==='hit'){noiseBurst(.22,900,200,.25);pluck(130,.2,MASTER,.3);}
  else if(n==='hurt'){noiseBurst(.3,500,90,.35);pluck(82,.25,MASTER,.4);}
  else if(n==='done'){[294,392,523].forEach((f,i)=>setTimeout(()=>pluck(f,.12,MASTER,.7),i*110));}
}
