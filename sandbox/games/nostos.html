que passe. No outro está Caribde, que três vezes por dia engole o mar e três vezes o vomita. Melhor perder seis homens do que todos. Não te armes contra Cila, disse-lhe ela, pois não é mortal.","STEER BETWEEN THE TWO  ·  A / D OR ARROWS  ·  KEEP THE MIDDLE":"GUIE ENTRE OS DOIS  ·  A / D OU SETAS  ·  MANTENHA O MEIO","The spray hurls you aside!":"A espuma o lança de lado!","SIX MEN":"SEIS HOMENS","Odysseus, disobeying Circe, puts on his armour and takes two long spears, and stands at the prow, but sees nothing as he searches the cliff. They row in through the narrows, the men in terror as Charybdis sucks down the sea water in front of them. While all eyes are on that, Scylla seizes six of his best men from the deck. He hears them cry out his name for the last time as they are lifted high, like fish dangled over rocks.":"Odisseu, desobedecendo a Circe, veste a armadura, toma duas longas lanças e se põe à proa, mas nada vê ao examinar o rochedo. Entram a remo pelo estreito, os homens aterrados enquanto Caribde engole a água do mar diante deles. Enquanto todos os olhos estão nela, Cila arrebata do convés seis dos seus melhores homens. Ele os ouve gritar o seu nome pela última vez enquanto são erguidos no ar, como peixes pendurados sobre rochas.","THE WORST SIGHT":"A PIOR VISÃO","The sight, Odysseus says afterwards, was the most pitiful he has seen of all the things he went through while searching the sea paths. The ship rows on and soon the island of the Sun, Thrinacia, comes into view.":"A visão, diz Odisseu depois, foi a mais lastimável que viu de tudo que passou ao explorar os caminhos do mar. O navio segue a remo e logo a ilha do Sol, Trinácria, surge à vista.","THE ISLAND OF THE SUN":"A ILHA DO SOL","A MONTH OF WIND":"UM MÊS DE VENTO","During the night Zeus sends a violent storm, and in the morning they haul the ship up into a cave. For a month the South Wind blows, and then the East, and nothing else. They use up the corn and the wine, and begin to hunt for fish and birds, whatever they can catch with hooks, because hunger torments them.":"Durante a noite Zeus envia uma violenta tempestade, e de manhã eles arrastam o navio para uma gruta. Por um mês sopra o Noto, e depois o Euro, e nenhum outro. Consomem o grão e o vinho, e começam a caçar peixes e aves, o que puderem apanhar com anzóis, pois a fome os atormenta.","GO INLAND TO PRAY FOR A WAY HOME":"VÁ PARA DENTRO DA ILHA REZAR POR UM CAMINHO DE VOLTA","A SHELTERED PLACE":"UM LUGAR ABRIGADO","THE CATTLE OF HELIOS":"O GADO DE HÉLIO","Odysseus washes his hands and prays to the gods on Olympus, and they send a sweet sleep. Meanwhile Eurylochus talks the men round: death by starvation is the worst of all deaths, so let them drive off the best of the cattle and promise a temple to Helios at home. They drive the cows off, kill them and roast them on spits, and when Odysseus wakes and smells the fat he cries out to Zeus, knowing that it is done.":"Odisseu lava as mãos e reza aos deuses do Olimpo, e eles lhe enviam um doce sono. Entretanto Euríloco persuade os homens: a morte pela fome é a pior de todas, portanto levem o melhor do gado e prometam um templo a Hélio em casa. Levam as vacas, matam-nas e as assam em espetos, e quando Odisseu acorda e sente o cheiro da gordura clama a Zeus, sabendo que está feito.","THE LAMENT OF HELIOS":"O LAMENTO DE HÉLIO","Lampetia the nymph goes to Helios with the news. Helios, enraged, tells Zeus that unless he is paid, he will go down to Hades and shine among the dead. Zeus promises to strike their ship with a thunderbolt. For six days the men feast, and on the seventh, when the storm drops, they put to sea.":"A ninfa Lampécia vai a Hélio com a notícia. Hélio, enraivecido, diz a Zeus que, se não for ressarcido, descerá a Hades e brilhará entre os mortos. Zeus promete atingir o navio deles com um raio. Por seis dias os homens banqueteiam, e no sétimo, quando a tempestade amaina, fazem-se ao mar.","ZEUS'S THUNDERBOLT  ·  STEER THE SHIP  ·  A / D OR ARROWS":"O RAIO DE ZEUS  ·  GUIE O NAVIO  ·  A / D OU SETAS","The ship shudders!":"O navio estremece!","THE BOLT":"O RAIO","As soon as they have left the island, with nothing but sky and sea in sight, Zeus sets a black cloud over the hollow ship. A violent west wind breaks the forestays, and the mast crashes down on the helmsman. Zeus thunders and strikes the ship with lightning. She spins, filled with sulphur, and the men fall into the water, bobbing like sea-crows around the black ship. The gods give them no return.":"Assim que deixam a ilha, com nada senão céu e mar à vista, Zeus põe uma nuvem negra sobre o navio oco. Um violento vento do oeste rompe os estais, e o mastro desaba sobre o piloto. Zeus troveja e atinge o navio com o raio. Ele gira, cheio de enxofre, e os homens caem na água, boiando como corvos-marinhos em torno do navio negro. Os deuses lhes negam o regresso.","CLING TO THE FIG TREE OVER CHARYBDIS  ·  HOLD SPACE OR THE MOUSE BUTTON":"AGARRE-SE À FIGUEIRA SOBRE CARIBDE  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE","THE FIG TREE":"A FIGUEIRA","PADDLE WITH YOUR HANDS  ·  TAP SPACE OR CLICK":"REMEIE COM AS MÃOS  ·  TOQUE EM ESPAÇO OU CLIQUE","OGYGIA":"OGÍGIA","He drifts nine days, and on the tenth night the gods bring him to Ogygia, where the dread goddess Calypso, with a human voice, takes him in and cares for him, and he stays seven years.":"Vaga nove dias, e na décima noite os deuses o levam a Ogígia, onde a temida deusa Calipso, de voz humana, o acolhe e cuida dele, e ele fica sete anos.","END OF THE TALE":"FIM DA NARRATIVA","Odysseus has told the story. Alcinous' hall is silent. He stops, since he has already told it once, yesterday, in this very house.":"Odisseu terminou a história. O palácio de Alcínoo está em silêncio. Ele se detém, pois já a contou uma vez, ontem, nesta mesma casa.","BOOK XIII":"CANTO XIII","THE GUEST-GIFTS":"OS PRESENTES DE HOSPITALIDADE","The tale is over, and the hall of Alcinous is silent. Alcinous tells his guest that he will be sent home without further wandering, and that each of the Phaeacian lords will give him a tripod and a cauldron, to be repaid later by the people. In the morning the gifts are carried to the ship. Arete sends him a cloak and tunic, and a chest, and slaves to carry them.":"A narrativa terminou, e o palácio de Alcínoo está em silêncio. Alcínoo diz ao hóspede que será enviado a casa sem mais andanças, e que cada um dos chefes feácios lhe dará um tripé e um caldeirão, que o povo repor depois. De manhã os presentes são levados ao navio. Arete lhe envia um manto e uma túnica, um baú e escravas para os levar.","TAKE LEAVE OF THE QUEEN AND THE KING":"DESPEÇA-SE DA RAINHA E DO REI","ARETE":"ARETE","ALCINOUS":"ALCÍNOO","FAREWELL":"ADEUS","Odysseus puts a two-handled cup into Arete's hand and wishes her joy until old age and death come to her, to her children, her people, and King Alcinous. Then he steps over the threshold, and Alcinous sends a herald to lead him to the ship. At the shore the sailors spread a rug and a linen sheet on the deck at the stern, and Odysseus lies down in silence.":"Odisseu põe uma taça de duas asas na mão de Arete e lhe deseja alegria até que a velhice e a morte lhe cheguem, a ela, aos filhos, ao povo e ao rei Alcínoo. Depois transpõe o umbral, e Alcínoo envia um arauto que o leve ao navio. Na praia os marinheiros estendem uma manta e um lençol de linho no convés, na popa, e Odisseu se deita em silêncio.","THE PHAEACIAN SHIP FLIES  ·  TAP SPACE OR CLICK":"O NAVIO FEÁCIO VOA  ·  TOQUE EM ESPAÇO OU CLIQUE","THE FASTEST SHIP":"O NAVIO MAIS VELOZ","They strike the sea with their oars and a deep sleep falls on Odysseus, sweet, unbroken, most like death. The ship runs as fast as four stallions harnessed together, and not even a falcon could have kept up. At the first appearance of the dawn star they reach Ithaca, to the harbour of Phorcys. The sailors lift him in his sheet and lay him on the sand without waking him, with his gifts piled under an olive tree, out of the path.":"Ferem o mar com os remos e um sono profundo cai sobre Odisseu, doce, ininterrupto, quase igual à morte. O navio corre como quatro garanhões atrelados juntos, e nem um falcão o alcançaria. Ao surgir a estrela da aurora chegam a Ítaca, ao porto de Fórcis. Os marinheiros o levantam no lençol e o deitam na areia sem acordá-lo, com os presentes amontoados sob uma oliveira, fora do caminho.","THE SHIP OF STONE":"O NAVIO DE PEDRA","On their way home Poseidon complains to Zeus that the Phaeacians have disregarded him. Zeus says: when all can see the ship near the land, turn it to stone, and hide the city behind a mountain. Poseidon waits until the ship is just entering harbour, strikes it with his hand, and roots it in the sea as stone. Alcinous remembers the old prophecy, and tells his people to sacrifice twelve bulls to Poseidon.":"Na volta, Posido se queixa a Zeus de que os feácios o desprezaram. Zeus diz: quando todos puderem ver o navio perto da terra, transforma-o em pedra e esconde a cidade atrás de uma montanha. Posido espera que o navio esteja entrando no porto, toca-o com a mão e o enraíza no mar como pedra. Alcínoo se lembra da antiga profecia e manda o povo sacrificar doze touros a Posido.","ITHACA, UNKNOWN":"ÍTACA, DESCONHECIDA","Odysseus wakes on his own land, and does not know it: Athena has poured a mist over everything so that she can disguise him. He laments that the Phaeacians have deceived him, and counts the gifts to be sure none are missing. Then he sees a young man, a shepherd, delicate, of high birth, with a cloak folded double over his shoulders and a spear in his hand. It is Athena.":"Odisseu acorda na própria terra e não a reconhece: Atena derramou uma névoa sobre tudo para poder disfarçá-lo. Lamenta que os feácios o tenham enganado e conta os presentes para ver se nenhum falta. Então vê um jovem, um pastor, delicado, de nobre estirpe, com um manto dobrado em dois sobre os ombros e uma lança na mão. É Atena.","ASK THE SHEPHERD WHAT LAND THIS IS":"PERGUNTE AO PASTOR QUE TERRA É ESSA","THE YOUNG SHEPHERD":"O JOVEM PASTOR","A CRETAN LIE":"UMA MENTIRA CRETENSE","The shepherd tells him: this is Ithaca, known as far as Troy. Odysseus, pleased, still tells him a lie, as he always does: he is a Cretan, who killed a son of Idomeneus and fled with Phoenician sailors, who left him asleep on this shore with his cargo. Athena smiles and strokes him, becoming a tall and beautiful woman. She tells him he is a man of many tricks, and so is she.":"O pastor lhe diz: esta é Ítaca, conhecida até Troia. Odisseu, contente, ainda assim lhe conta uma mentira, como sempre faz: é um cretense, que matou um filho de Idomeneu e fugiu com marinheiros fenícios, que o deixaram dormindo nesta praia com a sua carga. Atena sorri e o acaricia, tornando-se uma mulher alta e bela. Diz-lhe que é um homem de muitas astúcias, e ela também.","THE GODDESS":"A DEUSA","Athena tells him she has been at his side through all his troubles, though not in the sea storms, since she would not fight her uncle Poseidon. She lifts the mist and shows him the harbour of Phorcys, the cave of the Nymphs and Mount Neriton. Odysseus kisses the ground. She tells him that suitors have been at his house for three years, and Penelope still holds out, hoping for him. She will change him so that no one knows him.":"Atena lhe diz que esteve ao seu lado em todas as provações, embora não nas tempestades do mar, pois não quis combater o tio Posido. Levanta a névoa e lhe mostra o porto de Fórcis, a gruta das Ninfas e o monte Nérito. Odisseu beija o chão. Ela lhe diz que há três anos os pretendentes estão em sua casa, e Penélope ainda resiste, esperando por ele. Ela o transformará para que ninguém o reconheça.","HIDE THE TREASURE IN THE CAVE OF THE NYMPHS":"ESCONDA O TESOURO NA GRUTA DAS NINFAS","THE GIFTS UNDER THE OLIVE":"OS PRESENTES SOB A OLIVEIRA","THE CAVE OF THE NYMPHS":"A GRUTA DAS NINFAS","ATHENA'S WAND  ·  HOLD STILL  ·  HOLD SPACE OR THE MOUSE BUTTON":"A VARINHA DE ATENA  ·  FIQUE PARADO  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE","THE BEGGAR":"O MENDIGO","Athena touches him with her wand. The smooth skin on his supple limbs withers, his hair falls from his head, his eyes dim, his clothes become a filthy tattered tunic and a deerskin, a staff and a worn bag with a rope for a strap. She sends him to the swineherd Eumaeus, and goes herself to Sparta to bring back Telemachus.":"Atena o toca com a varinha. A pele lisa de seus membros flexíveis murcha, os cabelos lhe caem da cabeça, os olhos se turvam, as roupas se tornam uma túnica imunda e esfarrapada e uma pele de cervo, um cajado e um alforje gasto com uma corda por alça. Envia-o ao porqueiro Eumeu e vai ela própria a Esparta para trazer Telêmaco de volta.","BOOK XIV":"CANTO XIV","EUMAEUS' FARM":"A CHÁCARA DE EUMEU","Odysseus climbs the rough path through the woods to the farm of Eumaeus, which the swineherd built himself in a clearing, with a high yard of stone, hedged with thorn and a ring of oak stakes. Inside are twelve sties, each with fifty sows, and outside four fierce dogs, as savage as wild beasts. Eumaeus is cutting a pair of sandals from an ox-hide.":"Odisseu sobe o áspero caminho pelo bosque até a chácara de Eumeu, que o porqueiro construiu ele mesmo numa clareira, com um alto pátio de pedra, cercado de espinheiros e de um círculo de estacas de carvalho. Dentro há doze chiqueiros, cada um com cinquenta porcas, e fora quatro cães ferozes, selvagens como feras. Eumeu está cortando um par de sandálias de couro de boi.","WALK UP TO THE FARM":"ANDE ATÉ A CHÁCARA","THE YARD":"O PÁTIO","SIT DOWN, DROP YOUR STAFF AND KEEP STILL  ·  HOLD SPACE OR THE MOUSE BUTTON":"SENTE-SE, LARGUE O CAJADO E FIQUE QUIETO  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE","EUMAEUS DRIVES OFF THE DOGS WITH STONES  ·  PRESS WHEN THE RING CLOSES":"EUMEU AFASTA OS CÃES A PEDRADAS  ·  APERTE QUANDO O ANEL SE FECHAR","The stone falls short.":"A pedra cai curta.","THE HOST":"O ANFITRIÃO","Eumaeus brings the stranger in, spreads brushwood and a goat skin for him to sit on, and says that guests and beggars are all from Zeus, and a small gift is welcome. He mourns his master, who would have given him a house, a plot and a wife, had he lived. Odysseus asks the name, and Eumaeus answers: Odysseus, son of Laertes, who is long gone. He has not believed a stranger's tale of him since an Aetolian fooled him.":"Eumeu leva o estrangeiro para dentro, estende ramos e uma pele de cabra para ele se sentar, e diz que hóspedes e mendigos vêm todos de Zeus, e um pequeno presente é bem-vindo. Chora o seu senhor, que lhe teria dado casa, um lote de terra e uma esposa, se tivesse vivido. Odisseu pergunta o nome, e Eumeu responde: Odisseu, filho de Laertes, que está longe há muito. Desde que um etólio o enganou, não acredita mais em nenhuma história de estrangeiros sobre ele.","HELP WITH THE FEAST  ·  FETCH TWO PIGLETS AND ROAST THEM":"AJUDE NO BANQUETE  ·  BUSQUE DOIS LEITÕES E ASSE-OS","THE PIGLETS":"OS LEITÕES","THE FIRE":"O FOGO","THE FEAST":"O BANQUETE","Eumaeus kills two piglets, singes them, cuts them up and roasts them on spits. He shares them in seven portions: one to the Nymphs and Hermes, and the best cut, the long chine, to the stranger, which delights Odysseus. They eat, and drink the dark wine, and Odysseus, sitting by the fire, tells a false tale: he is the son of a rich Cretan, a leader at Troy beside Idomeneus, later raided Egypt and lost his men, and was a guest at the house of Thesprotian king Pheidon, who told him that Odysseus was near and would return.":"Eumeu mata dois leitões, chamusca-os, corta-os e os assa em espetos. Reparte-os em sete porções: uma para as Ninfas e Hermes, e o melhor pedaço, o lombo comprido, para o estrangeiro, o que alegra Odisseu. Comem e bebem o vinho escuro, e Odisseu, sentado junto ao fogo, conta uma história falsa: é filho de um rico cretense, chefe em Troia ao lado de Idomeneu, depois saqueou o Egito e perdeu os homens, e foi hóspede na casa do rei tesproto Fidão, que lhe disse que Odisseu estava perto e voltaria.","THE CLOAK":"O MANTO","Eumaeus does not believe a word of his return, and says no news of Odysseus will move him. Odysseus swears, and wagers a cloak and tunic against a sure return in the month's end. As night comes on and it freezes, Odysseus tells a tale of an ambush before Troy, in which he, cold in the night, begged one of his men for a cloak, and got it by a trick. Eumaeus takes the hint and gives him a thick cloak for the night.":"Eumeu não acredita numa palavra sobre o regresso e diz que nenhuma notícia de Odisseu o comoverá. Odisseu jura e aposta um manto e uma túnica contra um regresso certo no fim do mês. Ao cair a noite e esfriar, Odisseu conta uma história de emboscada diante de Troia, em que, com frio na noite, pediu a um dos seus homens um manto e o obteve por astúcia. Eumeu percebe a indireta e lhe dá um grosso manto para a noite.","THE SWINEHERD AT NIGHT":"O PORQUEIRO À NOITE","Eumaeus goes outside to sleep beside the boars, in the cold, with a sword on his shoulder and a goat-skin round him. Odysseus is glad that the man takes such care of his master's property, even when his master is away.":"Eumeu sai para dormir ao lado dos javalis, no frio, com uma espada no ombro e uma pele de cabra em volta. Odisseu se alegra de que o homem cuide tanto dos bens do senhor, mesmo estando o senhor ausente.","BOOK XV":"CANTO XV","ATHENA IN SPARTA":"ATENA EM ESPARTA","Athena finds Telemachus lying awake in the porch, troubled, and tells him it is time to go home, since the suitors may eat up his property. She says Penelope's family is urging her to marry Eurymachus, and that the suitors are laying an ambush for him in the strait between Ithaca and Same. He must sail by night, keep away from the islands, and when he is landed, go first to the swineherd.":"Atena encontra Telêmaco desperto no pórtico, inquieto, e lhe diz que é hora de voltar para casa, pois os pretendentes podem consumir os seus bens. Diz que a família de Penélope a pressiona a casar com Eurímaco, e que os pretendentes lhe armam uma emboscada no estreito entre Ítaca e Samo. Deve navegar de noite, manter-se longe das ilhas e, ao desembarcar, ir primeiro ao porqueiro.","TAKE LEAVE OF MENELAUS AND HELEN":"DESPEÇA-SE DE MENELAU E HELENA","THE GIFTS OF SPARTA":"OS PRESENTES DE ESPARTA","HELEN'S OMEN":"O PRESSÁGIO DE HELENA","Helen interprets the sign: just as the eagle, from the hills where it was bred, has snatched the goose reared in the house, so Odysseus will come home after much suffering and take his vengeance. Telemachus prays to Zeus that it may come true. He and Pisistratus drive to Pylos, and at the shore Telemachus begs Pisistratus not to take him to Nestor's house, but to the ship, for the old man would keep him.":"Helena interpreta o sinal: assim como a águia, vinda dos montes onde nasceu, arrebatou o ganso criado em casa, Odisseu voltará depois de muito sofrer e se vingará. Telêmaco reza a Zeus que se cumpra. Ele e Pisístrato vão de carro a Pilo, e na praia Telêmaco pede a Pisístrato que não o leve à casa de Nestor, mas ao navio, pois o velho o reteria.","AT THE SHIP, A STRANGER ASKS FOR PASSAGE  ·  GO TO HIM":"NO NAVIO, UM ESTRANGEIRO PEDE PASSAGEM  ·  VÁ ATÉ ELE","THEOCLYMENUS":"TEOCLÍMENO","Telemachus is sacrificing to Athena at the stern of the ship when a stranger, Theoclymenus, descendant of the seer Melampus, arrives. He has killed a man in Argos and is a fugitive, and he begs to be taken aboard. Telemachus brings him on board, setting him beside him by the stern, and they put out to sea.":"Telêmaco está sacrificando a Atena na popa do navio quando chega um estrangeiro, Teoclímeno, descendente do adivinho Melampo. Matou um homem em Argos e é fugitivo, e pede para ser levado a bordo. Telêmaco o leva a bordo, sentando-o ao seu lado junto à popa, e fazem-se ao mar.","SAIL BY NIGHT, KEEP WELL AWAY FROM THE ISLANDS  ·  A / D OR ARROWS":"NAVEGUE DE NOITE, MANTENHA-SE BEM LONGE DAS ILHAS  ·  A / D OU SETAS","Too close to the rocks!":"Perto demais dos rochedos!","PAST THE AMBUSH":"ALÉM DA EMBOSCADA","They sail all night with a following wind, past Elis and the islets of the Pointed Isles, with Telemachus wondering whether he will escape death or be caught. Athena has told him to steer far from the islands and keep to the sea. He reaches the headland of Ithaca, tells the crew to take the ship round to the city, and goes up himself, alone, to the farm of Eumaeus.":"Navegam a noite toda com vento de popa, passando por Élide e pelas ilhotas Pontiagudas, e Telêmaco se pergunta se escapará à morte ou será apanhado. Atena lhe disse que se mantivesse longe das ilhas e no mar alto. Chega ao promontório de Ítaca, manda a tripulação levar o navio até a cidade e sobe ele próprio, sozinho, à chácara de Eumeu.","EUMAEUS' LIFE":"A VIDA DE EUMEU","GO TO THE SWINEHERD'S HOUSE":"VÁ À CASA DO PORQUEIRO","BOOK XVI":"CANTO XVI","A SON COMES HOME":"UM FILHO VOLTA PARA CASA","GREET THE SWINEHERD":"SAÚDE O PORQUEIRO","EUMAEUS":"EUMEU","ATHENA AT THE DOOR":"ATENA À PORTA","ATHENA'S WAND  ·  HOLD SPACE OR THE MOUSE BUTTON":"A VARINHA DE ATENA  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE","THE RECOGNITION":"O RECONHECIMENTO","EMBRACE YOUR FATHER":"ABRACE SEU PAI","ODYSSEUS":"ODISSEU","THE SUITORS COUNTED":"OS PRETENDENTES CONTADOS","THE PLAN":"O PLANO","Telemachus must go back to the house and mingle with the suitors. Odysseus will come later, as a beggar, and whatever they do to him he must bear, even if they drag him by the feet to the door. When he nods, Telemachus is to take the weapons from the hall and put them away in the upper room, telling the suitors that smoke is spoiling them, but keeping back two swords, two spears and two shields. And no one is to know he has come, not Laertes, not Penelope, not the swineherd.":"Telêmaco deve voltar à casa e misturar-se aos pretendentes. Odisseu virá mais tarde, como mendigo, e o que lhe fizerem deve suportar, ainda que o arrastem pelos pés até a porta. Quando ele fizer sinal com a cabeça, Telêmaco deve tirar as armas do salão e guardá-las no quarto de cima, dizendo aos pretendentes que a fumaça as estraga, mas retendo duas espadas, duas lanças e dois escudos. E ninguém deve saber que ele chegou, nem Laertes, nem Penélope, nem o porqueiro.","THE SHIP RETURNS":"O NAVIO VOLTA","EUMAEUS RETURNS":"EUMEU VOLTA","Back at the farm, Athena has made Odysseus into a beggar again before Eumaeus returns. The swineherd tells Telemachus that he saw a ship full of armed men come into harbour, but he thinks nothing. Telemachus smiles to himself at his father. They eat and sleep.":"De volta à chácara, Atena fez de Odisseu um mendigo de novo antes que Eumeu regresse. O porqueiro diz a Telêmaco que viu um navio cheio de homens armados entrar no porto, mas não pensa nada disso. Telêmaco sorri consigo para o pai. Comem e dormem.","BOOK XVII":"CANTO XVII","TELEMACHUS IN THE TOWN":"TELÊMACO NA CIDADE","WALK TO THE TOWN WITH EUMAEUS":"ANDE ATÉ A CIDADE COM EUMEU","THE ROAD UP":"O CAMINHO ACIMA","MELANTHIUS":"MELÂNTIO","On the road, they meet the goatherd Melanthius, driving the best goats to the suitors' feast, with two herdsmen. He insults them, calling Eumaeus a swineherd leading a beggar. He kicks Odysseus in the hip. Odysseus does not move, and thinks whether to kill him with his staff, but holds back. Eumaeus prays to the Nymphs, that Odysseus may come and scatter such pride.":"No caminho encontram o cabreiro Melântio, que leva as melhores cabras ao banquete dos pretendentes, com dois pastores. Insulta-os, chamando Eumeu de porqueiro que conduz um mendigo. Chuta Odisseu no quadril. Odisseu não se move e pondera se o mata com o cajado, mas se contém. Eumeu reza às Ninfas para que Odisseu venha e dissipe tamanha arrogância.","APPROACH THE DUNG-HEAP AT THE GATE":"APROXIME-SE DO ESTERQUEIRO NO PORTÃO","THE OLD DOG":"O VELHO CÃO","ARGOS":"ARGOS","A dog lifts his head and ears: Argos, whom Odysseus had trained as a puppy but never hunted with. Now he lies on a dung heap, full of ticks, neglected. He wags his tail and lays his ears flat, but cannot get up. Odysseus, wiping a tear away where Eumaeus cannot see, asks about him. Eumaeus says that he was once the fastest dog. As soon as he has seen Odysseus again after twenty years, black death takes Argos.":"Um cão ergue a cabeça e as orelhas: Argos, que Odisseu criara filhote mas nunca levou à caça. Agora jaz num monte de esterco, cheio de carrapatos, abandonado. Abana a cauda e baixa as orelhas, mas não consegue se levantar. Odisseu, enxugando uma lágrima onde Eumeu não vê, pergunta por ele. Eumeu diz que já foi o cão mais veloz. Assim que vê Odisseu de novo, depois de vinte anos, a negra morte leva Argos.","GO ROUND THE TABLES AND BEG, AS ATHENA ADVISED":"PERCORRA AS MESAS E PEÇA, COMO ATENA ACONSELHOU","THE FIRST TABLE":"A PRIMEIRA MESA","ANTINOUS":"ANTÍNOO","THE LAST TABLE":"A ÚLTIMA MESA","THE FOOTSTOOL":"O BANQUINHO","Telemachus sends him bread and meat from the table. He goes round the suitors, who give. Antinous refuses, saying that the beggar is a nuisance, and Odysseus answers that he has a mean heart who would not give salt from his own house. Antinous, furious, takes up the footstool under his table and throws it. It strikes Odysseus on the right shoulder. He does not flinch, but shakes his head in silence, and thinks of vengeance.":"Telêmaco lhe manda pão e carne da mesa. Ele percorre os pretendentes, que dão. Antínoo recusa, dizendo que o mendigo é um incômodo, e Odisseu responde que tem coração mesquinho quem não daria sal da própria casa. Antínoo, furioso, toma o banquinho debaixo da mesa e o atira. Atinge Odisseu no ombro direito. Ele não se abala, mas balança a cabeça em silêncio e pensa em vingança.","STAND LIKE A ROCK  ·  HOLD SPACE OR THE MOUSE BUTTON":"FIQUE COMO UMA ROCHA  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE","PENELOPE'S WISH":"O DESEJO DE PENÉLOPE","BOOK XVIII":"CANTO XVIII","IRUS":"IRO","A beggar called Irus, who runs errands for the suitors, arrives. He was known for his enormous appetite and his huge body, but he has no strength. Seeing Odysseus on the threshold he abuses him and tells him to leave, or he will drag him by the feet. Odysseus answers calmly that there is room for both, and that Irus should not try to be a beggar by envy. Irus threatens to knock his teeth out. Antinous laughs and says that the suitors will let them fight, and the winner may eat what he wants of the goat's stomachs sizzling on the fire.":"Chega um mendigo chamado Iro, que faz recados aos pretendentes. Era conhecido pelo enorme apetite e pelo corpanzil, mas não tem força. Ao ver Odisseu na soleira, insulta-o e manda-o embora, senão o arrastará pelos pés. Odisseu responde com calma que há lugar para ambos, e que Iro não deve querer ser mendigo por inveja. Iro ameaça arrancar-lhe os dentes. Antínoo ri e diz que os pretendentes os deixarão lutar, e o vencedor poderá comer o que quiser dos estômagos de cabra que chiam no fogo.","THE BEGGAR STRIPS":"O MENDIGO SE DESPE","Odysseus ties his rags round his waist. The suitors see his thighs, huge and fine, his broad shoulders, his chest and thick arms, with Athena at his side making his limbs bigger. Irus is shaken, and his legs tremble. The suitors say that Irus will soon be in trouble. Antinous makes him stand.":"Odisseu amarra os trapos à cintura. Os pretendentes veem as coxas dele, enormes e belas, os ombros largos, o peito e os braços grossos, com Atena a seu lado fazendo-lhe os membros maiores. Iro se abala, e as pernas lhe tremem. Os pretendentes dizem que Iro logo estará em apuros. Antínoo o obriga a ficar de pé.","ONE BLOW  ·  STRIKE WHEN THE RING CLOSES  ·  NOT TOO HARD":"UM GOLPE  ·  GOLPEIE QUANDO O ANEL SE FECHAR  ·  NÃO FORTE DEMAIS","Hold off. Wait for it.":"Espere. Aguarde o momento.","A BLOW BELOW THE EAR":"UM GOLPE ABAIXO DA ORELHA","Odysseus wonders whether to kill him outright, but decides to strike lightly, so that the suitors do not recognise him. He hits Irus in the neck below the ear and crushes the bone. Blood comes from his mouth and he falls in the dust, kicking, with his teeth gnashing. The suitors die laughing. Odysseus drags him by the feet out to the yard, props him against the wall and puts his staff in his hand, telling him to sit there and scare off the pigs and dogs.":"Odisseu pondera se o mata de vez, mas decide golpear de leve, para que os pretendentes não o reconheçam. Atinge Iro no pescoço, abaixo da orelha, e quebra o osso. O sangue lhe sai pela boca e ele cai no pó, esperneando, rilhando os dentes. Os pretendentes morrem de rir. Odisseu o arrasta pelos pés até o pátio, encosta-o no muro e lhe põe o cajado na mão, mandando-o sentar ali e espantar porcos e cães.","AMPHINOMUS":"ANFÍNOMO","The suitors give him presents, and Antinous a great goat's stomach full of fat. Odysseus then warns Amphinomus, the best of them, that men on earth are only what the day brings them, and that Odysseus will not be far from his own people when he returns. Amphinomus is troubled, since Athena has marked him for death, and he goes back to his seat.":"Os pretendentes lhe dão presentes, e Antínoo um grande estômago de cabra cheio de gordura. Odisseu então adverte Anfínomo, o melhor deles, de que os homens na terra são apenas o que o dia lhes traz, e que Odisseu não estará longe dos seus quando voltar. Anfínomo se perturba, pois Atena o marcou para a morte, e volta ao seu assento.","PENELOPE APPEARS":"PENÉLOPE APARECE","Athena puts into Penelope's mind the wish to appear before the suitors, to draw gifts from them. She laughs for no reason. Athena puts her to sleep, makes her taller, fairer and whiter than ivory. She comes down, veiled, with two maids, and rebukes Telemachus for letting the beggar be mistreated. The suitors' knees give way with desire. Eurymachus calls her the most beautiful, and each suitor sends gifts: Antinous a robe, Eurymachus a golden necklace strung with amber, and others earrings and jewels.":"Atena põe na mente de Penélope o desejo de aparecer diante dos pretendentes, para lhes arrancar presentes. Ela ri sem motivo. Atena a adormece, torna-a mais alta, mais bela e mais branca que o marfim. Desce, velada, com duas servas, e repreende Telêmaco por deixar o mendigo ser maltratado. Os joelhos dos pretendentes se dobram de desejo. Eurímaco a chama a mais bela, e cada pretendente envia presentes: Antínoo um manto, Eurímaco um colar de ouro cravejado de âmbar, e outros brincos e joias.","MELANTHO AND EURYMACHUS":"MELANTO E EURÍMACO","Odysseus tends the lamps in the hall to see the maids. The maid Melantho, who sleeps with Eurymachus, insults him again. He warns her that Telemachus will hear. Eurymachus mocks him too, calling him a vagrant too lazy to work. Odysseus challenges him to a mowing match in spring and a ploughing match, and to fight in battle. Eurymachus, furious, throws a stool at him. Odysseus ducks, and it strikes the cupbearer, who falls with a crash.":"Odisseu cuida das lamparinas no salão para observar as servas. A serva Melanto, que dorme com Eurímaco, o insulta de novo. Ele a adverte de que Telêmaco ouvirá. Eurímaco também zomba dele, chamando-o de vagabundo preguiçoso demais para trabalhar. Odisseu o desafia para uma competição de ceifa na primavera e uma de lavoura, e para lutar em batalha. Eurímaco, furioso, lhe atira um banquinho. Odisseu se abaixa, e ele atinge o copeiro, que cai com estrondo.","THE STOOL FLIES  ·  A / D OR CLICK TO DUCK ASIDE":"O BANQUINHO VOA  ·  A / D OU CLIQUE PARA SE ABAIXAR","Close!":"Por pouco!","PEACE FOR THE NIGHT":"PAZ PARA A NOITE","Telemachus calls for order: the suitors have eaten and drunk enough, and should go to bed. Amphinomus agrees. They pour the last wine and go home. Odysseus stays in the hall with Telemachus and the thought of the weapons.":"Telêmaco pede ordem: os pretendentes comeram e beberam o bastante e devem ir deitar-se. Anfínomo concorda. Derramam o último vinho e vão para casa. Odisseu fica no salão com Telêmaco e o pensamento das armas.","BOOK XIX":"CANTO XIX","THE WEAPONS REMOVED":"AS ARMAS RETIRADAS","Odysseus and Telemachus stay in the hall to carry the helmets, shields and sharp spears away into the storeroom, as agreed. Athena goes ahead of them with a golden lamp, shedding a wonderful light, and Telemachus sees the walls and rafters glowing like fire. He tells his father that some god of heaven is in the house. Odysseus tells him to be quiet, and keep it to himself.":"Odisseu e Telêmaco ficam no salão para levar os elmos, escudos e lanças afiadas ao depósito, como combinado. Atena vai à frente deles com uma lâmpada de ouro, derramando uma luz maravilhosa, e Telêmaco vê as paredes e as vigas brilharem como fogo. Diz ao pai que algum deus do céu está na casa. Odisseu lhe manda calar-se e guardar para si.","CARRY THE WEAPONS OUT OF THE HALL, TO THE STOREROOM  ·  THREE LOADS":"LEVE AS ARMAS DO SALÃO AO DEPÓSITO  ·  TRÊS CARGAS","THE SHIELDS":"OS ESCUDOS","THE HELMETS":"OS ELMOS","THE SPEARS":"AS LANÇAS","SPEAK WITH PENELOPE BY THE FIRE":"FALE COM PENÉLOPE JUNTO AO FOGO","PENELOPE":"PENÉLOPE","THE KEEPER OF THE HEARTH":"A GUARDIÃ DA LAREIRA","Penelope sits by the fire. She asks the beggar who he is. He answers with a tale: he is from Crete, Aethon by name, and Odysseus was once a guest in his brother Idomeneus' house, on his way to Troy, held for twelve days by the north wind. She tests him: what clothes did he wear? He describes a purple cloak with a gold brooch showing a hound holding a dappled fawn, and a shining tunic, and a herald a little older who was dark, with rounded shoulders, called Eurybates.":"Penélope está sentada junto ao fogo. Pergunta ao mendigo quem é. Ele responde com uma história: é de Creta, de nome Etão, e Odisseu foi hóspede na casa de seu irmão Idomeneu, a caminho de Troia, retido doze dias pelo vento norte. Ela o põe à prova: que roupas vestia? Ele descreve um manto de púrpura com um broche de ouro mostrando um cão que segura um filhote de gamo malhado, e uma túnica brilhante, e um arauto um pouco mais velho, moreno, de ombros redondos, chamado Euríbates.","THE TIMING OF THE RETURN":"O MOMENTO DO REGRESSO","Penelope weeps, and tells him she will give him clothes and treat him as a friend. He says that he heard Odysseus in Thesprotia, and that he will be back before this month and year are out. She does not believe it, but she tells the maids to bathe him.":"Penélope chora e lhe diz que lhe dará roupas e o tratará como amigo. Ele diz que ouviu falar de Odisseu na Tesprócia, e que voltará antes que este mês e este ano acabem. Ela não acredita, mas manda as servas banhá-lo.","THE SCAR":"A CICATRIZ","The old nurse Eurycleia comes with a basin to wash his feet. Penelope says he looks about the age her husband would be. Odysseus sits out of the firelight, thinking of the scar on his leg, and turns his face away. The nurse touches it, and knows.":"A velha ama Euricleia vem com uma bacia para lavar-lhe os pés. Penélope diz que ele parece ter a idade que o marido teria. Odisseu senta-se fora da luz do fogo, pensando na cicatriz da perna, e vira o rosto. A ama a toca, e reconhece.","KEEP YOUR LEG IN THE SHADOW  ·  HOLD SPACE OR THE MOUSE BUTTON":"MANTENHA A PERNA NA SOMBRA  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE","THE BOAR'S TUSK":"A PRESA DO JAVALI","SEIZE HER THROAT BEFORE SHE CRIES OUT  ·  PRESS WHEN THE RING CLOSES":"AGARRE-LHE A GARGANTA ANTES QUE GRITE  ·  APERTE QUANDO O ANEL SE FECHAR","She draws breath, too soon!":"Ela toma fôlego, cedo demais!","THE NURSE SWORN TO SILENCE":"A AMA OBRIGADA AO SILÊNCIO","Odysseus takes her by the throat with his right hand and with his left draws her close, and tells her: you nursed me, do you wish to destroy me? Keep it to yourself, or when the god has laid the suitors low, I will not spare you when I kill the maids. Eurycleia swears: she will be as solid as stone or iron. She brings fresh water, and he moves back to the fire.":"Odisseu a agarra pela garganta com a mão direita e com a esquerda a puxa para si, e lhe diz: tu me amamentaste, queres me perder? Guarda para ti, ou quando o deus tiver abatido os pretendentes, não te pouparei quando matar as servas. Euricleia jura: será firme como pedra ou ferro. Traz água fresca, e ele volta para junto do fogo.","PENELOPE'S DREAM":"O SONHO DE PENÉLOPE","Penelope tells the beggar her dream: twenty geese in the yard, whom she loved to watch eating, were killed by a great eagle that came from the mountains. She wept. The eagle perched on the roof and said in a human voice that it was Odysseus, and the geese were the suitors. The beggar says that the meaning is clear. She says that dreams pass through two gates, of horn and ivory, and this one may have come through the false gate.":"Penélope conta ao mendigo o seu sonho: vinte gansos no pátio, que ela gostava de ver comer, foram mortos por uma grande águia vinda das montanhas. Ela chorou. A águia pousou no telhado e disse com voz humana que era Odisseu, e os gansos eram os pretendentes. O mendigo diz que o sentido é claro. Ela diz que os sonhos passam por duas portas, de chifre e de marfim, e este pode ter vindo pela porta enganosa.","THE BOW":"O ARCO","She says that tomorrow is the day of the contest: she will set up twelve axes in a row, as Odysseus used to, and whoever can string his bow most easily and shoot an arrow through all twelve will take her away from this house. The beggar says she should hold the contest at once, for Odysseus will be here before they finish. She goes up to bed, weeping for her husband until Athena closes her eyes.":"Ela diz que amanhã é o dia da prova: disporá doze machados em fila, como Odisseu fazia, e quem conseguir armar o arco dele com mais facilidade e atirar uma flecha através de todos os doze a levará desta casa. O mendigo diz que ela deve fazer a prova logo, pois Odisseu estará aqui antes que terminem. Ela sobe para deitar-se, chorando pelo marido até que Atena lhe fecha os olhos.","BOOK XX":"CANTO XX","A NIGHT OF ANGER":"UMA NOITE DE IRA","Odysseus lies in the porch on an ox hide, with the sheepskins of the slaughtered beasts over him, and Eurynome covers him with a cloak. He cannot sleep. He sees the maids slip out to sleep with the suitors, laughing, and his heart growls in him like a bitch over her pups. He strikes his chest and speaks to his heart: endure, you endured worse when the Cyclops ate your friends. His heart obeys. Athena stands over him and reassures him.":"Odisseu se deita no pórtico sobre um couro de boi, com peles de ovelhas dos animais abatidos por cima, e Eurínoma o cobre com um manto. Não consegue dormir. Vê as servas saírem para dormir com os pretendentes, rindo, e o coração lhe rosna dentro como uma cadela sobre os filhotes. Bate no peito e fala ao coração: resiste, já suportaste pior quando o Ciclope devorou os teus amigos. O coração obedece. Atena se detém sobre ele e o tranquiliza.","MASTER YOUR ANGER  ·  HOLD SPACE OR THE MOUSE BUTTON":"DOMINE A SUA IRA  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE","THE OMEN OF THUNDER":"O PRESSÁGIO DO TROVÃO","THE FEAST OF APOLLO":"A FESTA DE APOLO","CTESIPPUS":"CTESIPO","Telemachus gives the beggar a seat and a table at the threshold. Ctesippus, a rich suitor from Same, says that he has had his share, and picks an ox's hoof out of the basket and throws it. Odysseus ducks with a grim smile, and the hoof hits the wall. Telemachus threatens to kill him, and Agelaus says that it would be fair to let Telemachus persuade his mother to marry one of them.":"Telêmaco dá ao mendigo um assento e uma mesa na soleira. Ctesipo, rico pretendente de Samo, diz que ele já teve a sua parte, e tira um casco de boi do cesto e o atira. Odisseu se abaixa com um sorriso sombrio, e o casco bate na parede. Telêmaco ameaça matá-lo, e Agelau diz que seria justo deixar Telêmaco persuadir a mãe a casar com um deles.","THE OX'S HOOF  ·  DUCK ASIDE":"O CASCO DE BOI  ·  DESVIE-SE","It grazes you.":"Ele de raspão o atinge.","THE SEER'S VISION":"A VISÃO DO ADIVINHO","BOOK XXI":"CANTO XXI","THE BOW FROM THE STOREROOM":"O ARCO DO DEPÓSITO","Athena puts it into Penelope's mind to set the bow and the grey iron axes before the suitors, as a contest and a beginning of slaughter. She goes up to the storeroom at the end of the house, with the key of bronze with an ivory handle, and unlocks the door, which bellows like a bull in a meadow. She takes the bow from its peg: the bow of Odysseus, a gift from Iphitus, with a quiver full of arrows. She sits and weeps, then goes down with the maids.":"Atena põe na mente de Penélope que ponha diante dos pretendentes o arco e os machados de ferro cinzento, como prova e começo da matança. Ela sobe ao depósito no fundo da casa, com a chave de bronze de cabo de marfim, e abre a porta, que muge como um touro no prado. Toma o arco do gancho: o arco de Odisseu, presente de Ífito, com uma aljava cheia de flechas. Senta-se e chora, depois desce com as servas.","GO UP TO THE STOREROOM AND TAKE THE BOW":"SUBA AO DEPÓSITO E PEGUE O ARCO","THE STOREROOM KEY":"A CHAVE DO DEPÓSITO","THE BOW OF ODYSSEUS":"O ARCO DE ODISSEU","PENELOPE'S CONTEST":"A PROVA DE PENÉLOPE","Penelope stands in the hall with her maids and tells the suitors: you have been eating my husband's house for years, and your only pretext is that you want to marry me. Here is the great bow of Odysseus. Whoever strings it most easily and shoots an arrow through all twelve axes, I will follow him from this house, even if I shall remember it in my dreams. Eumaeus weeps as he hands over the bow, and Philoetius too.":"Penélope está no salão com as servas e diz aos pretendentes: há anos vocês devoram a casa do meu marido, e o único pretexto é que querem casar comigo. Aqui está o grande arco de Odisseu. Quem o armar com mais facilidade e atirar uma flecha através de todos os doze machados, eu o seguirei desta casa, ainda que a recorde em sonhos. Eumeu chora ao entregar o arco, e Filécio também.","TELEMACHUS DIGS THE TRENCH AND SETS UP THE AXES  ·  PRESS WHEN THE RING CLOSES":"TELÊMACO CAVA A VALA E ALINHA OS MACHADOS  ·  APERTE QUANDO O ANEL SE FECHAR","Not true yet. Again.":"Ainda não está certo. De novo.","TELEMACHUS TRIES":"TELÊMACO TENTA","Telemachus tries to string the bow, and three times he strains at it, but fails. A fourth time he would have done it, but Odysseus makes a sign, and he lays the bow down. He tells the suitors that he is too weak, and invites them to try, starting with Leodes. Leodes, the priest, who has soft hands and has disapproved of the others, fails and puts the bow down.":"Telêmaco tenta armar o arco, e três vezes se esforça, mas falha. Uma quarta vez o teria conseguido, mas Odisseu faz um sinal, e ele larga o arco. Diz aos pretendentes que é fraco demais e os convida a tentar, começando por Liodes. Liodes, o sacerdote, que tem mãos macias e desaprovava os outros, falha e põe o arco de lado.","ANTINOUS AND EURYMACHUS":"ANTÍNOO E EURÍMACO","Antinous orders Melanthius to light a fire and fetch a block of tallow, to warm and grease the bow. They try it in the fire, but fail. Antinous says that the contest should wait until the next day, with an offering to Apollo, and the others agree.":"Antínoo manda Melântio acender fogo e trazer um bloco de sebo, para aquecer e untar o arco. Tentam-no ao fogo, mas falham. Antínoo diz que a prova deve esperar o dia seguinte, com uma oferenda a Apolo, e os outros concordam.","GO OUT TO THE COWHERD AND THE SWINEHERD":"VÁ AO VAQUEIRO E AO PORQUEIRO","EUMAEUS AND PHILOETIUS":"EUMEU E FILÉCIO","THE SCAR AGAIN":"A CICATRIZ DE NOVO","THE BEGGAR ASKS":"O MENDIGO PEDE","The suitors have given up for the day. The beggar asks to try the bow: he wants to know whether his strength is still as it was. Antinous shouts at him, but Penelope intervenes: the beggar will not take her, so what harm? Eurymachus objects that it is a question of shame. Penelope says that the people of this house have no reputation to lose. Telemachus tells her to go upstairs: bows are for men, and mine most of all. She obeys, and Athena puts her to sleep.":"Os pretendentes desistiram por hoje. O mendigo pede para tentar o arco: quer saber se sua força é ainda a de antes. Antínoo grita com ele, mas Penélope intervém: o mendigo não a levará, então que mal faz? Eurímaco objeta que é questão de vergonha. Penélope diz que os da casa não têm reputação a perder. Telêmaco lhe manda subir: os arcos são dos homens, e meu acima de todos. Ela obedece, e Atena a adormece.","THE BEGGAR STRINGS THE BOW  ·  TAP SPACE OR CLICK":"O MENDIGO ARMA O ARCO  ·  TOQUE EM ESPAÇO OU CLIQUE","THE BOW STRUNG":"O ARCO ARMADO","Odysseus turns the bow over and over to check for worm in the horn. The suitors mock. Then, as easily as a singer fits a new string to his lyre, he strings the bow without effort, and plucks the string, which sings like a swallow. The suitors turn pale. Zeus thunders. Odysseus takes an arrow, sits where he is, and shoots it straight through the holes of all twelve axes without touching any of them.":"Odisseu revira o arco de um lado a outro para ver se o chifre tem caruncho. Os pretendentes zombam. Então, tão facilmente como um cantor põe uma corda nova na lira, arma o arco sem esforço e dedilha a corda, que canta como uma andorinha. Os pretendentes empalidecem. Zeus troveja. Odisseu toma uma flecha, senta-se onde está e a dispara direto pelos furos de todos os doze machados sem tocar em nenhum.","THE SHOT  ·  LOOSE WHEN THE RING CLOSES  ·  THROUGH ALL TWELVE AXES":"O TIRO  ·  DISPARE QUANDO O ANEL SE FECHAR  ·  ATRAVÉS DOS DOZE MACHADOS","Steady. Draw again.":"Firme. Puxe de novo.","\"I HAVE NOT SHAMED YOU\"":"\"NÃO TE ENVERGONHEI\"","BOOK XXII":"CANTO XXII","THE THRESHOLD":"A SOLEIRA","Odysseus strips off his rags and leaps on to the great threshold with the bow and the quiver full of arrows, which he pours out at his feet. He tells the suitors: this contest is over. Now I aim at another mark, which no man has ever hit, if Apollo grant it. He aims at Antinous, who is about to lift a fine golden cup to drink, with the handle in his hands. No thought of death is in his head. Odysseus shoots him in the throat, and the point goes through his neck.":"Odisseu arranca os trapos e salta sobre a grande soleira com o arco e a aljava cheia de flechas, que derrama a seus pés. Diz aos pretendentes: esta prova acabou. Agora miro outro alvo, que nenhum homem jamais acertou, se Apolo o conceder. Mira em Antínoo, que está prestes a erguer uma bela taça de ouro para beber, com a asa nas mãos. Nenhum pensamento de morte lhe passa pela cabeça. Odisseu o atinge na garganta, e a ponta lhe atravessa o pescoço.","LOOSE ARROWS AT THE SUITORS  ·  AIM WITH THE MOUSE  ·  CLICK OR SPACE":"DISPARE FLECHAS CONTRA OS PRETENDENTES  ·  MIRE COM O MOUSE  ·  CLIQUE OU ESPAÇO","EURYMACHUS PLEADS":"EURÍMACO IMPLORA","The suitors cry out that he has killed a man, and that the vultures will have him. They think it was an accident. Odysseus says: you dogs, you thought I should never come back from Troy, you ate my house, slept with my maids, and courted my wife while I was alive. Eurymachus offers to repay twenty oxen's worth for everything eaten and drunk, and bronze and gold besides. Odysseus answers that even if they gave him all they have and more, he would not stop until they have paid for their crimes. They must fight or run.":"Os pretendentes gritam que ele matou um homem, e que os abutres o terão. Pensam que foi um acidente. Odisseu diz: cães, pensastes que eu jamais voltaria de Troia, devorastes a minha casa, dormistes com as minhas servas e cortejastes a minha esposa enquanto eu vivia. Eurímaco oferece pagar o valor de vinte bois por tudo que foi comido e bebido, e bronze e ouro além disso. Odisseu responde que ainda que lhe dessem tudo o que têm e mais, não pararia até que pagassem os seus crimes. Têm de lutar ou fugir.","THE ARMING":"O ARMAMENTO","Eurymachus calls on the suitors to draw their swords and use the tables as shields. He rushes at Odysseus with a bronze sword, but Odysseus shoots him through the chest. Amphinomus rushes at him with a sword and is run through by Telemachus' spear. Telemachus then runs to fetch arms from the storeroom, for himself, Eumaeus and Philoetius, but he leaves the door open, and Melanthius slips in and brings twelve shields, spears and helmets to the suitors.":"Eurímaco chama os pretendentes a sacar as espadas e usar as mesas como escudos. Lança-se sobre Odisseu com uma espada de bronze, mas Odisseu o atravessa com uma flecha no peito. Anfínomo avança contra ele com uma espada e é traspassado pela lança de Telêmaco. Telêmaco então corre a buscar armas no depósito, para si, Eumeu e Filécio, mas deixa a porta aberta, e Melântio entra e leva aos pretendentes doze escudos, lanças e elmos.","THE SUITORS HURL THEIR SPEARS  ·  A / D OR CLICK TO DODGE":"OS PRETENDENTES ARREMESSAM AS LANÇAS  ·  A / D OU CLIQUE PARA DESVIAR","The spear grazes you!":"A lança lhe passa de raspão!","Athena in the shape of Mentor comes into the hall. Odysseus is glad, and calls for help. The suitor Agelaus threatens her, and she is angry. She does not give victory at once, but tests the strength of Odysseus and his son. She flies up to a rafter in the shape of a swallow. The six suitors left throw their spears, but Athena makes them fly wide. Odysseus, Telemachus, Eumaeus and Philoetius throw together, and each kills a man.":"Atena, sob a figura de Mentor, entra no salão. Odisseu se alegra e lhe pede ajuda. O pretendente Agelau a ameaça, e ela se irrita. Não dá a vitória de imediato, mas põe à prova a força de Odisseu e do filho. Voa para uma viga sob a forma de uma andorinha. Os seis pretendentes que restam atiram as lanças, mas Atena as faz errar. Odisseu, Telêmaco, Eumeu e Filécio atiram juntos, e cada um mata um homem.","THE LAST OF THEM  ·  AIM AND LOOSE":"O ÚLTIMO DELES  ·  MIRE E DISPARE","THE AEGIS":"A ÉGIDE","Athena holds up her deadly aegis from the roof, and terror seizes the suitors. They run through the hall like cattle stung by gadflies in spring, with Odysseus and the others striking them down like hawks falling on little birds. The floor runs with blood. Leodes begs for mercy, but Odysseus kills him with the sword he picked up. Phemius the bard and Medon the herald, who served the suitors only under compulsion, are spared.":"Atena ergue do teto a sua terrível égide, e o terror se apossa dos pretendentes. Correm pelo salão como bois picados por moscas na primavera, e Odisseu e os outros os abatem como falcões que caem sobre passarinhos. O chão corre sangue. Liodes implora piedade, mas Odisseu o mata com a espada que apanhou. Fêmio, o aedo, e Medonte, o arauto, que serviram os pretendentes só por coação, são poupados.","THE MAIDS AND MELANTHIUS":"AS SERVAS E MELÂNTIO","Eurycleia is sent to fetch the twelve maids who had behaved shamelessly. Telemachus makes them carry out the bodies and wash the floor and the tables, then hangs them, with a ship's cable on a high post, so that they die quickly. Melanthius is dragged out into the yard, mutilated and hung up. Odysseus asks for sulphur and fire to purify the house and the courtyard, and Eurycleia brings out the loyal women, who greet their master with tears.":"Euricleia é mandada buscar as doze servas que se comportaram sem pudor. Telêmaco as faz carregar os corpos e lavar o chão e as mesas, e depois as enforca, com um cabo de navio num alto poste, para que morram depressa. Melântio é arrastado ao pátio, mutilado e pendurado. Odisseu pede enxofre e fogo para purificar a casa e o pátio, e Euricleia faz sair as mulheres leais, que saúdam o senhor em lágrimas.","BOOK XXIII":"CANTO XXIII","EURYCLEIA'S NEWS":"AS NOVAS DE EURICLEIA","Eurycleia goes up laughing to the room where Penelope sleeps and tells her: wake up, Odysseus is here, he has killed the suitors. Penelope is doubtful: a god has killed them, since Odysseus is dead. The nurse shows her the scar. Penelope still thinks the man may be a god in disguise. She goes down to the hall to see him, in doubt.":"Euricleia sobe rindo ao quarto onde Penélope dorme e lhe diz: acorda, Odisseu está aqui, matou os pretendentes. Penélope duvida: um deus os matou, pois Odisseu está morto. A ama lhe mostra a cicatriz. Penélope ainda pensa que o homem pode ser um deus disfarçado. Desce ao salão para vê-lo, em dúvida.","SIT OPPOSITE PENELOPE, BY THE FIREPLACE":"SENTE-SE DIANTE DE PENÉLOPE, JUNTO À LAREIRA","FACING HER":"DIANTE DELA","THE LONG SILENCE":"O LONGO SILÊNCIO","THE TEST":"A PROVA","THE BED WITH THE LIVING OLIVE  ·  GO TO HER":"A CAMA DA OLIVEIRA VIVA  ·  VÁ ATÉ ELA","THE BED OF THE OLIVE-TRUNK":"A CAMA DO TRONCO DE OLIVEIRA","EMBRACE HER  ·  HOLD SPACE OR THE MOUSE BUTTON  ·  DAWN WAITS":"ABRACE-A  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE  ·  A AURORA ESPERA","PENELOPE KNOWS HIM":"PENÉLOPE O RECONHECE","Her knees and her heart give way. She bursts into tears, runs to him, throws her arms round his neck, and kisses him. She says: do not be angry with me, I was always afraid that someone would come and deceive me with a story. Only the two of us and one maid knew the secret of the bed. Odysseus holds his beloved, faithful wife, and weeps. As sea-tossed men see land, so she sees him, and will not take her arms from his neck. Athena holds back the dawn.":"Os joelhos e o coração lhe cedem. Rompe em lágrimas, corre para ele, joga os braços ao redor do seu pescoço e o beija. Diz: não te irrites comigo, sempre temi que alguém viesse e me enganasse com uma história. Só nós dois e uma serva sabíamos o segredo da cama. Odisseu abraça a querida e fiel esposa e chora. Como os homens batidos pelo mar veem a terra, assim ela o vê, e não tira os braços do seu pescoço. Atena retém a aurora.","THE LONG NIGHT":"A LONGA NOITE","BOOK XXIV":"CANTO XXIV","THE SHADES OF THE SUITORS":"AS SOMBRAS DOS PRETENDENTES","Hermes of Cyllene calls out the souls of the suitors with his golden wand, and they follow him squeaking like bats in a cave, down the dark paths, past the streams of Ocean, the Gates of the Sun and the land of dreams, to the meadow of asphodel where the souls of the dead live. There they meet the souls of Achilles, Patroclus, Antilochus and Ajax. Agamemnon comes with the others who died with him in Aegisthus' house.":"Hermes Cilênio chama as almas dos pretendentes com a sua varinha de ouro, e elas o seguem chiando como morcegos numa gruta, pelos caminhos escuros, junto às correntes do Oceano, às Portas do Sol e à terra dos sonhos, até o prado de asfódelos onde habitam as almas dos mortos. Ali encontram as almas de Aquiles, Pátroclo, Antíloco e Ajaz. Agamémnone vem com os outros que morreram com ele na casa de Egisto.","ACHILLES AND AGAMEMNON":"AQUILES E AGAMÉMNONE","LAERTES' FARM":"A CHÁCARA DE LAERTES","Odysseus, with Telemachus and the herdsmen, goes out of the city to the orchard farm of Laertes, and sends the others into the house to prepare a meal. He goes alone into the vineyard, where he finds his old father digging round a plant, in a filthy tunic, patched, with leather leggings tied on, gloves, and a goatskin cap for his sorrow. Odysseus sees the old man bowed down by age and grief, and tears fall from his eyes.":"Odisseu, com Telêmaco e os pastores, sai da cidade para o pomar de Laertes e manda os outros para dentro da casa preparar uma refeição. Vai sozinho à vinha, onde encontra o velho pai cavando em torno de uma planta, com uma túnica imunda e remendada, caneleiras de couro atadas, luvas e um gorro de pele de cabra, pela sua dor. Odisseu vê o velho curvado pela idade e pela mágoa, e lágrimas lhe caem dos olhos.","WALK UP TO YOUR FATHER":"ANDE ATÉ SEU PAI","LAERTES":"LAERTES","A STRANGER'S TALE":"A HISTÓRIA DE UM ESTRANGEIRO","Odysseus tests his father: the old man tends the garden well, but not himself. He claims to be from Alybas, a guest-friend of Odysseus, who he says he entertained five years ago. Laertes weeps and puts dust on his head, and asks where the guest-gifts were. Odysseus can no longer hold back. He embraces him: I am the man you ask about, I have come home in the twentieth year. Laertes asks for a sign.":"Odisseu põe o pai à prova: o velho cuida bem do jardim, mas não de si mesmo. Diz ser de Alibante, e que hospedou Odisseu há cinco anos. Laertes chora e põe pó na cabeça, e pergunta onde estavam os presentes de hospitalidade. Odisseu não aguenta mais. Abraça-o: sou o homem por quem perguntas, voltei para casa no vigésimo ano. Laertes pede um sinal.","THE SIGNS":"OS SINAIS","Odysseus shows the scar from the boar's tusk on Parnassus, and then lists the trees in the orchard which Laertes gave him as a child, when they walked together through it: thirteen pear trees, ten apple trees and forty fig trees, and fifty rows of vines. Laertes' knees give way and he faints in his son's arms. When he comes round, he praises Zeus: the gods are still on Olympus, if the suitors have paid for their crimes.":"Odisseu mostra a cicatriz da presa do javali no Parnaso, e depois enumera as árvores do pomar que Laertes lhe deu quando menino, ao percorrê-lo juntos: treze pereiras, dez macieiras e quarenta figueiras, e cinquenta fileiras de videiras. Os joelhos de Laertes cedem e ele desmaia nos braços do filho. Ao voltar a si, louva Zeus: os deuses ainda estão no Olimpo, se os pretendentes pagaram os seus crimes.","THE FEAST AT THE FARM":"O BANQUETE NA CHÁCARA","Athena makes Laertes taller and stronger. They eat in the house, with the old servant Dolius and his sons, who have come back from work. Meanwhile Rumour has run through the city, and the people gather outside the palace of the suitors, lament the dead, and send the bodies home. In the assembly Eupeithes, father of Antinous, urges them to pursue Odysseus before he escapes to Pylos or Elis. Medon tells them that a god was with Odysseus.":"Atena faz Laertes mais alto e mais forte. Comem na casa, com o velho servo Dólio e seus filhos, que voltaram do trabalho. Entretanto o Rumor correu pela cidade, e o povo se reúne diante do palácio dos pretendentes, chora os mortos e envia os corpos para casa. Na assembleia Eupites, pai de Antínoo, exorta-os a perseguir Odisseu antes que fuja para Pilo ou Élide. Medonte lhes diz que um deus estava com Odisseu.","THE FAMILIES MARCH":"AS FAMÍLIAS MARCHAM","Eupeithes leads the kinsmen of the dead out of the city, armed. Odysseus, with Telemachus, the herdsmen, Dolius and his sons, and the old Laertes, put on bronze and go out to meet them. Athena, in the shape of Mentor, stands by Odysseus. Laertes prays to Athena and Zeus, and throws his spear, and it strikes Eupeithes through the helmet, and he falls dead.":"Eupites conduz para fora da cidade os parentes dos mortos, armados. Odisseu, com Telêmaco, os pastores, Dólio e seus filhos e o velho Laertes, vestem o bronze e saem ao encontro deles. Atena, sob a figura de Mentor, se põe ao lado de Odisseu. Laertes reza a Atena e a Zeus, atira a lança, e ela atinge Eupites através do elmo, e ele cai morto.","LAERTES HURLS HIS SPEAR  ·  YOU PRESS ON  ·  PRESS WHEN THE RING CLOSES":"LAERTES ARREMESSA A LANÇA  ·  VOCÊS AVANÇAM  ·  APERTE QUANDO O ANEL SE FECHAR","Wait for the moment.":"Espere o momento.","PRESS THE ATTACK  ·  TAP SPACE OR CLICK":"INTENSIFIQUE O ATAQUE  ·  TOQUE EM ESPAÇO OU CLIQUE","ATHENA'S CRY":"O GRITO DE ATENA","Odysseus and his son fall on the front ranks, striking with swords and double-edged spears, and they would have killed them all, leaving no one to return home, if Athena, daughter of Zeus, had not cried out: Stop! End this war, Ithacans, so that you may part without blood. The enemy, pale with fear, drop their weapons and flee for the city. Odysseus, with a terrible cry, gathers himself like an eagle to swoop on them, and Zeus sends down a smoking thunderbolt, which lands at the feet of his grey-eyed daughter.":"Odisseu e o filho se lançam sobre as primeiras fileiras, ferindo com espadas e lanças de dois gumes, e teriam matado todos, sem deixar ninguém que voltasse para casa, se Atena, filha de Zeus, não tivesse gritado: Parai! Acabai com esta guerra, itacenses, para que vos separeis sem sangue. Os inimigos, pálidos de medo, largam as armas e fogem para a cidade. Odisseu, com um grito terrível, recolhe-se como uma águia que se lança sobre eles, e Zeus envia um raio fumegante, que cai aos pés da filha de olhos glaucos.","ATHENA COMMANDS: STOP  ·  HOLD YOUR HAND  ·  HOLD SPACE OR THE MOUSE BUTTON":"ATENA ORDENA: PAREM  ·  CONTENHA A MÃO  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE","ITHACA":"ÍTACA","The house of Odysseus, twenty years on":"O paço de Odisseu, vinte anos depois","The assembly in the market-place":"A assembleia na praça","Nestor on the shore":"Nestor na praia","The house of Menelaus":"A casa de Menelau","Calypso is made to let him go":"Calipso é obrigada a deixá-lo partir","SCHERIA":"ESQUÉRIA","The river-mouth, and Nausicaa":"A foz do rio, e Nausícaa","The palace of Alcinous":"O palácio de Alcínoo","The games of the Phaeacians":"Os jogos dos feácios","The city of the Cicones":"A cidade dos cíconos","The floating island of Aeolus":"A ilha flutuante de Éolo","LAESTRYGONIA":"LESTRIGÔNIA","The city of Lamus":"A cidade de Lamo","The island of Circe":"A ilha de Circe","THE HOUSE OF HADES":"A CASA DE HADES","Beyond Ocean, in the land of the Cimmerians":"Além do Oceano, na terra dos cimérios","THE STRAIT":"O ESTREITO","Scylla and Charybdis":"Cila e Caribde","The island of the Sun":"A ilha do Sol","The harbour of Phorcys":"O porto de Fórcis","The farm of Eumaeus the swineherd":"A chácara de Eumeu, o porqueiro","The way home begins":"O caminho de casa começa","The farm: a father and his son":"A chácara: um pai e seu filho","The road to the city":"O caminho para a cidade","The hall of Odysseus: the beggar Irus":"O salão de Odisseu: o mendigo Iro","The hall, by night":"O salão, à noite","The porch, the night before the festival":"O pórtico, na véspera da festa","The contest of the bow":"A prova do arco","The hall: the reckoning":"O salão: o acerto de contas","The marriage bed":"O leito nupcial","The orchard of Laertes":"O pomar de Laertes","The House of Odysseus":"A casa de Odisseu","The Assembly of Ithaca":"A assembleia de Ítaca","Pylos":"Pilo","Sparta":"Esparta","The Raft and the Storm":"A jangada e a tempestade","Nausicaa":"Nausícaa","The Palace of Alcinous":"O palácio de Alcínoo","The Games of the Phaeacians":"Os jogos dos feácios","The Cicones, the Lotus-Eaters, the Cyclops":"Os cíconos, os lotófagos, o Ciclope","Aeolus, the Laestrygonians, Circe":"Éolo, os lestrigões, Circe","The House of Hades":"A casa de Hades","The Sirens, Scylla, the Cattle of the Sun":"As Sereias, Cila, o gado do Sol","The Return to Ithaca":"O regresso a Ítaca","The Swineherd":"O porqueiro","Telemachus Sails Home":"Telêmaco volta para casa","Father and Son":"Pai e filho","The Beggar in the City":"O mendigo na cidade","Irus":"Iro","Penelope and the Scar":"Penélope e a cicatriz","The Night Before":"A véspera","The Bow":"O arco","The Suitors":"Os pretendentes","The Bed":"O leito","Laertes, and Peace":"Laertes, e a paz","CHAPTERS":"CAPÍTULOS","Back":"Voltar","SETTINGS":"CONFIGURAÇÕES","Text size: ":"Tamanho do texto: ","Screen shake: ":"Tremor de tela: ","STORY SO FAR":"A HISTÓRIA ATÉ AGORA","Nothing has been told yet.":"Nada foi contado ainda.","Earlier":"Anterior","Later":"Seguinte","ABOUT":"SOBRE","The story follows Homer's Odyssey as rendered in English by Ian Johnston, with the translations of Robert Fagles and E. V. Rieu consulted beside it. All the words on the story cards are our own retelling, and the pictures are in the manner of Athenian black-figure vases.":"A história segue a Odisseia de Homero na tradução portuguesa de Carlos Alberto Nunes, com outras traduções consultadas ao lado. Todas as palavras dos cartões são nosso próprio reconto, e as imagens seguem a maneira dos vasos áticos de figuras negras.","PAUSED":"PAUSA","Resume":"Continuar","Chapters":"Capítulos","Story so far":"A história até agora","Characters":"Personagens","Title":"Título","Odysseus":"Odisseu","King of Ithaca":"Rei de Ítaca","Son of Laertes, husband of Penelope, the man of many turns, famous for his cunning. He fought ten years at Troy and has spent ten more trying to get home. Poseidon hates him for blinding the Cyclops, his son.":"Filho de Laertes, marido de Penélope, o homem de muitas voltas, famoso pela astúcia. Combateu dez anos em Troia e passou mais dez tentando voltar para casa. Posido o odeia por ter cegado o Ciclope, filho dele.","Penelope":"Penélope","Wife of Odysseus":"Esposa de Odisseu","She has held off the suitors for years by weaving a shroud for Laertes by day and unpicking it by night. When the suitors press her at last, she sets the contest of the bow.":"Ela adiou os pretendentes por anos tecendo de dia uma mortalha para Laertes e desfazendo-a de noite. Quando os pretendentes por fim a pressionam, propõe a prova do arco.","Telemachus":"Telêmaco","Son of Odysseus":"Filho de Odisseu","He has grown up without his father and cannot drive the suitors out alone. Athena sends him to Pylos and Sparta for news, and when he comes home he stands beside his father against the suitors.":"Cresceu sem o pai e não consegue expulsar sozinho os pretendentes. Atena o envia a Pilo e a Esparta em busca de notícias, e quando volta para casa ele fica ao lado do pai contra os pretendentes.","Laertes":"Laertes","Father of Odysseus":"Pai de Odisseu","The old king, who has left the town to live in grief on his orchard farm. Athena makes him strong again, and in the last battle he kills Eupeithes with a spear.":"O velho rei, que deixou a cidade para viver na dor em sua chácara de pomar. Atena o torna forte de novo, e na última batalha ele mata Eupites com uma lança.","Anticleia":"Anticleia","Mother of Odysseus":"Mãe de Odisseu","She died of longing for her son. Odysseus meets her shade in the house of Hades, and three times she slips through his arms.":"Morreu de saudade do filho. Odisseu encontra a sombra dela na casa de Hades, e três vezes ela lhe escapa dos braços.","Eurycleia":"Euricleia","The old nurse":"A velha ama","She nursed Odysseus as a child. While washing the beggar's feet she knows him by his scar, and Odysseus makes her swear to tell no one.":"Amamentou Odisseu menino. Ao lavar os pés do mendigo, reconhece-o pela cicatriz, e Odisseu a faz jurar que não dirá a ninguém.","Eumaeus":"Eumeu","The swineherd":"O porqueiro","Born a king's son, he was stolen as a child and sold to Laertes. He keeps faith with his absent master, shelters the beggar in his farm, and fights at his side.":"Filho de rei de nascimento, foi roubado menino e vendido a Laertes. Guarda fidelidade ao senhor ausente, abriga o mendigo na sua chácara e luta ao seu lado.","Philoetius":"Filécio","The cowherd":"O vaqueiro","A loyal herdsman who tells the beggar he would fight for Odysseus if he came home. Odysseus reveals himself to him and Eumaeus, and both help in the hall.":"Fiel pastor que diz ao mendigo que lutaria por Odisseu se ele voltasse. Odisseu se revela a ele e a Eumeu, e ambos ajudam no salão.","Argos":"Argos","The old hunting dog":"O velho cão de caça","Trained by Odysseus as a puppy, he now lies neglected on a dung heap. He knows his master after twenty years, wags his tail, and dies.":"Criado por Odisseu desde filhote, jaz agora abandonado num monte de esterco. Reconhece o dono depois de vinte anos, abana a cauda e morre.","Melanthius":"Melântio","The goatherd":"O cabreiro","He takes the suitors' side. He kicks the disguised Odysseus on the road, and in the fight he brings armour to the suitors. Afterwards he is punished.":"Põe-se ao lado dos pretendentes. Chuta o disfarçado Odisseu no caminho, e na luta leva armas aos pretendentes. Depois é castigado.","Melantho":"Melanto","A maid of the house":"Uma serva da casa","She sleeps with Eurymachus and insults the beggar, and is among the maids who are hanged.":"Dorme com Eurímaco e insulta o mendigo, e está entre as servas que são enforcadas.","Phemius":"Fêmio","The bard":"O aedo","He sings for the suitors because they force him. Odysseus spares him at the end.":"Canta para os pretendentes porque o obrigam. Odisseu o poupa no fim.","Medon":"Medonte","The herald":"O arauto","He served the suitors under compulsion and warned Penelope of their plot. Odysseus spares him, and later he tells the Ithacans that a god was with Odysseus.":"Serviu os pretendentes por coação e avisou Penélope da conspiração deles. Odisseu o poupa, e depois ele diz aos itacenses que um deus estava com Odisseu.","Mentor":"Mentor","Friend of Odysseus":"Amigo de Odisseu","Odysseus left him in charge of the household. He rebukes the Ithacans in the assembly, and Athena takes his shape more than once.":"Odisseu o deixou encarregado da casa. Ele repreende os itacenses na assembleia, e Atena toma a sua figura mais de uma vez.","Halitherses":"Haliterses","The old seer":"O velho adivinho","He reads the omen of the two eagles in the assembly and says Odysseus is already near and the suitors face ruin.":"Lê o presságio das duas águias na assembleia e diz que Odisseu já está perto e os pretendentes enfrentam a ruína.","Antinous":"Antínoo","Leader of the suitors":"Chefe dos pretendentes","The most violent of them. He throws a stool at the beggar and plots to ambush Telemachus. He is the first to die, shot in the throat as he lifts his cup.":"O mais violento deles. Atira um banquinho no mendigo e trama emboscar Telêmaco. É o primeiro a morrer, atingido na garganta quando ergue a taça.","Eurymachus":"Eurímaco","A suitor of smooth words":"Pretendente de palavras suaves","He courts Penelope with gifts and flatters her son, but means him harm. He offers to repay what they have eaten, then rushes Odysseus and is shot through the chest.":"Corteja Penélope com presentes e lisonjeia o filho dela, mas lhe quer mal. Oferece pagar o que comeram, depois avança sobre Odisseu e é atingido no peito por uma flecha.","Amphinomus":"Anfínomo","The best-mannered suitor":"O pretendente de melhores modos","Odysseus warns him to leave before it is too late, but Athena has already marked him, and Telemachus kills him with a spear.":"Odisseu o adverte para partir antes que seja tarde, mas Atena já o marcou, e Telêmaco o mata com uma lança.","Leodes":"Liodes","The suitors' priest":"O sacerdote dos pretendentes","He dislikes what the suitors do. He fails to string the bow, and when he begs for mercy Odysseus kills him.":"Desaprova o que os pretendentes fazem. Falha em armar o arco, e quando implora piedade Odisseu o mata.","Ctesippus":"Ctesipo","A rich suitor from Same":"Rico pretendente de Samo","Insolent and rich, he throws an ox's hoof at the beggar and misses.":"Insolente e rico, atira um casco de boi no mendigo e erra.","Agelaus":"Agelau","A suitor":"Um pretendente","He speaks for the others in the hall and tries to rally them when Odysseus strikes.":"Fala pelos outros no salão e tenta reuni-los quando Odisseu ataca.","The beggar of Ithaca":"O mendigo de Ítaca","A huge beggar who runs errands for the suitors. He picks a fight with Odysseus on the threshold, and Odysseus knocks him down with one blow.":"Um mendigo enorme que faz recados aos pretendentes. Provoca briga com Odisseu na soleira, e Odisseu o derruba com um só golpe.","The Gods":"Os Deuses","Zeus":"Zeus","King of the gods":"Rei dos deuses","He agrees that Odysseus should go home and sends Hermes to Calypso. Later he strikes the ship with a thunderbolt for the slaughter of Helios' cattle.":"Concorda que Odisseu volte para casa e envia Hermes a Calipso. Depois atinge o navio com um raio pela matança do gado de Hélio.","Athena":"Atena","Daughter of Zeus":"Filha de Zeus","Odysseus' protector. She appears as Mentes, Mentor, a shepherd and a girl with a jug, and she makes him look like a beggar and like a hero in turn. She keeps clear of him at sea, out of respect for Poseidon.":"Protetora de Odisseu. Aparece como Mentes, Mentor, um pastor e uma moça com um cântaro, e o faz parecer ora um mendigo, ora um herói. Mantém-se longe dele no mar, por respeito a Posido.","Poseidon":"Posido","God of the sea":"Deus do mar","Furious that Odysseus blinded his son Polyphemus, he drives the hero from his course for years and wrecks the raft. He also turns a Phaeacian ship to stone.":"Furioso porque Odisseu cegou seu filho Polifemo, desvia o herói do rumo por anos e destroça a jangada. Também transforma um navio feácio em pedra.","Hermes":"Hermes","The messenger":"O mensageiro","He brings Zeus' order to Calypso and gives Odysseus the herb moly against Circe. At the end he leads the suitors' souls down to the dead.":"Leva a ordem de Zeus a Calipso e dá a Odisseu a erva móli contra Circe. No fim conduz as almas dos pretendentes aos mortos.","Helios":"Hélio","The Sun":"O Sol","His cattle graze on Thrinacia. When the crew slaughter them, he threatens to take his light down among the dead unless Zeus pays him back.":"Seu gado pasta em Trinácria. Quando a tripulação o abate, ameaça levar a sua luz para os mortos se Zeus não o ressarcir.","Calypso":"Calipso","Nymph of Ogygia":"Ninfa de Ogígia","She kept Odysseus on her island for seven years and wanted to make him her husband. She lets him go when Hermes brings the order of Zeus.":"Reteve Odisseu na sua ilha por sete anos e queria fazê-lo seu marido. Deixa-o partir quando Hermes traz a ordem de Zeus.","Circe":"Circe","The witch of Aeaea":"A feiticeira de Eeia","She turns Odysseus' men into swine with a drug. Odysseus, armed with moly, forces her to free them. He stays a year, and she tells him how to reach the dead and what dangers lie beyond.":"Transforma os homens de Odisseu em porcos com uma droga. Odisseu, armado com o móli, a obriga a libertá-los. Ele fica um ano, e ela lhe diz como chegar aos mortos e que perigos há além.","Ino Leucothea":"Ino Leucoteia","The sea goddess":"A deusa do mar","Once a mortal woman, she pities the drowning Odysseus and gives him her veil, which saves him. He must throw it back into the sea once he lands.":"Outrora mulher mortal, compadece-se de Odisseu, que se afoga, e lhe dá o seu véu, que o salva. Ele deve atirá-lo de volta ao mar quando chegar à terra.","Proteus":"Proteu","The old man of the sea":"O velho do mar","A sea god of Egypt who counts his seals at noon. Held fast, he changes shape and finally tells Menelaus what happened to the Greeks, including that Odysseus is on Calypso's island.":"Deus marinho do Egito que conta as focas ao meio-dia. Seguro com firmeza, muda de forma e por fim diz a Menelau o que aconteceu aos gregos, inclusive que Odisseu está na ilha de Calipso.","Aeolus":"Éolo","Keeper of the winds":"Guardião dos ventos","He lives on a floating island walled in bronze. He gives Odysseus the winds tied in an ox-hide bag, and when the crew open it he drives Odysseus away.":"Vive numa ilha flutuante cercada de bronze. Dá a Odisseu os ventos atados num odre de pele de boi, e quando a tripulação o abre ele expulsa Odisseu.","Monsters and Marvels":"Monstros e Maravilhas","Polyphemus":"Polifemo","The Cyclops":"O Ciclope","A one-eyed shepherd and a son of Poseidon, who traps Odysseus and his men in his cave and eats six of them. Odysseus blinds him with a stake of olive wood after telling him his name is Nobody.":"Pastor de um só olho e filho de Posido, que prende Odisseu e os companheiros na gruta e devora seis deles. Odisseu o cega com uma estaca de oliveira depois de lhe dizer que o seu nome é Ninguém.","The Laestrygonians":"Os Lestrigões","Giants of Lamus":"Gigantes de Lamo","Man-eaters whose king is Antiphates. They crush eleven of the twelve ships with boulders from the cliffs and spear the men like fish.":"Devoradores de homens, cujo rei é Antífates. Esmagam onze dos doze navios com blocos de pedra dos rochedos e espetam os homens como peixes.","The Lotus-Eaters":"Os Lotófagos","A peaceful people":"Um povo pacífico","They give the crew the lotus to eat. Whoever tastes it loses all wish to go home, and Odysseus drags his men back to the ships.":"Dão aos companheiros o lótus para comer. Quem o prova perde todo o desejo de voltar para casa, e Odisseu arrasta os seus homens de volta aos navios.","The Sirens":"As Sereias","Singers on the meadow":"Cantoras no prado","Their song enchants every man who hears it, and the meadow is heaped with the bones of men who came near. Odysseus has the crew's ears stopped with wax and has himself tied to the mast.":"O seu canto enfeitiça todo homem que o ouve, e o prado está coberto de ossos de homens que se aproximaram. Odisseu manda tapar os ouvidos da tripulação com cera e se faz amarrar ao mastro.","Scylla":"Cila","The monster of the cliff":"O monstro do rochedo","She has twelve feet, six long necks and six heads with three rows of teeth, and snatches one man for every head from any ship that passes. Circe says she is not mortal and cannot be fought.":"Tem doze pés, seis longos pescoços e seis cabeças com três fileiras de dentes, e arrebata um homem por cabeça de qualquer navio que passe. Circe diz que não é mortal e não se pode combater.","Charybdis":"Caribde","The whirlpool":"O redemoinho","Three times a day she sucks down the sea and three times she spews it up. Odysseus clings to a fig tree above her until the keel and mast of his wrecked ship are thrown up again.":"Três vezes por dia engole o mar e três vezes o vomita. Odisseu se agarra a uma figueira acima dela até que a quilha e o mastro do seu navio destroçado são cuspidos de novo.","The Crew":"A Tripulação","Eurylochus":"Euríloco","Odysseus' second in command":"Imediato de Odisseu","He alone escapes Circe's house and warns the others. Later he is the one who urges the men to land on Thrinacia and to kill the Sun's cattle.":"Só ele escapa da casa de Circe e avisa os outros. Depois é quem exorta os homens a desembarcar em Trinácria e a matar o gado do Sol.","Elpenor":"Elpenor","The youngest of the crew":"O mais jovem da tripulação","Drunk, he falls from Circe's roof and breaks his neck. His shade is the first to meet Odysseus, begging for burial with an oar planted on his mound.":"Ébrio, cai do telhado de Circe e quebra o pescoço. Sua sombra é a primeira a encontrar Odisseu, pedindo sepultura com um remo plantado no seu túmulo.","The Phaeacians":"Os Feácios","Alcinous":"Alcínoo","King of Scheria":"Rei de Esquéria","He receives the shipwrecked stranger, gives him gifts, and has him taken home in a Phaeacian ship.":"Recebe o estrangeiro naufragado, dá-lhe presentes e o manda levar para casa num navio feácio.","Arete":"Arete","Queen of Scheria":"Rainha de Esquéria","Odysseus clasps her knees first. She knows the clothes he wears, which she made herself.":"Odisseu abraça primeiro os joelhos dela. Ela reconhece as roupas que ele veste, feitas por ela própria.","Daughter of Alcinous":"Filha de Alcínoo","She finds Odysseus on the shore while washing clothes with her maids. She gives him clothes and food and tells him how to reach her father's house.":"Encontra Odisseu na praia enquanto lava roupas com as servas. Dá-lhe roupas e comida e lhe diz como chegar à casa do pai.","Demodocus":"Demódoco","The blind bard":"O aedo cego","He sings of the quarrel of Odysseus and Achilles, of Ares and Aphrodite, and of the wooden horse, and the last song makes Odysseus weep.":"Canta a contenda de Odisseu e Aquiles, de Ares e Afrodite e do cavalo de madeira, e o último canto faz Odisseu chorar.","Euryalus":"Euríalo","A young Phaeacian":"Um jovem feácio","He mocks Odysseus as a merchant at the games, and afterwards makes amends with a gift of a bronze sword.":"Zomba de Odisseu como mercador nos jogos, e depois se retrata com o presente de uma espada de bronze.","Laodamas":"Laodamante","Son of Alcinous":"Filho de Alcínoo","He invites the stranger to the games. Odysseus sits in his chair when he is first received.":"Convida o estrangeiro aos jogos. Odisseu se senta na cadeira
