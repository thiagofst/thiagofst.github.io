<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nostos: The Odyssey</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0d0705;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding-bottom:clamp(80px,16vh,130px)}
#cap{position:absolute;left:0;top:calc(100% + 10px);width:100%;text-align:center;color:#f1deb8;font:500 clamp(17px,2.8vh,26px)/1.45 'EB Garamond',Georgia,serif;letter-spacing:.01em;text-shadow:0 1px 0 #000;pointer-events:none;transition:opacity .5s;opacity:0;padding:0 6%;box-sizing:border-box;max-width:100%}
#wrap{container-type:inline-size;position:relative;width:min(100vw,calc((100vh - clamp(80px,16vh,130px))*1.6));height:calc(min(100vw,calc((100vh - clamp(80px,16vh,130px))*1.6))*.625);font-family:'EB Garamond',Georgia,serif}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud span:empty{display:none}
#hud{position:absolute;left:4.1%;top:7.1%;transform:translateY(-50%);color:#f1deb8;font:600 1.3cqw/1 Cinzel,Georgia,serif;letter-spacing:.1em;display:flex;gap:2.2em;pointer-events:none;z-index:4}
#veil{position:absolute;inset:0;background:rgba(13,7,5,.55);display:none}
#box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(78%,860px);background:#c9652f;color:#17100c;border:4px solid #17100c;outline:2px solid #f1deb8;outline-offset:-10px;padding:34px 38px 26px;display:none;font-size:clamp(13px,1.9vw,20px);line-height:1.42;box-shadow:0 0 0 3px #17100c}
#box:before,#box:after{content:"";position:absolute;left:14px;right:14px;height:16px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='16'><path d='M2 14V2H22V10H8V6H15' fill='none' stroke='%2317100c' stroke-width='1.6'/></svg>") repeat-x}
#ban{position:absolute;left:50%;top:6.5%;transform:translateX(-50%);padding:.7em 2.4em .8em;background:rgba(23,16,12,.82);border:2px solid #f1deb8;outline:2px solid #17100c;text-align:center;color:#f1deb8;pointer-events:none;opacity:0;transition:opacity .8s;z-index:5;white-space:nowrap}
#ban b{display:block;font:700 clamp(18px,3.6vw,40px) Cinzel,Georgia,serif;letter-spacing:.3em;padding-left:.3em}
#ban i{display:block;margin-top:.5em;font:italic clamp(11px,1.5vw,17px) 'EB Garamond',Georgia,serif;letter-spacing:.08em}
#ban u{display:none}
#hint{position:absolute;right:4.4%;top:5.2%;color:#f1deb8;opacity:.55;font:600 clamp(8px,1vw,11px) Cinzel,Georgia,serif;letter-spacing:.14em;pointer-events:none}
#box.menu{top:auto;bottom:4%;transform:translateX(-50%);width:min(88%,600px);padding:20px 26px 18px}
#box.menu:before,#box.menu:after{display:none}
#box.menu .in{padding:0}
#box.menu .b{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
#box.menu button{padding:.7em .6em}
#box.lst .b{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
#box.lst button{text-align:left;padding:.4em .8em;font-size:.74em}
#box.lst{max-height:92vh;overflow-y:auto}
#box h3.hd{display:flex;justify-content:space-between;align-items:center}
#box h3 button.arw{font:700 1.1em Cinzel,Georgia,serif;line-height:1;padding:.2em .8em;margin:-.15em 0 -.05em;background:#17100c;color:#f1deb8;letter-spacing:0}
#box.lst button.lk{background:#2a1a12;color:#9c7a5a;opacity:.7}
#box button:focus,#box button:focus-visible{outline:2px solid #f1deb8;outline-offset:2px;background:#8a2b17}
#box.chars{width:min(88%,940px);padding:26px 30px 20px}
#box.chars:before,#box.chars:after{display:none}
#box .cw{display:flex;gap:22px;align-items:stretch}
#box .cl{flex:none;width:31%;max-height:clamp(260px,62vh,500px);overflow-y:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:#17100c #c9652f}
#box .cl button{display:block;width:100%;text-align:left;margin:0 0 4px;padding:.45em .8em}
#box .cl button.on,#box .cl button:focus{background:#8a2b17}
#box .cs{flex:1;min-width:0}
#box .cs canvas.art{height:clamp(150px,33vh,300px);width:auto;aspect-ratio:7/5;max-width:100%;display:block;margin:0 auto 12px}
#box .cs em{display:block;margin:-.2em 0 .6em;font-style:italic}
#box .cs p{margin:0}
#box button.close{margin-top:14px;float:right}
#tm{position:absolute;left:0;right:0;bottom:5%;display:none;justify-content:center;gap:1.2em}
#tm button{background:#17100c;border:0;color:#f1deb8;font:600 clamp(10px,1.3vw,15px) Cinzel,Georgia,serif;letter-spacing:.2em;cursor:pointer;padding:.65em 1.4em;opacity:.92}
#tm .lg{display:flex;gap:0;margin-left:1.2em}#tm .lg button{padding:.65em 1em;letter-spacing:.12em;opacity:.6}#tm .lg button.on{opacity:1;background:#8a2b17}
#tm button:hover,#tm button:focus{opacity:1;outline:2px solid #f1deb8;outline-offset:-5px;background:#8a2b17}
#box:before{top:12px}#box:after{bottom:12px}
#box .in{display:flex;gap:26px;align-items:flex-start;padding:10px 0}
#box canvas.art{flex:none;width:34%;aspect-ratio:7/5;border:3px solid #17100c;outline:2px solid #f1deb8;outline-offset:-7px;background:#c9652f}
#box .tx{flex:1}
#box h3{margin:0 0 .5em;font:700 1.12em Cinzel,Georgia,serif;letter-spacing:.14em;color:#17100c;border-bottom:2px solid #17100c;padding-bottom:.35em}
#box p{margin:0 0 1em}
#box .b{display:flex;gap:.8em;flex-wrap:wrap}
#box button{background:#17100c;color:#f1deb8;border:0;padding:.55em 1.2em;font:600 .82em Cinzel,Georgia,serif;letter-spacing:.1em;cursor:pointer}
#box button:hover{background:#8a2b17}
#box button.lk{opacity:.38;cursor:default;background:#17100c}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="hud"><span id="h1"></span><span id="h2"></span></div><div id="ban"></div><div id="hint"></div><div id="cap"></div><div id="tm"></div><div id="veil"></div><div id="box"></div></div>
<script>
(()=>{
const W=960,H=600;
const C={bg:'#c9652f',bg2:'#b0551f',ink:'#17100c',cream:'#f1deb8',red:'#8a2b17',pale:'#e8d3a6'};
const cv=document.getElementById('c');let g=cv.getContext('2d');const g0=g;
const boxEl=document.getElementById('box');
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
let TY=null,TYPE=false;const LOG=[];
let paused=false,scene=null,last=0,time=0,toastMsg='',toastT=0;
const S={};
function fit(){const dpr=Math.min(window.devicePixelRatio||1,2);const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);g.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
addEventListener('resize',fit);

function reset(){S.ships=12;S.men=null;S.stage=0;S.seen=false;S.book='';S.sh=false;S.idx=0;hudUpdate();}
function hudUpdate(){document.getElementById('h1').textContent=S.sh?tr('SHIPS ')+S.ships:'';document.getElementById('h2').textContent=tr(S.book);}
function toast(m,s){toastMsg=m;toastT=s||2.4;}
function artKey(t){
  if(/CAVE|NIGHT|DAY|WINE|NOBODY|EYE|DOOR|PROPHECY|TAUNT|STAKE|LOTS|SHORE|HILLTOP|CYCLOP/.test(t))return'poly';
  if(/RAM|ESCAPE/.test(t))return'ram';
  if(/SIREN|SONG|EYEBROW|CIRCE/.test(t))return'siren';
  if(/LOTUS|TO THE SHIPS/.test(t))return'lotus';
  if(/CICONES/.test(t))return'men';
  return'ship';
}
function vignette(cvs,key){
  const x=cvs.getContext('2d');cvs.width=560;cvs.height=400;
  const save=g;g=x;g.setTransform(1,0,0,1,0,0);
  g.fillStyle=C.bg;g.fillRect(0,0,560,400);g.save();g.scale(1,1);
  g.strokeStyle=C.ink;g.globalAlpha=.4;g.lineWidth=2;g.beginPath();for(let r=0;r<7;r++){for(let q=-1;q<12;q++){const xx=q*52+(r%2)*26,yy=60+r*52;g.moveTo(xx,yy);g.quadraticCurveTo(xx+13,yy-8,xx+26,yy);g.quadraticCurveTo(xx+39,yy+8,xx+52,yy);}}g.stroke();g.globalAlpha=1;
  if(Array.isArray(key)){g.fillStyle=C.ink;g.fillRect(0,366,560,40);g.strokeStyle=C.cream;g.lineWidth=1.3;g.beginPath();g.moveTo(0,366);g.lineTo(560,366);g.stroke();key.forEach(c=>drawItem(c,time,360));}
  else if(key==='poly'){poly(280,360,1.5,'stand',-1,true);}
  else if(key==='ram'){ram(190,330,3.2,1,1);fig(400,350,1.7,{dir:-1,cloak:C.red,helm:true,beard:true});}
  else if(key==='siren'){siren(280,230,2.3,time);}
  else if(key==='lotus'){flower(110,300,time,2.6);fig(330,360,1.7,{dir:-1,cloak:C.cream,carry:'flower',long:true});flower(470,320,time+1,2);}
  else if(key==='men'){fig(190,350,1.8,{dir:1,helm:true,beard:true,carry:'spear',a1:.5});fig(370,350,1.8,{dir:-1,helm:true,beard:true,carry:'spear',a1:.5});}
  else{drawShip(280,270,3,time,0,false,{still:false});}
  g.restore();g=save;
}
function say(title,text,btns,ARTSPEC0){
  const ARTSPEC=ARTSPEC0;
  paused=true;boxEl.innerHTML='';title=tr(title);text=tr(text);btns=btns.map(b=>[tr(b[0]),b[1],b[2]]);
  const veil=document.getElementById('veil');veil.style.display='block';
  const menu=ARTSPEC0==='menu',none=ARTSPEC0==='none'||menu,lst=ARTSPEC0==='list';
  boxEl.className=menu?'menu':lst?'lst':'';if(menu&&!title)veil.style.display='none';delete boxEl.dataset.pause;
  const h=document.createElement('h3');h.textContent=title;if(!title)h.style.display='none';
  const p=document.createElement('p');p.textContent=text;if(!text)p.style.display='none';
  boxEl.style.zoom=SET.big?1.2:1;TY=null;
  if(TYPE){TYPE=false;
    const hk=title+'|'+text.length+'|'+text.slice(0,24);
    if(!LOG.length||LOG[LOG.length-1][2]!==hk){LOG.push([title,text,hk]);if(LOG.length>60)LOG.shift();}
    if(SET.type&&!seenHas(hk)){
      let n=0;p.textContent='';
      const iv=setInterval(()=>{n=Math.min(text.length,n+2);p.textContent=text.slice(0,n);if(n>=text.length)fin();},16);
      const fin=()=>{clearInterval(iv);p.textContent=text;if(TY&&TY.iv===iv)TY=null;};
      TY={iv,finish:fin};
    }
    seenAdd(hk);
  }
  const b=document.createElement('div');b.className='b';
  btns.forEach(([l,f,lk],i)=>{const x=document.createElement('button');x.textContent=(btns.length>1?(i+1)+'. ':'')+l;if(lk){x.disabled=true;x.className='lk';}x.onclick=()=>{if(TY){TY.finish();return;}sfx('ui');boxEl.style.display='none';veil.style.display='none';paused=false;if(f)f();};b.appendChild(x);});
  const tx=document.createElement('div');tx.className='tx';tx.append(h,p,b);
  const inn=document.createElement('div');inn.className='in';
  const art=document.createElement('canvas');art.className='art';
  inn.append(art,tx);boxEl.append(inn);boxEl.style.display='block';
  if(none||lst)art.style.display='none';else vignette(art,ARTSPEC||artKey(title));
  const f0=b.querySelector('button');if(f0)f0.focus({preventScroll:true});
}
/* a chain of story cards, each with a Continue button */
function story(cards,done){
  let i=0;const next=()=>{if(i>=cards.length){if(done)done();return;}const c=cards[i++];TYPE=true;say(c[0],c[1],[['Continue',next]],c[2]);};next();
}

const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k.startsWith('arrow')||k===' ')e.preventDefault();
  if(k==='escape'){if(paused){if(boxEl.className==='chars')boxEl.querySelector('button.close').click();else if(boxEl.dataset.pause){boxEl.querySelector('button').click();}}else if(inPlay())openPause();return;}
  if(paused){
    if(k==='enter'||k===' ')e.preventDefault();
    const bs=[...boxEl.querySelectorAll('button:not(:disabled)')];
    if(TY&&(k==='enter'||k===' '||/^[1-9]$/.test(k))){TY.finish();return;}
    const cur=bs.indexOf(document.activeElement),grid=boxEl.classList.contains('menu')||boxEl.classList.contains('lst');
    const mv=d=>{if(!bs.length)return;const n=cur<0?0:Math.max(0,Math.min(bs.length-1,cur+d));bs[n].focus();};
    if(k==='arrowdown'){mv(grid?2:1);return;}if(k==='arrowup'){mv(grid?-2:-1);return;}if(k==='arrowright'){mv(1);return;}if(k==='arrowleft'){mv(-1);return;}
    if(k==='enter'||k===' '){e.preventDefault();if(cur>=0)bs[cur].click();else if(bs.length===1)bs[0].click();return;}
    const i=parseInt(k,10)-1;if(bs[i])bs[i].click();return;}
  keys[k]=true;if(scene&&scene.key)scene.key(k);
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const ptr={x:0,y:0,down:false};
function pos(e){const r=cv.getBoundingClientRect();ptr.x=(e.clientX-r.left)/r.width*W;ptr.y=(e.clientY-r.top)/r.height*H;}
cv.addEventListener('pointerdown',e=>{pos(e);ptr.down=true;if(!paused&&scene&&scene.click)scene.click(ptr.x,ptr.y);});
cv.addEventListener('pointermove',pos);
addEventListener('pointerup',()=>{ptr.down=false;});

/* frame: meander border, drawn once */
const frameCv=document.createElement('canvas');frameCv.width=W*2;frameCv.height=H*2;
(function(){
  const f=frameCv.getContext('2d');f.scale(2,2);
  f.fillStyle=C.ink;f.fillRect(0,0,W,26);f.fillRect(0,H-26,W,26);f.fillRect(0,0,26,H);f.fillRect(W-26,0,26,H);
  f.strokeStyle=C.cream;f.lineWidth=1.6;const u=18;
  function row(y){f.beginPath();for(let x=30;x<W-30-u+1;x+=u){f.moveTo(x,y+u-4);f.lineTo(x,y+4);f.lineTo(x+u-4,y+4);f.lineTo(x+u-4,y+u*.66);f.lineTo(x+u*.33,y+u*.66);f.lineTo(x+u*.33,y+u*.33);f.lineTo(x+u*.6,y+u*.33);}f.moveTo(30,y+u-4);f.lineTo(W-30,y+u-4);f.stroke();}
  row(3);row(H-23);f.globalAlpha=.7;f.strokeRect(26,26,W-52,H-52);
})();

function txt(s,x,y,size,col,al){s=tr(s);g.font='600 '+size+'px Cinzel,Georgia,serif';g.fillStyle=col||C.cream;g.textAlign=al||'center';g.textBaseline='alphabetic';g.fillText(s,x,y);}
function plate(s,x,y,size){s=tr(s);size=size||15;g.font='600 '+size+'px Cinzel,Georgia,serif';const w=g.measureText(s).width+26;g.fillStyle=C.ink;g.fillRect(x-w/2,y-size-2,w,size*1.8);g.fillStyle=C.cream;g.textAlign='center';g.textBaseline='alphabetic';g.fillText(s,x,y+size*.12);}
function bgFill(col){g.fillStyle=col||C.bg;g.fillRect(0,0,W,H);}
function bar(x,y,w,v,col){g.fillStyle=C.ink;g.fillRect(x,y,w,12);g.fillStyle=col;g.fillRect(x+2,y+2,(w-4)*cl(v,0,1),8);g.strokeStyle=C.cream;g.lineWidth=1.2;g.strokeRect(x,y,w,12);}
function mv(o,tx,ty,sp,dt){const d=Math.hypot(tx-o.x,ty-o.y);if(d>2){const k=Math.min(sp*dt,d)/d;o.x+=(tx-o.x)*k;o.y+=(ty-o.y)*k;}}
function sea(t,amp,sy,al){
  g.save();g.strokeStyle=C.ink;g.globalAlpha=al||.55;g.lineWidth=2;g.beginPath();
  for(let r=0;r<12;r++){const y=((r*44+(sy||0))%528)+40;const off=(r%2)*24+Math.sin(t*.8+r)*6*amp;
    for(let x=-48+off;x<W+24;x+=48){g.moveTo(x,y);g.quadraticCurveTo(x+12,y-8-2*amp,x+24,y);g.quadraticCurveTo(x+36,y+8+2*amp,x+48,y);}}
  g.stroke();g.restore();
}
/* incised cream line helper */
function inc(pts,w){g.save();g.strokeStyle=C.cream;g.lineWidth=w||1.1;g.globalAlpha=.9;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.restore();}
function limb(x0,y0,a1,l1,a2,l2,w1,w2,c){
  const x1=x0+Math.sin(a1)*l1,y1=y0+Math.cos(a1)*l1,x2=x1+Math.sin(a2)*l2,y2=y1+Math.cos(a2)*l2;
  g.strokeStyle=c;g.lineWidth=w1;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
  g.lineWidth=w2;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();return[x1,y1,x2,y2];
}
const PT={"The farewell in the palace of Alcinous":"A despedida no palácio de Alcínoo","SHIPS ":"NAVIOS ","Continue":"Continuar","THE LAND OF THE LOTUS-EATERS":"A TERRA DOS LOTÓFAGOS","Nine days of storm bring the fleet here":"Nove dias de tempestade trazem a frota até aqui","THE LOTUS-EATERS":"OS LOTÓFAGOS","Odysseus lands for water and a meal by the ships, then sends two men inland, with a herald as third, to learn who lives there. The Lotus-eaters mean them no harm. They simply give them lotus to taste, and any man who eats it loses all wish to bring word back or to go home.":"Odisseu desembarca para tomar água e comer junto aos navios, e envia dois homens para o interior, com um arauto como terceiro, para saber quem vive ali. Os lotófagos não lhes querem mal. Apenas lhes dão o lótus a provar, e quem o come perde todo o desejo de trazer notícias ou de voltar para casa.","TO THE SHIPS":"PARA OS NAVIOS","Odysseus goes himself. He must bring the three back, weeping, to the ships. Walk with WASD, arrows or a click, and press E or Space beside a man to take him. Keep him away from the Lotus-eaters, who will offer him the flower again.":"Odisseu vai ele próprio. Tem de trazer os três de volta aos navios, chorando. Ande com WASD, as setas ou um clique, e aperte E ou Espaço junto a um homem para levá-lo. Mantenha-o longe dos lotófagos, que lhe oferecerão a flor outra vez.","\"Come away. You will go home.\"":"\"Venha. Você voltará para casa.\"","He tastes the lotus again.":"Ele prova o lótus de novo.","He is bound under the rowing benches.":"Está amarrado sob os bancos dos remadores.","BACK TO THE SHIPS":"DE VOLTA AOS NAVIOS","Odysseus forces the three men, in tears, into the hollow ships, drags them under the rowing benches and ties them there. He orders the rest to board at once, in case another man eats the lotus and forgets his way home. They take their places and strike the grey sea with their oars.":"Odisseu força os três homens, em lágrimas, para dentro dos navios ocos, arrasta-os para baixo dos bancos dos remadores e ali os amarra. Ordena que os demais embarquem de imediato, para que nenhum outro coma o lótus e esqueça o caminho de casa. Ocupam seus lugares e ferem o mar cinzento com os remos.","BRING ALL THREE TO THE SHIP  ":"LEVE OS TRÊS PARA O NAVIO  ","E · TAKE HIM":"E · LEVAR","THE CYCLOPS' ISLAND":"A ILHA DOS CICLOPES","Polyphemus and his cave":"Polifemo e sua gruta","THE ISLAND OF THE GOATS":"A ILHA DAS CABRAS","Twelve ships reach an island of wild goats, near the land of the Cyclopes. Each ship receives nine goats, and Odysseus ten. Across the water the crews see smoke and hear sheep. Odysseus leaves the fleet where it is, and with his own ship rows over to learn whether these people are savage or kind to strangers. He chooses twelve of his best men and takes a goatskin of dark wine, given to him at Ismarus by Maron, priest of Apollo.":"Doze navios chegam a uma ilha de cabras selvagens, perto da terra dos Ciclopes. Cada navio recebe nove cabras, e Odisseu, dez. Do outro lado da água, as tripulações veem fumaça e ouvem ovelhas. Odisseu deixa a frota onde está e, com o próprio navio, rema até lá para saber se essa gente é selvagem ou boa com os estrangeiros. Escolhe doze dos seus melhores homens e leva um odre de vinho escuro, que Marão, sacerdote de Apolo, lhe dera em Ismaro.","THE CAVE":"A GRUTA","The cave is empty, full of cheeses, with lambs and kids penned apart. His men beg him to take the cheeses and go. Odysseus refuses: he wants to see the man, and hopes for a guest-gift. They light a fire, sacrifice, and wait. The giant comes home with a pile of dry wood, drives in his flock, and seals the door with a rock that twenty-two wagons could not move.":"A gruta está vazia, cheia de queijos, com cordeiros e cabritos em currais separados. Os companheiros pedem que ele leve os queijos e vá embora. Odisseu recusa: quer ver o homem e espera um presente de hospitalidade. Acendem o fogo, fazem um sacrifício e esperam. O gigante volta com um feixe de lenha seca, recolhe o rebanho e fecha a porta com uma rocha que nem vinte e dois carros conseguiriam mover.","THE FIRST NIGHT":"A PRIMEIRA NOITE","Polyphemus asks who they are. Odysseus answers that they are Achaeans from Troy, suppliants under the protection of Zeus. The Cyclops replies that he cares nothing for Zeus, and asks where the ship is moored. Odysseus lies, saying Poseidon wrecked it. The giant seizes two of the men, smashes them on the floor and eats them. Odysseus thinks of stabbing him, but knows they could never move the stone, and would die in the cave.":"Polifemo pergunta quem são. Odisseu responde que são aqueus vindos de Troia, suplicantes sob a proteção de Zeus. O Ciclope replica que não se importa com Zeus e pergunta onde o navio está ancorado. Odisseu mente, dizendo que Posido o despedaçou. O gigante agarra dois dos homens, esmaga-os no chão e os devora. Odisseu pensa em feri-lo com a espada, mas sabe que jamais moveriam a pedra e morreriam na gruta.","THE SECOND DAY":"O SEGUNDO DIA","At dawn the Cyclops eats two more, rolls back the rock, drives out his flock and sets the stone back like the cap on a quiver. Left behind, Odysseus plans his revenge, if Athena will grant him the glory.":"Ao amanhecer o Ciclope devora mais dois, afasta a rocha, leva o rebanho para fora e recoloca a pedra como a tampa de uma aljava. Deixado para trás, Odisseu planeja a vingança, se Atena lhe conceder a glória.","CUT A SIX-FOOT LENGTH FROM HIS OLIVE CLUB":"CORTE UM PEDAÇO DE SEIS PÉS DO SEU TACÃO DE OLIVEIRA","SMOOTH IT AND SHARPEN THE POINT":"ALISE-O E AFIE A PONTA","HARDEN IT IN THE FIRE, THEN HIDE IT IN THE DUNG":"ENDUREÇA-O NO FOGO E DEPOIS ESCONDA-O NO ESTERCO","He drinks. \"Give me more.\"":"Ele bebe. \"Dá-me mais.\"","Pour when the ring fits the bowl.":"Sirva quando o anel couber na taça.","THE RAMS":"OS CARNEIROS","His hand finds a back. Start the line again.":"Sua mão toca um lombo. Recomece a fila.","THE LOTS":"O SORTEIO","The four men chosen by lot are the very ones Odysseus would have chosen, and he is the fifth. At evening the giant returns, brings every animal inside, seals the door and milks the flock. Then he seizes two men and eats them.":"Os quatro homens escolhidos por sorteio são exatamente os que Odisseu teria escolhido, e ele é o quinto. Ao anoitecer o gigante regressa, traz todos os animais para dentro, fecha a porta e ordenha o rebanho. Depois agarra dois homens e os devora.","THE EYE":"O OLHO","Odysseus and four men lift the stake of olive wood, red-hot though green, and drive the point into his eye, while Odysseus leans on the top and twists it like a shipwright turning a drill. The eye hisses like an axe plunged into water. The giant screams, pulls out the stake, and bellows for his neighbours.":"Odisseu e quatro homens erguem a estaca de oliveira, em brasa ainda que verde, e cravam a ponta no olho dele, enquanto Odisseu se apoia no alto e a gira como um construtor de navios gira a broca. O olho chia como um machado mergulhado na água. O gigante grita, arranca a estaca e brada pelos vizinhos.","NOBODY IS KILLING ME":"NINGUÉM ME MATA","The Cyclopes gather at the cave mouth and ask whether anyone is stealing his flock or killing him by trick or force. Polyphemus answers: \"Nobody is killing me, my friends, by trick or by force.\" They tell him that if nobody is hurting him it must be a sickness from Zeus, and he should pray to his father Poseidon. They leave, and Odysseus laughs in his heart at the name that tricked them.":"Os Ciclopes se reúnem à entrada da gruta e perguntam se alguém lhe rouba o rebanho ou o mata por astúcia ou por força. Polifemo responde: \"Ninguém me mata, amigos, nem por astúcia nem por força.\" Eles dizem que, se ninguém o fere, só pode ser uma doença enviada por Zeus, e que reze a seu pai Posido. Vão-se, e Odisseu ri em seu coração do nome que os enganou.","THE DOOR":"A PORTA","Groaning, the Cyclops rolls the stone away and sits in the doorway with his arms stretched out, to catch anyone who tries to leave with the sheep. Odysseus thinks it over.":"Gemendo, o Ciclope rola a pedra e senta-se na entrada com os braços estendidos, para apanhar quem tentar sair com as ovelhas. Odisseu reflete.","THE LAST RAM":"O ÚLTIMO CARNEIRO","At dawn the males go out to graze and the unmilked females bleat in their pens. The blinded giant strokes the back of every animal that passes, and never feels the men under the bellies. Odysseus's ram is last, weighed down by its wool and by him. The giant speaks to it: why is it last, is it grieving for its master's eye, put out by Nobody and his wicked crew? If only it could speak and tell him where Nobody hides.":"Ao amanhecer os machos saem a pastar e as fêmeas por ordenhar balem nos currais. O gigante cego passa a mão no dorso de cada animal que sai e nunca sente os homens debaixo das barrigas. O carneiro de Odisseu é o último, carregado pela lã e por ele. O gigante lhe fala: por que é o último? Lamenta o olho do dono, furado por Ninguém e seus maus companheiros? Se ao menos pudesse falar e dizer onde Ninguém se esconde.","THE ESCAPE":"A FUGA","Once clear of the cave Odysseus lets go, frees his men, and they drive the long-legged fat sheep down to the ship, glancing back as they go. Their shipmates weep for the dead. Odysseus will not allow it: he orders the sheep aboard and every man to his oar.":"Longe da gruta, Odisseu se solta, liberta os companheiros e eles tocam as gordas ovelhas de pernas longas até o navio, olhando para trás enquanto vão. Os companheiros de bordo choram pelos mortos. Odisseu não o permite: manda embarcar as ovelhas e cada homem ir ao seu remo.","THE FIRST TAUNT":"A PRIMEIRA PROVOCAÇÃO","At a shout's distance from shore, Odysseus calls out: \"So he was no weakling, the man whose companions you tried to eat in your cave. Zeus and the other gods have paid you back.\" Polyphemus tears off a mountain peak and hurls it. It lands before the prow, and the wave carries the ship back towards the land. Odysseus seizes a long boat hook and pushes off. Press E, Space or click repeatedly to push the ship out.":"À distância de um grito da margem, Odisseu clama: \"Então não era um fraco o homem cujos companheiros tentaste devorar na tua gruta. Zeus e os outros deuses te pagaram.\" Polifemo arranca o cume de um monte e o lança. Cai diante da proa, e a onda leva o navio de volta para a terra. Odisseu empunha uma longa vara e empurra o navio. Aperte E, Espaço ou clique repetidamente para afastar o navio.","Push off":"Empurrar","THE SECOND TAUNT":"A SEGUNDA PROVOCAÇÃO","When they are about twice as far out, Odysseus calls again, though his men plead with him from every side: that was reckless, the next rock will crush the ship and their skulls. His spirit will not listen. He shouts: \"Cyclops, if anyone asks who blinded you, say it was Odysseus, sacker of cities, son of Laertes, of Ithaca.\"":"Quando estão cerca de duas vezes mais longe, Odisseu chama de novo, ainda que seus homens o supliquem de todos os lados: foi imprudente, a próxima rocha esmagará o navio e os seus crânios. Seu ânimo não escuta. Ele grita: \"Ciclope, se alguém perguntar quem te cegou, diz que foi Odisseu, saqueador de cidades, filho de Laertes, de Ítaca.\"","THE PROPHECY AND THE PRAYER":"A PROFECIA E A PRECE","THE ISLAND":"A ILHA","The crews are waiting beside their ships. They divide the stolen flock, and give Odysseus the ram. He sacrifices it to Zeus, who pays no heed, but is already planning the destruction of the ships and companions. At dawn Odysseus orders the cables loosed, and they sail on, glad to have escaped death, sad for those they lost.":"As tripulações esperam junto aos navios. Dividem o rebanho roubado e dão o carneiro a Odisseu. Ele o sacrifica a Zeus, que não lhe dá atenção e já planeja a destruição dos navios e dos companheiros. Ao amanhecer Odisseu manda soltar as amarras, e seguem viagem, felizes por terem escapado à morte, tristes pelos que perderam.","THE STAKE":"A ESTACA","Odysseus chops off a fathom of the green olive club, has his men smooth it while he sharpens the point, hardens it in the embers, and hides it under the dung that lies in great heaps in the cave.":"Odisseu corta uma braça do tacão de oliveira verde, manda os homens alisá-la enquanto afia a ponta, endurece-a nas brasas e a esconde sob o esterco que jaz em grandes montes na gruta.","The point glows. Carry it to his eye.":"A ponta rubra. Leve-a até o olho dele.","  ·  STAND THERE":"  ·  FIQUE ALI","POUR WHEN THE RING FITS THE BOWL  (":"SIRVA QUANDO O ANEL COUBER NA TAÇA  (","CARRY THE GLOWING STAKE TO HIS EYE":"LEVE A ESTACA EM BRASA ATÉ O OLHO DELE","HEAT THE STAKE IN THE FIRE  ·  STAND THERE":"AQUEÇA A ESTACA NO FOGO  ·  FIQUE ALI","TWIST IT, LIKE A SHIPWRIGHT'S DRILL  ·  PRESS E / SPACE / CLICK FAST":"GIRE-A, COMO A BROCA DO CONSTRUTOR DE NAVIOS  ·  APERTE E / ESPAÇO / CLIQUE DEPRESSA","TIE THE MEN UNDER THE RAMS  (":"AMARRE OS HOMENS SOB OS CARNEIROS  (","SEND EACH RAM OUT WHEN HIS HAND IS AWAY  (":"DEIXE CADA CARNEIRO SAIR QUANDO A MÃO DELE ESTIVER LONGE  (","PUSH THE SHIP OFF WITH THE BOAT HOOK  ·  E / SPACE / CLICK":"AFASTE O NAVIO COM A VARA  ·  E / ESPAÇO / CLIQUE","THE SIRENS' ISLAND":"A ILHA DAS SEREIAS","Circe's warning, remembered":"O aviso de Circe, lembrado","CIRCE'S WARNING":"O AVISO DE CIRCE","THE CALM":"A CALMARIA","Odysseus tells the crew everything Circe has said. A fair wind carries the ship towards the island, then drops, and some god stills the waves. The crew furl the sail and sit at the oars. Odysseus cuts a large cake of wax with his sword and kneads it until the sun's warmth softens it, then plugs every man's ears. They bind him upright to the mast, and take up their oars.":"Odisseu conta à tripulação tudo o que Circe disse. Um vento favorável leva o navio para a ilha e depois cessa, e algum deus aquieta as ondas. Os companheiros recolhem a vela e sentam-se aos remos. Odisseu corta com a espada um grande pão de cera e o amassa até que o calor do sol o amoleça, e então tapa os ouvidos de cada homem. Amarram-no de pé ao mastro e pegam nos remos.","THE SONG":"O CANTO","At a man's shout from the island the Sirens see the swift ship, and begin: \"Come here, famous Odysseus, great glory of the Achaeans. Stop your ship and listen to our voices. No man has ever sailed past without hearing our honeyed song, and gone on a wiser man, for we know all that the Greeks and Trojans suffered at Troy, and everything that happens on the fertile earth.\" Odysseus longs to listen. Keep the crew rowing in time, so the ship does not drift towards the meadow. Press E, Space or click as each ring closes.":"À distância de um grito de homem da ilha, as Sereias veem o navio veloz e começam: \"Vem, famoso Odisseu, grande glória dos aqueus. Detém o navio e escuta as nossas vozes. Nenhum homem passou por aqui sem ouvir o nosso doce canto, e seguiu mais sábio, pois sabemos tudo o que os gregos e troianos sofreram em Troia, e tudo o que acontece sobre a terra fértil.\" Odisseu deseja ouvir. Mantenha os remadores em compasso, para que o navio não derive para o prado. Aperte E, Espaço ou clique quando cada anel se fechar.","TOO CLOSE":"MUITO PERTO","The ship has drifted in towards the meadow, and the bones. Take the stroke again from the start.":"O navio derivou para o prado, e para os ossos. Retome a remada desde o começo.","Row again":"Remar de novo","Out of time.":"Fora do tempo.","EYEBROWS":"SOBRANCELHAS","The voice reaches him so beautifully that his heart longs to listen. Odysseus signals to his men with his eyebrows to set him free, but they bend to the oars and row on. Perimedes and Eurylochus stand up, bind him with more rope and lash him tighter.":"A voz chega a ele tão bela que seu coração anseia por ouvir. Odisseu faz sinal com as sobrancelhas aos companheiros para que o soltem, mas eles se curvam sobre os remos e seguem. Perimedes e Euríloco se levantam, amarram-no com mais cordas e o prendem com mais força.","PAST THE ISLAND":"ALÉM DA ILHA","When they are well beyond the Sirens, the men take the wax from their ears and untie him. But as they leave the island behind, Odysseus sees great waves and smoke and hears a crashing roar. The terrified crew lose their grip on the oars, and the ship stops moving.":"Quando já estão bem longe das Sereias, os homens tiram a cera dos ouvidos e o desamarram. Mas ao deixarem a ilha para trás, Odisseu vê grandes ondas e fumaça e ouve um estrondo. Os companheiros, aterrados, deixam escapar os remos, e o navio para.","KEEP THE STROKE  ·  DON'T LET HER DRIFT TO THE MEADOW":"MANTENHA A REMADA  ·  NÃO DEIXE O NAVIO DERIVAR PARA O PRADO","Missed.":"Errou.","Struck!":"Atingido!","PRESS SPACE OR CLICK WHEN THE RING CLOSES":"APERTE ESPAÇO OU CLIQUE QUANDO O ANEL SE FECHAR","TAP SPACE OR CLICK, FAST":"TOQUE EM ESPAÇO OU CLIQUE, DEPRESSA","HOLD SPACE OR THE MOUSE BUTTON":"SEGURE ESPAÇO OU O BOTÃO DO MOUSE","WALK ON":"ANDE","AIM WITH THE MOUSE  ·  CLICK OR SPACE TO LOOSE":"MIRE COM O MOUSE  ·  CLIQUE OU ESPAÇO PARA DISPARAR","BOOK I":"CANTO I","THE COUNCIL OF THE GODS":"O CONSELHO DOS DEUSES","On Olympus the gods are gathered. Poseidon is away among the Ethiopians, and Athena seizes her chance to speak for Odysseus, who has been held for years on Calypso's island. Zeus agrees that he should go home. Athena flies down to Ithaca in the shape of Mentes, a Taphian chief, and Hermes is sent to Calypso.":"No Olimpo os deuses estão reunidos. Posido está longe, entre os etíopes, e Atena aproveita a ocasião para falar em favor de Odisseu, que há anos é retido na ilha de Calipso. Zeus concorda que ele volte para casa. Atena desce a Ítaca sob a forma de Mentes, chefe dos táfios, e Hermes é enviado a Calipso.","THE HALL OF ODYSSEUS":"O PAÇO DE ODISSEU","Young Telemachus sits among the suitors, dreaming that his father might come home and drive them out. He sees a stranger waiting at the gate, and is ashamed that a guest should stand outside.":"O jovem Telêmaco está sentado entre os pretendentes, sonhando que o pai possa voltar e expulsá-los. Vê um estrangeiro esperando no portão e sente vergonha de que um hóspede fique do lado de fora.","WALK TO THE STRANGER AT THE DOOR":"ANDE ATÉ O ESTRANGEIRO NA PORTA","WELCOME THE GUEST":"ACOLHA O HÓSPEDE","LEAD HIM TO A SEAT AND SEE HIM FED":"LEVE-O A UM ASSENTO E VEJA QUE SEJA ALIMENTADO","A SEAT BY THE FIRE":"UM ASSENTO JUNTO AO FOGO","BRING WATER AND FOOD":"TRAGA ÁGUA E COMIDA","MENTES' ADVICE":"O CONSELHO DE MENTES","The guest says he is Mentes, chief of the Taphians, and that Odysseus is alive, held on an island by a nymph. He tells Telemachus to call the Achaeans to assembly and order the suitors to disperse, then to sail to Pylos for Nestor's news and on to Sparta, to Menelaus. If he hears his father is dead, he must give his mother in marriage.":"O hóspede diz que é Mentes, chefe dos táfios, e que Odisseu está vivo, retido numa ilha por uma ninfa. Diz a Telêmaco que convoque os aqueus em assembleia e ordene aos pretendentes que se dispersem, e depois navegue a Pilo, em busca de notícias de Nestor, e a Esparta, a Menelau. Se souber que o pai está morto, deverá dar a mãe em casamento.","A BIRD IN THE RAFTERS":"UMA AVE NAS VIGAS","Athena leaves like a bird in flight. Telemachus feels his strength rise, and knows a god has spoken to him. Below, the bard Phemius is singing of the Achaeans' unhappy return from Troy.":"Atena parte como uma ave em voo. Telêmaco sente crescer sua força e sabe que um deus lhe falou. Embaixo, o aedo Fêmio canta o infeliz regresso dos aqueus de Troia.","GO TO YOUR MOTHER":"VÁ ATÉ SUA MÃE","PENELOPE AT THE STAIRS":"PENÉLOPE JUNTO À ESCADA","PENELOPE COMES DOWN":"PENÉLOPE DESCE","Penelope begs the bard to choose another song. Telemachus answers that the singer is free to sing what the god puts in him, and that she should go to her rooms and see to her weaving: speech is for men, and for him most of all. Amazed, she goes up with her maids and weeps for Odysseus until Athena sheds sleep on her eyes.":"Penélope pede ao aedo que escolha outro canto. Telêmaco responde que o cantor é livre de cantar o que o deus lhe põe no peito, e que ela deve subir aos seus aposentos e cuidar da tecelagem: a palavra é dos homens, e dele acima de todos. Atônita, ela sobe com as servas e chora por Odisseu até que Atena derrama sono sobre os seus olhos.","BOOK II":"CANTO II","THE ASSEMBLY":"A ASSEMBLEIA","At dawn Telemachus takes his spear and goes to the meeting-place, followed by two dogs. No assembly has been called in Ithaca since Odysseus left. The old man Aegyptius speaks first, whose son went with Odysseus and was eaten by the Cyclops. Telemachus says openly that the suitors are devouring his house, and bursts into tears, throwing the speaker's staff to the ground.":"Ao amanhecer Telêmaco toma a lança e vai ao lugar da reunião, seguido de dois cães. Nenhuma assembleia fora convocada em Ítaca desde que Odisseu partiu. O velho Egípcio fala primeiro, cujo filho foi com Odisseu e foi devorado pelo Ciclope. Telêmaco diz abertamente que os pretendentes estão devorando a sua casa, e rompe em lágrimas, atirando ao chão o cetro do orador.","WALK TO THE SPEAKER'S STONE":"ANDE ATÉ A PEDRA DO ORADOR","TAKE THE STAFF AND SPEAK":"PEGUE O CETRO E FALE","ANTINOUS REPLIES":"ANTÍNOO RESPONDE","Antinous answers that the fault is Penelope's. For three years and now a fourth she has put them off: she wove a great shroud for old Laertes, promising to choose a husband when it was done, and each night she unpicked by torchlight what she wove by day, until a maid betrayed her. He tells Telemachus to send his mother back to her father.":"Antínoo responde que a culpa é de Penélope. Por três anos, e agora por um quarto, ela os tem enganado: teceu uma grande mortalha para o velho Laertes, prometendo escolher marido quando a acabasse, e a cada noite desfazia à luz de tochas o que tecera de dia, até que uma serva a traiu. Manda Telêmaco mandar a mãe de volta ao pai.","THE EAGLES":"AS ÁGUIAS","Zeus sends two eagles from a mountain peak. They wheel over the assembly, tear each other's faces and necks, and fly off to the right. Halitherses reads the sign: Odysseus is already near and is bringing death to the suitors. Eurymachus mocks the old man's prophecy.":"Zeus envia duas águias do alto de um monte. Elas rodam sobre a assembleia, dilaceram-se mutuamente no rosto e no pescoço e voam para a direita. Haliterses lê o sinal: Odisseu já está perto e traz a morte aos pretendentes. Eurímaco zomba da profecia do velho.","ASK FOR A SHIP AND TWENTY ROWERS  ·  WALK TO THE SHORE":"PEÇA UM NAVIO E VINTE REMADORES  ·  ANDE ATÉ A PRAIA","FIND MENTOR, WHO IS ATHENA":"PROCURE MENTOR, QUE É ATENA","MENTOR":"MENTOR","Telemachus asks the assembly for a fast ship and twenty rowers. Mentor, old comrade of Odysseus, rebukes the people for sitting silent. Leocritus brushes it off. As the meeting breaks up, Athena, in Mentor's form, promises to find the ship and the crew and to sail with him. She tells him to go home and make ready the provisions.":"Telêmaco pede à assembleia um navio veloz e vinte remadores. Mentor, velho companheiro de Odisseu, repreende o povo por ficar calado. Leócrito não lhe dá importância. Quando a reunião se dissolve, Atena, sob a forma de Mentor, promete encontrar o navio e a tripulação e navegar com ele. Manda-o voltar para casa e preparar as provisões.","PROVISIONS BY NIGHT":"PROVISÕES À NOITE","Telemachus tells old Eurycleia to draw off twelve jars of wine and fill twenty measures of barley meal in sewn leather sacks, and to tell no one, not even his mother, until twelve days have passed or until she asks for him. Eurycleia swears an oath to the gods. Meanwhile Athena, in Telemachus' likeness, gathers a crew and borrows a ship from Noemon.":"Telêmaco manda à velha Euricleia que tire doze ânforas de vinho e encha vinte medidas de farinha de cevada em odres de couro cosidos, e que não diga a ninguém, nem à mãe, até que passem doze dias ou até que ela pergunte por ele. Euricleia jura pelos deuses. Entretanto Atena, com a figura de Telêmaco, reúne uma tripulação e toma emprestado um navio de Noêmon.","CARRY THE JARS AND SACKS TO THE DOOR":"LEVE AS ÂNFORAS E OS ODRES ATÉ A PORTA","THE WINE JARS":"AS ÂNFORAS DE VINHO","THE BARLEY SACKS":"OS ODRES DE CEVADA","CARRY THEM TO THE SHIP":"LEVE-OS AO NAVIO","DRAG THE SHIP DOWN TO THE SEA  ·  TAP SPACE OR CLICK":"ARRASTE O NAVIO ATÉ O MAR  ·  TOQUE EM ESPAÇO OU CLIQUE","THE LAUNCH":"O LANÇAMENTO","They carry the gear aboard, set the mast, hoist the white sails and pour libations to the immortals, above all to Athena. At her prompting a following wind blows from the west, and the ship runs all night over the dark water.":"Levam a carga a bordo, erguem o mastro, içam as velas brancas e fazem libações aos imortais, sobretudo a Atena. A seu impulso, sopra um vento de popa do oeste, e o navio corre a noite inteira sobre a água escura.","BOOK III":"CANTO III","PYLOS":"PILO","At sunrise the ship comes to Pylos, where Nestor and his people are on the shore sacrificing black bulls to Poseidon. There are nine groups, each of five hundred men, and each group has nine bulls. Nestor's son Pisistratus brings Telemachus and Athena, who is in Mentor's shape, to sit by the feast and offers them the first portions.":"Ao nascer do sol o navio chega a Pilo, onde Nestor e o seu povo estão na praia sacrificando touros negros a Posido. Há nove grupos, cada um de quinhentos homens, e cada grupo tem nove touros. Pisístrato, filho de Nestor, leva Telêmaco e Atena, que tem a figura de Mentor, para sentar-se ao banquete e lhes oferece as primeiras porções.","JOIN THE SACRIFICE ON THE SHORE":"JUNTE-SE AO SACRIFÍCIO NA PRAIA","GREET NESTOR":"SAÚDE NESTOR","POUR THE LIBATION · PRESS WHEN THE RING CLOSES  ·  SPACE OR CLICK":"FAÇA A LIBAÇÃO · APERTE QUANDO O ANEL SE FECHAR  ·  ESPAÇO OU CLIQUE","The offering waits. Steady.":"A oferenda espera. Firme.","NESTOR'S TALE":"A HISTÓRIA DE NESTOR","THE EAGLE":"A ÁGUIA","Athena, leaving, changes into a sea-eagle and flies off, and everyone is amazed. Nestor knows it was a god. He vows a heifer with gilded horns to her, and the sons of Nestor carry out the sacrifice at dawn. Then Telemachus goes by chariot, with Pisistratus beside him, towards Sparta.":"Atena, ao partir, transforma-se numa águia-marinha e voa, e todos ficam atônitos. Nestor sabe que foi um deus. Promete-lhe uma novilha de chifres dourados, e os filhos de Nestor realizam o sacrifício ao amanhecer. Depois Telêmaco segue de carro, com Pisístrato a seu lado, para Esparta.","NESTOR'S SONS STAND READY. GO TO THE CHARIOT":"OS FILHOS DE NESTOR ESTÃO PRONTOS. VÁ AO CARRO","TO SPARTA, WITH PISISTRATUS":"PARA ESPARTA, COM PISÍSTRATO","BOOK IV":"CANTO IV","SPARTA":"ESPARTA","Telemachus and Pisistratus reach the house of Menelaus, where a double wedding feast is under way: his daughter Hermione is being sent to Neoptolemus, and his son to a daughter of Alector. A servant asks whether the strangers should be sent on, and Menelaus answers that guests must be welcomed. They are bathed, clothed and fed. Telemachus whispers his awe at the gold, amber and ivory of the hall.":"Telêmaco e Pisístrato chegam à casa de Menelau, onde se realiza uma festa de dois casamentos: sua filha Hermíone vai ser entregue a Neoptólemo, e seu filho a uma filha de Alector. Um servo pergunta se os estrangeiros devem ser despachados, e Menelau responde que os hóspedes têm de ser acolhidos. São banhados, vestidos e alimentados. Telêmaco murmura seu assombro diante do ouro, do âmbar e do marfim do palácio.","GREET THE KING OF SPARTA":"SAÚDE O REI DE ESPARTA","MENELAUS":"MENELAU","HELEN":"HELENA","Helen comes in like Artemis, and sees at once whom the young man resembles. Menelaus has also noticed the likeness to Odysseus. Telemachus weeps at his father's name. Helen mixes a drug in the wine that stops sorrow and anger, so that the sad tales may be told. She recalls how Odysseus entered Troy as a beggar, beaten and in rags, and told her the Greek plans.":"Helena entra como Ártemis e logo vê a quem o jovem se parece. Menelau também notou a semelhança com Odisseu. Telêmaco chora ao ouvir o nome do pai. Helena mistura ao vinho uma droga que faz esquecer a dor e a ira, para que as tristes histórias possam ser contadas. Lembra como Odisseu entrou em Troia como mendigo, espancado e em farrapos, e lhe contou os planos dos gregos.","THE HORSE":"O CAVALO","Menelaus adds a story of his own: in the wooden horse, Helen walked round it and called out in the voices of their wives. Anticlus nearly answered, and Odysseus clamped his hand over his mouth and held him until she moved on.":"Menelau acrescenta uma história sua: dentro do cavalo de madeira, Helena deu a volta nele e chamou com as vozes de suas esposas. Anticlo quase respondeu, e Odisseu lhe tapou a boca com a mão e o segurou até que ela se afastasse.","PROTEUS":"PROTEU","Menelaus tells what he learnt in Egypt. Becalmed twenty days on the island of Pharos, he was helped by the sea-goddess Eidothea, who told him to ambush her father Proteus when he came up from the sea at noon to count his seals. Hide in sealskins, hold on, and do not let go, whatever shapes he takes.":"Menelau conta o que soube no Egito. Retido vinte dias pela calmaria na ilha de Faro, foi ajudado pela deusa marinha Idoteia, que lhe disse que emboscasse o pai dela, Proteu, quando saísse do mar ao meio-dia para contar as suas focas. Esconda-se em peles de foca, agarre-o e não o solte, sejam quais forem as formas que tome.","HOLD HIM FAST  ·  HOLD SPACE OR THE MOUSE BUTTON":"SEGURE-O FIRME  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE","PROTEUS SPEAKS":"PROTEU FALA","THE AMBUSH":"A EMBOSCADA","Menelaus bids Telemachus stay as long as he wishes. In Ithaca the suitors learn that Telemachus has sailed. Antinous takes a ship and twenty men to lie in wait in the strait between Ithaca and Same, off the isle of Asteris, to kill him on his way back. Penelope hears of it from the herald Medon and weeps, and Athena sends a dream-image to comfort her: her son will come home.":"Menelau convida Telêmaco a ficar quanto quiser. Em Ítaca os pretendentes sabem que Telêmaco partiu. Antínoo toma um navio e vinte homens para ficar de emboscada no estreito entre Ítaca e Samo, junto à ilha de Astéris, a fim de matá-lo na volta. Penélope sabe disso pelo arauto Medonte e chora, e Atena envia-lhe uma imagem em sonho para consolá-la: o filho voltará para casa.","BOOK V":"CANTO V","HERMES AND CALYPSO":"HERMES E CALIPSO","At the next council Athena speaks again for Odysseus, who is shut up on Ogygia, longing for home. Zeus sends Hermes with the order: the nymph must let him go. Calypso is angry at the jealousy of the gods but she obeys. She tells Odysseus to build a raft and promises not to stand in his way, and he, seated alone on the shore, weeps every day.":"No conselho seguinte Atena fala de novo em favor de Odisseu, que está preso em Ogígia, com saudade de casa. Zeus envia Hermes com a ordem: a ninfa deve deixá-lo partir. Calipso se irrita com o ciúme dos deuses, mas obedece. Diz a Odisseu que construa uma jangada e promete não lhe barrar o caminho, e ele, sentado sozinho na praia, chora todos os dias.","THE RAFT":"A JANGADA","Calypso gives Odysseus a great bronze axe and an adze. He fells twenty trees, trims them, bores and pegs the logs, and builds a broad raft on the shape of a ship's hold, with a mast, a steering oar, a deck and a sail cut from cloth she provides. On the fifth day he launches it.":"Calipso dá a Odisseu um grande machado de bronze e uma enxó. Ele derruba vinte árvores, apara-as, fura e prende os troncos com cavilhas, e constrói uma ampla jangada no feitio do fundo de um navio, com mastro, remo de leme, convés e uma vela cortada de tecido que ela fornece. No quinto dia a lança ao mar.","WALK TO THE GROVE":"ANDE ATÉ O BOSQUE","THE TREES":"AS ÁRVORES","FELL THE TREES · STRIKE WHEN THE RING CLOSES":"DERRUBE AS ÁRVORES · GOLPEIE QUANDO O ANEL SE FECHAR","The axe glances off.":"O machado resvala.","SEVENTEEN DAYS":"DEZESSETE DIAS","He sails seventeen days, steering by the Pleiades, the Plough and Orion, keeping the Bear on his left as Calypso told him. On the eighteenth day the mountains of the Phaeacians appear. But Poseidon, coming home from the Ethiopians, sees the raft from the Solymi mountains and, in a rage, gathers the clouds and rouses every wind.":"Navega dezessete dias, guiando-se pelas Plêiades, pelo Boieiro e por Órion, mantendo a Ursa à esquerda, como Calipso lhe dissera. No décimo oitavo dia surgem os montes dos feácios. Mas Posido, que volta da terra dos etíopes, avista a jangada das montanhas dos sólimos e, enfurecido, reúne as nuvens e solta todos os ventos.","POSEIDON'S STORM  ·  STEER THE RAFT WITH A / D":"A TEMPESTADE DE POSIDO  ·  GUIE A JANGADA COM A / D","The sea strikes!":"O mar golpeia!","INO'S VEIL":"O VÉU DE INO","A great wave breaks the mast and sail, and flings Odysseus overboard. Ino Leucothea, once a mortal, takes pity on him and rises from the sea like a gull. She gives him her veil to wind round his chest and says he will not drown. Once he touches land he must untie it, throw it back into the sea, and turn his face away.":"Uma grande onda quebra o mastro e a vela e lança Odisseu ao mar. Ino Leucoteia, que um dia foi mortal, compadece-se dele e sobe do mar como uma gaivota. Dá-lhe o véu para enrolar no peito e diz que não se afogará. Quando tocar a terra, deverá desatá-lo, atirá-lo de volta ao mar e desviar o rosto.","SWIM  ·  HOLD SPACE OR THE MOUSE BUTTON TO KEEP KICKING":"NADE  ·  SEGURE ESPAÇO OU O BOTÃO DO MOUSE PARA CONTINUAR A BATER AS PERNAS","TWO NIGHTS AND TWO DAYS":"DUAS NOITES E DOIS DIAS","Odysseus drifts for two nights and two days before the wind drops. On the third dawn he sees land. Surf thunders on every cliff, with no harbour, so he swims along the coast until he finds a river mouth, sheltered and smooth, and prays to the river god. It stills its current for him.":"Odisseu vaga duas noites e dois dias antes que o vento amaine. No terceiro amanhecer avista terra. A arrebentação troveja em todos os rochedos, sem porto, e ele nada ao longo da costa até achar uma foz de rio, abrigada e calma, e reza ao deus do rio. Este aquieta a sua corrente por ele.","CRAWL ASHORE  ·  THEN FIND SHELTER UNDER THE OLIVES":"ARRASTE-SE PARA A TERRA  ·  DEPOIS PROCURE ABRIGO SOB AS OLIVEIRAS","THE RIVER-MOUTH":"A FOZ DO RIO","THE OLIVE THICKET":"O OLIVAL","SLEEP UNDER THE OLIVES":"DURMA SOB AS OLIVEIRAS","He unties the veil and throws it back, turning away. Then he walks into the thicket, burrows under two olive trees, and heaps leaves over himself as a man hides a spark of fire in ash. Athena closes his eyes with sleep.":"Desata o véu e o atira de volta, desviando o rosto. Depois entra no matagal, enfia-se sob duas oliveiras e amontoa folhas sobre si, como quem esconde uma brasa na cinza. Atena lhe fecha os olhos com o sono.","BOOK VI":"CANTO VI","NAUSICAA'S DREAM":"O SONHO DE NAUSÍCAA","In Scheria, Athena goes to the sleeping princess Nausicaa in the likeness of a friend and tells her to wash the family's clothes at the river, since she will be married soon. At dawn Nausicaa asks her father Alcinous for the mule-cart. Her mother Arete packs food, wine and olive oil for her.":"Em Esquéria, Atena vai à princesa Nausícaa adormecida, sob a figura de uma amiga, e lhe diz que lave as roupas da família no rio, pois em breve se casará. Ao amanhecer Nausícaa pede ao pai Alcínoo o carro de mulas. A mãe Arete lhe prepara comida, vinho e azeite.","DRIVE THE MULE-CART TO THE RIVER-MOUTH":"CONDUZA O CARRO DE MULAS ATÉ A FOZ DO RIO","THE RIVER":"O RIO","THE BALL GAME  ·  PRESS WHEN THE RING CLOSES":"O JOGO DA BOLA  ·  APERTE QUANDO O ANEL SE FECHAR","The ball goes wide!":"A bola vai longe!","THE BALL":"A BOLA","After they have washed the clothes, bathed and eaten, the girls play ball. Nausicaa starts the song. When she throws the ball at a maid and it falls into the river, they scream, and Odysseus wakes. He pushes aside the leaves, covers himself with a leafy branch and walks out.":"Depois de lavarem as roupas, banharem-se e comerem, as moças brincam com a bola. Nausícaa inicia o canto. Quando atira a bola a uma serva e ela cai no rio, gritam, e Odisseu desperta. Afasta as folhas, cobre-se com um ramo frondoso e sai.","APPROACH THE PRINCESS":"APROXIME-SE DA PRINCESA","NAUSICAA":"NAUSÍCAA","THE SUPPLIANT":"O SUPLICANTE","The maids run in terror, but Athena fills the princess with courage and she stays. Odysseus keeps his distance and begs her, as a goddess or a woman, for a rag to wear and the way to the town. She gives him clothes, olive oil and food. He washes the brine from his skin and Athena makes him taller and broader, his hair thick like hyacinth flowers.":"As servas fogem aterradas, mas Atena enche a princesa de coragem, e ela fica. Odisseu mantém distância e lhe pede, como a uma deusa ou a uma mulher, um trapo para vestir e o caminho da cidade. Ela lhe dá roupas, azeite e comida. Ele lava a salsugem da pele e Atena o faz mais alto e mais robusto, os cabelos espessos como flores de jacinto.","FOLLOW THE CART AT A DISTANCE":"SIGA O CARRO A DISTÂNCIA","THE ROAD":"A ESTRADA","THE GROVE OF ATHENA":"O BOSQUE DE ATENA","Nausicaa tells him to go behind the cart until they come near the town, then wait in Athena's grove, so that no gossip will touch her. Then he must go to her mother, clasp her knees, and ask for her help. In the grove Odysseus prays to Athena that the Phaeacians may receive him kindly, and she hears him, though out of respect for her uncle Poseidon she does not yet show herself.":"Nausícaa lhe diz que vá atrás do carro até chegarem perto da cidade, e depois espere no bosque de Atena, para que nenhuma maledicência a atinja. Depois deve ir à mãe dela, abraçar-lhe os joelhos e pedir-lhe ajuda. No bosque Odisseu reza a Atena que os feácios o recebam com bondade, e ela o ouve, embora, por respeito ao tio Posido, ainda não se mostre.","BOOK VII":"CANTO VII","THE GIRL WITH THE JUG":"A MOÇA DO CÂNTARO","As Odysseus walks towards the town, Athena meets him in the likeness of a young girl carrying a jug. She shows him the way to Alcinous' house, and wraps him in a mist so that no one will mock a stranger as he walks through the harbour and the streets.":"Enquanto Odisseu caminha para a cidade, Atena o encontra sob a figura de uma jovem que leva um cântaro. Mostra-lhe o caminho da casa de Alcínoo e o envolve numa névoa, para que ninguém zombe do estrangeiro quando atravessar o porto e as ruas.","FOLLOW THE GIRL THROUGH THE MIST":"SIGA A MOÇA PELA NÉVOA","THE HARBOUR":"O PORTO","THE MARKET":"O MERCADO","THE GATE":"O PORTÃO","THE PALACE OF ALCINOUS":"O PALÁCIO DE ALCÍNOO","He stops to look at the bronze walls, the blue frieze, the golden doors with silver posts, the golden and silver dogs which Hephaestus made, and the fruit orchard outside, where pears, pomegranates, apples, figs and olives never fail and the vines are in fruit all year. Athena has told him that the queen Arete must be his first appeal.":"Detém-se a contemplar os muros de bronze, o friso azul, as portas de ouro com batentes de prata, os cães de ouro e prata que Hefesto fez, e o pomar de fora, onde pêras, romãs, maçãs, figos e azeitonas nunca faltam e as vinhas dão fruto o ano todo. Atena lhe disse que a rainha Arete deve ser o seu primeiro pedido.","CROSS THE HALL TO THE HEARTH":"ATRAVESSE O SALÃO ATÉ A LAREIRA","THE HEARTH OF ARETE":"A LAREIRA DE ARETE","AT THE HEARTH":"JUNTO À LAREIRA","Odysseus throws his arms round Arete's knees and begs for a passage home. The mist falls from him. Everyone is silent, until old Echeneus tells Alcinous that it is shameful for a guest to sit in the ashes. Alcinous raises him and seats him in the chair of his own son, and the guest is served food and wine.":"Odisseu abraça os joelhos de Arete e pede passagem para casa. A névoa se desfaz. Todos silenciam, até que o velho Equeneu diz a Alcínoo que é vergonha um hóspede sentar-se nas cinzas. Alcínoo o levanta e o põe na cadeira do próprio filho, e o hóspede é servido de comida e vinho.","THE STRANGER'S STORY":"A HISTÓRIA DO ESTRANGEIRO","Alcinous promises a ship tomorrow. Arete recognises the clothes he wears, which she made herself, and asks where he got them. He tells how he spent seven years with Calypso, shipwrecked, and how Nausicaa helped him, though he takes the blame for not coming with her maids. Alcinous says he would give him his daughter, if he wished to stay, but will not hold him.":"Alcínoo promete um navio para amanhã. Arete reconhece as roupas que ele veste, feitas por ela mesma, e pergunta onde as conseguiu. Ele conta como passou sete anos com Calipso, naufragou, e como Nausícaa o ajudou, embora assuma a culpa de não ter vindo com as servas. Alcínoo diz que lhe daria a filha, se ele quisesse ficar, mas não o reterá.","BOOK VIII":"CANTO VIII","THE ASSEMBLY OF THE PHAEACIANS":"A ASSEMBLEIA DOS FEÁCIOS","At dawn Alcinous leads the guest to the assembly. Athena goes through the town in a herald's guise to call the people to see the stranger, and she makes him look still more imposing. Alcinous picks fifty-two young men for the ship, and sends the leaders to his house to feast.":"Ao amanhecer Alcínoo leva o hóspede à assembleia. Atena percorre a cidade sob a aparência de um arauto para chamar o povo a ver o estrangeiro, e o faz parecer ainda mais imponente. Alcínoo escolhe cinquenta e dois jovens para o navio e manda os chefes à sua casa para o banquete.","DEMODOCUS":"DEMÓDOCO","The blind singer Demodocus is led in and given a lyre. He sings of a quarrel between Odysseus and Achilles at a feast, a story whose beginning Odysseus knows. Odysseus pulls his cloak over his head and weeps, and Alcinous alone sees it, and calls the young men out to games.":"O cantor cego Demódoco é trazido e recebe uma lira. Canta uma contenda entre Odisseu e Aquiles num banquete, história cujo começo Odisseu conhece. Odisseu puxa o manto sobre a cabeça e chora, e só Alcínoo o vê, e convida os jovens aos jogos.","GO OUT TO THE GAMES":"VÁ AOS JOGOS","THE GROUND":"O CAMPO","EURYALUS":"EURÍALO","The Phaeacians run, wrestle, jump and throw. Laodamas, Alcinous' son, invites the guest to try, and Odysseus says his heart is too heavy. Euryalus mocks him as a merchant who thinks only of his cargo. Odysseus stands up angry, picks up a discus much heavier than those the Phaeacians have used, whirls it and throws it far beyond all their marks.":"Os feácios correm, lutam, saltam e arremessam. Laodamante, filho de Alcínoo, convida o hóspede a tentar, e Odisseu diz que tem o coração pesado demais. Euríalo zomba dele como um mercador que só pensa na carga. Odisseu se levanta irado, apanha um disco muito mais pesado do que os que os feácios usaram, gira-o e o lança muito além de todas as marcas.","THE DISCUS  ·  THROW WHEN THE RING CLOSES":"O DISCO  ·  LANCE QUANDO O ANEL SE FECHAR","Too early. Too late. Feel the weight.":"Cedo demais. Tarde demais. Sinta o peso.","THE THROW":"O ARREMESSO","Athena, in the likeness of a man, marks the place where the discus fell and says even a blind man could find it, so far beyond the others. Odysseus, encouraged, says he will take on anyone at boxing, wrestling or running, except Laodamas, his host. He is best with the bow, as only Philoctetes was at Troy. His one weakness is running, since the sea has broken his legs.":"Atena, sob a figura de um homem, marca o lugar onde o disco caiu e diz que até um cego o acharia, tão além dos outros. Odisseu, animado, diz que enfrentará qualquer um no pugilato, na luta ou na corrida, exceto Laodamante, seu anfitrião. É o melhor com o arco, como só Filoctetes foi em Troia. Sua única fraqueza é a corrida, pois o mar lhe quebrou as pernas.","THE SONG OF ARES AND APHRODITE":"O CANTO DE ARES E AFRODITE","Alcinous bids the Phaeacians dance and Demodocus sing the story of Ares and Aphrodite, caught in Hephaestus' invisible net while the gods laughed. Odysseus is glad. Alcinous gives the guest gifts: twelve kings and himself contribute a cloak, a tunic and a talent of gold, and Euryalus makes amends with a bronze sword with a silver hilt.":"Alcínoo manda os feácios dançarem e Demódoco cantar a história de Ares e Afrodite, presos na rede invisível de Hefesto enquanto os deuses riam. Odisseu se alegra. Alcínoo dá presentes ao hóspede: doze reis e ele mesmo contribuem com um manto, uma túnica e um talento de ouro, e Euríalo se retrata com uma espada de bronze de punho de prata.","SIT BY THE SINGER, AND ASK FOR THE WOODEN HORSE":"SENTE-SE JUNTO AO CANTOR E PEÇA O CAVALO DE MADEIRA","BESIDE DEMODOCUS":"JUNTO A DEMÓDOCO","THE WOODEN HORSE":"O CAVALO DE MADEIRA","At Odysseus' request, Demodocus sings of the horse, of how the Greeks hid inside it and the Trojans dragged it into their city, and of Odysseus fighting at Deiphobus' house. Odysseus weeps like a woman who clings to her fallen husband. Again only Alcinous notices. He stops the song and asks the stranger to tell his name, his country and his troubles, since the ship will know where to take him.":"A pedido de Odisseu, Demódoco canta o cavalo, como os gregos se esconderam dentro dele e os troianos o arrastaram para a cidade, e Odisseu combatendo na casa de Deífobo. Odisseu chora como a mulher que se agarra ao esposo caído. De novo só Alcínoo repara. Interrompe o canto e pede ao estrangeiro que diga o nome, a pátria e suas dores, pois o navio saberá aonde levá-lo.","BOOK IX":"CANTO IX","ISMARUS":"ISMARO","The wind carries the twelve ships from Troy to Ismarus, the land of the Cicones. Odysseus sacks the city, kills the men, and shares out the women and the plunder so that none is cheated. He urges the crew to flee at once. The fools will not listen: they drink the wine and kill sheep and cattle on the shore.":"O vento leva os doze navios de Troia a Ismaro, terra dos cíconos. Odisseu saqueia a cidade, mata os homens e reparte as mulheres e os despojos para que ninguém seja lesado. Exorta a tripulação a fugir logo. Os tolos não o escutam: bebem o vinho e matam ovelhas e bois na praia.","ORDER THE MEN BACK TO THE SHIPS  ·  GO TO EACH GROUP":"MANDE OS HOMENS DE VOLTA AOS NAVIOS  ·  VÁ A CADA GRUPO","THE REVELLERS":"OS FOLIÕES","THE FEASTERS":"OS BANQUETEADORES","AT DAWN":"AO AMANHECER","Meanwhile the Cicones call on their neighbours inland, more numerous and better men, who fight from chariots and on foot. They come at dawn, as thick as the leaves and flowers in spring. Zeus gives the Achaeans a bad fate.":"Entretanto os cíconos chamam os vizinhos do interior, mais numerosos e melhores guerreiros, que lutam de carros e a pé. Vêm ao alvorecer, tão numerosos quanto as folhas e flores na primavera. Zeus dá aos aqueus um mau destino.","HOLD THE LINE IN THE MORNING  ·  THRUST WHEN THE RING CLOSES":"MANTENHA A LINHA PELA MANHÃ  ·  INVISTA QUANDO O ANEL SE FECHAR","The spears bite.":"As lanças mordem.","THE TURN OF THE DAY":"A VIRADA DO DIA","Both sides throw bronze spears at the ships, and as long as the morning lasts and the sacred day grows they hold out. But when the sun passes to the time for unyoking oxen, the Cicones prevail, and six men from every ship are lost. The rest escape death and fate.":"Os dois lados atiram lanças de bronze contra os navios, e enquanto dura a manhã e cresce o dia sagrado resistem. Mas quando o sol chega à hora de desatrelar os bois, os cíconos prevalecem, e seis homens de cada navio se perdem. Os demais escapam à morte e ao destino.","RUN TO THE SHIPS  ·  A / D OR CLICK  ·  DODGE THE SPEARS":"CORRA PARA OS NAVIOS  ·  A / D OU CLIQUE  ·  DESVIE DAS LANÇAS","Struck down — up again!":"Derrubado — de pé de novo!","THE SHIPS":"OS NAVIOS","They sail sadly on, glad to have escaped death, but grieving for the friends they lost. Odysseus will not let a ship leave until each of the dead has been called three times by name.":"Seguem tristes, felizes por terem escapado à morte, mas chorando os amigos que perderam. Odisseu não deixa partir nenhum navio até que cada um dos mortos tenha sido chamado três vezes pelo nome.","LOTUS-EATERS":"LOTÓFAGOS","THE STORM":"A TEMPESTADE","Zeus stirs the North Wind against the ships. After two days of rest on land they sail again, but the wind and the currents carry them past Cape Malea, and for nine days they are driven over the sea. On the tenth they reach the land of the Lotus-eaters.":"Zeus lança o vento Bóreas contra os navios. Depois de dois dias de descanso em terra, voltam a navegar, mas o vento e as correntes os levam além do cabo Maleia, e por nove dias são arrastados sobre o mar. No décimo chegam à terra dos lotófagos.","THE CYCLOPES":"OS CICLOPES","AEOLIA":"EÓLIA","THE LAESTRYGONIANS":"OS LESTRIGÕES","AEAEA":"EEIA","HOUSE OF HADES":"CASA DE HADES","THE SIRENS":"AS SEREIAS","SCYLLA & CHARYBDIS":"CILA E CARIBDE","THRINACIA":"TRINÁCRIA","In the hall of Alcinous, Odysseus names himself and begins the tale of his journey home from Troy.":"No palácio de Alcínoo, Odisseu diz o seu nome e começa a narrativa da sua viagem de volta de Troia.","CLICK THE GLOWING ISLAND  ·  ENTER":"CLIQUE NA ILHA BRILHANTE  ·  ENTER","BOOK X":"CANTO X","On the floating island of Aeolus, surrounded by a wall of unbroken bronze, the king lives with his six daughters and six sons, who are married to each other. Aeolus entertains Odysseus for a month and asks about Troy and the Achaean fleet. When Odysseus asks to leave, Aeolus gives him a bag made of the hide of a nine-year-old ox, with all the winds tied inside, for Zeus has made him keeper of the winds. He ties it in the ship with a silver cord and leaves only the West Wind free.":"Na ilha flutuante de Éolo, cercada por um muro de bronze inquebrável, o rei vive com as seis filhas e os seis filhos, casados entre si. Éolo hospeda Odisseu por um mês e pergunta por Troia e pela frota dos aqueus. Quando Odisseu pede para partir, Éolo lhe dá um odre feito da pele de um boi de nove anos, com todos os ventos atados dentro, pois Zeus o fez guardião dos ventos. Amarra-o no navio com um cordão de prata e deixa livre apenas o vento Zéfiro.","NINE DAYS AND NIGHTS  ·  HOLD THE STEERING OAR  ·  SPACE OR MOUSE":"NOVE DIAS E NOITES  ·  SEGURE O REMO DO LEME  ·  ESPAÇO OU MOUSE","IN SIGHT OF ITHACA":"À VISTA DE ÍTACA","On the tenth day they can see their own country, and men tending fires on the shore. Odysseus, who has held the steering oar the whole time and let no one else take it, falls asleep. The crew whisper that Aeolus has given him gold and silver and that he is taking it home alone. They open the bag, and every wind rushes out.":"No décimo dia avistam a própria terra e homens cuidando de fogueiras na praia. Odisseu, que segurou o remo do leme todo o tempo e não deixou ninguém tomá-lo, adormece. Os companheiros cochicham que Éolo lhe deu ouro e prata e que ele os leva sozinho para casa. Abrem o odre, e todos os ventos se precipitam.","THE WINDS ARE LOOSE  ·  STEER THE SHIP  ·  A / D OR ARROWS":"OS VENTOS ESTÃO SOLTOS  ·  GUIE O NAVIO  ·  A / D OU SETAS","The gale takes her!":"A tempestade a arrasta!","TURNED AWAY":"REPELIDOS","Odysseus wakes, and thinks of jumping into the sea, but he endures it and lies under his cloak while the storm carries them back to Aeolia. He goes alone, with a herald, to the king's hall and finds him feasting. Aeolus drives him out: any man the gods hate is no friend of his. They row on six days and nights without a break.":"Odisseu acorda e pensa em atirar-se ao mar, mas suporta e se deita sob o manto enquanto a tempestade os leva de volta a Eólia. Vai sozinho, com um arauto, ao palácio do rei e o encontra banqueteando. Éolo o expulsa: quem os deuses odeiam não é amigo dele. Remam seis dias e noites sem pausa.","TELEPYLUS":"TELÉPILO","On the seventh day they come to the high city of Lamus in Laestrygonia, where a shepherd driving his flock in calls to another who is going out, since there the nights are so short that a man who needs no sleep can earn double wages. The harbour is a ring of high cliffs with a narrow mouth. All the fleet goes in and moors close together, but Odysseus keeps his own ship outside, tied to the rock at the end.":"No sétimo dia chegam à alta cidade de Lamo, na Lestrigônia, onde um pastor que recolhe o rebanho chama outro que sai, pois ali as noites são tão curtas que quem não precisa de sono ganha salário dobrado. O porto é um anel de altos rochedos com uma boca estreita. Toda a frota entra e atraca junto, mas Odisseu mantém o próprio navio do lado de fora, amarrado à rocha da ponta.","THE SCOUTS":"OS EXPLORADORES","RUN TO THE MOORING ROPE ON THE SEAWARD SHIP":"CORRA ATÉ A AMARRA DO NAVIO MAIS AFASTADO","THE MOORING":"A AMARRA","DRAW YOUR SWORD AND CUT THE CABLE  ·  TAP SPACE OR CLICK":"SAQUE A ESPADA E CORTE O CABO  ·  TOQUE EM ESPAÇO OU CLIQUE","ROW CLEAR OF THE BOULDERS  ·  A / D OR ARROWS":"REME PARA LONGE DOS PENHASCOS  ·  A / D OU SETAS","A boulder crashes close!":"Um penhasco desaba perto!","ONE SHIP":"UM SÓ NAVIO","Odysseus' ship slips out into open water and escapes. In the harbour the Laestrygonians spear the men like fish and haul them off for a horrible meal, and crush the other eleven ships with boulders. Alone, with the one crew that is left, he sails on, glad to be alive, and grieving for those he has lost.":"O navio de Odisseu escorrega para mar aberto e escapa. No porto os lestrigões espetam os homens como peixes e os arrastam para uma horrenda refeição, e esmagam os outros onze navios com blocos de pedra. Sozinho, com a única tripulação que resta, segue viagem, feliz por estar vivo, chorando os que perdeu.","THE SWINE":"OS PORCOS","The house stands in a clearing, and around it are wolves and lions, which are men she has bewitched with drugs. They fawn on the men like dogs. Circe invites them in, gives them cheese, barley, honey and wine mixed with her drug, and strikes them with a wand into the pen. Their bodies, voices and bristles are those of swine, but their minds stay as they were. Only Eurylochus, who stayed outside, sees it and runs back with the news.":"A casa se ergue numa clareira, e em volta há lobos e leões, homens que ela enfeitiçou com drogas. Afagam os homens como cães. Circe os convida a entrar, dá-lhes queijo, cevada, mel e vinho misturado com a sua droga, e os fere com a varinha e os manda para o chiqueiro. Seus corpos, vozes e cerdas são de porcos, mas a mente permanece como era. Só Euríloco, que ficou fora, vê tudo e volta correndo com a notícia.","GO ALONE UP THE PATH TO CIRCE'S HOUSE":"VÁ SOZINHO PELO CAMINHO ATÉ A CASA DE CIRCE","THE PATH":"O CAMINHO","HERMES BLOCKS THE WAY":"HERMES BARRA A PASSAGEM","HERMES":"HERMES","HERMES AND THE MOLY":"HERMES E O MOLI","CIRCE'S HALL":"O SALÃO DE CIRCE","ENTER THE HALL":"ENTRE NO SALÃO","SHE STRIKES  ·  DRAW YOUR SWORD WHEN THE RING CLOSES":"ELA GOLPEIA  ·  SAQUE A ESPADA QUANDO O ANEL SE FECHAR","Too soon, she is not yet near.":"Cedo demais, ela ainda não está perto.","THE OATH":"O JURAMENTO","A YEAR":"UM ANO","They stay a full year, feasting on meat and sweet wine. When the seasons return, the men remind Odysseus of home. He clasps Circe's knees at night, and she says that they must first make another journey, to the house of Hades and dread Persephone, to ask the shade of the Theban Tiresias, who still has his senses among the dead.":"Ficam um ano inteiro, banqueteando com carne e doce vinho. Quando voltam as estações, os homens lembram a Odisseu a pátria. Ele abraça os joelhos de Circe à noite, e ela diz que antes devem fazer outra viagem, à casa de Hades e da temida Perséfone, para consultar a sombra do tebano Tirésias, que conserva o juízo entre os mortos.","BOOK XI":"CANTO XI","ELPENOR":"ELPENOR","Before the voyage, the youngest of the crew, Elpenor, drunk with wine, had gone up to sleep on Circe's roof, woken at the noise of his companions, forgotten the ladder, and fallen, breaking his neck. Odysseus tells his men that Circe has given them another journey, to the house of Hades, and the men weep. But a ship waits for them at the shore, with a black ram and ewe on board, sent by Circe with a following wind.":"Antes da viagem, o mais jovem da tripulação, Elpenor, ébrio de vinho, subira a dormir no telhado de Circe, acordara com o barulho dos companheiros, esquecera a escada e caíra, quebrando o pescoço. Odisseu diz aos homens que Circe lhes impôs outra viagem, à casa de Hades, e os homens choram. Mas um navio os espera na praia, com um carneiro negro e uma ovelha a bordo, enviado por Circe com vento favorável.","THE LAND OF THE DEAD":"A TERRA DOS MORTOS","The ship comes to the edge of Ocean, to the land of the Cimmerians, wrapped in mist and cloud, where the sun never shines. They beach the ship, take the sheep, and walk along the stream of Ocean to the place Circe described, near the rock where two rivers meet. Perimedes and Eurylochus hold the sheep while Odysseus digs a pit a cubit long and a cubit wide.":"O navio chega à margem do Oceano, à terra dos cimérios, envolta em névoa e nuvem, onde o sol nunca brilha. Encalham o navio, tomam as ovelhas e caminham ao longo da corrente do Oceano até o lugar que Circe descreveu, perto da rocha onde se juntam dois rios. Perimedes e Euríloco seguram as ovelhas enquanto Odisseu cava uma fossa de um côvado de comprimento e outro de largura.","DIG THE PIT AT THE PLACE CIRCE DESCRIBED":"CAVE A FOSSA NO LUGAR QUE CIRCE DESCREVEU","THE PIT":"A FOSSA","POUR THE OFFERINGS FOR ALL THE DEAD  ·  MILK AND HONEY, WINE, WATER, BARLEY":"FAÇA AS OFERENDAS A TODOS OS MORTOS  ·  LEITE E MEL, VINHO, ÁGUA, CEVADA","The libation spills.":"A libação derrama.","THE SACRIFICE":"O SACRIFÍCIO","Odysseus pours the offerings for all the dead, first honey and milk, then wine, then water, with barley sprinkled over them. He vows that when he is home in Ithaca he will sacrifice a barren heifer, and to Tiresias alone a black ram, the best of the flock. He cuts the throats of the ram and the ewe over the pit, and the dark blood flows. The first to come is Elpenor, who is still unburied: he begs Odysseus to burn his body with his armour on his return to Aeaea and to heap a mound and plant an oar on it, and Odysseus promises. Then the shades come up from Erebus in crowds, brides, young men, old men, and warriors with their bloody armour. They scream, and the pale fear takes hold of him.":"Odisseu faz as oferendas a todos os mortos, primeiro mel e leite, depois vinho, depois água, com cevada espalhada por cima. Promete que, ao voltar a Ítaca, sacrificará uma novilha estéril, e só a Tirésias um carneiro negro, o melhor do rebanho. Corta o pescoço do carneiro e da ovelha sobre a fossa, e o sangue escuro corre. O primeiro a vir é Elpenor, ainda insepulto: pede a Odisseu que queime o corpo com as suas armas ao voltar a Eeia, e erga um túmulo e plante nele um remo, e Odisseu promete. Depois as sombras sobem do Érebo em multidão, noivas, jovens, velhos e guerreiros com as armaduras ensanguentadas. Gritam, e o pálido medo toma conta dele.","KEEP THE SHADES FROM THE BLOOD UNTIL TIRESIAS COMES  ·  WAVE THE SWORD  ·  SPACE OR CLICK":"AFASTE AS SOMBRAS DO SANGUE ATÉ QUE TIRÉSIAS CHEGUE  ·  AGITE A ESPADA  ·  ESPAÇO OU CLIQUE","TIRESIAS":"TIRÉSIAS","THE LAST JOURNEY":"A ÚLTIMA VIAGEM","LET HIS MOTHER ANTICLEIA DRINK, AND SPEAK TO HER":"DEIXE SUA MÃE ANTICLEIA BEBER, E FALE COM ELA","ANTICLEIA":"ANTICLEIA","HIS MOTHER":"SUA MÃE","Odysseus sees the shade of his mother Anticleia, who was alive when he left for Troy. He weeps, but lets her drink the blood only after Tiresias. She tells him that grief for him killed her, not illness. Three times he runs to embrace her, and three times she flies from his arms like a shadow or a dream. She tells him that this is the way of mortals when they die, and bids him take what he has learned home to his wife.":"Odisseu vê a sombra da mãe Anticleia, que estava viva quando ele partiu para Troia. Chora, mas só a deixa beber o sangue depois de Tirésias. Ela lhe diz que a saudade dele a matou, e não doença. Três vezes ele corre a abraçá-la, e três vezes ela lhe foge dos braços como sombra ou sonho. Diz-lhe que esse é o destino dos mortais quando morrem, e pede que leve o que aprendeu para casa, à esposa.","SPEAK WITH THE HEROES OF TROY":"FALE COM OS HERÓIS DE TROIA","AGAMEMNON":"AGAMÉMNONE","ACHILLES":"AQUILES","AJAX":"AJAZ","Agamemnon drinks the blood and weeps. He tells Odysseus how Aegisthus and his own wife killed him at a feast, like an ox at its manger, and how Clytemnestra did not even stay to close his eyes and mouth as he died. He warns Odysseus not to tell a wife everything he knows.":"Agamémnone bebe o sangue e chora. Conta a Odisseu como Egisto e a própria esposa o mataram num banquete, como a um boi na manjedoura, e como Clitemnestra nem sequer ficou para lhe fechar os olhos e a boca quando morria. Previne Odisseu de que não conte tudo à esposa.","Achilles asks how he dared to come to the house of Hades. Odysseus says that he is as honoured among the dead as he was among the living. Achilles answers that he would rather be a hired labourer on a poor man's farm than rule over all the dead. Odysseus tells him that his son Neoptolemus fights bravely. Achilles strides away, delighted, over the asphodel meadow.":"Aquiles pergunta como ousou vir à casa de Hades. Odisseu diz que ele é tão honrado entre os mortos como foi entre os vivos. Aquiles responde que preferiria ser jornaleiro na terra de um pobre a reinar sobre todos os mortos. Odisseu lhe diz que o filho, Neoptólemo, luta com bravura. Aquiles se afasta, jubiloso, pelo prado de asfódelos.","The shade of Ajax stands apart, still angry that Odysseus won the armour of Achilles. Odysseus speaks to him, but he gives no answer, and goes off into the darkness. Then Odysseus sees Minos judging the dead, Orion hunting the shades of animals, Tityus pegged out, Tantalus unable to drink, Sisyphus pushing his stone, and, last, the image of Heracles, while the shades screech about him like birds.":"A sombra de Ajaz fica à parte, ainda irada porque Odisseu ganhou as armas de Aquiles. Odisseu lhe fala, mas ele não responde e se vai para a escuridão. Depois Odisseu vê Minos julgando os mortos, Órion caçando as sombras das feras, Títio estirado, Tântalo incapaz de beber, Sísifo empurrando a sua pedra e, por último, a imagem de Héracles, enquanto as sombras gritam à volta dele como aves.","BACK TO THE SHIP":"DE VOLTA AO NAVIO","Odysseus would have stayed to see Theseus and Pirithous, but the shades crowd round him with their cries, and pale fear takes him: Persephone may send the head of the Gorgon against him. He goes back to the ship, orders the men aboard, and the current of Ocean carries it first under oars, then with a fair wind.":"Odisseu teria ficado para ver Teseu e Pirítoo, mas as sombras o cercam com seus gritos, e o pálido medo o toma: Perséfone pode enviar contra ele a cabeça da Górgona. Volta ao navio, manda os homens embarcarem, e a corrente do Oceano o leva primeiro a remo, depois com vento favorável.","BOOK XII":"CANTO XII","CIRCE'S COUNSEL":"O CONSELHO DE CIRCE","Circe told him of two paths: past the Wandering Rocks, which no ship but Jason's has passed, or between two cliffs. On one is Scylla, with twelve feet, six long necks and six heads, each with three rows of teeth, who snatches one man for every head from any ship that passes. On the other is Charybdis, who three times a day sucks down the sea and three times spews it up. Better to lose six men than all. Do not arm yourself against Scylla, she told him, for she is not mortal.":"Circe lhe falou de dois caminhos: passar pelas Rochas Errantes, por onde nenhum navio passou exceto o de Jasão, ou entre dois rochedos. Em um está Cila, com doze pés, seis longos pescoços e seis cabeças, cada uma com três fileiras de dentes, que arrebata um homem por cabeça de qualquer navio
