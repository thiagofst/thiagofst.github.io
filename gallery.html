<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery - Thiago Ferreira</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:,">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root { --bg: #fff; --fg: #000; --accent: #e30613; --gutter: 24px; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 17px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--fg); text-decoration: none; }

        .page { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); }

        .row { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--gutter); }

        .topbar { padding: 1.4rem 0 0 0; font-weight: 700; font-size: 1rem; }
        .topbar a:hover { color: var(--accent); }

        header { padding: 2.2rem 0 1.2rem 0; border-bottom: 3px solid var(--fg); }

        h1 {
            grid-column: 1 / -1;
            font-size: clamp(2.6rem, 7.2vw, 5.6rem);
            font-weight: 700;
            line-height: 0.98;
            letter-spacing: -0.035em;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--gutter); align-items: start; padding: 1.6rem 0 0 0; }
        .grid img { display: block; width: 100%; height: auto; cursor: pointer; }

        .rule { border: 0; border-top: 1px solid var(--fg); margin: 2.4rem 0 0 0; }

        footer { padding: 1rem 0 2.5rem 0; font-size: 0.9rem; font-weight: 700; }

        #photoModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        #photoModal .inner { display: flex; flex-direction: column; align-items: flex-start; }
        #modalImg { display: block; max-width: 80vw; max-height: 70vh; height: auto; }
        #modalDesc { color: #fff; margin-top: 0.8rem; font-size: 1rem; max-width: 70vw; text-align: left; }
    </style>
</head>
<body>
    <div class="page">

        <div class="topbar"><a href="index.html">Thiago Ferreira dos Santos</a></div>

        <header>
            <div class="row">
                <h1>Gallery</h1>
            </div>
        </header>

        <main>
        <div class="grid">
            <!-- MESA Summer School 2025 -->
            <img class="photoThumb" src="photos/20250722-Participants-MESA-School-Leuven.jpg" data-desc="MESA Summer School, Leuven/Belgium, July 2025.">
            <img class="photoThumb" src="photos/4SciGens-MESA-School-Leuven.jpg" data-desc="Four scientific generations, Leuven/Belgium, July 2025.">
            <img class="photoThumb" src="photos/GraduationMESASummerSchool-LeuvenBE2025.jpg" data-desc="Graduation - MESA Summer School, Leuven/Belgium, July 2025.">
            <!-- HITS 2025 -->
            <img class="photoThumb" src="photos/HITS2025.jpg" data-desc="HITS - Heidelberg/Germany, July 2025.">
            <!-- TASC9/KASC16 2025 -->
            <img class="photoThumb" src="photos/TASC2025.jpg" data-desc="Presented my poster on 'seismology of Population III stars' at the TASC9/KASC16 conference in Vienna, Austria, July 2025.">
            <img class="photoThumb" src="photos/TASC9-KASC16_Vienna.jpg" data-desc="9th TESS/16th Kepler Asteroseismic Science Consortium Workshop, Vienna/Austria, July 2025.">
            <!-- Yale -->
            <img class="photoThumb" src="photos/Yale2023-Welcome.JPG" data-desc="Yale University, New Haven/U.S. (2023).">
        </div>

        <hr class="rule">
        </main>

        <footer>
 2026 | Thiago Ferreira dos Santos
        </footer>

    </div>

    <div id="photoModal">
        <div class="inner">
            <img id="modalImg" src="">
            <div id="modalDesc"></div>
        </div>
    </div>

    <script>
    const photoThumbs = document.querySelectorAll('.photoThumb');
    const photoModal = document.getElementById('photoModal');
    const modalImg = document.getElementById('modalImg');
    const modalDesc = document.getElementById('modalDesc');
    photoThumbs.forEach(thumb => {
        thumb.onclick = function() {
            modalImg.src = thumb.src;
            modalDesc.textContent = thumb.getAttribute('data-desc');
            photoModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };
    });

    photoModal.onclick = function(e) {
        if (e.target === photoModal) {
            photoModal.style.display = 'none';
            document.body.style.overflow = '';
        }
    };
    </script>

</body>
</html>
